# Server config for docker-compose.yml: the secure baseline (SECURE-DEFAULT-1,
# ADR-112 §4). `keyorix-server admin validate --posture` reports zero deviations
# on it, file permissions included:
#   - TLS on the backend listener, required. The certificate, its key and the
#     /metrics token are generated by the backend's entrypoint on first start
#     (`admin init --secure-files`, KEYORIX_INIT_SECURE_FILES=true) into the
#     keyorix_tls volume, 0600, and kept across restarts.
#   - The database connection is TLS with ssl_mode: verify-full against the
#     bundled postgres' certificate (ssl_root_cert, a Docker secret).
#   - API rate limiting on (same values as server/config/production.yaml).
#   - GET /metrics requires the generated token.
#   - The entrypoint copies this bind-mounted file to a private 0600 path
#     (KEYORIX_CONFIG_SOURCE -> KEYORIX_CONFIG_PATH), so the host's owner and
#     mode no longer matter (#2922).
# Needs a backend image newer than v0.95.3 (metrics_token_file and the
# entrypoint steps are new) and one that has storage.database.ssl_root_cert
# (after v0.96.0): the compose pins move with the release that ships it.
#
# security.enable_file_permission_check is deliberately NOT set here. Since ADR-112
# an absent key means TRUE: key material (the wrapped DEK and KEK salt, the SQLite
# file, and the KEYORIX_*_FILE secret files) is checked strictly at every start, while
# this bind-mounted config file (owned by the host user, not by the container's uid)
# only produces a warning. Writing `enable_file_permission_check: true` here would
# audit THIS file strictly too and the container would refuse to start.
# deploy TestShippedComposeConfig_FilePermissionCheckIsOn pins this.
environment: production
server:
  http:
    enabled: true
    # Inside the container the server must listen on all interfaces so the
    # web container (nginx) can reach it. The built-in default is 127.0.0.1
    # only (#2939).
    host: "0.0.0.0"
    port: "8080"
    tls:
      enabled: true
      cert_file: "/app/tls/server.crt"
      key_file: "/app/tls/server.key"
    ratelimit:
      enabled: true
      requests_per_second: 50
      burst: 100
    metrics_token_file: "/app/tls/metrics_token"
  grpc:
    enabled: false
    ratelimit:
      enabled: true
      requests_per_second: 25
      burst: 50
    metrics_token_file: "/app/tls/metrics_token"
security:
  require_transport_tls: true
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    # verify-full: the bundled postgres serves TLS with the certificate
    # scripts/selfhost/init-secrets.sh generates (docker-compose.yml, secret
    # postgres_tls_cert, named "postgres" = host above). The connection is
    # encrypted and the server is authenticated by that certificate, so the
    # server refuses to start (and never falls back to plaintext) against a
    # postgres that does not present it. Never prefer/allow/disable.
    ssl_mode: verify-full
    ssl_root_cert: /run/secrets/postgres_tls_cert
    # Password comes from KEYORIX_DB_PASSWORD_FILE (docker-compose.yml), never committed here.
  encryption:
    enabled: true
    # The wrapped DEK + KEK salt live on the persisted `keys` volume. These MUST
    # survive restarts — losing them, or changing KEYORIX_MASTER_PASSWORD,
    # makes every stored secret undecryptable.
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
