environment: production
# security.enable_file_permission_check is deliberately NOT set here. Since ADR-112
# an absent key means TRUE: key material (the wrapped DEK and KEK salt, the SQLite
# file, and the KEYORIX_*_FILE secret files) is checked strictly at every start, while
# this bind-mounted config file (owned by the host user, not by the container's uid)
# only produces a warning. Writing `enable_file_permission_check: true` here would
# audit THIS file strictly too and the container would refuse to start.
# deploy TestShippedComposeConfig_FilePermissionCheckIsOn pins this.
server:
  http:
    enabled: true
    # Inside the container the server must listen on all interfaces so the
    # published port (and the web container) can reach it. The built-in default
    # is 127.0.0.1 only (#2939).
    host: "0.0.0.0"
    port: "8080"
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    # prefer: uses TLS when the postgres server supports it (default for docker-compose
    # where the server runs on an internal Docker network without server certs). For
    # production deployments with a managed or externally-reachable postgres, set this
    # to verify-full and supply sslrootcert/sslcert/sslkey. Never use disable in prod.
    ssl_mode: prefer
    # Password comes from KEYORIX_DB_PASSWORD (set in .env), never committed here.
  encryption:
    enabled: true
    # The wrapped DEK + KEK salt live on the persisted `keys` volume (see
    # docker-compose.yml). These MUST survive restarts — losing them, or changing
    # KEYORIX_MASTER_PASSWORD, makes every stored secret undecryptable.
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
