# Mounted over /etc/nginx/keyorix-backend.conf by docker-compose.secure.yml
# (SECURE-DEFAULT-1): the backend serves TLS with the certificate its entrypoint
# generated (`admin init --secure-files --tls-dns-name backend`), and the
# backend copies that certificate to the keyorix_tls_public volume, mounted
# here read-only. nginx refuses to start if the file is missing, and refuses
# the upstream if the certificate does not verify for the name "backend".
set $keyorix_backend https://backend:8080;
proxy_ssl_verify on;
proxy_ssl_verify_depth 1;
proxy_ssl_trusted_certificate /etc/keyorix/tls/ca.crt;
proxy_ssl_name backend;
proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
