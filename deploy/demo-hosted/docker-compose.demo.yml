# Overlay for the hosted demo (DEMO-HOSTED-1). Used ONLY together with the
# production docker-compose.yml, always through the `tls` profile:
#
#   docker compose --project-directory <repo> --env-file /etc/keyorix-demo/demo.env \
#     -f docker-compose.yml -f deploy/demo-hosted/docker-compose.demo.yml --profile tls up -d
#
# `keyorix-demo` (democtl.sh) builds that command line; nobody types it by hand.
# Needs Docker Compose >= 2.24 (the `!override` tag below); install.sh checks it.
#
# What this overlay changes, and nothing else (deploy/demo-hosted tests pin each):
#   - project name keyorix-demo, so the volumes are keyorix-demo_* and cannot collide;
#   - web is published on the loopback only (the base file publishes 0.0.0.0:8088, and
#     Docker's published ports bypass the host firewall): the public entry is Caddy;
#   - backend reads the generated config (base config + storage.database.audit_durability:
#     strict) instead of the bind-mounted keyorix.docker.yaml;
#   - caddy runs deploy/demo-hosted/Caddyfile.demo (security headers, the gate, access
#     log) for a hostname that MUST be set (no localhost fallback).
# Images, secrets (Docker secrets files, no default passwords), read-only root
# filesystems, dropped capabilities and the TLS links are inherited unchanged.
name: keyorix-demo

services:
  web:
    ports: !override
      - "127.0.0.1:8088:80"

  backend:
    volumes:
      - "${KEYORIX_DEMO_CONFIG:?KEYORIX_DEMO_CONFIG is required, run deploy/demo-hosted/install.sh}:/app/config/keyorix.docker.yaml:ro"

  caddy:
    environment:
      KEYORIX_DOMAIN: "${KEYORIX_DOMAIN:?KEYORIX_DOMAIN is required, run deploy/demo-hosted/install.sh}"
      KEYORIX_ACME_EMAIL: "${KEYORIX_ACME_EMAIL:?KEYORIX_ACME_EMAIL is required, run deploy/demo-hosted/install.sh}"
      KEYORIX_ACME_CA: "${KEYORIX_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}"
    volumes:
      - ./deploy/demo-hosted/Caddyfile.demo:/etc/caddy/Caddyfile:ro
      # gate.caddy (basic auth / IP allow-list) is generated by install.sh. Caddyfile.demo
      # imports it by exact name, so a missing file stops Caddy instead of serving open.
      - "${KEYORIX_DEMO_GATE_DIR:?KEYORIX_DEMO_GATE_DIR is required, run deploy/demo-hosted/install.sh}:/etc/caddy/gate:ro"
