apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kxsync.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kxsync.labels" . | nindent 4 }}
data:
  k8s-sync.yaml: |
    keyorix_url: {{ required "keyorix.url is required" .Values.keyorix.url | quote }}
    {{- /* Sprig's `required` only rejects nil/empty-string, not a numeric zero value,
    so a missing keyorix.projectID (default 0) would otherwise silently render
    "project_id: 0" instead of failing here — deferring the failure all the way to
    the agent's own LoadConfig validation at pod startup. Fail at render time instead. */}}
    {{- if not .Values.keyorix.projectID }}
    {{- fail "keyorix.projectID is required" }}
    {{- end }}
    project_id: {{ .Values.keyorix.projectID }}
    interval: {{ .Values.keyorix.interval | default "5m" | quote }}
    health_port: {{ .Values.healthPort | default 8080 }}
    cleanup: {{ .Values.cleanup | default false }}
    {{- /* NOT `| default true`: Sprig's `default` treats the Go zero value (false,
    for a bool) as "empty" and substitutes the fallback -- with a `true` fallback,
    that makes an explicit `pruneOnRevoke: false` override UNREACHABLE, always
    silently rendering `true` instead. values.yaml already provides `true` as the
    chart's own base default, so no `default` pipeline is needed here: an
    unset/missing key still resolves to that base value through Helm's normal
    values-merge, and an explicit override (either direction) renders as given. */}}
    prune_on_revoke: {{ .Values.pruneOnRevoke }}
    {{- /* on_suspend: retain (default) | clear; see values.yaml. The config validator
    rejects anything else, so a typo fails the pod at start rather than silently
    retaining. */}}
    on_suspend: {{ .Values.onSuspend | default "retain" | quote }}
    {{- if .Values.massPruneAck }}
    mass_prune_ack: {{ .Values.massPruneAck | quote }}
    {{- end }}
    mappings:
    {{- if .Values.mappings }}
      {{- toYaml .Values.mappings | nindent 6 }}
    {{- else }}
      []
    {{- end }}
