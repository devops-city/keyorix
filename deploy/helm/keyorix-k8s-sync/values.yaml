# keyorix-k8s-sync — deploys the Keyorix Kubernetes sync agent.
#
# The agent reads selected Keyorix secrets and materialises them into native
# Kubernetes Secrets, refreshing on rotation. It authenticates to Keyorix with a
# machine-identity token (sourced from an existing Secret) and writes Secrets via the
# Kubernetes API using its ServiceAccount.

image:
  repository: ghcr.io/keyorixhq/keyorix-k8s-sync
  # Empty defaults to this chart's own appVersion (a pinned `vX.Y.Z`). `latest`/`main`
  # are MUTABLE -- the exact same tag can point at a different image tomorrow,
  # defeating "what did I actually deploy" and any image-scan attestation pinned to
  # this value -- only set this to a floating tag if you understand that tradeoff. A
  # digest via `digest:` below (strongest pin) takes precedence over either. This
  # agent holds a live Keyorix machine-identity bearer token, so pinning by digest in
  # production matters more here than for a typical workload.
  tag: ""
  # digest, when set (e.g. "sha256:abc123..."), pins the exact image content --
  # immune to a tag being retargeted after the fact -- and takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

keyorix:
  # url is the Keyorix server base URL (required), e.g. https://keyorix.internal
  url: ""
  # projectID is the numeric id (required) of the single Keyorix project the
  # tokenSecret's machine identity belongs to. Every mapping's ref below names only
  # an environment and secret ("<environment>/<name>"), never a project, because
  # environment names are unique per-project, not globally -- two different projects
  # can each have a "production" environment. projectID pins every secret lookup to
  # this one project server-side so a same-named secret in a DIFFERENT project can
  # never be resolved instead. Find it in the Keyorix UI/CLI for the project this
  # agent should read from.
  projectID: 0
  # interval is the reconcile cadence (Go duration).
  interval: 5m
  # token is read from an existing Secret — never put the token in values.
  tokenSecret:
    name: ""        # required: a Secret holding the Keyorix machine-identity token
    key: token      # the key within that Secret

# healthPort is where the agent serves /healthz, /readyz, /status (probes) and
# /metrics (Prometheus) -- all on the same port; there is no separate metrics port.
healthPort: 8080

# metricsBearerToken (OPTIONAL): when set, required on /metrics' Authorization:
# Bearer <token> header -- wired straight to the agent's own
# -metrics-bearer-token flag (KEYORIX_METRICS_TOKEN env var). /healthz, /readyz,
# and /status on the same port stay unauthenticated regardless -- kubelet must
# reach them, and they expose no secret values (only counts, a timestamp, and an
# error count). Leave empty to rely on networkPolicy.enabled/metricsAllowFrom
# below, or your own perimeter controls, instead; set both for defense in depth.
metricsBearerToken: ""

# ── Network policy ────────────────────────────────────────────────────────────
# Restricts inbound traffic to healthPort (serves /metrics alongside the probe
# endpoints -- see healthPort above, there's no separate port to isolate just
# /metrics) to same-namespace pods plus the peers listed in
# networkPolicy.metricsAllowFrom, instead of every pod in the cluster that can
# route to it. Disable only if your CNI doesn't support NetworkPolicy, or you
# have an equivalent policy managed elsewhere.
networkPolicy:
  enabled: true
  # metricsAllowFrom: additional NetworkPolicyPeer entries (podSelector /
  # namespaceSelector, in the upstream NetworkPolicy `from` syntax) permitted to
  # reach healthPort from OUTSIDE this release's own namespace -- e.g. a
  # cluster-wide Prometheus. Defaults to any pod, in any namespace, carrying the
  # Prometheus community Helm chart's standard `app.kubernetes.io/name:
  # prometheus` label -- adjust to match your cluster's actual scrape identity.
  metricsAllowFrom:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
  egress:
    # Restricts the agent's OUTBOUND traffic instead of leaving it reachable to
    # anything the cluster network permits (the default without this). Its real
    # destinations are DNS, the in-cluster Kubernetes API server, and the
    # Keyorix server named in keyorix.url -- neither of the latter two is a
    # podSelector-able destination (the API server's Endpoints aren't backed by
    # a selectable pod set, and keyorix.url is an admin-configured external
    # host), so both are allowed by PORT only (443 and 6443, the two ports a
    # Kubernetes API server and an https Keyorix server overwhelmingly listen
    # on) rather than by destination. This is deliberately coarser than a
    # per-destination allow: if your API server or Keyorix server runs on a
    # different port, add it via extraRules below, or this agent will silently
    # stop reconciling (a NetworkPolicy drop looks like a hung/timed-out call,
    # not a clear error).
    enabled: true
    # extraRules: additional egress rules (raw NetworkPolicyEgressRule entries),
    # appended verbatim -- e.g. for a Keyorix server or API server on a
    # non-standard port.
    extraRules: []

# cleanup reaps orphaned Secrets: when a mapping is removed, the agent-owned Secret it
# created (carrying app.kubernetes.io/managed-by=keyorix-sync) is deleted on the next
# pass. Off by default — deleting Secrets is destructive. Assumes a single sync agent
# owns each managed namespace; do not point two agents with different mappings at the
# same namespace with cleanup on. Enabling it grants the agent list+delete on Secrets.
cleanup: false

# pruneOnRevoke controls a DIFFERENT case than cleanup above: a mapping still IN the
# config whose upstream Keyorix reference becomes inaccessible (the secret was deleted,
# or the agent's own access/token was revoked). On by default (the secure default,
# restored 2026-09-25 -- a secret confirmed gone or access confirmed revoked must not
# stay readable in the cluster indefinitely): a confirmed-gone/revoked reference actively
# wipes/trims its target Secret. The MASS-REVOCATION CIRCUIT BREAKER bounds the blast
# radius of this default when many targets are confirmed gone/revoked in the SAME
# reconcile pass (more than one target AND more than 20% of everything this agent
# manages) -- a shared credential rotation, not independent per-secret events: none of
# them are wiped, the pass instead reports "MASS REVOCATION SUSPECTED" (see the
# "suspected" count in /status and the keyorix_k8s_sync_secrets_total{outcome=
# "mass_revocation_suspected"} metric), until acknowledged via massPruneAck below. A
# single revocation is unaffected by the breaker and still wipes immediately. Set this
# to false to opt OUT of wiping entirely (the target Secret's last-known value is always
# left untouched, reported via the "revoked" count/metric instead) for deployments that
# prefer availability over immediate reap.
pruneOnRevoke: true

# onSuspend: what happens to a target Secret while a Keyorix secret it references is
# SUSPENDED (an operator's "block value reads" switch). "retain" (default) keeps that
# source's key exactly as it is (the target's other keys keep syncing). "clear" empties
# that source's key (the Secret object is never deleted; a Secret this agent does not own
# is never touched), so
# workloads stop receiving the value; new pods that require one of those keys fail with
# CreateContainerConfigError until it is resumed. Resuming restores the data on the next
# pass either way. An EXPIRED source's key is always retained; fetch failures (server
# unreachable, 5xx) never modify the target. Each state is logged (SourceSecretSuspended /
# SourceSecretExpired / SourceSecretExpiring at 30, 7 and 1 days before expiry) and counted
# as keyorix_k8s_sync_secrets_total{outcome="source_suspended|source_expired|source_expiring"}.
onSuspend: retain

# massPruneAck acknowledges the mass-revocation circuit breaker above: an RFC3339
# timestamp, valid for 1 hour after it's set. Leave empty in normal operation -- set it
# only in direct response to an observed "MASS REVOCATION SUSPECTED" alert that you've
# confirmed is an intentional, expected event (e.g. a planned credential rotation), then
# clear it again once resolved. A permanently-set ack defeats the breaker for every
# future incident, not just this one.
massPruneAck: ""

# mappings: each copies one Keyorix secret ("<environment>/<name>") into one key of
# one Kubernetes Secret. Several mappings may target the same Secret.
#   - ref: production/db-password
#     namespace: app
#     name: db-creds
#     key: DB_PASSWORD
mappings: []

# targetNamespaces lists the namespaces the agent may write Secrets in; a RoleBinding
# to the chart's ClusterRole (get/create/patch secrets) is created in each. When
# empty, only the release namespace is granted.
targetNamespaces: []

serviceAccount:
  create: true
  # name overrides the generated ServiceAccount name.
  name: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi
    ephemeral-storage: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi
    ephemeral-storage: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
