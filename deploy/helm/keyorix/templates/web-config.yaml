{{- if .Values.web.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keyorix.web.fullname" . }}-config
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  # Kubernetes-adapted nginx.conf. Unlike the Docker image's config (which uses
  # Docker's embedded DNS resolver 127.0.0.11 + a variable upstream), this proxies
  # to the server Service by name with a literal proxy_pass: a Service ClusterIP
  # is stable, so nginx resolves it once at startup via the pod's cluster DNS and
  # never caches a stale pod IP.
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_types application/javascript application/json application/xml image/svg+xml text/css text/javascript text/plain text/xml font/ttf font/otf;

      # #138: the web UI's own JS calls /api etc. same-origin (served by this SAME
      # nginx) and needs no CORS headers at all — a browser never sends/requires them
      # for a same-origin fetch. This map only serves a genuinely cross-origin caller
      # that has been explicitly allowlisted via web.corsAllowedOrigins; any other
      # Origin gets no Access-Control-Allow-Origin match, so the browser blocks the
      # response. Empty by default (no cross-origin API access unless opted in).
      map $http_origin $cors_allowed_origin {
        default "";
        {{- range .Values.web.corsAllowedOrigins }}
        "{{ . }}" "{{ . }}";
        {{- end }}
      }

      # HSTS only behind a trusted TLS-terminating proxy (web.trustedProxies).
      {{- include "keyorix.web.hsts" . | nindent 6 }}

      # Baseline security headers. NOTE: nginx's add_header does not inherit into
      # any location block that defines its own add_header (see the comment on
      # keyorix.web.securityHeaders in _helpers.tpl) — every location below that
      # sets its own add_header re-includes this same template so the headers
      # still apply there instead of silently disappearing.
      {{- include "keyorix.web.securityHeaders" . | nindent 6 }}

      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
          expires 1y;
          {{- include "keyorix.web.securityHeaders" . | nindent 10 }}
          add_header Cache-Control "public, immutable";
          try_files $uri =404;
        }

        # /api/ = authenticated API, /auth/ = public auth (login/refresh/logout,
        # served at the root), /system/ = first-boot init. Proxy all to the server.
        location ~ ^/(api|auth|system)/ {
          proxy_pass http://{{ include "keyorix.server.fullname" . }}:{{ .Values.server.service.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # The backend adds the same security headers to its own responses
          # (server/middleware/security_headers.go); drop its copy so the set
          # added below is the only one (DEMO-WALK-3 finding 23).
          proxy_hide_header X-Frame-Options;
          proxy_hide_header X-Content-Type-Options;
          proxy_hide_header X-XSS-Protection;
          proxy_hide_header Referrer-Policy;
          proxy_hide_header Content-Security-Policy;
          proxy_hide_header Cross-Origin-Resource-Policy;
          proxy_hide_header Cross-Origin-Embedder-Policy;
          proxy_hide_header Cross-Origin-Opener-Policy;
          proxy_hide_header Strict-Transport-Security;
          {{- include "keyorix.web.securityHeaders" . | nindent 10 }}
          add_header Access-Control-Allow-Origin $cors_allowed_origin always;
          add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
          add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
          add_header Access-Control-Allow-Credentials true always;
          if ($request_method = 'OPTIONS') { return 204; }
        }

        location / { try_files $uri $uri/ /index.html; }

        location /health {
          access_log off;
          return 200 "healthy\n";
          {{- include "keyorix.web.securityHeaders" . | nindent 10 }}
          add_header Content-Type text/plain;
        }

        location ~ /\. { deny all; access_log off; log_not_found off; }
      }
    }
{{- end -}}
