{{- if .Values.postgresql.enabled -}}
{{- if .Values.postgresql.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size }}
  {{- with .Values.postgresql.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.postgresql.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  annotations:
    # This is a third-party image (not one this project builds/publishes), already
    # pinned to a specific repository:tag; digest-pinning a bundled upstream
    # dependency is a separate, larger undertaking (tracking and rotating upstream
    # digests) than pinning the images this project builds itself (server, web,
    # operator, k8s-sync -- all of which support .Values.<component>.image.digest).
    checkov.io/skip1: CKV_K8S_43=third-party bundled dependency, already tag-pinned; digest tracking is a separate undertaking from this project's own images
    # kube-score (helm-chart-policy CI job): same singleton reasoning as the
    # keyorix chart's server-deployment.yaml -- pinned to exactly 1 replica with
    # Recreate, since RollingUpdate would briefly run 2 pods against the same
    # bundled-Postgres data volume, which this single-instance evaluation DB was
    # never designed for. Production deployments are expected to set
    # postgresql.enabled=false and point externalDatabase at a managed/HA
    # PostgreSQL instead (see this chart's own README "Production notes").
    kube-score/ignore: "deployment-strategy,deployment-replicas"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
      annotations:
        # kube-score, each with an already-settled reason elsewhere:
        #   - container-security-context-user-group-id: fixed uid to match
        #     the official postgres:*-alpine image's own user (see the
        #     securityContext comment below) -- same already-reviewed tradeoff
        #     as this repo's checkov CKV_K8S_40 exclusion.
        #   - pod-probes-identical: pg_isready is the correct check for BOTH
        #     liveness and readiness on this single, non-clustered bundled
        #     instance -- if it fails, a restart is the right response either
        #     way, unlike a scaled-out clustered DB where a readiness failure
        #     should instead just pull the replica from load balancing.
        kube-score/ignore: >-
          container-security-context-user-group-id,
          pod-probes-identical
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # postgresql.runAsUser must be the uid of the postgres image: 70 in the
        # official postgres:*-alpine images (the default tag, and what
        # docker-compose.yml runs), 999 in the Debian-based ones -- deploy/hardening
        # pins the pairing. Earlier charts ran this pod as 999 even on the alpine
        # image, so a volume they created is owned by 999: see postgresql.runAsUser
        # and postgresql.migrateOwnership in values.yaml for upgrading it.
        # fsGroup makes a fresh PVC group-writable by it so no root-owned chown
        # step is needed.
        runAsNonRoot: true
        runAsUser: {{ .Values.postgresql.runAsUser }}
        runAsGroup: {{ .Values.postgresql.runAsUser }}
        fsGroup: {{ .Values.postgresql.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.postgresql.persistence.enabled .Values.postgresql.migrateOwnership }}
      initContainers:
        # Opt-in one-time migration (postgresql.migrateOwnership): a volume created by
        # an older chart is owned by uid 999, and Postgres will not start on a data
        # directory its own uid does not own. Root with CHOWN + DAC_READ_SEARCH only
        # (the data directory is 0700, so root needs search permission to descend into
        # it once it is owned by someone else); touches the data volume only and only
        # entries not already owned by the target uid; a no-op on later starts.
        - name: fix-data-ownership
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command:
            - find
            - /var/lib/postgresql/data
            - -xdev
            - "("
            - "!"
            - -user
            - {{ .Values.postgresql.runAsUser | quote }}
            - -o
            - "!"
            - -group
            - {{ .Values.postgresql.runAsUser | quote }}
            - ")"
            - -exec
            - chown
            - -h
            - {{ printf "%d:%d" (int .Values.postgresql.runAsUser) (int .Values.postgresql.runAsUser) | quote }}
            - "{}"
            - "+"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_READ_SEARCH"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 8Mi
            limits:
              cpu: 200m
              memory: 64Mi
              ephemeral-storage: 8Mi
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # Writes go to the data PVC, the unix-socket dir and /tmp only; the
            # latter two are emptyDirs below.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "keyorix.secretName" . }}
                  key: KEYORIX_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if .Values.postgresql.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "keyorix.postgresql.fullname" . }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.postgresql.persistence.size | quote }}
          {{- end }}
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end -}}
