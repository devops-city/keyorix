{{- include "keyorix.valuesDefaults" . -}}
{{- if and .Values.secureBaseline.existingSecret (not .Values.secureBaseline.enabled) -}}
{{- fail "secureBaseline.existingSecret is set but secureBaseline.enabled is false: it would be silently ignored. Set secureBaseline.enabled=true, or unset existingSecret." -}}
{{- end -}}
{{- if and .Values.secureBaseline.existingSecretRevision (not .Values.secureBaseline.existingSecret) -}}
{{- fail "secureBaseline.existingSecretRevision is set but secureBaseline.existingSecret is empty: the revision only applies to an existing Secret and would be silently ignored. Set existingSecret, or unset the revision." -}}
{{- end -}}
{{- if and .Values.secureBaseline.enabled (not .Values.secureBaseline.existingSecret) -}}
{{- /*
SECURE-DEFAULT-1 (ADR-112 §4): the TLS certificates and the /metrics token the
secure-baseline config references, generated by Helm on first install and kept
on upgrades (lookup): regenerating them on every upgrade would rotate the
token under a running Prometheus and restart nothing that reads them.

- server.crt/server.key: the server's TLS certificate for its Service names
  (self-signed; the web pod trusts exactly this certificate).
- metrics_token: GET /metrics bearer token.
- postgres.crt/postgres.key: TLS for the bundled PostgreSQL (postgresql.enabled).

Pod-to-pod only: browsers reach the web pod (or your Ingress), never these.
To rotate, delete this Secret and run `helm upgrade` (then restart the pods).
`helm template` has no cluster to look up, so it renders fresh values each time:
GitOps tools that render with it (ArgoCD) must set secureBaseline.existingSecret, in
which case this Secret is not rendered at all and nothing is generated.
The data is computed once per render in the keyorix.secureBaseline.data helper; the
server, web and postgres pods carry its checksum (checksum/secure-baseline), so a
changed Secret rolls them.
*/ -}}
{{- $name := printf "%s-secure-baseline" (include "keyorix.fullname" .) -}}
{{- $data := include "keyorix.secureBaseline.data" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k }}
  {{- end }}
{{- end }}
