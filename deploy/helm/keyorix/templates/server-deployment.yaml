apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.server.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # kube-score (helm-chart-policy CI job): deployment-strategy/deployment-replicas
    # both assume a horizontally-scalable Deployment -- server is pinned to exactly
    # 1 replica with Recreate (see the replicas/strategy comments right below):
    # RollingUpdate would briefly run 2 pods against the same ReadWriteOnce keys
    # volume, which can't work, and >1 replica would mean 2 processes racing the
    # same per-instance KEK. Not a compromise to relax later -- structurally
    # required by the ReadWriteOnce ownership model.
    kube-score/ignore: "deployment-strategy,deployment-replicas"
spec:
  # Single instance: the keys volume is ReadWriteOnce and the KEK is per-instance.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-config.yaml") . | sha256sum }}
        {{- if .Values.secureBaseline.enabled }}
        checksum/secure-baseline: {{ include "keyorix.secureBaseline.checksum" . }}
        {{- end }}
        # kube-score: container-security-context-user-group-id wants a UID/GID >
        # 10000; 1001 is fixed to match the server image's own "keyorix" user (see
        # the securityContext comment below) -- same already-reviewed tradeoff as
        # this repo's checkov CKV_K8S_40 exclusion (CLAUDE.md), applied per-object
        # here since k8s-sync/operator's distroless UID (65532) already satisfies
        # this check on its own and shouldn't have it silenced too.
        kube-score/ignore: "container-security-context-user-group-id"
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # matches the server image's "keyorix" user (server/Dockerfile: addgroup/
        # adduser -u 1001 -g 1001).
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # Also lets prepare-files (secureBaseline) read the root-owned Secret
        # volume files via group 1001.
        # The keys PVC must be writable by uid 1001: most provisioners (local-path,
        # hostPath, NFS) hand out a root-owned directory, and without fsGroup the
        # server cannot create data.key/kek.salt on first boot. Files the server
        # creates stay 0600 (internal/encryption), so group access is not widened.
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.secureBaseline.enabled }}
      initContainers:
        # secureBaseline (SECURE-DEFAULT-1, #2922): the startup audit and
        # `admin validate --posture` require the config, TLS certificate/key and
        # metrics token to be 0600 and owned by the server's uid. ConfigMap and
        # Secret files are root-owned, so copy them into the /app/run memory
        # emptyDir as this uid first.
        - name: prepare-files
          image: {{ include "keyorix.server.image" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              mkdir -p /app/run/tls
              cp /mnt/config/keyorix.yaml /app/run/keyorix.yaml
              cp /mnt/secure/server.crt /app/run/tls/server.crt
              cp /mnt/secure/server.key /app/run/tls/server.key
              cp /mnt/secure/metrics_token /app/run/tls/metrics_token
              chmod 600 /app/run/keyorix.yaml /app/run/tls/server.crt /app/run/tls/server.key /app/run/tls/metrics_token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /mnt/config
              readOnly: true
            - name: secure-baseline
              mountPath: /mnt/secure
              readOnly: true
            - name: run
              mountPath: /app/run
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: 100m
              memory: 16Mi
              ephemeral-storage: 1Mi
      {{- end }}
      containers:
        - name: server
          image: {{ include "keyorix.server.image" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          env:
            # Credentials are FILES from the mounted Secret (see the `secrets` volume),
            # never environment values: an env var is returned verbatim by the API to
            # anyone who can read the pod spec's resolved env, shows up in
            # /proc/<pid>/environ and is inherited by every child process. The server
            # (internal/secretenv) and entrypoint.sh read these *_FILE paths.
            - name: KEYORIX_MASTER_PASSWORD_FILE
              value: /run/secrets/keyorix/master-password
            - name: KEYORIX_DB_PASSWORD_FILE
              value: /run/secrets/keyorix/db-password
            - name: KEYORIX_ADMIN_USERNAME
              value: {{ .Values.auth.adminUsername | quote }}
            - name: KEYORIX_ADMIN_EMAIL
              value: {{ .Values.auth.adminEmail | quote }}
            {{- if include "keyorix.hasAdminPassword" . }}
            - name: KEYORIX_ADMIN_PASSWORD_FILE
              value: /run/secrets/keyorix/admin-password
            {{- end }}
            {{- if include "keyorix.hasBootstrapToken" . }}
            # Required for auth.adminPassword's first-boot bootstrap to actually
            # complete (server/main.go rejects POST /system/init without a matching
            # token) and to make manual `keyorix system init` possible without
            # rebooting the pod -- see keyorix.bootstrapToken in _helpers.tpl.
            # Omitted (old masked-log-only behaviour) for an auth.existingSecret
            # that has no KEYORIX_BOOTSTRAP_TOKEN key.
            - name: KEYORIX_BOOTSTRAP_TOKEN_FILE
              value: /run/secrets/keyorix/bootstrap-token
            {{- end }}
            {{- if .Values.secureBaseline.enabled }}
            # The private copy prepare-files made, and how entrypoint.sh reaches
            # this server for its first-boot bootstrap (verified TLS).
            - name: KEYORIX_CONFIG_PATH
              value: /app/run/keyorix.yaml
            - name: KEYORIX_LOCAL_URL
              value: "https://localhost:{{ .Values.server.service.port }}"
            - name: KEYORIX_LOCAL_CA_FILE
              value: /app/run/tls/server.crt
            {{- end }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/keyorix
              readOnly: true
            - name: config
              mountPath: /app/keyorix.yaml
              subPath: keyorix.yaml
              readOnly: true
            - name: keys
              mountPath: /app/keys
            - name: tmp
              mountPath: /tmp
            {{- if .Values.secureBaseline.enabled }}
            - name: run
              mountPath: /app/run
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              {{- if .Values.secureBaseline.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              {{- if .Values.secureBaseline.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- if .Values.server.resources }}
            {{- toYaml .Values.server.resources | nindent 12 }}
            {{- else }}
            # Kept in sync with values.yaml's own server.resources default --
            # see its comment for the Guaranteed-QoS/measurement derivation.
            requests:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
            {{- end }}
      volumes:
        # 0440 + the pod's fsGroup (1001) = readable by the server, nobody else, and
        # exactly what the server's secret-file permission check accepts (nothing for
        # "other", no group write). A projected volume lets only the listed keys in.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ include "keyorix.secretName" . }}
                  items:
                    - key: KEYORIX_MASTER_PASSWORD
                      path: master-password
                    - key: KEYORIX_DB_PASSWORD
                      path: db-password
                    {{- if include "keyorix.hasAdminPassword" . }}
                    - key: KEYORIX_ADMIN_PASSWORD
                      path: admin-password
                    {{- end }}
                    {{- if include "keyorix.hasBootstrapToken" . }}
                    - key: KEYORIX_BOOTSTRAP_TOKEN
                      path: bootstrap-token
                    {{- end }}
        - name: config
          configMap:
            name: {{ include "keyorix.server.fullname" . }}-config
        - name: keys
          {{- if .Values.server.keysPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "keyorix.server.fullname" . }}-keys
          {{- else }}
          emptyDir:
            sizeLimit: 16Mi
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.secureBaseline.enabled }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: secure-baseline
          secret:
            secretName: {{ include "keyorix.secureBaseline.secretName" . }}
            defaultMode: 0440
            items:
              - key: server.crt
                path: server.crt
              - key: server.key
                path: server.key
              - key: metrics_token
                path: metrics_token
        {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
