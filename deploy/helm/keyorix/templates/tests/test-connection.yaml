apiVersion: v1
kind: Pod
metadata:
  name: {{ include "keyorix.fullname" . }}-test
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    # checkov (helm-chart-security CI job): this is an ephemeral `helm test` hook
    # pod (deleted after each run), not a long-running production workload -- it
    # doesn't carry the same registry-compromise blast radius that motivates
    # digest-pinning this project's own long-lived server/web/operator/k8s-sync
    # images, and busybox:1.36 is already a specific, well-known pinned tag.
    checkov.io/skip1: CKV_K8S_43=ephemeral test-hook pod on a well-known pinned tag, not a production workload
    # kube-score (helm-chart-policy CI job):
    #   - container-security-context-user-group-id: uid 65534 (nobody) already
    #     satisfies the >10000 recommendation; only the GROUP is left at its
    #     default (0) since a plain `wget --spider` needs no group identity of
    #     its own -- same already-reviewed tradeoff as this repo's checkov
    #     CKV_K8S_40 exclusion.
    #   - pod-networkpolicy: this is a `helm test` hook pod (see
    #     helm.sh/hook above) -- created, runs one wget, and is deleted within
    #     seconds of every `helm test` invocation. A dedicated NetworkPolicy for
    #     a pod that exists that briefly is disproportionate to the risk it
    #     poses; it already carries the same hardened securityContext as this
    #     chart's long-lived containers otherwise.
    kube-score/ignore: "container-security-context-user-group-id,pod-networkpolicy"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    # A plain `wget --spider` needs no elevated privileges at all -- matches the
    # same hardening baseline as the application's own containers (#helm-chart-security).
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "-S"
        {{- if .Values.secureBaseline.enabled }}
        # secureBaseline: the server only speaks TLS (busybox wget has no CA
        # option), so test the path users take: the web pod's nginx, which
        # proxies to the server over verified HTTPS.
        - "http://{{ include "keyorix.web.fullname" . }}:{{ .Values.web.service.port }}/api/v1/version"
        {{- else }}
        - "http://{{ include "keyorix.server.fullname" . }}:{{ .Values.server.service.port }}/health"
        {{- end }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
          ephemeral-storage: 16Mi
