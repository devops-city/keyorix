{{- include "keyorix.valuesDefaults" . -}}
{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keyorix.web.fullname" . }}
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "keyorix.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/web-config.yaml") . | sha256sum }}
        {{- if .Values.secureBaseline.enabled }}
        checksum/secure-baseline: {{ include "keyorix.secureBaseline.checksum" . }}
        {{- end }}
        # kube-score (helm-chart-policy CI job), each with an already-settled reason
        # elsewhere in this file/chart, not a fresh judgment call made here:
        #   - container-security-context-user-group-id: fixed uid 101 to match the
        #     nginx image's own user (see the securityContext comment below) -- same
        #     already-reviewed tradeoff as this repo's checkov CKV_K8S_40 exclusion.
        #   - pod-probes-identical: /health (web-config.yaml) is a static "return
        #     200 healthy" location with no dependency check -- readiness and
        #     liveness are tautologically identical here, so differentiating them
        #     would add a distinct probe with zero behavioral difference.
        #   - pod-networkpolicy: this chart's own networkpolicy.yaml already
        #     documents WHY web's ingress is deliberately left unrestricted (the
        #     intended public entry point, often via an Ingress controller whose
        #     pod labels vary by installation).
        kube-score/ignore: >-
          container-security-context-user-group-id,
          pod-probes-identical,
          pod-networkpolicy
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # A non-root nginx binding port 80 needs CAP_NET_BIND_SERVICE (below,
        # container-level), not root — UID 101 is nginx's own non-root user in the
        # standard/alpine nginx images this is built from.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "keyorix.web.image" . | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # nginx's cache, pid file, temp files and logs are the only writes;
            # each lives on its own emptyDir (writable by uid 101) below.
            readOnlyRootFilesystem: true
            capabilities:
              add: ["NET_BIND_SERVICE"]
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- if .Values.secureBaseline.enabled }}
            - name: server-ca
              mountPath: /etc/keyorix/tls
              readOnly: true
            {{- end }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /run
            - name: nginx-log
              mountPath: /var/log/nginx
            - name: nginx-tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- if .Values.web.resources }}
            {{- toYaml .Values.web.resources | nindent 12 }}
            {{- else }}
            # Kept equal to values.yaml's web.resources (deploy/helm_resources_test.go).
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 128Mi
            {{- end }}
      {{- with include "keyorix.topologySpread" (list . "web" .Values.web.topologySpreadConstraints .Values.web.replicas) }}
      {{- . | nindent 6 }}
      {{- end }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "keyorix.web.fullname" . }}-config
        {{- if .Values.secureBaseline.enabled }}
        # Only the server's public certificate, never its key or the token.
        - name: server-ca
          secret:
            secretName: {{ include "keyorix.secureBaseline.secretName" . }}
            defaultMode: 0444
            items:
              - key: server.crt
                path: ca.crt
        {{- end }}
        # Every emptyDir carries a sizeLimit: past it the kubelet evicts the pod
        # instead of letting a runaway writer fill the node's ephemeral storage.
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        # access/error logs (web/nginx.conf writes files here).
        - name: nginx-log
          emptyDir:
            sizeLimit: 32Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end -}}
