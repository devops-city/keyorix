{{- include "keyorix.valuesDefaults" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keyorix.server.fullname" . }}-config
  labels:
    {{- include "keyorix.labels" . | nindent 4 }}
data:
  keyorix.yaml: |
    environment: production
    # security.enable_file_permission_check is deliberately NOT set. Since ADR-112 an
    # absent key means TRUE: key material (the keys PVC files, the *_FILE secret files
    # from the Secret volume) is checked strictly at every start, while this
    # ConfigMap-mounted file (root-owned 0644, mounted by the kubelet) only produces a
    # warning. An explicit `true` would audit THIS file strictly too and the pod would
    # refuse to start. deploy TestShippedHelmConfig_FilePermissionCheckIsOn
    # pins this.
    server:
      http:
        enabled: true
        # Pod networking: the kubelet probes and Service reach the pod IP, so
        # the built-in loopback-only default (#2939) must be widened here.
        host: "0.0.0.0"
        port: "{{ .Values.server.service.port }}"
        {{- with .Values.server.trustedProxies }}
        # server.trustedProxies: peers whose X-Forwarded-For / X-Forwarded-Proto the
        # server honors (client IP; HSTS and the Secure flag of session/CSRF cookies).
        trusted_proxies:
          {{- range . }}
          {{- if not (regexMatch "^[0-9a-fA-F:.]+(/[0-9]{1,3})?$" (toString .)) }}
          {{- fail (printf "server.trustedProxies: %q is not an IP or CIDR" (toString .)) }}
          {{- end }}
          - {{ toString . | quote }}
          {{- end }}
        {{- end }}
        {{- if .Values.secureBaseline.enabled }}
        # secureBaseline (SECURE-DEFAULT-1): /app/run is the memory emptyDir the
        # prepare-files initContainer fills from the <fullname>-secure-baseline
        # Secret, 0600, owned by the server's uid.
        tls:
          enabled: true
          cert_file: "/app/run/tls/server.crt"
          key_file: "/app/run/tls/server.key"
        ratelimit:
          enabled: true
          requests_per_second: 50
          burst: 100
        metrics_token_file: "/app/run/tls/metrics_token"
      grpc:
        enabled: false
        ratelimit:
          enabled: true
          requests_per_second: 25
          burst: 50
        metrics_token_file: "/app/run/tls/metrics_token"
    security:
      require_transport_tls: true
        {{- end }}
    storage:
      type: postgres
      database:
        host: {{ include "keyorix.dbHost" . }}
        port: "{{ .Values.postgresql.enabled | ternary 5432 .Values.externalDatabase.port }}"
        name: {{ .Values.postgresql.enabled | ternary .Values.postgresql.auth.database .Values.externalDatabase.database }}
        user: {{ .Values.postgresql.enabled | ternary .Values.postgresql.auth.username .Values.externalDatabase.user }}
        {{- if and .Values.postgresql.enabled .Values.secureBaseline.enabled }}
        # The bundled PostgreSQL serves TLS with the chart's self-signed
        # certificate: encrypted, not verified (pod network only).
        ssl_mode: require
        {{- else }}
        ssl_mode: {{ .Values.postgresql.enabled | ternary "disable" .Values.externalDatabase.sslMode }}
        {{- end }}
      encryption:
        enabled: true
        # The wrapped DEK + KEK salt live on the persisted keys volume. These MUST
        # survive restarts — losing them, or changing KEYORIX_MASTER_PASSWORD,
        # makes every stored secret undecryptable.
        dek_path: "/app/keys/data.key"
        salt_path: "/app/keys/kek.salt"
