# Default values for the Keyorix chart.

# ── Required secrets ──────────────────────────────────────────────────────────
# The KEK is derived from masterPassword. Changing it after first boot makes
# every stored secret undecryptable — set it once and keep it. Provide it here,
# or set auth.existingSecret to bring your own Secret (recommended for prod).
auth:
  # The encryption master passphrase. REQUIRED unless existingSecret is set.
  masterPassword: ""
  # Optional first-boot admin bootstrap (idempotent). Leave password empty to
  # run `keyorix system init` manually instead. Must satisfy the server's own
  # admin-bootstrap password policy: at least 16 characters, with an
  # uppercase letter, a lowercase letter, a digit, and a special character,
  # AND must not contain adminUsername/adminEmail/"Administrator" as a
  # substring (internal/core/rules/password_policy.go +
  # internal/core/auth_bootstrap.go's CreateUser call -- the substring check
  # is enforced separately/later than the rest of the policy). The chart
  # fails the render if it's under 16 characters or contains the username,
  # the email's local part or "Administrator" (case-insensitively); the
  # other rules can't be chart-checked -- get those wrong and the server pod
  # exits non-zero at first boot (crash-loop, #3025) after printing the
  # policy's reason in its log. A rejected password writes nothing, so
  # `helm upgrade` with a compliant one completes the install.
  adminUsername: "admin"
  adminEmail: "admin@keyorix.local"
  adminPassword: ""
  # Bring your own Secret instead of the values above. It must contain keys:
  #   KEYORIX_MASTER_PASSWORD, KEYORIX_DB_PASSWORD, and optionally
  #   KEYORIX_ADMIN_PASSWORD and KEYORIX_BOOTSTRAP_TOKEN.
  # Pods read these as mounted files (the server's *_FILE support), never as env.
  existingSecret: ""
  # Which optional keys existingSecret carries. A pod only gets a *_FILE variable for
  # a key that exists (a *_FILE pointing at nothing is a startup error by design).
  # `helm install/upgrade` detects the keys in the live Secret on its own; set these
  # to true for `helm template`, GitOps renderers (Argo CD, Flux) and other flows
  # where the chart cannot look the Secret up.
  existingSecretKeys:
    adminPassword: false
    bootstrapToken: false

# ── Secure baseline (SECURE-DEFAULT-1, ADR-112 §4) ────────────────────────────
# When enabled, `keyorix-server admin validate --posture` reports zero
# deviations on this chart's config, file permissions included: the server
# serves TLS (certificate generated by Helm, kept across upgrades) and requires
# it, the web pod proxies to it over HTTPS and verifies that certificate, API
# rate limiting is on, /metrics needs a generated token, the bundled PostgreSQL
# serves TLS (ssl_mode: require), and an initContainer copies the config,
# certificate, key and token into a memory emptyDir at 0600 owned by the
# server's uid (#2922: ConfigMap/Secret files are root-owned).
# On by default since v0.96.0. It NEEDS A SERVER IMAGE NEWER THAN v0.95.3
# (metrics_token_file is new): when pinning an older image.tag, set
# secureBaseline.enabled=false (deploy TestHelmSecureBaselineOnByDefaultAfterRelease).
secureBaseline:
  enabled: true
  # Lifetime of the generated pod-to-pod certificates (server <-> web,
  # server <-> postgresql). Browsers never see them. Rotate by deleting the
  # <fullname>-secure-baseline Secret and running `helm upgrade`.
  certValidityDays: 3650
  # Name of a pre-created Secret holding the baseline's certificates and token.
  # When set, the chart generates NOTHING and renders no Secret: the pods mount
  # this one. Use it with GitOps tools that render with `helm template` (ArgoCD,
  # Flux post-renderers): there `lookup` sees no cluster, so the generated
  # values change on every sync. Requires secureBaseline.enabled=true (setting
  # it alone fails the render rather than being ignored). Unset (default) keeps
  # the chart-generated, lookup-persisted Secret.
  # Required keys (the Postgres pair only while postgresql.enabled=true):
  #   server.crt      PEM server certificate (SANs: the server Service names)
  #   server.key      PEM private key for server.crt
  #   metrics_token   bearer token for GET /metrics
  #   postgres.crt    PEM certificate of the bundled PostgreSQL
  #   postgres.key    PEM private key for postgres.crt
  # Where Helm can read the cluster (helm install/upgrade) a missing or empty
  # key fails the render; under `helm template` it cannot be checked.
  # Also set auth.existingSecret for a fully deterministic render (the
  # bootstrap token in the auth Secret is generated otherwise).
  # See README.md ("Secure baseline with an existing Secret").
  existingSecret: ""
  # Optional, only with existingSecret. Any string (a counter, a date, the
  # Secret's resourceVersion). Kubernetes does not restart pods when a mounted
  # Secret changes and, under ArgoCD, the chart cannot see the Secret, so the
  # pod annotation checksum/secure-baseline is constant: after rotating the
  # Secret, bump this value in Git to roll the server, web and bundled-Postgres
  # pods. Empty (default) leaves the annotation exactly as it is without it.
  # Setting it without existingSecret fails the render.
  existingSecretRevision: ""

# ── API server ────────────────────────────────────────────────────────────────
server:
  image:
    repository: ghcr.io/keyorixhq/keyorix-server
    # Empty defaults to this chart's own appVersion (a pinned `vX.Y.Z`), matching
    # the keyorix-operator/keyorix-k8s-sync charts. `latest`/`main` are MUTABLE —
    # the exact same tag can point at a different image tomorrow, defeating "what
    # did I actually deploy" and any image-scan attestation pinned to this value —
    # only set this to a floating tag if you understand that tradeoff. A digest
    # via `digest:` below (strongest pin) takes precedence over either.
    tag: ""
    # digest, when set (e.g. "sha256:abc123..."), pins the exact image content —
    # immune to a tag being retargeted after the fact — and takes precedence over
    # tag.
    digest: ""
    pullPolicy: IfNotPresent
  # The server holds the encryption keys on a single ReadWriteOnce volume and is
  # a single logical instance — do not scale beyond 1 replica.
  replicas: 1
  service:
    port: 8080
  # trustedProxies is the server's own server.http.trusted_proxies: IPs/CIDRs of the
  # proxies whose X-Forwarded-For and X-Forwarded-Proto the SERVER honors, as the
  # server sees them (the TCP peer). From a listed peer carrying
  # X-Forwarded-Proto=https the server sends HSTS and marks the session and CSRF
  # cookies Secure; it never trusts those headers from any other peer. Empty
  # (default): nothing is trusted. Needed only if something OTHER than the web pod
  # reaches the server through a TLS-terminating load balancer (the chart's Ingress
  # routes to web, whose nginx makes its own decision; see web.trustedProxies).
  trustedProxies: []
  # accessLog.onSinkStall is the server's server.access_log.on_sink_stall: what a
  # request does when the access-log sink (the container's stdout/log collector)
  # stalls and the 1 MiB queue is full. "block" (default, same as empty): wait, so
  # no access-log line is ever lost. "drop": keeps serving secrets when the log sink
  # stalls; access-log lines past the 1 MiB queue are dropped and reported (warning
  # log, GET /api/v1/system/info access_log_dropped); the audit trail is unaffected.
  accessLog:
    onSinkStall: ""
  # Persistent volume for the wrapped DEK + KEK salt (/app/keys). MUST persist —
  # losing it makes every stored secret undecryptable. Back it up.
  keysPersistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  # requests == limits for both cpu and memory (Guaranteed QoS -- see
  # docs/adr-100-mlockall-removal-deployment-swap-control.md): under Kubernetes'
  # NodeSwap, only Burstable-QoS pods are eligible for swap at all -- Guaranteed
  # (and BestEffort) pods receive zero swap unconditionally
  # (github.com/kubernetes/enhancements/blob/master/keps/sig-node/2400-node-swap/README.md:
  # "Swap access is granted only for pods of Burstable QoS"). Since mlockall was
  # removed, this is now the ONLY control preventing decrypted secret memory from
  # being swapped to disk on a cluster where a node opts into swap -- a
  # requests==limits mismatch here silently reopens exactly the gap ADR-100 closed.
  # ephemeral-storage is NOT part of QoS classification and is left as before.
  #
  # memory: 512Mi is unchanged from before mlockall removal, but re-derived from
  # measurement rather than inherited: the real server binary
  # (server/Dockerfile, linux/arm64 via this environment's Docker backend --
  # see ADR-100's own environment caveat) measured VmRSS at rest ~22.5MB, peak
  # (VmHWM) ~82MB after creating 50 secrets (20 * 500KB + 30 * 2MB payloads) via
  # the real HTTP API -- 512Mi is ~6.4x that observed peak, headroom for
  # larger production bulk operations (bigger secret exports, wider audit
  # queries) this synthetic load didn't exercise.
  #
  # cpu: previously 100m request / 1 limit (Burstable). Request raised to match
  # the existing limit -- the trade-off: every server pod now permanently
  # reserves a full CPU core from the node's allocatable capacity, even at
  # idle, instead of bursting into it opportunistically. Not re-derived from
  # measurement (no CPU load test was run); kept at the existing limit value
  # rather than picked arbitrarily.
  resources:
    requests:
      cpu: 1
      memory: 512Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 1
      memory: 512Mi
      ephemeral-storage: 256Mi
  # GOMEMLIMIT (Go's soft heap limit) for the server container. By default it is
  # goMemLimitPercent of resources.limits.memory (rounded down), leaving the rest
  # for stacks, the runtime's own overhead and non-heap memory. Set goMemLimit to
  # a Go size ("400MiB") to override it verbatim, or goMemLimitPercent: 0 to leave
  # GOMEMLIMIT unset. GOGC is left at the Go default. GOMAXPROCS needs nothing:
  # Go >= 1.25 sets it from the cgroup CPU limit.
  goMemLimit: ""
  goMemLimitPercent: 85
  # Probe timing for the server container. Endpoints are fixed: startup and liveness
  # use GET /health (never touches the database, so a database blip does not restart
  # the pod), readiness uses GET /readyz (pings the database; 503 takes the pod out
  # of the Service without restarting it). Any field a probe accepts may be set here
  # (e.g. server.probes.startup.failureThreshold); unset fields keep these defaults.
  # The startup probe gives a first boot (migrations, admin bootstrap) 36 x 5s = 3 min
  # before liveness takes over; raise failureThreshold for a very large database.
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 36
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Web UI ────────────────────────────────────────────────────────────────────
web:
  enabled: true
  image:
    repository: ghcr.io/keyorixhq/keyorix-web
    # See server.image.tag — same appVersion-pinned default, same mutable-tag
    # caveat if you override it.
    tag: ""
    # digest, when set, takes precedence over tag (see server.image.digest).
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi
      ephemeral-storage: 128Mi
  # corsAllowedOrigins allowlists origins (exact scheme+host+port, e.g.
  # "https://app.example.com") the nginx-proxied /api, /auth, /system endpoints will
  # accept CREDENTIALED cross-origin requests from. The bundled web UI's own JS calls
  # these same-origin (served by this same nginx) and needs no entry here. Empty by
  # default: no cross-origin API access unless explicitly opted in.
  corsAllowedOrigins: []
  # trustedProxies lists the IPs/CIDRs of the load balancer / ingress controller
  # that terminates TLS in front of the web pod, as the web nginx sees them (the TCP
  # peer; with an ingress controller that is the controller pod network, not the
  # cloud LB). Keep it equal to the server's http.trusted_proxies. The web nginx
  # sends Strict-Transport-Security ONLY for a request from one of these peers that
  # carries X-Forwarded-Proto=https; it never trusts that header from any other
  # client and never sends HSTS over plain http. Empty (default): nothing is
  # trusted, so no HSTS is sent by this layer.
  trustedProxies: []
  hsts:
    # auto: send HSTS iff trustedProxies is non-empty. on: same, but fail the
    # render if trustedProxies is empty. off: never send HSTS from the web nginx.
    mode: auto
    maxAge: 31536000
    includeSubDomains: true

# ── Ingress (for the web UI) ──────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: keyorix.local
  # e.g. [{ secretName: keyorix-tls, hosts: [keyorix.example.com] }]
  # #479: left empty, the ingress serves plaintext HTTP only — session cookies,
  # PATs, and the admin/master passwords entered at login would cross the wire
  # unencrypted. Only leave this empty if TLS already terminates upstream (e.g.
  # a cloud load balancer or service mesh) before traffic reaches this ingress.
  tls: []

# ── Bundled PostgreSQL ────────────────────────────────────────────────────────
# A minimal in-chart Postgres for evaluation. For production, set enabled:false
# and point externalDatabase at a managed/HA PostgreSQL.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: keyorix
    database: keyorix
    # Password for the bundled DB. REQUIRED when postgresql.enabled and no
    # auth.existingSecret is set. Deliberately has no default (no empty
    # placeholder value either): the chart fails the render when it is unset.
    # Pass it with --set postgresql.auth.password=... or a values file.
    # password:
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  # The uid/gid the bundled Postgres runs as (and the fsGroup of its volume). It
  # MUST be the uid of the image in use: 70 for the official postgres:*-alpine
  # images (the default tag here and the one docker-compose.yml uses), 999 for the
  # Debian-based postgres:* images. Postgres refuses to start on a data directory
  # owned by a different uid.
  #
  # UPGRADING a release installed with a chart older than this one: those charts
  # ran the pod as 999 even on the alpine image, so the existing volume is owned by
  # 999 and the pod will CrashLoop ("data directory ... has wrong ownership"). Either
  #   --set postgresql.runAsUser=999            (keep running as the old owner), or
  #   --set postgresql.migrateOwnership=true    (one-time chown to runAsUser, below).
  runAsUser: 70
  # Opt-in, and off by default because it adds a ROOT init container (capabilities
  # CHOWN + DAC_READ_SEARCH only, read-only root FS, no network access needed) that a
  # Pod Security "restricted" namespace would reject. It chowns only entries of the
  # data volume not already owned by runAsUser:runAsUser, and is a no-op afterwards,
  # so it can be removed again once the volume is migrated. Rolling back to a chart
  # that runs as 999 after migrating needs the reverse.
  migrateOwnership: false
  # Extra server settings for the bundled PostgreSQL, rendered as
  # `postgres -c key=value`. Empty = the image's defaults. Production profile
  # (docs/PERFORMANCE.md, "Production PostgreSQL profile"), sized for the
  # 1Gi memory limit below; scale shared_buffers / effective_cache_size with it:
  #   settings:
  #     shared_buffers: 256MB        # ~25% of resources.limits.memory
  #     effective_cache_size: 768MB  # ~75% of resources.limits.memory
  #     wal_buffers: 16MB
  #     wal_compression: lz4
  #     checkpoint_timeout: 15min
  #     max_wal_size: 2GB            # keep well under persistence.size
  # Durability is not tunable here: synchronous_commit, fsync and full_page_writes
  # accept only durable values (on/true/yes/1; synchronous_commit also local,
  # remote_write, remote_apply). The audit entry is committed before a secret is
  # returned; whether that commit waits for the disk sync is the server's
  # storage.database.audit_durability (strict | standard), not a database setting.
  # Settings that would override the secure baseline or run commands are refused:
  # ssl and ssl_*, hba_file, ident_file, listen_addresses, port,
  # password_encryption, data_directory, config_file, archive_command,
  # archive_library, restore_command. session_replication_role is refused too: in
  # 'replica' mode PostgreSQL enforces no foreign keys and fires no ordinary
  # trigger, and the server refuses to start unless it is 'origin' (#3361).
  settings: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 512Mi

# auditDurability is the server's storage.database.audit_durability: whether an
# audit entry's commit waits for the disk sync before the secret is returned.
#   ""         (default) leave it unset: the backend default applies.
#   "strict"   wait for the disk sync.
#   "standard" do not wait for the disk sync.
# Anything else is rejected (values.schema.json). Not a PostgreSQL setting: see
# postgresql.settings.
auditDurability: ""

# Used when postgresql.enabled is false.
externalDatabase:
  host: ""
  port: 5432
  database: keyorix
  user: keyorix
  sslMode: require
  # CA that signed the database server's certificate, rendered as
  # storage.database.ssl_root_cert. REQUIRED with sslMode verify-full/verify-ca
  # (the server refuses to start without it, and so does `helm template`). Set
  # ONE of:
  #   caSecret.name: a Secret in the release namespace holding the CA's PEM
  #     under caSecret.key. The chart mounts it read-only (0440, group = the
  #     pod's fsGroup) at /app/db-ca/ca.crt and points ssl_root_cert there. The
  #     server reads the CA once, when it opens its database pool: after
  #     rotating the Secret, restart it (kubectl rollout restart).
  #   sslRootCert: "system" trusts the image's OS CA store (a publicly issued
  #     certificate); a path names a PEM file you mount into the server pod
  #     yourself.
  sslRootCert: ""
  caSecret:
    name: ""
    key: ca.crt
  # Connection pooler between the server and this database, rendered as
  # storage.database.pooler: "" (none), pgbouncer-session or
  # pgbouncer-transaction. Point host/port at the pooler. Transaction mode
  # needs settings on the PgBouncer side too: docs/postgresql-poolers.md.
  pooler: ""

# ── Network policy ────────────────────────────────────────────────────────────
# Scopes the server API and the bundled Postgres to same-namespace traffic —
# without this both are reachable from any pod in the cluster that can route to
# their Service. Disable only if your CNI doesn't support NetworkPolicy, or you
# have an equivalent policy managed elsewhere.
networkPolicy:
  enabled: true
  egress:
    # Restricts each pod's OUTBOUND traffic to only what it actually needs (DNS,
    # and its one known in-cluster peer) instead of the cluster-wide-reachable
    # default every pod has without this. web and postgresql get a fully static,
    # known egress surface with no further configuration needed. server's real
    # egress surface is NOT static — SSO/OIDC/SAML identity providers, webhook
    # notification sinks, secret-rotation backends (Vault/Azure/AWS/etc.), and
    # externalDatabase.host (when postgresql.enabled is false) are all
    # admin-configured destinations this chart cannot know ahead of time. Turning
    # this on WITHOUT also populating extraRules below for whichever of those
    # features you use will silently break them — a NetworkPolicy drop looks like
    # a hung/timed-out call, not a clear error. See templates/networkpolicy.yaml
    # for the full per-component rule set.
    enabled: true
    # extraRules: additional egress rules (raw NetworkPolicyEgressRule entries, the
    # same `to`/`ports` shape Kubernetes itself uses), appended verbatim to the
    # server pod's egress rules only. Required for SSO/webhook/rotation-backend
    # destinations and for externalDatabase when postgresql.enabled is false — e.g.:
    #   extraRules:
    #     - to:
    #         - ipBlock: { cidr: 10.0.5.0/32 }
    #       ports:
    #         - protocol: TCP
    #           port: 5432
    extraRules: []
    # databaseTo: with postgresql.enabled=false the server's egress to the external
    # PostgreSQL is DENIED unless you name it here (a NetworkPolicy cannot match a
    # host name, so give the database's IPs/CIDRs or its in-cluster pods). A list of
    # NetworkPolicyPeer entries; the port is externalDatabase.port. Example:
    #   databaseTo:
    #     - ipBlock: { cidr: 10.20.0.0/24 }
    databaseTo: []
    # kmsTo / kmsPorts: the key-management or secret-backend endpoints the server calls
    # (Vault/OpenBao, a cloud KMS), same peer format, TCP on kmsPorts (default 443).
    kmsTo: []
    kmsPorts: [443]
  ingress:
    # controllerNamespaceSelector: labels of the ingress controller's namespace. When
    # set, the web pods accept traffic only from that namespace and this release's own
    # pods (the server and postgresql policies already restrict their ingress). Unset
    # (default) = web ingress unrestricted. Example (ingress-nginx):
    #   controllerNamespaceSelector:
    #     kubernetes.io/metadata.name: ingress-nginx
    controllerNamespaceSelector: {}
    # monitoringNamespaceSelector: labels of the namespace Prometheus scrapes from; it
    # may then reach the server port (/metrics). Needed for monitoring.serviceMonitor.
    monitoringNamespaceSelector: {}

# ── Monitoring ────────────────────────────────────────────────────────────────
monitoring:
  # Prometheus Operator ServiceMonitor for the server's /metrics. Needs the
  # monitoring.coreos.com CRDs. With the secure baseline the scrape is HTTPS with the
  # chart's certificate as CA and the generated /metrics bearer token; the
  # ServiceMonitor then lives in the release namespace (leave namespace empty).
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels, e.g. the release label your Prometheus selects ServiceMonitors by.
    labels: {}

imagePullSecrets: []
