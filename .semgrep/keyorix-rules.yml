# Custom Semgrep rules for patterns specific to this repo -- run alongside
# --config=auto (community rules) in .github/workflows/semgrep.yml. Each rule here
# closes a gap semgrep's generic ruleset can't see: a repo-specific convention
# (the one sanctioned helper for a security-sensitive operation) that the same
# mistake bypassed more than once across the codebase.

rules:
  - id: keyorix-unbounded-json-decoder
    languages: [go]
    severity: WARNING
    message: >-
      json.NewDecoder is reading from a source with no size limit. A large
      payload is fully buffered into memory before any of the decoded struct's
      own validation ever runs, which is a self-inflicted memory-exhaustion DoS
      when the source is a remote HTTP response or another process's stdin.
      Wrap it in io.LimitReader(...) or http.MaxBytesReader(...) first (see
      internal/mcp/keyorix.go's getJSON for the pattern). This rule excludes
      server/http/handlers/**, which server/middleware's MaxBodyBytes
      middleware already caps globally before any handler runs.
    metadata:
      category: security
      references:
        - internal/mcp/server.go (stdin JSON-RPC decode had no cap)
        - operator/internal/keyorix/client.go (FetchValue response decode had no cap)
    paths:
      exclude:
        - server/http/handlers/**
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - pattern: json.NewDecoder($X).Decode(...)
          - pattern: |
              $DEC := json.NewDecoder($X)
              ...
              $DEC.Decode(...)
      - pattern-not: json.NewDecoder(io.LimitReader(...)).Decode(...)
      - pattern-not: json.NewDecoder(http.MaxBytesReader(...)).Decode(...)
      - pattern-not: |
          $DEC := json.NewDecoder(io.LimitReader(...))
          ...
          $DEC.Decode(...)
      - pattern-not: |
          $DEC := json.NewDecoder(http.MaxBytesReader(...))
          ...
          $DEC.Decode(...)

  - id: keyorix-json-unmarshal-fail-open
    languages: [go]
    severity: WARNING
    message: >-
      This function parses a stored JSON column into a security-relevant
      restriction/scope value and returns nil on a parse error. If nil is
      interpreted downstream as "no restriction," a corrupted-but-non-empty
      stored value silently WIDENS access instead of failing closed -- the field
      was legitimately empty and unrestricted is a different case from the field
      being non-empty but unreadable. This does NOT apply to a purely additive
      grant model (e.g. an ACL where nil means "no extra grant, still governed
      by the base role check") -- only to a model where nil is interpreted as
      "unrestricted." Return a sentinel value that matches no real
      permission/CIDR instead of nil (see internal/core/pat.go's
      patScopeCorrupted or internal/core/machine_token.go's
      machineTokenCIDRCorrupted for the pattern), or add a `// nosemgrep:
      keyorix-json-unmarshal-fail-open -- <reason>` comment if this is a
      confirmed additive-grant model.
    metadata:
      category: security
      references:
        - internal/core/pat.go DecodePATScopes (fixed, r124-M)
        - internal/core/machine_token.go machineRestrictionFrom (fixed, r137 PAT-001)
    paths:
      exclude:
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - pattern: |
              func $FUNC(...) $RET {
                ...
                if $ERR := json.Unmarshal(...); $ERR != nil {
                  return nil
                }
                ...
              }
          - pattern: |
              func $FUNC(...) $RET {
                ...
                if $ERR := json.Unmarshal(...); $ERR != nil {
                  return nil, nil
                }
                ...
              }
      - metavariable-regex:
          metavariable: $FUNC
          regex: (?i).*(restrict|scope|cidr|permission).*

  - id: keyorix-raw-error-to-client
    languages: [go]
    severity: WARNING
    message: >-
      A raw error's .Error() text is sent verbatim to the client (CWE-209). On
      the HTTP side this fires only for a 5xx ("backend/internal fault")
      status -- a 5xx path's error usually wraps a backend/storage/driver
      failure and can leak internal details (DSNs, file paths, stack context,
      driver error text), unlike a 4xx validation error, which is an
      application-generated, already-safe message describing what the caller
      did wrong. On the gRPC side (status.Error) this fires regardless of
      code, since this codebase's convention is to never pass a raw error
      straight into a gRPC status -- every status.Error call is expected to go
      through a map*Error-style translator returning a fixed safe string. Log
      the error server-side and return a fixed safe string instead (see
      clientSafe() in server/http/handlers, or the mapUserError-style pattern
      in server/grpc/services). If this specific error is a known, safe
      sentinel (checked via errors.Is/errors.As) whose .Error() text is
      already a fixed, non-sensitive string, add a `// nosemgrep:
      keyorix-raw-error-to-client -- <reason>` comment instead of changing it.
    metadata:
      category: security
      references:
        - server/http/handlers/secrets_versions.go, users_crud.go, rbac.go, dynamic_secrets.go, pat_handler.go, secret_schedule.go (fixed, CWE-209 sweep)
        - server/grpc/services/{user_service,machine_identity_service,break_glass_service}.go (fixed, r139 GRPC-003/004/005)
    paths:
      exclude:
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: sendError($W, $CODE, $E.Error(), $STATUS, ...)
                  - pattern: $H.sendError($W, $CODE, $E.Error(), $STATUS, ...)
              - metavariable-pattern:
                  metavariable: $STATUS
                  patterns:
                    - pattern-either:
                        - pattern: http.StatusInternalServerError
                        - pattern: http.StatusBadGateway
                        - pattern: http.StatusServiceUnavailable
                        - pattern: http.StatusGatewayTimeout
                        - pattern: http.StatusNotImplemented
          - pattern: status.Error($GCODE, $E.Error())

  - id: keyorix-role-grant-query-missing-expiry-filter
    languages: [go]
    severity: WARNING
    message: >-
      This function queries the user_roles/group_roles grants table (a
      models.UserRole/models.GroupRole read) without applying
      sqlWhereURNotExpired/sqlWhereGRNotExpired anywhere in the same function,
      unlike every other role-lookup function in this file. An expired JIT/
      time-boxed grant is then read back as a live, currently-held role --
      access reviews, role-replacement logic, and reinstatement counts all
      treat a lapsed grant as still active. Add
      .Where(sqlWhereURNotExpired, time.Now().UTC()) (or the GR variant for
      group grants) to the query chain, matching e.g. GetUserRoleIDsAt in this
      same file. If this function deliberately needs to see expired rows too
      (e.g. a cleanup/sweep job, or a Delete that intentionally targets both
      live and expired grants), add a `// nosemgrep:
      keyorix-role-grant-query-missing-expiry-filter -- <reason>` comment.
    metadata:
      category: security
      references:
        - internal/storage/store/local_rbac.go ListProjectRoleAssignments (fixed, AUTHZ-002, r137 Sprint 3)
        - internal/storage/store/local_rbac.go GetUserRoleIDsExact (fixed, AUTHZ-003, r137 Sprint 4)
    paths:
      include:
        - internal/storage/**
      exclude:
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      func $FN(...) $RET {
                        ...
                        var $VAR []models.UserRole
                        ...
                        $DB.Find(&$VAR)
                        ...
                      }
                  - pattern: |
                      func $FN(...) $RET {
                        ...
                        $DB.Model(&models.UserRole{})
                        ...
                      }
              - pattern-not: |
                  func $FN(...) $RET {
                    ...
                    $X.Where(sqlWhereURNotExpired, ...)
                    ...
                  }
          - patterns:
              - pattern-either:
                  - pattern: |
                      func $FN(...) $RET {
                        ...
                        var $VAR []models.GroupRole
                        ...
                        $DB.Find(&$VAR)
                        ...
                      }
                  - pattern: |
                      func $FN(...) $RET {
                        ...
                        $DB.Model(&models.GroupRole{})
                        ...
                      }
              - pattern-not: |
                  func $FN(...) $RET {
                    ...
                    $X.Where(sqlWhereGRNotExpired, ...)
                    ...
                  }

  - id: keyorix-unbounded-bulk-slice-param
    languages: [go]
    severity: WARNING
    message: >-
      This function takes a caller-supplied slice parameter and loops over it
      doing per-item work (a storage/DB round trip per item) with no upper
      bound on the slice's length. The global request body-size limit alone
      still permits a very large array of small values in one request (well
      over a million integers within 10 MiB), and the per-item loop has no
      cancellation check, so an oversized batch is a per-request resource-
      exhaustion vector (CWE-400) -- this also covers the CLI's embedded/local
      mode, which calls core functions directly, bypassing the HTTP body-size
      limit entirely. Add a `if len($PARAM) > maxBatchSize { return ...,
      fmt.Errorf(...) }` guard before the loop (see
      maxBulkAccessRequestBatchSize in internal/core/bulk_access_requests.go
      for the pattern). If this function is deliberately unbounded (e.g. an
      internal/trusted-only caller, or the loop does no per-item I/O), add a
      `// nosemgrep: keyorix-unbounded-bulk-slice-param -- <reason>` comment.
    metadata:
      category: security
      references:
        - internal/core/bulk_access_requests.go BulkApproveAccessRequests/BulkRejectAccessRequests (fixed, r141, #1331)
    paths:
      include:
        - internal/core/**
      exclude:
        - "**/*_test.go"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  func ($RECV *KeyorixCore) $FN(ctx context.Context, $PARAM []$T, ...) $RET {
                    ...
                    for $I, $ITEM := range $PARAM {
                      ...
                    }
                    ...
                  }
              - pattern-not: |
                  func ($RECV *KeyorixCore) $FN(ctx context.Context, $PARAM []$T, ...) $RET {
                    ...
                    if len($PARAM) > $MAX {
                      ...
                    }
                    ...
                  }
          - patterns:
              - pattern: |
                  func ($RECV *KeyorixCore) $FN(ctx context.Context, $PARAM []$T, ...) $RET {
                    ...
                    for _, $ITEM := range $PARAM {
                      ...
                    }
                    ...
                  }
              - pattern-not: |
                  func ($RECV *KeyorixCore) $FN(ctx context.Context, $PARAM []$T, ...) $RET {
                    ...
                    if len($PARAM) > $MAX {
                      ...
                    }
                    ...
                  }

  - id: keyorix-raw-clipboard-write
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Raw navigator.clipboard.writeText bypasses this app's clipboard
      auto-clear utility (copyToClipboard, web/src/utils/index.ts), which
      schedules an automatic wipe after CLIPBOARD_CLEAR_TIMEOUT. A credential
      copied this way sits in the OS clipboard indefinitely instead of being
      cleared, where a clipboard-history manager or clipboard-monitoring
      malware can pick it up later. Use copyToClipboard(...) instead.
    metadata:
      category: security
      references:
        - web/src/features/machine-identities/MachineTokensPanel.tsx (fixed)
        - web/src/features/dynamic-secrets/LeasesPanel.tsx (fixed)
    pattern: navigator.clipboard.writeText(...)
    paths:
      exclude:
        - web/src/utils/index.ts
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/__tests__/**"

  - id: keyorix-archive-entry-path-unchecked
    languages: [go]
    severity: ERROR
    message: >-
      A filesystem path is built directly from an archive entry's own name
      ($X.Name of a *tar.Header, or $X.Name of a *zip.File/zip.FileHeader) via
      filepath.Join, path.Join, os.Create, os.OpenFile, os.WriteFile, or
      os.MkdirAll, and this function has no filepath.IsLocal (or equivalent
      Rel/HasPrefix containment) check anywhere in it. An archive entry name
      is attacker-controlled input -- it can contain ".." segments or be an
      absolute path (tar-slip / zip-slip) -- so a crafted archive can write
      (or create directories) outside the intended extraction directory. Add
      a filepath.IsLocal(name) check that refuses the entry before building
      any path from it -- see internal/backupfmt/reader.go's
      ExtractArchive/stageFile (Session P review, #2270) for the pattern.
      KNOWN GAP: this rule is intentionally scoped to the direct, same-function
      shape (free Semgrep has no interprocedural taint tracking -- confirmed
      empirically while building this rule) -- it will not catch the name
      flowing into a helper through an untyped, unsuggestively-named string
      parameter (the exact shape #2270's original bug took: ExtractArchive
      passed hdr.Name into stageFile(stagingDir, name string, data []byte),
      which joined the bare "name" parameter with no local re-check). Review
      any new helper that takes a bare string parameter and builds a path
      from it by hand; this rule cannot see across that boundary.
    metadata:
      category: security
      references:
        - internal/backupfmt/reader.go ExtractArchive/stageFile (fixed, #2270, merged 2026-09-29)
    patterns:
      - pattern-either:
          - pattern: filepath.Join(..., $X.Name, ...)
          - pattern: path.Join(..., $X.Name, ...)
          - pattern: os.Create($X.Name)
          - pattern: os.OpenFile($X.Name, ...)
          - pattern: os.WriteFile($X.Name, ...)
          - pattern: os.MkdirAll($X.Name, ...)
      - pattern-not-inside: |
          func $FUNC(...) $RET {
            ...
            if !filepath.IsLocal(...) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          func $FUNC(...) $RET {
            ...
            if filepath.IsLocal(...) {
              ...
            }
            ...
          }
    paths:
      exclude:
        - "**/*_test.go"

  - id: keyorix-secret-env-as-flag-default
    languages: [go]
    severity: ERROR
    message: >-
      A secret-looking environment variable ($ENV) is used as a command-line
      flag's registered default. The flag package (and cobra/pflag) prints every
      non-empty default in its usage text -- on -h and on ANY unknown or
      malformed flag -- so a typo in a container's args copies the secret into
      the log. Register the flag with an empty default and read the variable
      after parsing (flagOrEnv in cmd/keyorix-k8s-sync/main.go and
      operator/cmd/main.go), or read it through internal/secretenv.
    metadata:
      category: security
      references:
        - cmd/keyorix-k8s-sync/main.go -metrics-bearer-token default os.Getenv("KEYORIX_METRICS_TOKEN") (fixed, SECRETENV-REVIEW-1)
        - operator/cmd/main.go -metrics-bearer-token default os.Getenv("KEYORIX_METRICS_TOKEN") (fixed, SECRETENV-REVIEW-1)
    patterns:
      - pattern-either:
          - pattern: flag.String($NAME, os.Getenv($ENV), ...)
          - pattern: flag.StringVar($PTR, $NAME, os.Getenv($ENV), ...)
          - pattern: $FS.String($NAME, os.Getenv($ENV), ...)
          - pattern: $FS.StringVar($PTR, $NAME, os.Getenv($ENV), ...)
          - pattern: $FS.StringP($NAME, $SHORT, os.Getenv($ENV), ...)
          - pattern: $FS.StringVarP($PTR, $NAME, $SHORT, os.Getenv($ENV), ...)
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i).*(TOKEN|PASSWORD|PASSWD|SECRET|PASSPHRASE|CREDENTIAL|API_?KEY|PRIVATE_?KEY|DSN).*
    paths:
      exclude:
        - "**/*_test.go"
