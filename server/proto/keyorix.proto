  uint64 success = 2;
  uint64 errors = 3;
  double avg_duration_ms = 4;
}

message SecretMetrics {
  uint64 total = 1;
  uint64 active = 2;
  uint64 expired = 3;
  uint64 accessed_today = 4;
}

message UserMetrics {
  uint64 total = 1;
  uint64 active = 2;
  uint64 last_login_24h = 3;
}

message PerformanceMetrics {
