}

// Project service for managing projects and their environments. Mirrors the
// HTTP/CLI surface: list/get use secrets.read, create/update use secrets.write,
// delete uses secrets.delete (scoped per project for per-project operations).
service ProjectService {
  // List all projects the caller can read.
  rpc ListProjects(google.protobuf.Empty) returns (ListProjectsResponse);

  // Get a project by ID.
  rpc GetProject(GetProjectRequest) returns (Project);

  // Create a new project.
  rpc CreateProject(CreateProjectRequest) returns (Project);

  // Update a project's name, description, and/or per-project MFA policy.
  rpc UpdateProject(UpdateProjectRequest) returns (Project);

  // Delete a project (soft delete; force also removes its secrets).
  rpc DeleteProject(DeleteProjectRequest) returns (google.protobuf.Empty);

  // Safe rotation order for the project's secret dependency graph (ADR-052),
  // read-only. Requires scoped secrets.read.
  rpc GetProjectRotationOrder(GetProjectRequest) returns (RotationOrder);

  // The project's automated rotation plan (ADR-053): overdue/due-soon secrets
  // batched into dependency-safe waves, prioritised by urgency. Scoped secrets.read.
  rpc GetProjectRotationPlan(GetProjectRequest) returns (RotationPlan);

  // GetDeploymentRotationPlan returns the install-wide rotation plan (ADR-053).
  rpc GetDeploymentRotationPlan(google.protobuf.Empty) returns (DeploymentRotationPlan);

  // List a project's environments.
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
}

message Project {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  bool require_mfa = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Environment {
  uint32 id = 1;
  uint32 project_id = 2;
  string name = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  uint32 id = 1;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
}

message UpdateProjectRequest {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  optional bool require_mfa = 4;
}

message DeleteProjectRequest {
  uint32 id = 1;
  bool force = 2;
}

message ListEnvironmentsRequest {
  uint32 project_id = 1;
}

message ListEnvironmentsResponse {
  repeated Environment environments = 1;
}

// Machine identity service (ADR-023/030): non-human project members + their
// bearer-token credentials. Mirrors the HTTP surface — list uses users.read,
// all mutations (create/transition/classify/token ops) use roles.assign, scoped
// per project.
service MachineIdentityService {
  // List a project's machine identities.
  rpc ListMachineIdentities(ListMachineIdentitiesRequest) returns (ListMachineIdentitiesResponse);

  // Create a machine identity.
  rpc CreateMachineIdentity(CreateMachineIdentityRequest) returns (MachineIdentity);

  // Advance a machine identity's lifecycle (activate | suspend | revoke).
  rpc TransitionMachineIdentity(TransitionMachineIdentityRequest) returns (MachineIdentity);

  // Set (or clear, with "") a machine identity's data-classification label.
  rpc ClassifyMachineIdentity(ClassifyMachineIdentityRequest) returns (MachineIdentity);

  // Issue a bearer token for a machine identity. The raw token is returned ONCE.
  rpc IssueMachineToken(IssueMachineTokenRequest) returns (IssueMachineTokenResponse);

  // List a machine identity's tokens (metadata only — never the raw token).
  rpc ListMachineTokens(ListMachineTokensRequest) returns (ListMachineTokensResponse);

  // Revoke a machine token.
  rpc RevokeMachineToken(RevokeMachineTokenRequest) returns (google.protobuf.Empty);

  // Set (or clear, with "") a machine token's data-classification label.
  rpc ClassifyMachineToken(ClassifyMachineTokenRequest) returns (MachineToken);
}

message MachineIdentity {
  uint32 id = 1;
  uint32 project_id = 2;
  string name = 3;
  string identity_type = 4;
  string state = 5;
  string description = 6;
  string classification = 7;
  uint32 created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp last_seen_at = 11;
  optional google.protobuf.Timestamp revoked_at = 12;
}

message MachineToken {
  uint32 id = 1;
  string name = 2;
  string prefix = 3;
  optional google.protobuf.Timestamp last_used_at = 4;
  optional google.protobuf.Timestamp expires_at = 5;
  bool revoked = 6;
  string classification = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListMachineIdentitiesRequest {
  uint32 project_id = 1;
}

message ListMachineIdentitiesResponse {
  repeated MachineIdentity machine_identities = 1;
}

message CreateMachineIdentityRequest {
  uint32 project_id = 1;
  string name = 2;
  string identity_type = 3;
  string description = 4;
  string classification = 5;
}

message TransitionMachineIdentityRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string action = 3; // activate | suspend | revoke
}

message ClassifyMachineIdentityRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string classification = 3;
}

message IssueMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  string name = 3;
  uint32 expires_in_days = 4; // 0 = never expires
  string classification = 5;
}

message IssueMachineTokenResponse {
  string token = 1; // shown once
  uint32 id = 2;
  string prefix = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  string classification = 5;
}

message ListMachineTokensRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
}

message ListMachineTokensResponse {
  repeated MachineToken tokens = 1;
}

message RevokeMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  uint32 token_id = 3;
}

message ClassifyMachineTokenRequest {
  uint32 project_id = 1;
  uint32 machine_id = 2;
  uint32 token_id = 3;
  string classification = 4;
}

// Dynamic secrets service (ADR-035): on-demand database credentials. Configs are
// project+environment scoped; lease ops authorize at the owning config/lease scope.
// Mirrors the HTTP surface — reads use secrets.read, mutations use secrets.write.
// The admin DSN is never returned; an issued credential is returned exactly once.
service DynamicSecretService {
  // List dynamic-secret configs in a project (optionally one environment).
  rpc ListConfigs(ListDynamicConfigsRequest) returns (ListDynamicConfigsResponse);

  // Get a config by ID.
  rpc GetConfig(GetDynamicConfigRequest) returns (DynamicSecretConfig);

  // Register a new dynamic-secret target.
  rpc CreateConfig(CreateDynamicConfigRequest) returns (DynamicSecretConfig);

  // Set (or clear, with "") a config's data-classification label.
  rpc ClassifyConfig(ClassifyDynamicConfigRequest) returns (DynamicSecretConfig);

  // Issue a short-lived credential. The username/password are returned ONCE.
  rpc IssueLease(IssueLeaseRequest) returns (IssuedCredential);

  // List a config's leases (never the credential bytes).
  rpc ListLeases(ListLeasesRequest) returns (ListLeasesResponse);

  // Revoke a single lease.
  rpc RevokeLease(RevokeLeaseRequest) returns (google.protobuf.Empty);

  // Renew a lease, extending its expiry (capped by the config's max TTL).
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);

  // Revoke every active lease from a config (incident kill switch).
  rpc RevokeAllLeases(RevokeAllLeasesRequest) returns (RevokeAllLeasesResponse);
}

message DynamicSecretConfig {
  uint32 id = 1;
  string name = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  string backend_type = 5;
  string creation_template = 6;
  int32 default_ttl_seconds = 7;
  int32 max_ttl_seconds = 8;
  string classification = 9;
  string created_by = 10;
  google.protobuf.Timestamp created_at = 11;
}

message DynamicSecretLease {
  string lease_id = 1;
  uint32 config_id = 2;
  string role_name = 3;
  string status = 4;
  string revoke_reason = 5;
  string revoke_error = 6;
  optional google.protobuf.Timestamp issued_at = 7;
  optional google.protobuf.Timestamp expires_at = 8;
  optional google.protobuf.Timestamp revoked_at = 9;
}

message IssuedCredential {
  string lease_id = 1;
  string username = 2;
  string password = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  // fields carries cloud-IAM credentials (e.g. AWS STS access_key_id /
  // secret_access_key / session_token) for backends with no username/password.
  map<string, string> fields = 5;
}

message ListDynamicConfigsRequest {
  uint32 project_id = 1;
  uint32 environment_id = 2; // 0 = all environments in the project
}

message ListDynamicConfigsResponse {
  repeated DynamicSecretConfig configs = 1;
}

message GetDynamicConfigRequest {
  uint32 id = 1;
}

message CreateDynamicConfigRequest {
  string name = 1;
  uint32 project_id = 2;
  uint32 environment_id = 3;
  string backend_type = 4;
  string admin_dsn = 5;
  string creation_template = 6;
  int32 default_ttl_seconds = 7;
  int32 max_ttl_seconds = 8;
  string classification = 9;
}

message ClassifyDynamicConfigRequest {
  uint32 id = 1;
  string classification = 2;
}

message IssueLeaseRequest {
  uint32 config_id = 1;
  int32 ttl_seconds = 2; // 0 = config default
}

message ListLeasesRequest {
  uint32 config_id = 1;
}

message ListLeasesResponse {
  repeated DynamicSecretLease leases = 1;
}

message RevokeLeaseRequest {
  string lease_id = 1;
}

message RenewLeaseRequest {
  string lease_id = 1;
  int32 ttl_seconds = 2;
}

message RenewLeaseResponse {
  string lease_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeAllLeasesRequest {
  uint32 config_id = 1;
}

message RevokeAllLeasesResponse {
  uint32 revoked = 1;
  uint32 failed = 2;
}

// ---------------------------------------------------------------------------
// Compliance posture & control matrix (read-only; gated by system.read).
// Mirrors the HTTP/CLI compliance surface so auditors' automation can pull the
// deployment's control posture over gRPC too.
// ---------------------------------------------------------------------------
service ComplianceService {
  // GetCompliancePosture returns the deployment-wide controls-posture snapshot.
  rpc GetCompliancePosture(google.protobuf.Empty) returns (CompliancePosture);
  // GetComplianceControls returns the evaluated control matrix (per-control
  // status mapped to ISO 27001 / SOC 2 / NIS2 / DORA clauses).
  rpc GetComplianceControls(google.protobuf.Empty) returns (ComplianceControls);
}

message AuditIntegrityPosture {
  bool chain_verified = 1;
  int64 chained_events = 2;
  bool checkpointed = 3;
  string reason = 4;
}

message AccessGovernancePosture {
  int32 projects = 1;
  int32 projects_with_open_campaign = 2;
  int32 projects_never_reviewed = 3;
  int32 open_campaigns = 4;
  int32 pending_items = 5;
  int32 projects_overdue = 6;
  int32 dormant_role_grants = 7;
  int32 sod_violations = 8;
}

message RotationPosture {
  int32 covered_secrets = 1;
  int32 overdue = 2;
  int32 due_soon = 3;
}

message IdentityPosture {
  int32 active_users = 1;
  int32 users_with_second_factor = 2;
  int32 second_factor_percent = 3;
}

message EmergencyAccessPosture {
  int32 active_activations = 1;
  int32 total_activations = 2;
}

message ClassificationCounts {
  int32 total = 1;
  int32 public = 2;
  int32 internal = 3;
  int32 confidential = 4;
  int32 restricted = 5;
  int32 unclassified = 6;
}

message ClassificationPosture {
  int32 total_secrets = 1;
  int32 public = 2;
  int32 internal = 3;
  int32 confidential = 4;
  int32 restricted = 5;
  int32 unclassified = 6;
  ClassificationCounts dynamic_configs = 7;
  ClassificationCounts machine_identities = 8;
  ClassificationCounts machine_credentials = 9;
}

message AnomaliesPosture {
  int32 unacknowledged = 1;
  int32 high_severity_open = 2;
}

message LegalHoldPosture {
  bool active = 1;
  google.protobuf.Timestamp placed_at = 2;
  string reason = 3;
}

message RetentionPosture {
  bool enabled = 1;
  int32 anomaly_alerts_days = 2;
  int32 closed_access_reviews_days = 3;
  int32 break_glass_days = 4;
  int32 resolved_access_requests_days = 5;
}

message RiskPosture {
  int32 active_exceptions = 1;
  int32 expiring_soon = 2;
}

message CompliancePosture {
  google.protobuf.Timestamp generated_at = 1;
  AuditIntegrityPosture audit_integrity = 2;
  AccessGovernancePosture access_governance = 3;
  RotationPosture rotation = 4;
  IdentityPosture identity = 5;
  EmergencyAccessPosture emergency_access = 6;
  ClassificationPosture classification = 7;
  AnomaliesPosture anomalies = 8;
  LegalHoldPosture legal_hold = 9;
  RetentionPosture retention = 10;
  RiskPosture risk = 11;
  // degraded is true when one or more sub-rollups above could not be queried this
  // run (#136) — the zero/clean values they carry are UNKNOWN, not verified-clean.
  // A consumer must treat a degraded snapshot as incomplete, not passing.
  bool degraded = 12;
  // degraded_reasons names each failed sub-rollup with its underlying error.
  repeated string degraded_reasons = 13;
}

message FrameworkRefs {
  repeated string iso_27001 = 1;
  repeated string soc2 = 2;
  repeated string nis2 = 3;
  repeated string dora = 4;
  // ENS — Spain's Esquema Nacional de Seguridad (RD 311/2022) measure codes.
  repeated string ens = 5;
}

message ControlState {
  string id = 1;
  string name = 2;
  string area = 3;
  string status = 4;
  string detail = 5;
  FrameworkRefs frameworks = 6;
}

message ControlsSummary {
  int32 total = 1;
  int32 pass = 2;
  int32 gap = 3;
  int32 not_configured = 4;
  // unknown (#136) counts controls whose signal could not be collected this run —
  // a non-zero value means the matrix is incomplete, not fully passing.
  int32 unknown = 5;
}

message ComplianceControls {
  google.protobuf.Timestamp generated_at = 1;
  repeated ControlState controls = 2;
  ControlsSummary summary = 3;
}

// ---------------------------------------------------------------------------
// Keyorix Connect — read-through federation to external secret stores (ADR-043),
// over gRPC. Read-only; gated by connect.read (ADR-044). Mirrors the HTTP surface.
// ---------------------------------------------------------------------------
service ConnectService {
  // ListConnectors returns the configured connector names.
  rpc ListConnectors(google.protobuf.Empty) returns (ConnectorList);
  // ReadSecret proxies a read-through of a secret's current value from a connector.
  rpc ReadSecret(ReadFederatedSecretRequest) returns (FederatedSecretValue);
  // ListRefGrants returns all per-reference grants (ADR-045). Requires roles.read.
  rpc ListRefGrants(google.protobuf.Empty) returns (ConnectRefGrantList);
  // CreateRefGrant adds a per-reference grant. Requires roles.write.
  rpc CreateRefGrant(CreateConnectRefGrantRequest) returns (ConnectRefGrant);
  // DeleteRefGrant removes a per-reference grant by id. Requires roles.write.
  rpc DeleteRefGrant(DeleteConnectRefGrantRequest) returns (google.protobuf.Empty);
}

message ConnectorList {
  repeated string connectors = 1;
}

message ReadFederatedSecretRequest {
  string connector = 1;
  string ref = 2;
}

message FederatedSecretValue {
  string connector = 1;
  string ref = 2;
  string value = 3;
}

message ConnectRefGrant {
  uint32 id = 1;
  uint32 role_id = 2;
  string connector = 3;
  string ref_prefix = 4;
  optional google.protobuf.Timestamp expires_at = 5;
}

message ConnectRefGrantList {
  repeated ConnectRefGrant grants = 1;
}

message CreateConnectRefGrantRequest {
  uint32 role_id = 1;
  string connector = 2;
  string ref_prefix = 3;
  optional google.protobuf.Timestamp expires_at = 4;
}

message DeleteConnectRefGrantRequest {
  uint32 id = 1;
}

// ---------------------------------------------------------------------------
// Per-secret ACL messages (RBAC Phase 3)
// ---------------------------------------------------------------------------

message GrantSecretACLRequest {
  uint64 secret_id = 1;
  uint64 user_id = 2;
  repeated string permissions = 3;
}

message RevokeSecretACLRequest {
  uint64 secret_id = 1;
  uint64 acl_id = 2;
}

message ListSecretACLsRequest {
  uint64 secret_id = 1;
}

message SecretACLEntry {
  uint64 id = 1;
  uint64 secret_id = 2;
  uint64 user_id = 3;
  repeated string permissions = 4;
  uint64 granted_by = 5;
  string created_at = 6;
}

message ListSecretACLsResponse {
  repeated SecretACLEntry acls = 1;
}
