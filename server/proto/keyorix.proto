syntax = "proto3";

package keyorix.v1;

option go_package = "github.com/keyorixhq/keyorix/server/proto/pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

// ---------------------------------------------------------------------------
// SCOPE: this is a PARTIAL, data-plane API. HTTP is the complete interface.
//
// Governance and identity capabilities are HTTP-only today — classification and
// description on secrets, MFA/step-up, SSO/SAML/SCIM, WebAuthn, personal access
// tokens, access reviews, access requests, segregation of duties, legal hold,
// risk exceptions, and more. Enforcement is unaffected: authorization, audit and
// the classification read gate live in core and apply to every transport, so this
// surface cannot bypass a control HTTP enforces. What it cannot do is *set* some
// of them, so objects created here default to the least-governed state.
//
// Capability parity with HTTP is planned. Before adding an RPC, read
// docs/adr-105-grpc-scope-and-parity.md — some HTTP capabilities are
// deliberately excluded from this surface and must not be ported.
// ---------------------------------------------------------------------------

// Secret service for managing secrets
service SecretService {
  // Create a new secret
  rpc CreateSecret(CreateSecretRequest) returns (Secret);

  // Get a secret by ID (optionally including the decrypted value)
  rpc GetSecret(GetSecretRequest) returns (Secret);

  // Get a secret's decrypted value (counts against max_reads if set)
  rpc GetSecretValue(GetSecretRequest) returns (SecretValue);

  // Update an existing secret (a new value creates a new version)
  rpc UpdateSecret(UpdateSecretRequest) returns (Secret);

  // Delete a secret
  rpc DeleteSecret(DeleteSecretRequest) returns (google.protobuf.Empty);

  // List secrets with filtering and pagination
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // Get a secret's version history
  rpc GetSecretVersions(GetSecretVersionsRequest) returns (GetSecretVersionsResponse);

  // Enable/disable automated rotation for a secret and set its generated-value shape
  // (ADR-046). Requires scoped secrets.write.
  rpc SetSecretAutoRotate(SetSecretAutoRotateRequest) returns (google.protobuf.Empty);

  // Secret dependency graph (ADR-052), read-only. Both require scoped secrets.read.
  // List a secret's direct dependencies and dependents.
  rpc ListSecretDependencies(GetSecretRequest) returns (SecretDependencies);
  // The blast radius of rotating a secret (its transitive dependents).
  rpc GetSecretImpact(GetSecretRequest) returns (SecretImpact);

  // Per-secret fine-grained ACL management (RBAC Phase 3).
  // All three require secrets.manage at the secret's project scope.
  rpc GrantSecretACL(GrantSecretACLRequest) returns (SecretACLEntry);
  rpc RevokeSecretACL(RevokeSecretACLRequest) returns (google.protobuf.Empty);
  rpc ListSecretACLs(ListSecretACLsRequest) returns (ListSecretACLsResponse);
}

// Share service for managing secret sharing
service ShareService {
  // Share a secret with another user or group
  rpc ShareSecret(ShareSecretRequest) returns (ShareRecord);

  // List shares for a secret
  rpc ListSecretShares(ListSecretSharesRequest) returns (ListSharesResponse);

  // List shares created by the calling user
  rpc ListUserShares(ListUserSharesRequest) returns (ListSharesResponse);

  // List secrets shared with the calling user
  rpc ListSharedSecrets(ListSharedSecretsRequest) returns (ListSecretsResponse);

  // Update share permissions
  rpc UpdateSharePermission(UpdateSharePermissionRequest) returns (ShareRecord);

  // Revoke a share
  rpc RevokeShare(RevokeShareRequest) returns (google.protobuf.Empty);
}

// User service for managing users
service UserService {
  // Create a new user (optionally with a system role + project assignments)
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // Get a user by ID
  rpc GetUser(GetUserRequest) returns (User);

  // Update an existing user
  rpc UpdateUser(UpdateUserRequest) returns (User);

  // Soft-delete a user
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  // List users with filtering and pagination
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// Role service for managing roles and assignments
service RoleService {
  // Create a new role with its permission set
  rpc CreateRole(CreateRoleRequest) returns (Role);

  // Get a role (with its permissions) by ID
  rpc GetRole(GetRoleRequest) returns (Role);

  // Update a role's description and/or permission set
  rpc UpdateRole(UpdateRoleRequest) returns (Role);

  // Delete a role (built-in roles cannot be deleted)
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);

  // List roles (with their permissions) and pagination
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // Assign a role to a user, optionally scoped to a project/environment
  rpc AssignRole(AssignRoleRequest) returns (RoleAssignment);

  // Remove a role assignment from a user
  rpc RemoveRole(RemoveRoleRequest) returns (google.protobuf.Empty);

  // Get all roles assigned to a user
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
}

// Audit service for reading audit logs
service AuditService {
  // Read the audit log with filtering and pagination
  rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);

  // Read RBAC-specific audit events
  rpc GetRBACAuditLogs(GetRBACAuditLogsRequest) returns (GetRBACAuditLogsResponse);

  // Stream audit events as they occur
  rpc StreamAuditLogs(StreamAuditLogsRequest) returns (stream AuditLog);

  // Verify the tamper-evidence hash chain (ADR-029): re-walk the chain and report
  // whether the trail is intact, naming the first divergent event on failure.
  rpc VerifyAuditChain(google.protobuf.Empty) returns (VerifyAuditChainResponse);

  // Write a signed checkpoint of the verified audit-chain head on demand (ADR-029).
  // Requires encryption (the signing key is DEK-derived) and a chain that verifies.
  rpc WriteAuditCheckpoint(google.protobuf.Empty) returns (WriteAuditCheckpointResponse);

  // Report the audit trail's retention coverage (total events, oldest/newest, and
  // whether it demonstrably covers the NIS2 12-month window).
  rpc GetAuditRetention(google.protobuf.Empty) returns (GetAuditRetentionResponse);
}

// System service for health, info, and metrics
service SystemService {
  // Liveness/readiness check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);

  // Static + runtime system information
  rpc GetSystemInfo(google.protobuf.Empty) returns (SystemInfo);

  // Operational metrics snapshot
  rpc GetMetrics(google.protobuf.Empty) returns (Metrics);
}

// Break-glass emergency access (NIS2/DORA incident response).
service BreakGlassService {
  // Activate emergency access on a project. Self-service: any authenticated member
  // may break the glass (it must work in an emergency); every activation is audited.
  rpc ActivateBreakGlass(ActivateBreakGlassRequest) returns (BreakGlassActivation);

  // List a project's break-glass activations. Requires scoped roles.read.
  rpc ListBreakGlassActivations(ListBreakGlassActivationsRequest) returns (ListBreakGlassActivationsResponse);

  // Revoke an active break-glass activation early. Requires scoped roles.assign.
  rpc RevokeBreakGlass(RevokeBreakGlassRequest) returns (google.protobuf.Empty);
}

// Group service for managing groups and their membership (RBAC).
service GroupService {
  // List all groups. Requires users.read.
  rpc ListGroups(google.protobuf.Empty) returns (ListGroupsResponse);
  // Get a group by ID. Requires users.read.
  rpc GetGroup(GetGroupRequest) returns (Group);
  // Create a group. Requires users.write.
  rpc CreateGroup(CreateGroupRequest) returns (Group);
  // Update a group's name/description. Requires users.write.
  rpc UpdateGroup(UpdateGroupRequest) returns (Group);
  // Soft-delete a group (restorable). Requires users.write.
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty);
  // Restore a soft-deleted group. Requires users.write.
  rpc RestoreGroup(RestoreGroupRequest) returns (Group);

  // List a group's members. Requires users.read.
  rpc GetGroupMembers(GetGroupMembersRequest) returns (GetGroupMembersResponse);
  // Add a user to a group (confers the group's roles). Requires roles.assign.
  rpc AddGroupMember(GroupMemberRequest) returns (google.protobuf.Empty);
  // Remove a user from a group. Requires roles.assign.
  rpc RemoveGroupMember(GroupMemberRequest) returns (google.protobuf.Empty);
}

// ---------------------------------------------------------------------------
// Secret messages
// ---------------------------------------------------------------------------

message Secret {
  uint32 id = 1;
  string name = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  // Human-readable names, populated on list/get where resolved.
  string project_name = 5;
  string environment_name = 6;
  string type = 7;
  optional int32 max_reads = 8;
  optional google.protobuf.Timestamp expiration = 9;
  map<string, string> metadata = 10;
  repeated string tags = 11;
  string status = 12;
  string created_by = 13;
  uint32 owner_id = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  // Sharing context relative to the calling user (populated on list).
  bool is_shared = 17;
  bool is_owned_by_user = 18;
  string user_permission = 19; // "read" | "write" | ""
  uint32 share_count = 20;
  // Lifetime count of reads of this secret's value (core.SecretTotalReads: access-log
  // rows with action read). Set only by GetSecret; absent on lists. Not the per-version
  // read_count, which counts only reads charged against max_reads. (#2971)
  optional int64 total_reads = 21;
}

message SecretValue {
  uint32 id = 1;
  string name = 2;
  string value = 3;
  uint32 version_number = 4;
  uint32 read_count = 5;
}

message CreateSecretRequest {
  string name = 1;
  string value = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
  string type = 5;
  optional int32 max_reads = 6;
  optional google.protobuf.Timestamp expiration = 7;
  map<string, string> metadata = 8;
  repeated string tags = 9;
  // parent_id optionally places the new secret inside a folder node.
  // The parent must exist, be a folder (is_secret=false), and belong to the
  // same project/environment. 0 or absent means root level.
  optional uint32 parent_id = 10;

  // Held for the planned HTTP-parity governance fields (ADR-105 phase 1):
  //   11 = description
  //   12 = classification
  // 13-20 are held for the remaining phase-1 governance fields so unrelated
  // work cannot spend them first. Protobuf field numbers can never be reused
  // once assigned, so un-reserve a number here only when adding the field it
  // is earmarked for. Adding these later is wire-compatible; renumbering is not.
  reserved 11 to 20;
}

message GetSecretRequest {
  uint32 id = 1;
  bool include_value = 2;
}

message UpdateSecretRequest {
  uint32 id = 1;
  // A non-empty value rotates the secret to a new version.
  optional string value = 2;
  optional int32 max_reads = 3;
  optional google.protobuf.Timestamp expiration = 4;
  map<string, string> metadata = 5;
  repeated string tags = 6;
}

message DeleteSecretRequest {
  uint32 id = 1;
}

message ListSecretsRequest {
  optional uint32 project_id = 1;
  optional uint32 environment_id = 2;
  optional string type = 3;
  optional string search = 4;
  // "read" | "write" — filter to secrets the user holds this permission on.
  optional string permission = 5;
  bool show_owned_only = 6;
  bool show_shared_only = 7;
  uint32 page = 8;
  uint32 page_size = 9;
  // parent_id, when set, restricts results to direct children of that folder node.
  optional uint32 parent_id = 10;
  // folder_only, when true, returns only folder nodes (is_secret=false).
  bool folder_only = 11;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
  uint32 owned_count = 6;
  uint32 shared_count = 7;
}

message GetSecretVersionsRequest {
  uint32 id = 1;
}

message SetSecretAutoRotateRequest {
  uint32 id = 1;
  bool enabled = 2;
  int32 length = 3;  // 0 = default
  string charset = 4; // "" = default alphanumeric
  string backend = 5; // "" = regenerate in Keyorix only (ADR-047)
  string ref = 6;     // upstream identifier (required iff backend set)
}

message SecretVersion {
  uint32 version_number = 1;
  google.protobuf.Timestamp created_at = 2;
  uint32 read_count = 3;
}

message GetSecretVersionsResponse {
  repeated SecretVersion versions = 1;
  // Lifetime count of reads of the secret's value (core.SecretTotalReads). Each
  // version's read_count counts only reads charged against max_reads. (#2971)
  optional int64 total_reads = 2;
}

// --- Secret dependency graph (ADR-052) ---

message DependencyEdge {
  uint32 id = 1; // the edge id (for removal via HTTP/CLI)
  uint32 secret_id = 2; // the other secret in the edge
  string secret_name = 3;
  string note = 4;
}

message SecretDependencies {
  uint32 secret_id = 1;
  repeated DependencyEdge depends_on = 2; // secrets this one depends on
  repeated DependencyEdge dependents = 3; // secrets that depend on this one
}

message ImpactedSecret {
  uint32 secret_id = 1;
  string secret_name = 2;
  int32 depth = 3; // hop distance from the rotated secret
}

message SecretImpact {
  uint32 secret_id = 1;
  string secret_name = 2;
  repeated ImpactedSecret affected = 3; // transitive dependents
  // truncated is true when the true affected set may extend beyond what
  // affected contains -- the underlying dependency-graph BFS hit its
  // resource-exhaustion node/depth cap (internal/core's maxDependencyBFSNodes
  // / maxDependencyBFSDepth).
  bool truncated = 4;
}

message RotationStep {
  uint32 secret_id = 1;
  string secret_name = 2;
}

message RotationOrder {
  uint32 project_id = 1;
  repeated RotationStep order = 2; // rotate top to bottom (dependencies first)
}

// --- Automated rotation plan (ADR-053) ---

// BrokenRotationProject names a project whose rotation plan could not be computed.
message BrokenRotationProject {
  uint32 project_id = 1;
  string error = 2;
}

// DeploymentRotationPlan is the install-wide rotation plan roll-up (ADR-053).
message DeploymentRotationPlan {
  int32 projects_scanned = 1;
  int32 projects_with_work = 2;
  int32 total_secrets = 3;
  int32 overdue_count = 4;
  int32 due_soon_count = 5;
  repeated RotationPlan projects = 6;
  repeated BrokenRotationProject broken_projects = 7;
}

message PlannedRotation {
  uint32 secret_id = 1;
  string secret_name = 2;
  string status = 3; // overdue | due_soon
  int32 days_overdue = 4; // positive = overdue, negative = days remaining
  int32 risk_score = 5;
  string risk_band = 6; // low | medium | high
  int32 urgency = 7;
  bool auto_rotate = 8;
  repeated uint32 after_secret_ids = 9; // in-plan dependencies that rotate first
  repeated string reasons = 10;
}

message RotationWave {
  int32 index = 1;
  repeated PlannedRotation secrets = 2; // safe to rotate together
}

message RotationPlan {
  uint32 project_id = 1;
  int32 total_secrets = 2;
  int32 overdue_count = 3;
  int32 due_soon_count = 4;
  repeated RotationWave waves = 5;
}

// ---------------------------------------------------------------------------
// User messages
// ---------------------------------------------------------------------------

message User {
  uint32 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  bool active = 5;
  string account_state = 6; // active | pending_first_login | password_reset_required | suspended
  optional google.protobuf.Timestamp last_login_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  uint32 project_count = 10;
  uint32 active_project_count = 11;
}

// A project-scoped role grant applied atomically at user creation.
message ProjectAssignment {
  uint32 project_id = 1;
  string role = 2;
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  // Exactly one credential mode: password, deliver_setup_link, or
  // generate_one_time_password.
  optional string password = 3;
  bool deliver_setup_link = 4;
  bool generate_one_time_password = 5;
  optional string display_name = 6;
  optional bool is_active = 7;
  optional string account_state = 8;
  // System role + atomic project assignments (ADR-028).
  optional string role = 9;
  repeated ProjectAssignment project_assignments = 10;
}

message CreateUserResponse {
  User user = 1;
  // Out-of-band credential artifacts, set only for the matching mode.
  optional string setup_link = 2;
  optional string one_time_password = 3;
}

message GetUserRequest {
  uint32 id = 1;
}

message UpdateUserRequest {
  uint32 id = 1;
  optional string username = 2;
  optional string email = 3;
  optional string display_name = 4;
  optional bool active = 5;
}

message DeleteUserRequest {
  uint32 id = 1;
}

message ListUsersRequest {
  uint32 page = 1;
  uint32 page_size = 2;
  optional string search = 3;
  optional bool is_active = 4;
  bool include_deleted = 5;
  // "inactive" = users with no login in the last 30 days.
  optional string filter = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

// ---------------------------------------------------------------------------
// Role messages
// ---------------------------------------------------------------------------

message Permission {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string resource = 4;
  string action = 5;
}

message Role {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  // Named permission strings, e.g. "secrets.read".
  repeated string permissions = 3;
}

message GetRoleRequest {
  uint32 id = 1;
}

message UpdateRoleRequest {
  uint32 id = 1;
  optional string description = 2;
  // If provided, replaces the entire permission set.
  repeated string permissions = 3;
}

message DeleteRoleRequest {
  uint32 id = 1;
}

message ListRolesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListRolesResponse {
  repeated Role roles = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

// Scope semantics: project_id=0 → global; project_id=P,environment_id=0 → all
// environments in P; project_id=P,environment_id=E → only environment E.
message AssignRoleRequest {
  uint32 user_id = 1;
  uint32 role_id = 2;
  optional uint32 project_id = 3;
  optional uint32 environment_id = 4;
}

message RoleAssignment {
  uint32 user_id = 1;
  uint32 role_id = 2;
  uint32 project_id = 3;
  uint32 environment_id = 4;
}

message RemoveRoleRequest {
  uint32 user_id = 1;
  uint32 role_id = 2;
  optional uint32 project_id = 3;
  optional uint32 environment_id = 4;
}

message GetUserRolesRequest {
  uint32 user_id = 1;
}

message GetUserRolesResponse {
  uint32 user_id = 1;
  string username = 2;
  string email = 3;
  repeated Role roles = 4;
}

// ---------------------------------------------------------------------------
// Audit messages
// ---------------------------------------------------------------------------

message AuditLog {
  uint32 id = 1;
  string event_type = 2;
  // Resolved actor username ("system"/"unknown" when not a user).
  string actor = 3;
  string actor_type = 4; // user | machine_identity | system
  optional uint32 user_id = 5;
  optional uint32 project_id = 6;
  optional uint32 secret_id = 7;
  string description = 8;
  string ip_address = 9;
  bool success = 10;
  google.protobuf.Timestamp event_time = 11;
  // Structured before/after for mutation events (JSON; never plaintext values).
  optional string diff = 12;
  bool impersonation = 13;
  optional string impersonated_by = 14;
  optional string acting_as = 15;
}

message GetAuditLogsRequest {
  optional string event_type = 1;
  optional uint32 user_id = 2;
  optional uint32 project_id = 3;
  optional string actor_type = 4;
  optional google.protobuf.Timestamp start_time = 5;
  optional google.protobuf.Timestamp end_time = 6;
  uint32 page = 7;
  uint32 page_size = 8;
}

message GetAuditLogsResponse {
  repeated AuditLog logs = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message RBACAuditLog {
  uint32 id = 1;
  string action = 2;
  optional uint32 actor_user_id = 3;
  optional uint32 target_user_id = 4;
  optional uint32 role_id = 5;
  optional uint32 project_id = 6;
  string details = 7;
  google.protobuf.Timestamp created_at = 8;
  // Set for group-role events (role.group_assigned / role.group_removed): the
  // group the role was granted to / removed from.
  optional uint32 group_id = 9;
  // Set for permission-to-role events (permission.assigned / permission.removed):
  // the permission granted to / removed from the role.
  optional uint32 permission_id = 10;
  // Set when the grant's scope included an environment (project-scoped grants
  // with no environment leave this unset, matching project_id's semantics).
  optional uint32 environment_id = 11;
}

message GetRBACAuditLogsRequest {
  optional string action = 1;
  optional uint32 actor_user_id = 2;
  optional uint32 target_user_id = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

message GetRBACAuditLogsResponse {
  repeated RBACAuditLog logs = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message StreamAuditLogsRequest {
  optional string event_type = 1;
  optional uint32 user_id = 2;
  optional uint32 project_id = 3;
  // after_id resumes the tail just after this audit event id: the stream first
  // replays the backlog of matching events with id > after_id, then continues live.
  // Omit (or 0) to tail only new events from the current head. Lets a disconnected
  // SIEM consumer reconnect from its last-seen id without losing the gap.
  optional uint32 after_id = 4;
}

// VerifyAuditChainResponse reports the tamper-evidence hash-chain verification
// (ADR-029). Record (chained_events, head_hash) off-box to detect tail-truncation
// that an on-box re-walk alone cannot catch.
message VerifyAuditChainResponse {
  bool valid = 1;
  int64 chained_events = 2;
  int64 unchained_events = 3; // leading legacy rows skipped before the chain begins
  string head_hash = 4;
  uint32 head_id = 5;
  bool checkpointed = 6; // chain also verified against a signed in-DB checkpoint
  optional uint32 first_broken_id = 7; // set only when !valid
  string reason = 8; // set only when !valid
  string checkpoint_reason = 9; // non-fatal notes (e.g. checkpoint under a prior key)
}

// WriteAuditCheckpointResponse is the signed checkpoint that was written.
message WriteAuditCheckpointResponse {
  uint32 id = 1;
  int64 chained_events = 2;
  uint32 head_id = 3;
  string head_hash = 4;
  string key_version = 5;
  optional google.protobuf.Timestamp anchored_at = 6; // external-notary anchor, if any
  string anchor_provider = 7;
}

// GetAuditRetentionResponse reports the audit trail's retention coverage.
message GetAuditRetentionResponse {
  string retention_policy = 1; // always "unlimited" — Keyorix applies no audit cap
  int64 total_events = 2;
  optional google.protobuf.Timestamp oldest_event = 3;
  optional google.protobuf.Timestamp newest_event = 4;
  int64 coverage_days = 5;
  bool meets_nis2_12_month = 6;
}

// BreakGlassActivation is one emergency-access grant on a project.
message BreakGlassActivation {
  uint32 id = 1;
  uint32 project_id = 2;
  uint32 user_id = 3; // who activated it
  uint32 role_id = 4;
  string role_name = 5;
  string justification = 6;
  string state = 7; // active | expired | revoked
  optional google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  optional uint32 revoked_by = 10; // set on early revoke
  optional google.protobuf.Timestamp revoked_at = 11;
}

message ActivateBreakGlassRequest {
  uint32 project_id = 1;
  string justification = 2;
  string ttl = 3; // optional override (e.g. "2h"); empty = policy default + cap
}

message ListBreakGlassActivationsRequest {
  uint32 project_id = 1;
}

message ListBreakGlassActivationsResponse {
  repeated BreakGlassActivation activations = 1;
}

message RevokeBreakGlassRequest {
  uint32 project_id = 1;
  uint32 activation_id = 2;
}

// Group is an RBAC group: a named set of users that collectively hold the group's
// roles. Soft-deletable (restorable).
message Group {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// GroupMember is a lightweight view of a user in a group's membership list.
message GroupMember {
  uint32 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  bool active = 5;
}

message GetGroupRequest {
  uint32 id = 1;
}

message CreateGroupRequest {
  string name = 1;
  string description = 2;
}

message UpdateGroupRequest {
  uint32 id = 1;
  string name = 2;
  string description = 3;
}

message DeleteGroupRequest {
  uint32 id = 1;
}

message RestoreGroupRequest {
  uint32 id = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupMembersRequest {
  uint32 id = 1;
}

message GetGroupMembersResponse {
  repeated GroupMember members = 1;
}

// GroupMemberRequest identifies a (group, user) pair for add/remove.
message GroupMemberRequest {
  uint32 group_id = 1;
  uint32 user_id = 2;
}

// ---------------------------------------------------------------------------
// Share messages
// ---------------------------------------------------------------------------

message ShareRecord {
  uint32 id = 1;
  uint32 secret_id = 2;
  uint32 owner_id = 3;
  uint32 recipient_id = 4;
  bool is_group = 5;
  string permission = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // expires_at, when set, makes the share time-bound (JIT access); absent = permanent.
  optional google.protobuf.Timestamp expires_at = 9;
}

message ShareSecretRequest {
  uint32 secret_id = 1;
  uint32 recipient_id = 2;
  bool is_group = 3;
  string permission = 4;
  // expires_at, when set, makes the share time-bound (JIT access); it must be in
  // the future. Omit for a permanent share. Mirrors REST POST .../share's
  // optional expires_at body field.
  optional google.protobuf.Timestamp expires_at = 5;
}

message ListSecretSharesRequest {
  uint32 secret_id = 1;
}

message ListUserSharesRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListSharedSecretsRequest {
  uint32 page = 1;
  uint32 page_size = 2;
}

message ListSharesResponse {
  repeated ShareRecord shares = 1;
  uint32 total = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint32 total_pages = 5;
}

message UpdateSharePermissionRequest {
  uint32 share_id = 1;
  string permission = 2;
  // expires_at, when set, sets/extends/shortens the share's expiry (must be in
  // the future). Mutually exclusive with clear_expiry in intent; leaving both
  // unset preserves the share's current expiry. Mirrors REST PUT
  // /shares/{id}'s optional expires_at/clear_expiry body fields.
  optional google.protobuf.Timestamp expires_at = 3;
  // clear_expiry, when true, makes the share permanent regardless of its
  // current expiry.
  bool clear_expiry = 4;
}

message RevokeShareRequest {
  uint32 share_id = 1;
}

