        id: {type: integer}
        secret_id: {type: integer}
        owner_id: {type: integer}
        recipient_id: {type: integer}
        is_group: {type: boolean}
        permission: {type: string, enum: [read, write]}
        expires_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    # docs/cli-split-inventory.md §7 PR 5 -- secret bulk/rotation/export/import/scan/hygiene.
    # models.SecretNode carries no `json:` tags; every handler route now converts through
    # the snake_case secretNodeWire type (server/http/handlers/secrets_wire.go) before
    # sending a response, fixed as part of the API-hygiene casing campaign.
    Secret:
      type: object
      description: >-
        A secret or folder node (internal/storage/models.SecretNode), metadata
        only -- never a value. Wire keys are snake_case, via the handler-level
        secretNodeWire type (server/http/handlers/secrets_wire.go) -- fixed
        from the previous bare-Go-field-name leak (ADR-108 PR 4/5) as part of
