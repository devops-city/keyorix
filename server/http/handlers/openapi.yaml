          description: Envelope `{data, message}`. `data` is `{secret_id, secret_name, affected}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretImpact'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/access:
    get:
      tags: [Secrets]
      summary: List who can read a secret
      description: >-
        Effective access list -- every user who can read the secret, with their EFFECTIVE
        permission and how it was granted. For a project member the level is
        max(role permission, active share permission), so a share that elevates a role
        shows as the higher level; `grants` lists every grant behind it. Expired shares
        and shares to users who are not project members grant nothing and are not
        listed. Holders of a global role (global admins) have implicit access and are
        not enumerated. An owner who is no longer a project member is not listed as
        owner. Project roles (role grants, and members who hold access only through a
        role) are shown only when the caller holds users.read at the project (the gate
        of GET /projects/{id}/members); per-secret ACL holders and acl grants only when
        the caller passes secrets.manage on the secret (the gate of
        GET /secrets/{id}/acl). A withheld part is left out and the response is
        flagged `degraded`, as is a lookup that failed; a degraded list is an
        under-count, never complete. A caller without users.read can still tell that
        a listed share recipient or the owner is a project member (a share to a
        non-member is not listed). Deactivated or suspended accounts that still hold a
        grant are listed on purpose: the grant applies again if the account is
        reactivated.
      operationId: listAccessors
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is `{accessors, total, degraded, degraded_reasons}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessors: {type: array, items: {$ref: '#/components/schemas/SecretAccessor'}}
                      total: {type: integer, description: Number of accessors listed.}
                      degraded:
                        type: boolean
                        description: >-
                          True when the list is incomplete: part of it was withheld from
                          this caller (project roles, ACL holders) or a lookup failed.
                          `accessors` is then an under-count. Clients must show it.
                      degraded_reasons:
                        type: array
                        nullable: true
                        items: {type: string}
                        description: "One entry per gap, in the form `area: reason`; null when the list is complete."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/access-log:
    get:
      tags: [Secrets]
      summary: Show a secret's recent reads
      description: >-
        Recent access-log entries -- who read it, when, from where. The originating
        IP/user-agent are included only for a caller who separately holds audit.read
        (checked globally); every other secrets.read caller sees accessor/action/time only.
      operationId: getSecretAccessLog
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer}, description: "Lookback window (default server-side: 30)."}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is `{access_log}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_log: {type: array, items: {$ref: '#/components/schemas/SecretAccessLogEntry'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/schedule:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Secrets]
      summary: Get a secret's temporal access schedule
      description: Requires secrets.manage.
      operationId: getSecretSchedule
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretAccessSchedule'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Secrets]
      summary: Set a secret's temporal access schedule
      description: >-
        Restrict read access to a day-of-week + hour window. Applies to
        permission-checked human reads; admin/machine reads bypass it.
      operationId: setSecretSchedule
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed_days, start_hour, end_hour]
              properties:
                allowed_days: {type: string, description: "Comma-separated ISO weekday list (1=Mon..7=Sun), or \"*\" for all days."}
                start_hour: {type: integer, minimum: 0, maximum: 23}
                end_hour: {type: integer, minimum: 1, maximum: 24}
                timezone: {type: string, description: "IANA timezone name, e.g. UTC or America/New_York."}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the stored schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretAccessSchedule'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Secrets]
      summary: Remove a secret's temporal access schedule
      description: Idempotent.
      operationId: deleteSecretSchedule
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Schedule removed (or none was set). Envelope `{data: {deleted: true}, message: "schedule removed"}`; the handler has always answered 200, not 204 (#3173).'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/suspend:
    post:
      tags: [Secrets]
      summary: Suspend a secret
      description: >-
        Block value reads without deleting the secret. Versions, shares, and
        the audit trail are preserved. Requires secrets.write.
        A request with `clear_synced_copies` is refused with 500 and error
        `SuspendAuditUnavailable` when its audit event cannot be recorded; nothing is
        changed. The message says what to do now: suspend again without
        `clear_synced_copies` to cut access immediately (a plain suspend is never
        blocked by the audit log); clearing the synced copies needs the audit log back.
        There is no gRPC twin: the gRPC API has no secret suspend.
      operationId: suspendSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, description: "Optional reason recorded in the audit event."}
                clear_synced_copies:
                  type: boolean
                  description: >-
                    Also clear the copies of this secret synced to Kubernetes
                    clusters, for THIS suspension only: the operator and k8s-sync
                    treat the secret as `onSuspend: Clear` whatever the resource's
                    own setting says (they empty only the keys Keyorix manages and
                    never delete a Secret they do not own). Meant as a compromise
                    response; rotate the secret afterwards. Resuming removes the
                    request and the next sync restores the copies. Needs the same
                    permission as suspending and is recorded in the `secret.suspended`
                    audit event (`clear_synced_copies=true`). On a secret that is
                    already suspended without it, the flag upgrades the suspension in
                    place; an existing request is never downgraded by a suspend.
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. Declared as a generic object -- no
            CLI command reads any field from it, only the status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/resume:
    post:
      tags: [Secrets]
      summary: Resume a suspended secret
      description: Restore value reads. Requires secrets.write.
      operationId: resumeSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. Declared as a generic object -- no
            CLI command reads any field from it, only the status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/rollback:
    post:
      tags: [Secrets]
      summary: Restore a secret to the value of a prior version
      description: >-
        The old value is re-instated as a NEW version -- history stays
        append-only, so the rollback itself can be undone. Requires secrets.write.
      operationId: rollbackSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: {type: integer, description: "Version number to restore."}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. Declared as a generic object -- no
            CLI command reads any field from it, only the status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/restore:
    post:
      tags: [Secrets]
      summary: Restore a soft-deleted secret
      description: >-
        Clears the deletion, returning the secret to the live list. Find
        restorable secrets with GET /projects/{id}/secrets/deleted.
      operationId: restoreSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope `{data, message}`. `data` is `{id, restored}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: integer}
                      restored: {type: boolean}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/deleted:
    get:
      tags: [Secrets]
      summary: List a project's soft-deleted (restorable) secrets
      description: >-
        The recycle bin for a project -- secrets that were deleted but are
        still restorable until the purge job reaps them, newest-deleted
        first. Requires secrets.read at the project scope.
      operationId: listDeletedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}, description: "Max entries (default server-side: 100, cap 500)."}
      responses:
        '200':
          description: "Envelope `{data, message}`. `data` is `{deleted}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleted: {type: array, items: {$ref: '#/components/schemas/DeletedSecretEntry'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/environments/{envId}/copy-secrets:
    post:
      tags: [Secrets]
      summary: Copy every secret from one environment into another
      description: >-
        Bulk-promote a whole environment (e.g. seed production from staging)
        in a single call. Name clashes in the target are skipped, never
        overwritten. Requires secrets.write on the target, secrets.read on
        the source environment.
      operationId: copyEnvironmentSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Project ID.}
        - {name: envId, in: path, required: true, schema: {type: integer}, description: Source environment ID.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_environment_id]
              properties:
                target_environment_id: {type: integer}
      responses:
        '200':
          description: "Envelope `{data, message}`. `data` is `{copied, skipped}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      copied: {type: integer}
                      skipped: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/folders:
    get:
      tags: [Secrets]
      summary: List folders
      description: Folders are secret nodes with IsSecret=false. Filterable by project and parent.
      operationId: listFolders
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: parent_id, in: query, schema: {type: integer}, description: "0/omit = no filter."}
        - {name: page_size, in: query, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope `data` is an array of folder nodes."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Secret'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Create a folder
      description: Authorized in-handler against the project/environment in the body.
      operationId: createFolder
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment_id]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                project_id: {type: integer}
                environment_id: {type: integer}
                parent_id: {type: integer, description: "0/omit = root."}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the created folder node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Secret'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/folders/{id}:
    delete:
      tags: [Secrets]
      summary: Delete a folder
      description: Requires secrets.delete at the folder's scope. Refuses if the target node is a secret, not a folder.
      operationId: deleteFolder
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Folder deleted.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secret-templates:
    get:
      tags: [Secrets]
      summary: List secret templates
      description: Reusable metadata presets (tags, classification, description hints) for secret creation. Requires secrets.read.
      operationId: listSecretTemplates
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `{data, message}`. `data` is `{templates}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templates: {type: array, items: {$ref: '#/components/schemas/SecretTemplate'}}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Create a secret template
      description: Requires secrets.write. Templates are deployment-wide, not project-scoped.
      operationId: createSecretTemplate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                default_classification: {type: string}
                default_tags: {type: string, description: "Comma-separated tag names."}
                description_pattern: {type: string}
                rotation_hint_days: {type: integer}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the created template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretTemplate'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secret-templates/{id}:
    delete:
      tags: [Secrets]
      summary: Delete a secret template
      description: Requires secrets.write.
      operationId: deleteSecretTemplate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Template deleted.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/rotate:
    post:
      tags: [Secrets]
      summary: Rotate a secret value
      description: Replace a secret's current value with a new one, archiving the previous version.
      operationId: rotateSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_value]
              properties:
                new_value: {type: string}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the rotated secret node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Secret'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/rotation/simulate:
    post:
      tags: [Secrets]
      summary: Simulate a rotation dry-run for a secret
      description: >-
        Validates the secret's rotation configuration (policy, backend, ref) without
        executing any live rotation. Read-only — requires only secrets.read.
      operationId: simulateSecretRotation
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the dry-run result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/RotationDryRunResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/auto-rotate:
    patch:
      tags: [Secrets]
      summary: Enable/disable automated rotation for a secret
      description: >-
        Opts a secret into automated rotation on schedule, optionally rotating an
        upstream credential too when backend/ref are set. Enable only for secrets whose
        value Keyorix owns.
      operationId: setSecretAutoRotate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                length: {type: integer}
                charset: {type: string}
                backend: {type: string}
                ref: {type: string}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` echoes the applied configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: {type: integer}
                      auto_rotate: {type: boolean}
                      length: {type: integer}
                      charset: {type: string}
                      backend: {type: string}
                      ref: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/audit:
    get:
      tags: [Secrets]
      summary: Show a secret's lifecycle events
      description: >-
        Lists the audit trail for a secret (created/rotated/rolled-back/suspended/
        resumed/shared/owner-transferred/reclassified, …), newest first. Never
        includes a plaintext value. `limit` defaults to 50, capped at 500.
      operationId: getSecretAuditTrail
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.audit` is the event list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      audit: {type: array, items: {$ref: '#/components/schemas/SecretAuditEntry'}}
                      total: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/ownership-history:
    get:
      tags: [Secrets]
      summary: Show a secret's ownership-transfer chain
      description: Ordered list of ownership transfers for a secret (oldest first).
      operationId: getSecretOwnershipHistory
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.ownership_history` is the transfer list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ownership_history: {type: array, items: {$ref: '#/components/schemas/OwnershipRecord'}}
                      total: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/certificate:
    get:
      tags: [Secrets]
      summary: Show a certificate secret's public X.509 metadata
      description: >-
        Subject, issuer, validity window, SANs, and algorithms of a certificate-valued
        secret. Never returns the value or any private key. Refused like a value read: a
        read outside the secret's access schedule answers 403 with error
        SecretAccessOutsideSchedule; an expired or suspended secret answers 409 (see the
        SecretReadRefused response). Inspecting does not charge max_reads, so
        SecretMaxReadsExhausted is never returned here.
      operationId: getSecretCertificate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the certificate metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/CertificateInfo'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/SecretReadRefused'}
  /api/v1/secrets/{id}/blast-radius:
    get:
      tags: [Secrets]
      summary: Show the enriched blast radius of rotating or deleting a secret
      description: >-
        All downstream dependents of a secret (recursive), each annotated with owner,
        project, hop depth, and risk level.
      operationId: getSecretBlastRadius
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the blast-radius report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BlastRadiusReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/versions:
    get:
      tags: [Secrets]
      summary: List secret versions
      description: Return the full version history for a secret, including previous values' metadata.
      operationId: getSecretVersions
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.versions` is the version history array; `data.total_reads` the secret's lifetime read count (access-log rows with action read).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      versions: {type: array, items: {$ref: '#/components/schemas/SecretVersion'}}
                      total_reads: {type: integer, description: "Lifetime count of reads of this secret's value (secret_access_logs rows with action read; on an install upgraded from before #2970 the earlier version listings, which were logged as reads, are included, so the lifetime count is inflated there). Each version's ReadCount counts only reads charged against max_reads."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/risk:
    get:
      tags: [Secrets]
      summary: Get a secret's risk score
      description: Return the composite risk score for a secret based on expiry, rotation, usage, and exposure factors.
      operationId: getSecretRisk
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` is the composite risk score
            (expiry / rotation / usage / exposure factors).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretRiskScore'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/quota-report:
    get:
      tags: [Secrets]
      summary: Show secrets approaching or at their MaxReads quota
      description: >-
        Lists every live secret with a MaxReads cap configured: current read count,
        quota percentage, and status. Requires audit.read (a usage-report endpoint,
        not secret-value access) -- NOT secrets.read.
      operationId: getQuotaReport
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.secrets` is the quota report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secrets: {type: array, items: {$ref: '#/components/schemas/QuotaReportRow'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/name-conformance:
    get:
      tags: [Secrets]
      summary: List every project's secrets whose names violate the naming policy (org-wide)
      description: >-
        Deployment-wide naming-policy conformance report, each violation tagged with its
        project. Requires audit.read (global) -- NOT the baseline system.read.
      operationId: deploymentSecretNameConformance
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the org-wide conformance report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/DeploymentSecretNameConformanceReport'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/usage/most-accessed:
    get:
      tags: [Secrets]
      summary: List most-accessed secrets
      description: Return the top secrets ranked by read count within the specified project and time window.
      operationId: getMostAccessedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
        - {name: limit, in: query, schema: {type: integer, default: 10}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data.secrets` ranks secrets by read
            count; `data.days` echoes the window.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/usage/unused:
    get:
      tags: [Secrets]
      summary: List unused secrets
      description: Return secrets that have not been read within the specified number of days, never-read first.
      operationId: getUnusedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer, default: 30}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data.secrets` lists secrets unread in
            the last N days (never-read first); `data.days` echoes the window.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/shares:
    get:
      tags: [Shares]
      summary: List a secret's shares
      description: Return all share records for a secret, showing who has been granted access and at what permission level.
      operationId: listSecretShares
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.shares` is the share records array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shares: {type: array, items: {$ref: '#/components/schemas/Share'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/share:
    post:
      tags: [Shares]
      summary: Share a secret
      description: Grant read or write access to a secret for a specific user or group.
      operationId: shareSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_id, permission]
              properties:
                recipient_id:
                  type: integer
                  description: User ID, or group ID when `is_group` is true.
                is_group: {type: boolean}
                permission: {type: string, enum: [read, write]}
                expires_at:
                  type: string
                  format: date-time
                  description: Optional time-bound (JIT) share expiry. Omitted = permanent.
      responses:
        '201':
          description: Envelope `{data, message}`. `data` is the created share record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Share'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/self-share:
    delete:
      tags: [Shares]
      summary: Remove yourself from a secret shared with you
      description: >-
        Self-service removal of the caller's own share grant (RecipientID ==
        caller), distinct from `revokeShare` (owner-driven revocation of
        anyone's share).
      operationId: removeSelfFromShare
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Removed (no content).}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/secrets/{id}/access-log/export:
    get:
      tags: [Secrets]
      summary: Download secret access log as a file
      description: >-
        Returns the secret's full access history (secret.read audit events) as
        a downloadable file. Supports JSON (default) and CSV formats via the
        `format` query parameter. Gated by secrets.read at the secret's project
        scope. Each row's ip_address is populated only for a caller who
        separately holds audit.read (checked globally), matching GET
        .../access-log's own gate; every other row field is unconditional.
      operationId: exportSecretAccessLog
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - name: format
          in: query
          schema: {type: string, enum: [json, csv], default: json}
          description: "Output format. `json` returns a JSON array; `csv` returns a spreadsheet-friendly attachment."
      responses:
        '200':
          description: File download. Content-Type is `application/json` or `text/csv` depending on `format`.
          content:
            application/json:
              schema: {type: string, format: binary}
            text/csv:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/dynamic-secrets/configs:
    get:
      tags: [DynamicSecrets]
      summary: List dynamic-secret configs
      description: >-
        List dynamic-secret configs, optionally filtered by project/environment.
        Never includes the encrypted admin DSN. Added for ADR-108 PR 1 (thin CLI
        `dynamic-secret list`) — this route existed and was already called by the
        old CLI's remote mode; it was simply undocumented in this spec until now.
      operationId: listDynamicSecretConfigs
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: environment_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is the array of sanitized configs (never the admin DSN).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DynamicSecretConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [DynamicSecrets]
      summary: Create a dynamic-secret config
      description: >-
        Register a target backend (database DSN, cloud IAM, etc.) that this
        config can mint short-lived credentials against. Added for ADR-108 PR 1
        (thin CLI `dynamic-secret create`) — see listDynamicSecretConfigs above.
      operationId: createDynamicSecretConfig
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, project_id, environment_id, backend_type, admin_dsn, creation_template]
              properties:
                name: {type: string}
                project_id: {type: integer}
                environment_id: {type: integer}
                backend_type: {type: string}
                admin_dsn: {type: string, description: "Plaintext admin DSN; encrypted at rest, never echoed back"}
                creation_template: {type: string}
                default_ttl_seconds: {type: integer}
                max_ttl_seconds: {type: integer}
                max_active_leases: {type: integer}
                classification: {type: string, enum: ['', public, internal, confidential, restricted]}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is the sanitized created config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/DynamicSecretConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/configs/{id}:
    get:
      tags: [DynamicSecrets]
      summary: Get a dynamic-secret config
      description: >-
        Return a single sanitized config by ID. Added for ADR-108 PR 1 (thin CLI
        `dynamic-secret get-config`) — see listDynamicSecretConfigs above.
      operationId: getDynamicSecretConfig
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is the sanitized config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/DynamicSecretConfig'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/configs/{id}/classification:
    patch:
      tags: [DynamicSecrets]
      summary: Set a dynamic-secret config's data-classification label
      description: >-
        Added for ADR-108 PR 1 (thin CLI `dynamic-secret classify`) — see
        listDynamicSecretConfigs above.
      operationId: classifyDynamicSecretConfig
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                classification: {type: string, enum: ['', public, internal, confidential, restricted]}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is the updated sanitized config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/DynamicSecretConfig'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/configs/{id}/issue:
    post:
      tags: [DynamicSecrets]
      summary: Issue a short-lived credential (lease) from a config
      description: >-
        Mints a new credential against the config's backend and returns it once
        (it is never retrievable again). Added for ADR-108 PR 1 (thin CLI
        `dynamic-secret issue`) — see listDynamicSecretConfigs above.
      operationId: issueDynamicSecretLease
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: {type: integer}
      responses:
        '200':
          description: >-
            Envelope `{success, data, message}`. `data`: `{lease_id, username?,
            password?, fields?, expires_at}` — the one-time credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/DynamicSecretIssuedLease'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/configs/{id}/leases:
    get:
      tags: [DynamicSecrets]
      summary: List a config's leases
      description: >-
        Added for ADR-108 PR 1 (thin CLI `dynamic-secret leases`) — see
        listDynamicSecretConfigs above. Never includes the issued credential
        itself (that is shown once, at issue time, and never again).
      operationId: listDynamicSecretLeases
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is the array of sanitized leases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/DynamicSecretLease'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/configs/{id}/revoke-all:
    post:
      tags: [DynamicSecrets]
      summary: Revoke every active lease issued from a config
      description: >-
        The incident kill switch. Added for ADR-108 PR 1 (thin CLI
        `dynamic-secret revoke-all`) — see listDynamicSecretConfigs above.
      operationId: revokeAllDynamicSecretLeases
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope `{success, data, message}`. `data`: `{config_id, revoked, failed}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      config_id: {type: integer, format: uint32}
                      revoked: {type: integer}
                      failed: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/leases/{leaseID}/renew:
    post:
      tags: [DynamicSecrets]
      summary: Extend a lease's expiry
      description: >-
        Added for ADR-108 PR 1 (thin CLI `dynamic-secret renew`) — see
        listDynamicSecretConfigs above.
      operationId: renewDynamicSecretLease
      security: [{bearerAuth: []}]
      parameters:
        - {name: leaseID, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: {type: integer}
      responses:
        '200':
          description: "Envelope `{success, data, message}`. `data`: `{lease_id, expires_at}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      lease_id: {type: string}
                      expires_at: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /api/v1/dynamic-secrets/leases/{leaseID}/revoke:
    post:
      tags: [DynamicSecrets]
      summary: Revoke a single lease
      description: >-
        Added for ADR-108 PR 1 (thin CLI `dynamic-secret revoke`) — see
        listDynamicSecretConfigs above.
      operationId: revokeDynamicSecretLease
      security: [{bearerAuth: []}]
      parameters:
        - {name: leaseID, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: "Envelope `{success, data, message}`. `data`: `{lease_id, status}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      lease_id: {type: string}
                      status: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}

  /api/v1/shares:
    get:
      tags: [Shares]
      summary: List shares created by the caller
      description: Return all secret shares that were created by the authenticated user.
      operationId: listShares
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.shares` is the share records array.
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/shares/owned:
    get:
      tags: [Shares]
      summary: List the shares the caller created, in projects they are a member of
      description: >-
        The owner-scoped share list behind the Sharing Management page for a caller
        without global secrets.read (GET /api/v1/shares needs it). Returns only shares
        the caller created, and only on secrets in projects the caller is a member of
        now: after removal from a project its shares stop being listed (they are not
        revoked). Received shares are not listed, and holding global secrets.read does
        not add anyone else's shares. Requires secrets.read at the global scope or at
        one or more project scopes; machine identities are refused. Every refusal is
        the same 403 with a fixed reason. Same filters, paging and shape as
        GET /api/v1/shares. A read: no audit event, like GET /api/v1/shares. A list over
        10000 shares is refused with 422 ShareListOverCap (never truncated); pagination
        in core is a follow-up.
      operationId: listOwnedShares
      security: [{bearerAuth: []}]
      parameters:
        - {name: secretId, in: query, required: false, schema: {type: integer, format: uint32}}
        - {name: recipientType, in: query, required: false, schema: {type: string, enum: [user, group]}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: pageSize, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 200, default: 20}}
      responses:
        '200':
          description: Envelope `{success, data}`. `data.data` is one page of shares; `data.total` counts every match.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [data, total, page, pageSize, totalPages]
                    additionalProperties: false
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [id, secretId, recipientType, recipientId, recipientName, permission, createdAt, createdBy]
                          additionalProperties: false
                          properties:
                            id: {type: integer, format: uint32}
                            secretId: {type: integer, format: uint32}
                            recipientType: {type: string, enum: [user, group]}
                            recipientId: {type: integer, format: uint32}
                            recipientName: {type: string}
                            permission: {type: string}
                            expiresAt: {type: string, format: date-time, description: Absent for a permanent share.}
                            createdAt: {type: string, format: date-time}
                            createdBy: {type: string, description: Username of the share's creator (always the caller here).}
                            secretName: {type: string, description: "The secret's name. Absent when the caller may not read the secret (#3153)."}
                            projectId: {type: integer, format: uint32, description: "The secret's project. Absent with secretName."}
                            projectName: {type: string, description: "The secret's project name. Absent with secretName."}
                      total: {type: integer}
                      page: {type: integer}
                      pageSize: {type: integer}
                      totalPages: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/shares/{id}:
    put:
      tags: [Shares]
      summary: Update a share's permission
      description: Change the permission level (read or write) of an existing secret share.
      operationId: updateSharePermission
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission: {type: string, enum: [read, write]}
                expires_at:
                  type: string
                  format: date-time
                  description: Set/extend/shorten the time-bound expiry. Mutually exclusive with clear_expiry.
                clear_expiry:
                  type: boolean
                  description: Make the share permanent (remove its expiry). Mutually exclusive with expires_at.
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the updated share record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Share'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Shares]
      summary: Revoke a share
      description: Remove a secret share, revoking the recipient's access to the secret.
      operationId: revokeShare
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Share revoked (no content).}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/shared-secrets:
    get:
      tags: [Shares]
      summary: List secrets shared with the caller
      description: Return all secrets that other users or groups have shared with the authenticated user.
      operationId: listSharedSecrets
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.secrets` is the shared secret nodes array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secrets: {type: array, items: {$ref: '#/components/schemas/Secret'}}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies:
    get:
      tags: [RotationPolicies]
      summary: List rotation policies
      description: Return rotation policies, optionally filtered by project or environment.
      operationId: listRotationPolicies
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: environment_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the rotation policies array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/RotationPolicy'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [RotationPolicies]
      summary: Create a rotation policy
      description: Create a new rotation policy with a name, scope, interval, and optional alert thresholds.
      operationId: createRotationPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope, interval_days]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string}
                scope: {type: string, enum: [project, environment]}
                project_id: {type: integer, nullable: true}
                environment_id: {type: integer, nullable: true}
                interval_days: {type: integer, minimum: 1, maximum: 365}
                alert_days_before: {type: integer, minimum: 0, maximum: 90}
                notify_on_breach: {type: boolean}
      responses:
        '201':
          description: Envelope `{data, message}`. `data` is the created rotation policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/RotationPolicy'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies/evaluate:
    get:
      tags: [RotationPolicies]
      summary: Evaluate rotation policies
      description: Evaluate rotation policies and return secrets that are overdue or approaching their rotation deadline.
      operationId: evaluateRotationPolicies
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` lists secrets that are overdue or
            approaching their rotation deadline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: array
                    nullable: true
                    description: >-
                      null (not []) when EvaluateRotationPolicies' `var
                      evaluations []*RotationPolicyEvaluation` never gets
                      appended to -- e.g. no active policy covers anything
                      currently overdue or approaching. Verified against the
                      real handler, not asserted: this is exactly the shape
                      TestContractPR1_EvaluateRotationPolicies
                      (openapi_contract_pr1_test.go) exercises.
                    items: {$ref: '#/components/schemas/RotationPolicyEvaluation'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies/status:
    get:
      tags: [RotationPolicies]
      summary: Get rotation posture per secret
      description: Return rotation posture (overdue, due soon, or OK) for every policy-covered secret in the project.
      operationId: getRotationStatus
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` reports rotation posture
            (`overdue` / `due_soon` / `ok`) for every policy-covered secret.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/rotation-policies/{id}:
    get:
      tags: [RotationPolicies]
      summary: Get a rotation policy
      description: Return a single rotation policy by its numeric ID.
      operationId: getRotationPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the rotation policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/RotationPolicy'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [RotationPolicies]
      summary: Update a rotation policy
      description: Update a rotation policy's name, interval, alert thresholds, or active status.
      operationId: updateRotationPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, interval_days]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string}
                interval_days: {type: integer, minimum: 1, maximum: 365}
                alert_days_before: {type: integer, minimum: 0, maximum: 90}
                notify_on_breach: {type: boolean}
                is_active: {type: boolean}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the updated rotation policy.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [RotationPolicies]
      summary: Delete a rotation policy
      description: Permanently delete a rotation policy by ID.
      operationId: deleteRotationPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204': {description: Rotation policy deleted (no content).}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/rotation-plan:
    get:
      tags: [RotationPolicies]
      summary: Get the install-wide rotation plan (ADR-053)
      description: >-
        Every project's overdue/due-soon secrets aggregated into a roll-up,
        most-pressing project first. Gated by GLOBAL secrets.read (the same
        access level as listing all projects) — deliberately a step up from
        the per-project route above, documented, not a gap (docs/cli-split-
        inventory.md §2.4). Added for ADR-108 PR 1 (thin CLI `rotation plan
        --all-projects`) — see getProjectRotationOrder above.
      operationId: getDeploymentRotationPlan
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope `{success, data, message}`. `data` is a
            DeploymentRotationPlan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/DeploymentRotationPlan'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Return a paginated list of users with optional filters for search, state, and activity.
      operationId: listUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: search, in: query, schema: {type: string}}
        - {name: username, in: query, schema: {type: string}}
        - {name: email, in: query, schema: {type: string}}
        - {name: is_active, in: query, schema: {type: boolean}}
        - {name: include_deleted, in: query, schema: {type: boolean}}
        - {name: filter, in: query, description: "Set to `inactive` for users with no login in the last 30 days.", schema: {type: string, enum: [inactive]}}
      responses:
        '200':
          description: "Envelope `data` has `users[]` (each with id, username, email, display_name, project_count, active_project_count), `page`, `page_size`, `total`, `total_pages`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      users: {type: array, items: {$ref: '#/components/schemas/UserSummary'}}
                      page: {type: integer}
                      page_size: {type: integer}
                      total: {type: integer}
                      total_pages: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user with credentials, optionally delivering a setup link or one-time password.
      operationId: createUser
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, display_name]
              properties:
                username: {type: string, minLength: 3, maxLength: 50}
                email: {type: string, format: email}
                display_name: {type: string, minLength: 1, maxLength: 100}
                password: {type: string, minLength: 8, description: "Required unless deliver_setup_link or generate_one_time_password is set."}
                is_active: {type: boolean}
                deliver_setup_link: {type: boolean, description: "Provision via account-setup link instead of an admin-set password."}
                generate_one_time_password: {type: boolean, description: "Server-generated one-time password, returned once. Mutually exclusive with deliver_setup_link."}
                role: {type: string, description: "Optional system role override (admin-set-password path only)."}
                project_assignments:
                  type: array
                  description: "Project-scoped role assignments applied atomically (admin-set-password path only)."
                  items:
                    type: object
                    properties:
                      project_id: {type: integer}
                      role: {type: string}
      responses:
        '201':
          description: "Envelope `data` is the created user. With generate_one_time_password it is `{user, one_time_password}` where `one_time_password` is `{email, one_time_password, expires_at}` (`expires_at` is the UTC RFC 3339 instant after which login with it is refused like a wrong password); with deliver_setup_link it is `{user, setup_link}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/users/search:
    get:
      tags: [Users]
      summary: Search users
      description: Search users by a query string, returning up to ten matching results.
      operationId: searchUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: "Envelope `data.users[]` with id, username, email (max 10)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/users/stale:
    get:
      tags: [Users]
      summary: List stale (stuck-state) accounts
      description: Return user accounts stuck in pending_first_login or password_reset_required state beyond the specified age.
      operationId: listStaleUsers
      security: [{bearerAuth: []}]
      parameters:
        - {name: state, in: query, description: "Account state to filter.", schema: {type: string, enum: [pending_first_login, password_reset_required], default: pending_first_login}}
        - {name: days, in: query, description: "Minimum age in days in the restricted state.", schema: {type: integer, default: 7}}
      responses:
        '200':
          description: "Envelope `data` has `users[]`, `state`, `days`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/users/by-email:
    get:
      tags: [Users]
      summary: Get a user by email (ADR-108 PR 6 addition)
      description: >-
        Return a single user by email address, for a caller that only has the
        email, not the numeric ID. Same gate (users.read) and not-found shape as
        GET /users/{id} -- grants no new capability, since users.read already lets
        a caller enumerate every user (including email) via GET /users. Added for
        ADR-108 PR 6 (thin CLI `user get --email`) -- was already a live route
        (handlers.GetUserByEmail, router.go), just undocumented in this spec until
        now.
      operationId: getUserByEmail
      security: [{bearerAuth: []}]
      parameters:
        - {name: email, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: "Envelope `data` is the user (id, username, email, display_name, active, created_at, updated_at)."
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Users]
      summary: Get user
      description: Return a single user by ID, including project membership counts and account state.
      operationId: getUser
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the user (id, username, email, display_name, project_count, active_project_count)."
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Users]
      summary: Update user
      description: Update a user's username, email, display name, or active status by ID.
      operationId: updateUser
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, minLength: 3, maxLength: 50}
                email: {type: string, format: email}
                display_name: {type: string, minLength: 1, maxLength: 100}
                active: {type: boolean}
      responses:
        '200':
          description: "Envelope `data` is the updated user."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Users]
      summary: Delete (soft-delete) user
      description: Soft-delete a user account by ID, preserving audit history while preventing login.
      operationId: deleteUser
      security: [{bearerAuth: []}]
      responses:
        '204': {description: User deleted.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/restore:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Restore soft-deleted user
      description: Restore a previously soft-deleted user account, re-enabling their access.
      operationId: restoreUser
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope with `message`; `data` is null."}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/suspend:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Suspend user
      description: Suspend a user account, immediately preventing authentication without deleting the account.
      operationId: suspendUser
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope with `message`; `data` is null."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/reactivate:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Reactivate user
      description: Reactivate a suspended user account, restoring their ability to authenticate.
      operationId: reactivateUser
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope with `message`; `data` is null."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/require-password-reset:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Require password reset on next login
      description: Flag a user account so the user must change their password before they can proceed after next login.
      operationId: requirePasswordReset
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope with `message`; `data` is null."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/resend-setup-link:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Reissue and resend account-setup link
      description: Generate a new account-setup link for a user and resend it via the configured delivery channel.
      operationId: resendSetupLink
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the delivery outcome (includes the link itself in out-of-band mode)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/reissue-one-time-password:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Reissue a one-time password for an existing user (REISSUE-1)
      description: >-
        Issue a new server-generated one-time password for an existing local user and
        return it ONCE in this response, for the administrator to relay out of band.
        Requires users.write (the same permission as creating a user with a one-time
        password) and the admin-rank ceiling over the target. The password expires
        after security.one_time_password_ttl (default 72h); the account is put into
        password_reset_required, so its first login is confined to changing the
        password (and to MFA enrolment where security.require_mfa applies); every
        existing session of the user ends. An enrolled second factor is kept.
        Personal access tokens are handled as for require-password-reset (restricted
        at once, revoked when the user sets a new password). Refused for the caller's
        own account (400, use `keyorix-server admin recover-admin`), for an
        externally-managed (SSO/SCIM) account and for a suspended or inactive one
        (409). Audited as user.one_time_password_reissued (actor and target, never the
        password).
      operationId: reissueOneTimePassword
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is {user_id, one_time_password: {email, one_time_password, expires_at}}. The response is not cacheable."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/revoke-sessions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      tags: [Users]
      summary: Force-logout a user (ADR-108 PR 6 addition)
      description: >-
        Terminate every active session of a user immediately, without changing
        their account state. Requires users.write; refuses to target the caller's
        own account (400). Added for ADR-108 PR 6 (thin CLI `user revoke-sessions`)
        -- was already a live route (UserHandler.RevokeSessions, router.go), just
        undocumented in this spec until now.
      operationId: revokeUserSessions
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is {revoked: <count>}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/roles:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Users]
      summary: Get user roles
      description: Return all roles assigned to the specified user.
      operationId: getUserRolesForUser
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data.roles[]` with id, name."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles: {type: array, items: {$ref: '#/components/schemas/RoleRef'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Users]
      summary: Replace user roles at a scope
      description: Replace the user's role assignments at the given project or global scope with the provided role IDs.
      operationId: updateUserRoles
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_ids: {type: array, items: {type: integer}}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
      responses:
        '200':
          description: "Envelope `data.roles[]` with id, name (post-replacement)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/memberships:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Users]
      summary: List user project memberships
      description: >-
        Return every project the specified user is a member of, with their role(s)
        and the membership's onboarding state. "Member of a project" means the user
        holds a live role grant scoped to that project, directly or through a group —
        the same definition GET /api/v1/projects/{id}/members reports, so the two
        views agree. An install-wide grant (project 0) is not membership of any
        project and is never listed here, nor is an expired time-bound grant.
        `state` is the ADR-022 onboarding lifecycle state where an invite produced
        the membership, and `active` for a grant added directly via
        POST /api/v1/projects/{id}/members. `via_group` marks a membership held only
        through a group, which the project's own members list cannot remove.
      operationId: getUserMembershipsForUser
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data, message}. data.memberships is an array of {project_id, project_name, role, roles[], state, via_group}."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      memberships:
                        type: array
                        items:
                          type: object
                          properties:
                            project_id: {type: integer}
                            project_name: {type: string}
                            role: {type: string, description: "The highest-privilege role the user holds at this project's scope."}
                            roles:
                              type: array
                              description: "Every role the user holds at this project's scope, sorted."
                              items: {type: string}
                            state:
                              type: string
                              description: "ADR-022 onboarding state; 'active' when the grant was added directly."
                              enum: [invited, identity_verified, provisioned, active, revoked]
                            via_group:
                              type: boolean
                              description: "True when the membership comes only from a group grant."
                            project_deleted:
                              type: boolean
                              description: >-
                                True when the project has been soft-deleted. The grant survives a
                                soft-delete (RestoreProject reinstates it), so the membership is
                                reported rather than hidden, but it is not counted by the per-user
                                project tallies on GET /api/v1/users.
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/users/{id}/shared-secrets:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Users]
      summary: List secrets shared with a specific user (admin-scoped)
      description: >-
        Return all secrets shared with the specified user — the same data as
        GET /api/v1/shared-secrets (the caller's own shares), for an arbitrary
        target. A self-view (id == the caller) needs only secrets.read;
        viewing another user's shares additionally requires the S1
        admin-rank ceiling (the caller must hold, at every scope, every
        permission the target already holds). A target the caller lacks
        authority over and a target that does not exist both return the same
        403 — this route never confirms via status code whether a given user
        ID exists.
      operationId: listSharedSecretsForUser
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope `{data, message}`. `data.secrets` is the shared secret nodes array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secrets: {type: array, items: {$ref: '#/components/schemas/Secret'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/admin/jobs/suspend-inactive-users:
    post:
      tags: [Users]
      summary: Suspend users inactive beyond a threshold (ADR-108 PR 6 addition)
      description: >-
        Suspend all non-admin users whose last login (or account creation, if they
        have never logged in) is older than inactive_days days. dry_run evaluates
        without making changes. Requires system.write (deployment-wide sweep, not a
        resource-scoped users.* permission). Added for ADR-108 PR 6 (thin CLI `user
        suspend-inactive`) -- was already a live route
        (adminJobsHandler.SuspendInactiveUsers, router.go), just undocumented in
        this spec until now.
      operationId: suspendInactiveUsers
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inactive_days]
              properties:
                inactive_days: {type: integer, description: "Inactivity threshold in days (must be > 0)."}
                dry_run: {type: boolean, description: "Preview which users would be suspended without making changes."}
      responses:
        '200':
          description: "Envelope `data` is {suspended: [<user ids>], skipped: <count>, total: <count>}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/admin/impersonate:
    post:
      tags: [Users]
      summary: Start impersonating a user
      description: Issue a short-lived impersonation session token to act as another user for administrative purposes.
      operationId: startImpersonation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: integer}
      responses:
        '200':
          description: "Envelope `data` is a short-lived target session: token, expires_at, user_id, username, display_name, impersonated_by."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/groups:
    get:
      tags: [Groups]
      summary: List groups
      description: Return all groups in the deployment with their names and descriptions.
      operationId: listGroups
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` has `groups[]` (id, name, description) and `total`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      groups: {type: array, items: {$ref: '#/components/schemas/Group'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Groups]
      summary: Create group
      description: Create a new group with a unique name and optional description.
      operationId: createGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string}
      responses:
        '201':
          description: "Envelope `data` is the created group (id, name, description)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/groups/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Groups]
      summary: Get group
      description: Return a single group by its numeric ID, including name and description.
      operationId: getGroup
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the group (id, name, description)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Group'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Groups]
      summary: Update group
      description: Update the name and/or description of an existing group by ID.
      operationId: updateGroup
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                description: {type: string}
      responses:
        '200':
          description: "Envelope `data` is the updated group."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Group'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Groups]
      summary: Delete group
      description: Permanently delete a group by ID, removing all its memberships and role assignments.
      operationId: deleteGroup
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Group deleted.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/groups/{id}/members:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Groups]
      summary: List group members
      description: Return all users who are members of the specified group.
      operationId: getGroupMembers
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` has `members[]` (user objects) and `total`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      members: {type: array, items: {$ref: '#/components/schemas/UserSummary'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Groups]
      summary: Add group member
      description: Add a user to a group, optionally scoped to a specific project.
      operationId: addGroupMember
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: {type: integer}
                project_id:
                  type: integer
                  default: 0
                  description: "0 = global membership (default); non-zero = scoped to that project only."
      responses:
        '200':
          description: "Envelope `data` is `{group_id, user_id, project_id}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group_id: {type: integer}
                      user_id: {type: integer}
                      project_id: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/groups/{id}/members/{userId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: userId, in: path, required: true, schema: {type: integer}}
      - {name: project_id, in: query, schema: {type: integer}, description: "Scope to the same project the membership was added with (0/omit = global membership). Fixed missing from this spec (ADR-108 PR 3) -- the real handler (groups_members.go's RemoveGroupMember) has always read this query param; every other caller sent it, this spec just never documented it."}
    delete:
      tags: [Groups]
      summary: Remove group member
      description: Remove a user from a group, revoking any access derived from that group membership.
      operationId: removeGroupMember
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Member removed.}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/groups/{id}/roles:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Groups]
      summary: List group role assignments
      description: Return all role assignments for the specified group, showing each role and its scope.
      operationId: getGroupRoles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is `{group_id, roles}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group_id: {type: integer}
                      roles: {type: array, nullable: true, items: {$ref: '#/components/schemas/GroupRoleGrant'}, description: "nil (JSON null), not [], when the group has no role grants."}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Groups]
      summary: Assign role to group at a scope
      description: Grant a role to a group at the specified project or global scope, with an optional expiry for JIT access.
      operationId: assignRoleToGroup
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: {type: integer}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
                expires_at: {type: string, format: date-time, nullable: true, description: "RFC3339; omit or null for a non-expiring grant. JIT access — the assignment is automatically revoked when the timestamp is reached."}
      responses:
        '201':
          description: "Envelope `data` is `{group_id, role_id}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      group_id: {type: integer}
                      role_id: {type: integer}
                      expires_at: {type: string, format: date-time, nullable: true}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/groups/{id}/roles/{roleId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: roleId, in: path, required: true, schema: {type: integer}}
      - {name: project_id, in: query, schema: {type: integer}, description: "Scope (0 = global)."}
      - {name: environment_id, in: query, schema: {type: integer}, description: "Scope (0 = global)."}
    delete:
      tags: [Groups]
      summary: Remove role from group
      description: Revoke a role assignment from a group at the specified project or global scope.
      operationId: removeRoleFromGroup
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Role removed from group.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  # docs/cli-split-inventory.md §7 PR 9 -- share.
  /api/v1/groups/{id}/shares:
    get:
      tags: [Groups, Shares]
      summary: List shares granted to a group
      description: >-
        The share grants made TO a group (as opposed to
        GET /groups/{id}/shared-secrets' resolved-secrets view). Requires
        secrets.read (global or at the group's shares' scope).
      operationId: listGroupShares
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.shares` is the share records array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      shares: {type: array, items: {$ref: '#/components/schemas/Share'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles with permissions
      description: Return all roles in the deployment, each with its assigned permissions.
      operationId: listRoles
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` has `roles[]` (with permissions) and `total`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles: {type: array, items: {$ref: '#/components/schemas/RoleWithPermissions'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Roles]
      summary: Create role
      description: Create a new custom role with a name, description, and initial set of permissions.
      operationId: createRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, permissions]
              properties:
                name: {type: string, minLength: 3, maxLength: 50}
                description: {type: string, minLength: 1, maxLength: 200}
                permissions: {type: array, minItems: 1, items: {type: string}, description: "Permission names."}
      responses:
        '201':
          description: "Envelope `data` is `{role, permissions}` (assigned permissions)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role: {$ref: '#/components/schemas/Role'}
                      permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/roles/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Roles]
      summary: Get role with permissions
      description: Return a single role by ID, including its full list of assigned permissions.
      operationId: getRole
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is `{role, permissions}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role: {$ref: '#/components/schemas/Role'}
                      permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Roles]
      summary: Update role
      description: Update a role's description and/or replace its full set of permissions.
      operationId: updateRole
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: {type: string, minLength: 1, maxLength: 200}
                permissions: {type: array, minItems: 1, items: {type: string}, description: "Replaces the role's permissions by name."}
      responses:
        '200':
          description: "Envelope `data` is `{role, permissions}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role: {$ref: '#/components/schemas/Role'}
                      permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Roles]
      summary: Delete role
      description: Permanently delete a role by ID; fails if the role is currently assigned to any user or group.
      operationId: deleteRole
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Role deleted.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/roles/by-name:
    get:
      tags: [Roles]
      summary: Get role by name
      description: >-
        Look up a role by its exact display name. Added for callers (e.g.
        RemoteStorage) that only have the role's name rather than its numeric
        ID; grants no capability beyond GET /api/v1/roles (roles.read-gated,
        same as GetRole-by-id).
      operationId: getRoleByName
      security: [{bearerAuth: []}]
      parameters:
        - {name: name, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: "Envelope `data` is the bare role object (no permissions payload)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/roles/{id}/permissions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Roles]
      summary: List role permissions
      description: Return all permissions currently assigned to the specified role.
      operationId: getRolePermissions
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is `{role_id, role_name, permissions}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role_id: {type: integer}
                      role_name: {type: string}
                      permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Roles]
      summary: Assign permission to role
      description: Add a permission to the specified role, granting it to all users and groups holding that role.
      operationId: assignPermissionToRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission_id]
              properties:
                permission_id: {type: integer}
      responses:
        '201':
          description: "Envelope `data` is `{role_id, permission_id}`."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/roles/{id}/permissions/{permissionId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: permissionId, in: path, required: true, schema: {type: integer}}
    delete:
      tags: [Roles]
      summary: Remove permission from role
      description: Remove a permission from the specified role, revoking it for all users and groups holding that role.
      operationId: removePermissionFromRole
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Permission removed from role.}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/permissions:
    get:
      tags: [Permissions]
      summary: List permissions
      description: Return all available permissions, optionally filtered by resource type.
      operationId: listPermissions
      security: [{bearerAuth: []}]
      parameters:
        - {name: resource, in: query, description: "Optional filter by resource.", schema: {type: string}}
      responses:
        '200':
          description: "Envelope `data` has `permissions[]` (id, name, resource, ...) and `total`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/permissions/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Permissions]
      summary: Get a single permission by ID
      description: Return a single permission by ID, including its resource, action, and description.
      operationId: getPermission
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the permission (id, name, description, resource, action)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Permission'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/user-roles:
    post:
      tags: [UserRoles]
      summary: Assign role to user at a scope
      description: Assign a role to a user at the specified project or global scope, with an optional JIT expiry.
      operationId: assignUserRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_id]
              properties:
                user_id: {type: integer}
                role_id: {type: integer}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
                expires_at: {type: string, format: date-time, nullable: true, description: "RFC3339; omit or null for a non-expiring grant. JIT access — the assignment is automatically revoked when the timestamp is reached."}
      responses:
        '201':
          description: "Envelope `data` is `{user_id, role_id}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id: {type: integer}
                      role_id: {type: integer}
                      expires_at: {type: string, format: date-time, nullable: true}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [UserRoles]
      summary: Remove role from user at a scope
      description: Remove a role assignment from a user at the specified project or global scope.
      operationId: removeUserRole
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_id]
              properties:
                user_id: {type: integer}
                role_id: {type: integer}
                project_id: {type: integer, description: "Scope (0 = global)."}
                environment_id: {type: integer, description: "Scope (0 = global)."}
      responses:
        '204': {description: Role removed from user.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/user-roles/user/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: integer}}
    get:
      tags: [UserRoles]
      summary: Get a user's role assignment
      description: Return the current role assignment for the specified user.
      operationId: getUserRoleAssignment
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is the user's role assignment."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/UserRoleAssignment'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/audit/logs:
    get:
      tags: [Audit]
      summary: List audit log entries (UI-oriented, paginated)
      description: >-
        Return audit log entries newest first (event time, then id), filtered by
        action, user, project, actor type, or time range. page/page_size reach
        the newest 10000 events; follow next_cursor (cursor=) to page deeper.
        See docs/specs/audit-list-keyset.md.
      operationId: listAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: action, in: query, schema: {type: string}, description: Filter by event type/action.}
        - {name: user_id, in: query, schema: {type: integer}, description: Filter by acting user ID.}
        - {name: project_id, in: query, schema: {type: integer}, description: Filter by project ID.}
        - {name: actor_type, in: query, schema: {type: string, enum: [user, machine_identity, system]}, description: Segment human vs machine activity (ADR-023).}
        - {name: start_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound (inclusive).}
        - {name: end_time, in: query, schema: {type: string, format: date-time}, description: RFC3339 upper bound (inclusive).}
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}, description: "(page-1)*page_size + page_size must be at most 10000 (400 beyond; use cursor)."}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque next_cursor of a previous page; continues after it (page is ignored).}
        - {name: include_total, in: query, schema: {type: boolean, default: false}, description: Exact total (a full count). Without it total is exact up to 10000 and capped there.}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, event_type, actor,
            actor_type, description, timestamp, optional diff, and impersonation /
            impersonated_by / acting_as when impersonated), page, page_size,
            next_cursor (null on the last page), and total, total_exact,
            total_pages (absent on a cursor page without include_total).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/export:
    get:
      tags: [Audit]
      summary: Cursor-paginated full-fidelity audit feed for SIEM pull
      description: >-
        Return a cursor-paginated, full-fidelity audit event feed designed
        for SIEM ingestion. Gated by audit.read AND system.read (same bar as
        /audit/anomalies): this feed includes ip_address, which /audit/logs
        and /audit/search deliberately omit.
      operationId: exportAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: after_id, in: query, schema: {type: integer}, description: Cursor — pass the last returned event id to fetch the next page.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "RFC3339 lower bound on event time (resolved to the lowest id at or after it through the time index, then paged by id; exact under clock skew)."}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has events[] (each: id, event_type, timestamp,
            actor, user_id, project_id, secret_id, description, ip_address, actor_type,
            success, optional diff/impersonation/impersonated_by/acting_as), count, and
            next_cursor (the id for the next after_id, or null when caught up).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/export.csv:
    get:
      tags: [Audit]
      summary: Download audit events as CSV (compliance hand-off)
      description: >-
        Returns a bounded, human/auditor-friendly CSV attachment with a header
        row. Distinct from the JSON /audit/export SIEM feed — this is a
        single one-shot download capped at 10 000 rows, newest first, streamed
        in batches. Gated by audit.read
        AND system.read (same bar as /audit/anomalies): the export includes
        ip_address, which /audit/logs and /audit/search deliberately omit.
      operationId: exportAuditLogsCSV
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}, description: Filter by project ID.}
        - {name: user_id, in: query, schema: {type: integer}, description: Filter by acting user ID.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 lower bound on event time (inclusive).}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: RFC3339 upper bound on event time (inclusive).}
        - {name: limit, in: query, schema: {type: integer, default: 1000, maximum: 10000}, description: Maximum rows to include.}
      responses:
        '200':
          description: CSV file download (`text/csv`). Columns — id, event_type, actor, actor_type, description, ip_address, project_id, secret_id, success, timestamp.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/search:
    get:
      tags: [Audit]
      summary: Rich-filter audit search
      description: >-
        Exposes finer-grained search filters than GET /audit/logs: partial
        actor username match, exact IP address, resource type/ID, success
        flag, RFC3339 time range, and limit/offset pagination (offset+limit at
        most 10000; follow next_cursor to page deeper). Newest first (event
        time, then id). Gated by audit.read.
      operationId: searchAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: actor, in: query, schema: {type: string}, description: Partial username match on the acting principal.}
        - {name: user_id, in: query, schema: {type: integer}, description: Exact numeric user ID.}
        - {name: project_id, in: query, schema: {type: integer}, description: Exact project ID.}
        - {name: action, in: query, schema: {type: string}, description: "Exact event_type (e.g. secret.read)."}
        - {name: resource_type, in: query, schema: {type: string}, description: "Resource kind prefix (e.g. secret)."}
        - {name: resource_id, in: query, schema: {type: integer}, description: Exact secret_node_id.}
        - {name: ip, in: query, schema: {type: string}, description: Exact originating IP address.}
        - {name: success, in: query, schema: {type: string, enum: ['true', 'false']}, description: Filter by operation success/failure.}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: RFC3339 start of time range (inclusive).}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: RFC3339 end of time range (inclusive).}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}, description: Maximum results.}
        - {name: offset, in: query, schema: {type: integer, default: 0, minimum: 0}, description: "Pagination offset; offset+limit must be at most 10000 (400 beyond; use cursor)."}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque next_cursor of a previous page; continues after it (offset is ignored).}
        - {name: include_total, in: query, schema: {type: boolean, default: false}, description: Exact total (a full count). Without it total is exact up to 10000 and capped there.}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has events[] -- the same shape GET
            /audit/logs returns (each: id, event_type, actor, actor_type,
            description, timestamp, optional diff, and impersonation /
            impersonated_by / acting_as when impersonated; never ip_address or
            the tamper-evidence hash chain) -- next_cursor (null on the last
            page), and total and total_exact (absent on a cursor page without
            include_total).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/rbac-logs:
    get:
      tags: [Audit]
      summary: List the role-assignment audit trail
      description: Return paginated records of role, permission, and group assignment changes for RBAC auditing.
      operationId: listRBACAuditLogs
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 50, maximum: 100}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data has logs[] (each: id, action, actor_user_id,
            target_user_id, group_id, role_id, permission_id, project_id, details,
            created_at), plus page, page_size, total, total_pages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      logs: {type: array, items: {$ref: '#/components/schemas/RBACAuditLogEntry'}}
                      total: {type: integer}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/rbac/permission-matrix:
    get:
      tags: [Roles]
      summary: Export the deployment-wide RBAC permission matrix
      description: >-
        Return every (user, role, permission, scope) tuple in the deployment, for
        SOC2/ISO27001-style access reviews (`keyorix rbac export-matrix`). Relocated
        out of the /system proxy tier to /api/v1/rbac/permission-matrix (#G79);
        added to this spec for ADR-108 Phase 3 PR 3 -- it had no OpenAPI entry at all
        before, despite being a real, routed, roles.read-gated endpoint.
      operationId: getPermissionMatrix
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}, description: "Filter to one project (0/omit = every project, including global grants)."}
        - {name: format, in: query, schema: {type: string, enum: [csv]}, description: "When 'csv', return text/csv instead of the JSON envelope."}
      responses:
        '200':
          description: "Envelope `data` is `{rows, total}` (JSON mode) or a CSV attachment (format=csv)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rows: {type: array, nullable: true, items: {$ref: '#/components/schemas/PermissionMatrixRow'}, description: "nil (JSON null), not [], when there are no grants to report."}
                      total: {type: integer}
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/retention:
    get:
      tags: [Audit]
      summary: Report audit-trail retention coverage (ADR-029)
      description: Return audit-trail retention statistics including oldest event, coverage span, and NIS2 compliance status.
      operationId: getAuditRetention
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: retention_policy (always "unlimited"),
            total_events, oldest_event, newest_event (nullable timestamps), coverage_days,
            and meets_nis2_12_month (true once the trail spans the NIS2 12-month window).
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/verify:
    get:
      tags: [Audit]
      summary: Verify the tamper-evidence hash chain (ADR-029)
      description: >-
        Report the audit hash chain's integrity. With incremental verification (the
        checkpoint scheduler running; docs/specs/audit-incremental-verification.md) this
        is the signed persisted state (rolling full re-walk, last full verification)
        plus a bounded check of the tail since the latest signed checkpoint; status says
        what is proven. Without it, a full walk now. full=true starts a background full
        walk instead and returns 202 with a job id (without a signing key, where no job
        state can be kept, full=true returns the full-walk report with 200).
      operationId: verifyAuditChain
      security: [{bearerAuth: []}]
      parameters:
        - name: full
          in: query
          description: "true starts a background full verification (202 + job id) instead of reporting."
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: status (valid|broken|not_proven), valid (true
            only for status=valid), mode (incremental|full), chained_events,
            unchained_events, head_id, head_hash, checkpointed; when broken also
            first_broken_id and reason; when not_proven not_proven_reason; in incremental
            mode coverage {checkpoint_id, tail_from_id, tail_through_id, tail_complete},
            last_full_verification_at (null if none), last_full_verification_started_at,
            last_full_verification_through_id, last_full_verification_source
            (rolling|job|checkpoint-full), rolling_cycle {started_at, target_id,
            verified_through_id}, state_reason.
        '202':
          description: >-
            full=true. Envelope {data, message}. data: {job_id, state: running, status_url};
            Location header = status_url. A request while a job runs returns that job.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: full=true could not start a job (another replica is starting one); retry.
  /api/v1/audit/verify/jobs/{id}:
    get:
      tags: [Audit]
      summary: Status of a background full audit-chain verification
      description: >-
        The job started by GET /api/v1/audit/verify?full=true. Same authorization as
        /audit/verify. state is running|succeeded|failed|interrupted (interrupted: the
        process running it died).
      operationId: getAuditVerifyJob
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: {job_id, state, started_at, finished_at, error,
            result} where result is the full-mode /audit/verify body.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404':
          description: Unknown job id, or superseded by a newer job.
  /api/v1/audit/checkpoint:
    post:
      tags: [Audit]
      summary: Write a signed audit-chain checkpoint on demand (ADR-029)
      description: >-
        Signs a checkpoint of the current verified chain head for on-box truncation
        detection. Requires system.write (above the audit group's audit.read) and
        server-side encryption (the signing key is DEK-derived). Use to re-baseline
        immediately after a DEK rotation.
      operationId: writeAuditCheckpoint
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: {id, chained_events, head_id, head_hash,
            key_version} of the new checkpoint. With incremental verification the new
            checkpoint extends the latest signed one by a check of the rows after its
            head (no full walk); it is refused (409) while a verification failure is
            recorded.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409':
          description: The chain does not verify (broken, or a signed checkpoint proves a truncation); refused.
        '412':
          description: Signed checkpoints require encryption to be enabled.

  /api/v1/audit/migrate-chain-encoding:
    post:
      tags: [Audit]
      summary: One-time re-derivation of the audit hash chain under the current encoding (ADR-108 PR 7 addition)
      description: >-
        Re-derives entry_hash/prev_hash for every chained audit_events row under the
        server's current hash encoding, so a breaking hash-format change doesn't make
        `audit verify` report the chain broken starting at the first pre-upgrade row.
        dry_run=true (default) only previews; dry_run=false applies. Same privilege bar
        as /audit/checkpoint (system.write) -- it rewrites the tamper-evidence dataset
        itself. Added for ADR-108 PR 7 (thin CLI `audit migrate-chain-encoding`) -- was
        already a live route (auditHandler.MigrateAuditChainEncoding, router.go), just
        undocumented in this spec until now.
      operationId: migrateAuditChainEncoding
      security: [{bearerAuth: []}]
      parameters:
        - name: dry_run
          in: query
          description: "false applies the migration for real; true (default) only previews."
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: {dry_run, rows_migrated, unchained_rows_skipped,
            head_id, head_hash, anchor_row_id, anchor_new_entry_hash}.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/audit/anomalies:
    get:
      tags: [Audit]
      summary: List anomaly alerts
      description: Return secret-access anomaly alerts, optionally filtered by acknowledged state.
      operationId: listAnomalyAlerts
      security: [{bearerAuth: []}]
      parameters:
        - {name: acknowledged, in: query, schema: {type: boolean}, description: Filter by acknowledged state; omit to return all.}
        - {name: unacknowledged, in: query, schema: {type: boolean}, description: Legacy alias (CLI) — true returns only unacknowledged alerts.}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: alerts[] (each: ID, SecretNodeID, SecretName,
            AlertType (off_hours|new_ip|frequency_spike|new_user), Severity (low|medium|high),
            Description, AccessedBy, IPAddress, DetectedAt, Acknowledged, CreatedAt) and total.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/audit/anomalies/{id}/acknowledge:
    post:
      tags: [Audit]
      summary: Acknowledge an anomaly alert
      description: Mark an anomaly alert as acknowledged, indicating it has been reviewed and triaged.
      operationId: acknowledgeAnomalyAlert
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Anomaly alert ID.}
      responses:
        '200':
          description: 'Envelope {data, message}. data: {acknowledged: true}.'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/admin/anomaly-config:
    get:
      tags: [Audit]
      summary: Get the runtime anomaly-detection configuration (ADR-108 PR 7 addition)
      description: >-
        Read the DB-persisted anomaly-detection thresholds (lookback window, quarantine
        period, off-hours band, ML Isolation Forest settings). Requires system.read.
        Added for ADR-108 PR 7 (thin CLI `anomalies config get`) -- was already a live
        route (handlers.GetAnomalyConfig, router.go), just undocumented in this spec
        until now.
      operationId: getAnomalyConfig
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data.config: {lookback_days, quarantine_hours,
            off_hours_enabled, off_hours_timezone, off_hours_start, off_hours_end,
            ml_enabled, ml_threshold, ml_num_trees, ml_sample_size, updated_at, updated_by}.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [Audit]
      summary: Update the runtime anomaly-detection configuration (ADR-108 PR 7 addition)
      description: >-
        Full-row replace of the anomaly-detection configuration (no version/ETag column
        -- see internal/core/anomaly_config.go). Requires system.write. Added for
        ADR-108 PR 7 (thin CLI `anomalies config set`) -- was already a live route
        (handlers.UpdateAnomalyConfig, router.go), just undocumented in this spec until
        now.
      operationId: updateAnomalyConfig
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lookback_days: {type: integer}
                quarantine_hours: {type: integer}
                off_hours_enabled: {type: boolean}
                off_hours_timezone: {type: string}
                off_hours_start: {type: integer}
                off_hours_end: {type: integer}
                ml_enabled: {type: boolean}
                ml_threshold: {type: number}
                ml_num_trees: {type: integer}
                ml_sample_size: {type: integer}
      responses:
        '200':
          description: "Envelope {data, message}. data.config: same shape as GET."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/alert-escalation-policies:
    get:
      tags: [Audit]
      summary: List alert escalation policies (ADR-108 PR 7 addition)
      description: >-
        Requires system.write (a router design choice applying to both GETs and
        mutations in this family, not a CLI/REST mismatch). Added for ADR-108 PR 7
        (thin CLI `anomalies escalation list`) -- was already a live route
        (alertEscalationHandler.List, router.go), just undocumented in this spec
        until now.
      operationId: listAlertEscalationPolicies
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data.policies[]: {id, name, min_severity,
            escalate_after_minutes, channel_ids, enabled}.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Audit]
      summary: Create an alert escalation policy (ADR-108 PR 7 addition)
      description: >-
        Requires system.write. Added for ADR-108 PR 7 (thin CLI `anomalies escalation
        create`) -- was already a live route (alertEscalationHandler.Create,
        router.go), just undocumented in this spec until now.
      operationId: createAlertEscalationPolicy
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                min_severity: {type: string, description: "low | medium | high | critical"}
                escalate_after_minutes: {type: integer}
                channel_ids: {type: string, description: "Comma-separated NotificationChannel IDs."}
                enabled: {type: boolean}
      responses:
        '201':
          description: >-
            Envelope {data, message}. data: {id, name, min_severity,
            escalate_after_minutes, channel_ids, enabled}.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/alert-escalation-policies/{id}:
    delete:
      tags: [Audit]
      summary: Delete an alert escalation policy (ADR-108 PR 7 addition)
      description: >-
        Requires system.write. Added for ADR-108 PR 7 (thin CLI `anomalies escalation
        delete`) -- was already a live route (alertEscalationHandler.Delete,
        router.go), just undocumented in this spec until now.
      operationId: deleteAlertEscalationPolicy
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope {data=null, message='deleted'}."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/admin/jobs/run-alert-escalation:
    post:
      tags: [Audit]
      summary: Trigger the alert-escalation job immediately (ADR-108 PR 7 addition)
      description: >-
        Evaluates unacknowledged anomaly alerts against every enabled escalation
        policy and escalates the ones past their after-minutes threshold. Requires
        system.write. Added for ADR-108 PR 7 (thin CLI `anomalies escalation run`) --
        was already a live route (alertEscalationHandler.RunEscalation, router.go),
        just undocumented in this spec until now. The old CLI's remote branch called
        the doomed `/system` proxy equivalent instead
        (`/api/v1/system/admin/jobs/run-alert-escalation`) -- the thin CLI uses this
        real, permission-gated, audited human route directly.
      operationId: runAlertEscalation
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data, message}. data: {evaluated, escalated, skipped}."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/notification-channels:
    get:
      tags: [Notifications]
      summary: List notification channel destinations (ADR-108 PR 7 addition)
      description: >-
        Requires alerts.write. Added for ADR-108 PR 7 (thin CLI `notification channel
        list`) -- was already a live route (notificationChannelHandler.List,
        router.go), just undocumented in this spec until now.

        Contract v2 (#3425): the channel URL is a bearer credential, so it is NOT
        returned here. Each channels[] entry carries the destination as scheme+host
        with the path elided (e.g. `https://hooks.slack.com/…`) and `url_set`.
      operationId: listNotificationChannels
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data.channels[]: {id, name, type, enabled,
            url, url_set, email, events, created_by, created_at, updated_at}.
            Contract v2 (#3425): `url` is scheme+host with the path elided
            (`https://hooks.slack.com/…`), or "" when the channel has no URL (email);
            `url_set` (boolean) is true when a URL is stored. Before v2 `url` was the
            full URL.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Notifications]
      summary: Add a notification channel (ADR-108 PR 7 addition)
      description: >-
        Requires alerts.write. Added for ADR-108 PR 7 (thin CLI `notification channel
        add`) -- was already a live route (notificationChannelHandler.Create,
        router.go), just undocumented in this spec until now.

        Contract v2 (#3425): the create response is the ONLY response that returns
        the full channel URL (it is a bearer credential); it is never returned again.
      operationId: createNotificationChannel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: {type: string}
                type: {type: string, description: "webhook | slack | teams | email"}
                enabled: {type: boolean}
                url: {type: string}
                email: {type: string}
                events: {type: string, description: "Comma-separated event types; empty = all."}
      responses:
        '201':
          description: >-
            Envelope {data, message}. data: same fields as list's channels[] entry,
            except that `url` is the FULL URL exactly as stored (contract v2, #3425:
            the only response that ever carries it). `url_set` is true when a URL was
            given.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/notification-channels/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Notifications]
      summary: Get a notification channel by ID (ADR-108 PR 7 addition)
      description: >-
        Requires alerts.write. Added for ADR-108 PR 7 (thin CLI `notification channel
        get`, which resolves a name via list then calls this) -- was already a live
        route (notificationChannelHandler.Get, router.go), just undocumented in this
        spec until now.

        Contract v2 (#3425): `url` is scheme+host with the path elided and `url_set`
        says whether one is stored; the full URL is never returned here.
      operationId: getNotificationChannel
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data, message}. data: same shape as list's channels[] entry."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Notifications]
      summary: Update a notification channel (ADR-108 PR 7 addition)
      description: >-
        Partial update -- only fields present in the body change. Requires
        system.write. Added for ADR-108 PR 7 (thin CLI `notification channel update`)
        -- was already a live route (notificationChannelHandler.Update, router.go),
        just undocumented in this spec until now.
      operationId: updateNotificationChannel
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: {type: string}
                email: {type: string}
                events: {type: string}
                enabled: {type: boolean}
      responses:
        '200':
          description: "Envelope {data, message}. data: same shape as list's channels[] entry."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Notifications]
      summary: Delete a notification channel (ADR-108 PR 7 addition)
      description: >-
        Requires alerts.write. Added for ADR-108 PR 7 (thin CLI `notification channel
        delete`) -- was already a live route (notificationChannelHandler.Delete,
        router.go), just undocumented in this spec until now.
      operationId: deleteNotificationChannel
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data=null, message='deleted'}."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List the authenticated user's notifications
      description: Return in-app notifications for the authenticated user, optionally filtered to unread only.
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - {name: unread, in: query, schema: {type: boolean}, description: true returns only unread notifications.}
        - {name: limit, in: query, schema: {type: integer}, description: Max notifications to return (0/absent = no limit).}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: notifications[] (each: id, type, title, message,
            link, is_read, created_at, optional project_id), newest first, plus unread_count
            for the bell badge.
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the user's notifications read
      description: Mark all in-app notifications for the authenticated user as read in one operation.
      operationId: markAllNotificationsRead
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 'Envelope {data, message}. data: {all_read: true}.'
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a single notification read
      description: Mark a specific notification as read by its ID; the notification must belong to the caller.
      operationId: markNotificationRead
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Notification ID (must belong to the caller).}
      responses:
        '200':
          description: 'Envelope {data, message}. data: {id, is_read: true}.'
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/dashboard/stats:
    get:
      tags: [Dashboard]
      summary: Dashboard summary statistics
      description: >-
        The caller's own home dashboard (secret/share counts, expiring secrets).
        Requires the universal system.read baseline (every real principal holds it).
        The deployment-wide aggregate fields (activeUsers, auditEvents30d,
        auditLogins30d, auditSecretReads30d, failedAuthAttempts24h (failed password/SSO logins only), failedSecondFactors24h (refused TOTP, recovery code or passkey: mfa.failed + webauthn.failed), refusedSecretReads24h (refused secret reads: authorization denials), inactiveUsers) and
        the full recentActivity feed are additionally scoped to audit.read — a
        baseline-only caller gets zeroed aggregates and an activity feed limited to
        their own events.
      operationId: getDashboardStats
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: totalSecrets, sharedSecrets, secretsSharedWithMe,
            activeUsers, auditEvents30d, auditLogins30d, auditSecretReads30d,
            failedAuthAttempts24h (failed password/SSO logins only), failedSecondFactors24h (refused TOTP, recovery code or passkey: mfa.failed + webauthn.failed), refusedSecretReads24h (refused secret reads: authorization denials), inactiveUsers; optional trend objects
            (totalSecretsTrend/sharedSecretsTrend/sharedWithMeTrend, each {value, isPositive}),
            expiringSecrets[] (id, name, environment, expiresAt, daysLeft, expired), and
            recentActivity[] (id, type, secretName, timestamp, actor).
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/posture:
    get:
      tags: [Dashboard]
      summary: Deployment controls-posture report (ISO 27001 / SOC 2 / NIS2 / DORA)
      description: >-
        A deployment-wide, on-demand snapshot of the control posture for auditors,
        rolling up: audit-trail integrity (chain verified, chained events,
        checkpointed), access governance (projects, with-open-campaign,
        never-reviewed, projects overdue for recertification (A.5.18 cadence),
        open campaigns + pending items, dormant role grants,
        separation-of-duties violations), rotation hygiene (covered secrets,
        overdue, due-soon), identity
        (active users, with-second-factor + percent), emergency access
        (active/total break-glass activations), data classification (secret
        counts per sensitivity level + unclassified), anomalies (open /
        high-severity access-anomaly alerts), legal hold (active + reason), and
        data retention (configured per-record-type windows in days; 0 = keep
        forever — A.5.33 storage-limitation). Requires audit.read (not the universal
        system_viewer baseline).
      operationId: getCompliancePosture
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data}. data: {generated_at, audit_integrity, access_governance,
            rotation, identity, emergency_access} — see the description for each group's fields.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/compliance/controls:
    get:
      tags: [Dashboard]
      summary: Compliance control matrix (ISO 27001 / SOC 2 / NIS2 / DORA)
      description: >-
        The control matrix: each control Keyorix enforces, mapped to its clause
        references across ISO 27001 Annex A, SOC 2 Trust Services Criteria, NIS2,
        and DORA, with a live status derived from the posture (pass | gap |
        not_configured) and a human-readable detail. Includes a summary tally.
        Requires audit.read (not the universal system_viewer baseline).
      operationId: getComplianceControls
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: >-
            Envelope {data}. data: {generated_at, summary {total, pass, gap,
            not_configured}, controls[] {id, name, area, status, detail, frameworks
            {iso_27001[], soc2[], nis2[], dora[]}}}.
        '401': {$ref: '#/components/responses/Error'}
