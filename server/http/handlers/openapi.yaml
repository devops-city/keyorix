      summary: Legal-hold status (ISO 27001 A.5.34 / eDiscovery)
      description: >-
        Whether a deployment-wide litigation/investigation hold is active. While
        active, the background purge jobs are blocked from hard-deleting records.
        Requires audit.read (not the universal system_viewer baseline).
      operationId: getLegalHold
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Envelope {data}. data: {active} or {active:true, hold:{id, reason, placed_by, placed_at}}."}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Dashboard]
      summary: Place a legal hold (block all purges)
      description: "Activate a hold with a reason; refuses if one is already active. Requires system.write."
      operationId: placeLegalHold
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, description: "Why the hold is placed (recorded for audit)"}
      responses:
        '201': {description: "Envelope {data}. data: {hold}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Dashboard]
      summary: Lift the active legal hold (resume purges)
      description: >-
        Remove the active deployment-wide legal hold, allowing background purge jobs
        to resume. The handler reads a JSON body on this DELETE (unusual for REST,
        but genuinely how the wire protocol works here -- LiftLegalHold requires a
        non-empty reason, mapped to 400 when absent); this requestBody was missing
        from the spec until now (ADR-108 PR 8 addition) even though the route itself
        predates this PR.
      operationId: liftLegalHold
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, description: "Why the hold is lifted (recorded for audit)."}
      responses:
        '200': {description: "Envelope {data, message}. Legal hold lifted."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
