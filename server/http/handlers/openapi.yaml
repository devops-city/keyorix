      operationId: getMachineAuditReport
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope with `data` (the audit report).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/MachineAuditReport'}
        '403': {$ref: '#/components/responses/Error'}
  # docs/cli-split-inventory.md §7 PR 5 -- secret bulk/rotation/export/import/scan/hygiene.
  /api/v1/projects/{id}/secrets/expiring:
    get:
      tags: [Secrets]
      summary: List a project's secrets expiring (or already expired) within a window
      description: >-
        Returns the project's secrets expiring soon (or already expired), soonest-first.
        `days` defaults to 30, capped at 3650.
      operationId: listExpiringSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: days, in: query, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the expiring-secrets report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/ExpiringSecretsReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/orphaned:
    get:
      tags: [Secrets]
      summary: List a project's secrets whose owner is no longer a live user
      description: Offboarding hygiene report — secrets left without an accountable owner.
      operationId: listOrphanedSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the orphaned-secrets report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/OrphanedSecretsReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/name-conformance:
    get:
      tags: [Secrets]
      summary: List a project's secrets whose names violate the current naming policy
      description: >-
        The naming policy is enforced only at create time, so a name can fall out of
        conformance after the policy is added or tightened — this surfaces those stragglers.
      operationId: secretNameConformance
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the conformance report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretNameConformanceReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/reassign-owner:
    post:
      tags: [Secrets]
      summary: Re-home all of a departed user's secrets to a new owner
      description: >-
        Transfers every secret in the project owned by from_owner_id to to_owner_id in one
        call. Requires roles.assign at the project scope (the same blast radius as a role
        grant, not secrets.write).
      operationId: reassignSecretOwner
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_owner_id, to_owner_id]
              properties:
                from_owner_id: {type: integer}
                to_owner_id: {type: integer}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.reassigned` is the count transferred.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      reassigned: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/bulk-rotate:
    post:
      tags: [Secrets]
      summary: Trigger rotation for multiple secrets at once
      description: >-
        Rotates every matching secret in the project (or an explicit secret_ids list, or
        env/classification filters). Secrets without auto-rotate configured are reported as
        failures, not treated as aborting errors — always best-effort.
      operationId: bulkRotateSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                secret_ids: {type: array, items: {type: integer}}
                environment_id: {type: integer}
                classification: {type: string}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the bulk-rotate result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BulkRotateResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/bulk-rename:
    post:
      tags: [Secrets]
      summary: Rename secrets toward naming-policy conformance
      description: >-
        Each new name must itself satisfy the policy and not collide with a sibling; an
        entry failing a check is skipped with a reason while the rest proceed. dry_run
        validates and reports without changing anything.
      operationId: bulkRenameSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [renames]
              properties:
                renames:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: integer}
                      new_name: {type: string}
                dry_run: {type: boolean}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the bulk-rename report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BulkRenameReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/bulk-delete:
    post:
      tags: [Secrets]
      summary: Delete multiple secrets in one operation
      description: >-
        Deletes every secret in secret_ids via the normal single-secret delete path;
        partial success is allowed — failures are collected rather than aborting the batch.
      operationId: bulkDeleteSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret_ids]
              properties:
                secret_ids: {type: array, items: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the bulk-delete result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BulkDeleteResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/suspend-all:
    post:
      tags: [Secrets]
      summary: Suspend every secret in a project
      description: >-
        Incident-response "freeze the project": blocks value reads of every active secret
        in the project the caller may write. Secrets the caller has no write authority over,
        and secrets already suspended, are skipped. Requires secrets.write on the project
        (the same permission as suspending one secret).
      operationId: suspendProjectSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, description: "Optional reason recorded in the audit events."}
                clear_synced_copies:
                  type: boolean
                  description: >-
                    The same per-suspension choice as on `POST /secrets/{id}/suspend`,
                    applied to every secret this request suspends: the operator and
                    k8s-sync empty the copies synced to Kubernetes clusters for THIS
                    suspension, whatever each resource's `onSuspend` says. A secret that
                    is already suspended without the choice is upgraded in place; one that
                    already has it is left alone. Resuming (`resume-all` or per secret)
                    removes it. Needs no permission beyond suspending. One
                    `secret.bulk_suspend_attempted` audit event records the choice
                    (`clear_synced_copies=true`) and the number of secrets targeted
                    BEFORE any secret is touched; if that event cannot be recorded
                    the request fails and nothing is suspended. That refusal, and one
                    that stops the run early because a secret's own audit event was
                    refused (`details` then holds `suspended` and `failed`), answer 500
                    with error `SuspendAuditUnavailable`; suspend again without
                    `clear_synced_copies` to cut access immediately.
      responses:
        '200':
          description: Envelope `{data, message}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      suspended:
                        type: integer
                        description: Secrets suspended (or upgraded to carry the choice) by this request.
                      clear_synced_copies:
                        type: boolean
                        description: Present and true only when the request carried the choice.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '500': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/resume-all:
    post:
      tags: [Secrets]
      summary: Resume every suspended secret in a project
      description: >-
        Restores value reads of every suspended secret in the project the caller may write
        and removes any per-suspension clear_synced_copies choice. Requires secrets.write
        on the project.
      operationId: resumeProjectSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope `{data, message}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resumed: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/secrets/render:
    post:
      tags: [Secrets]
      summary: Render a template, expanding ${secret:<environment>/<name>} references
      description: >-
        Resolves every ${secret:<environment>/<name>} reference within the project under
        the caller's own read permissions. A missing or forbidden reference fails the
        render without returning partial output. A referenced secret whose state refuses the
        read fails the render the same way, with that refusal's status and code. A read refused by the secret's access schedule answers 403 with error SecretAccessOutsideSchedule; an expired, suspended or max-reads-exhausted secret answers 409 (see the SecretReadRefused response).
      operationId: renderSecretTemplate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: {type: string}
      responses:
        '200':
          description: Envelope `{data, message}`. `data.rendered` is the expanded template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rendered: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/SecretReadRefused'}

  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List secrets
      description: List secrets accessible to the caller with optional filters for project, environment, type, and classification.
      operationId: listSecrets
      security: [{bearerAuth: []}]
      parameters:
        - {name: project_id, in: query, schema: {type: integer}}
        - {name: environment_id, in: query, schema: {type: integer}}
        - {name: search, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string}}
        - {name: classification, in: query, schema: {type: string, enum: [public, internal, confidential, restricted, unclassified]}, description: "Data-classification filter (A.5.12); 'unclassified' matches secrets with no label."}
        - {name: expires_before, in: query, schema: {type: string, format: date-time}, description: "RFC3339 — return only secrets with a non-null expiration before this time (expired or expiring soon)."}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, default: 20, maximum: 100}}
        - {name: show_owned_only, in: query, schema: {type: boolean}}
        - {name: show_shared_only, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` holds the paginated list
            (`secrets` array plus pagination fields).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secrets: {type: array, items: {$ref: '#/components/schemas/SecretListEntry'}}
                      total:
                        type: integer
                        description: >-
                          Every secret the caller can read under the requested filter. A FLOOR
                          rather than a count when `truncated` is true.
                      page: {type: integer}
                      page_size: {type: integer}
                      total_pages: {type: integer}
                      truncated:
                        type: boolean
                        description: >-
                          Present and true only when assembling the caller's multi-scope union hit
                          its per-scope bound, so `total` is a floor and later pages may be
                          incomplete. A client must not present `total` as a complete count when
                          this is set. Absent on an ordinary response.
                      truncated_reason:
                        type: string
                        description: "Names the bound and the scopes it affected. Absent unless truncated."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Create a secret
      description: Create a new secret with a name, value, type, and optional metadata in the specified environment.
      operationId: createSecret
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, environment_id, type]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                value: {type: string}
                project_id: {type: integer}
                environment_id: {type: integer}
                type: {type: string}
                max_reads: {type: integer, minimum: 1, nullable: true}
                metadata: {type: object, additionalProperties: {type: string}}
                tags: {type: array, items: {type: string}}
                classification: {type: string, description: "Optional data-sensitivity label (A.5.12): public|internal|confidential|restricted."}
                description: {type: string, maxLength: 1024, description: "Optional free-text note. Metadata only -- never the value. Fixed missing from this spec (ADR-108 PR 4) -- the real handler (secrets_crud.go's CreateSecret) has accepted this field since #1808, this spec just never documented it."}
                expiration: {type: string, format: date-time, description: "Optional RFC3339 expiration. Fixed missing from this spec (ADR-108 PR 4) -- same #1808 gap as description above."}
      responses:
        '201':
          description: >-
            Envelope `{data, message}`. `data` is the created secret node
            (`id`, `name`, `project_id`, `environment_id`, `type`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Secret'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}:
    get:
      tags: [Secrets]
      summary: Get a secret
      description: >-
        Return a secret by ID; include include_value=true to retrieve the decrypted value. A read refused by the secret's access schedule answers 403 with error SecretAccessOutsideSchedule; an expired, suspended or max-reads-exhausted secret answers 409 (see the SecretReadRefused response).
      operationId: getSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - name: include_value
          in: query
          description: When `true`, response `data` becomes `{secret, value}` with the decrypted value.
          schema: {type: boolean}
        - name: include
          in: query
          description: >-
            Comma-separated (or repeated) optional fields. `total_reads` adds
            the secret's lifetime read count as `total_reads`; it is computed
            only when requested, so it is absent by default.
          schema: {type: string}
      responses:
        '200':
          description: >-
            Envelope `{data, message}`. `data` is the secret node, or
            `{secret, value}` when `include_value=true`. `total_reads` is
            present only when `include=total_reads` is sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SecretGetResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/SecretReadRefused'}
    put:
      tags: [Secrets]
      summary: Update a secret
      description: Update a secret's value, max-read limit, or expiration by ID.
      operationId: updateSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                `expiration` (RFC3339) and `clear_expiration` are mutually
                exclusive; so are `max_reads` and `clear_max_reads`.
                `max_reads: 0` is rejected (400): to remove an existing read
                limit send `clear_max_reads: true`.
              properties:
                value: {type: string}
                max_reads: {type: integer, minimum: 1, nullable: true}
                clear_max_reads: {type: boolean, description: "Remove the read limit (the secret becomes unlimited). The read counter is kept."}
                expiration: {type: string, format: date-time}
                clear_expiration: {type: boolean}
      responses:
        '200':
          description: Envelope `{data, message}`. `data` is the updated secret node.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Secret'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Secrets]
      summary: Delete a secret
      description: Permanently delete a secret and all its versions by ID.
      operationId: deleteSecret
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '204':
          description: >-
            Secret soft-deleted (no content). The Keyorix-Purge-At header says
            until when it can be restored; it is omitted only if the server could
            not read the date back after the delete.
          headers:
            Keyorix-Purge-At:
              description: UTC instant (RFC 3339) before which the purge job will not hard-delete the secret.
              schema: {type: string, format: date-time}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/acl:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Secret ID}
    get:
      tags: [Secrets]
      summary: List ACL grants for a secret
      description: >-
        Returns all per-secret ACL entries for the given secret. Requires
        `secrets.manage` at the secret's project scope.
      operationId: listSecretACLs
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope `data` is an array of SecretACL objects."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/SecretACL'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Secrets]
      summary: Grant a per-secret ACL entry
      description: >-
        Grants the specified permissions to a user on a single secret. The
        caller must hold `secrets.manage` at the secret's project scope. If
        an entry already exists for the (secret, user) pair it is replaced
        (upsert semantics).
      operationId: grantSecretACL
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, permissions]
              properties:
                user_id:
                  type: integer
                  description: ID of the user to grant access to.
                permissions:
                  type: array
                  items: {type: string}
                  description: "List of permission strings to grant, e.g. [\"secrets.read\"]."
                  minItems: 1
      responses:
        '200':
          description: "Envelope `data` is `{granted: true}`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      granted: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/secrets/{id}/acl/{aclId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}, description: Secret ID}
      - {name: aclId, in: path, required: true, schema: {type: integer}, description: ACL entry ID}
    delete:
