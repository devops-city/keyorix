        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/oidc-bindings/{bindingId}:
    delete:
      tags: [MachineIdentities]
      summary: Remove an OIDC binding from a machine identity
      description: Permanently remove a previously created OIDC federation binding.
      operationId: deleteOIDCBinding
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
        - {name: bindingId, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: Envelope with null `data` and a confirmation message.}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/machine-token-hygiene:
    get:
      tags: [MachineIdentities]
      summary: List stale or expired-but-active machine tokens across all identities (admin)
      description: >-
        Deployment-wide machine-identity credentials that should probably be revoked:
        expired-but-never-revoked, and unused-for-a-long-window (non-human token
        sprawl). Requires global audit.read. Never returns a token secret.
      operationId: machineTokenHygiene
      security: [{bearerAuth: []}]
      parameters:
        - {name: days, in: query, schema: {type: integer}, description: "Staleness window in days (default server-side: 90, cap 3650)."}
      responses:
        '200':
          description: Envelope with `data.tokens` (array of machine token hygiene rows).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens: {type: array, items: {$ref: '#/components/schemas/MachineTokenHygieneRow'}}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/machine-identities/audit:
    get:
      tags: [MachineIdentities]
      summary: Deployment-wide machine identity audit report (admin)
      description: >-
        Credential counts, last-used timestamps, staleness, and revocation status
