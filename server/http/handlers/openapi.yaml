components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token, personal access token (kx_pat_…), or machine token (kx_machine_…).
        A RESTRICTED personal access token (any scopes, project, environment or CIDR
        restriction) is refused with 403 on every write that has no permission gate
        (profile, password, MFA and passkeys, access requests, notifications,
        break-glass, PAT creation, ...), except revoking the owner's own tokens and
        sessions and the in-handler-authorized creates (ADR-042, PAT-GUARD-3; the
        table is internal/core/pat_restriction_writes.go).
  responses:
    Error:
      description: >-
        Error response, matching server/http/handlers/helpers.go's sendError verbatim.
        `code` and `message` are top-level, and `error` is a short string label (e.g.
        "NotFound"), NOT a nested object -- confirmed 2026-09-24 against a live server
        (docs/cli-split-inventory.md PR 2's live-verification step) after this schema's
        previous shape (a nested `error: {code, message, type}` object with no `code`/
        `message` at the top level) was found to have never matched any real response
        this server has ever sent -- it broke the first oapi-codegen-generated client to
        actually parse an error path (the thin CLI), which fails loudly on a schema
        mismatch rather than silently misreading a field, unlike a raw-JSON caller.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              error: {type: string, description: 'Short error-type label, e.g. "NotFound", "BadRequest".'}
              message: {type: string}
              details: {type: object, additionalProperties: true, nullable: true}
              pending_steps:
                type: array
                items: {type: string}
                description: >-
                  Values: change_password, enroll_mfa. Present on a 403 from the account-setup gate (error PasswordChangeRequired or
                  MFAEnrollmentRequired, #3024): the setup steps the caller still owes. Until they
                  are done only these are reachable -- change_password: POST
                  /api/v1/auth/change-password; enroll_mfa: POST /api/v1/auth/mfa/enroll,
                  /auth/mfa/activate, /auth/webauthn/register/begin|finish and GET
                  /auth/webauthn/credentials; always GET /api/v1/auth/profile. Owing both opens
                  both, in either order.
    SecretReadRefused:
      description: >-
        The caller may read this secret, but the secret's own state refuses the value
        read (ERRMAP-1). `error` is a stable code clients can branch on and `message`
        a fixed, client-safe sentence: SecretExpired (its expiration has passed; an
        operator can extend or clear it), SecretSuspended (resume it to allow reads),
        SecretMaxReadsExhausted (its max_reads budget is spent; an operator can raise
        it). A SecretSuspended answer whose suspension asked for the synced Kubernetes
        copies to be cleared also carries `details: {clear_synced_copies: true}`, which
        the operator and k8s-sync read. A read outside the secret's access schedule is a permission decision and
        answers 403 with error SecretAccessOutsideSchedule instead. 409, not 410: each
        state is reversible. Only a caller who may read the secret ever sees these; any
        other caller gets the same 403/404 as for a secret it cannot see. The gRPC
        GetSecretValue twin is FailedPrecondition (PermissionDenied for the schedule)
        with the same message and an ErrorInfo detail (domain keyorix.secrets, reason =
        the code).
      content:
        application/json:
          schema:
            type: object
            properties:
              success: {type: boolean}
              code: {type: integer}
              error: {$ref: '#/components/schemas/SecretReadRefusalCode'}
              message: {type: string}
              details:
                type: object
                description: Present only on SecretSuspended when the suspension asked to clear synced Kubernetes copies.
                properties:
                  clear_synced_copies: {type: boolean}
  schemas:
    # authLogin/authConsumeSetup/verifyMFALogin all return one of these two
    # shapes in `data`, disambiguated by presence of `mfa_required` -- never by
    # status code (both are 200). See server/http/handlers/auth.go's
    # buildLoginResponse and mfa.go's VerifyMFA.
    SecretReadRefusalCode:
      type: string
      description: Stable code of a 409 secret-state read refusal (see the SecretReadRefused response).
      enum: [SecretExpired, SecretSuspended, SecretMaxReadsExhausted]
    LoginSuccessData:
      type: object
      required: [token]
      properties:
        token: {type: string, description: Session bearer token}
        expires_at: {type: string, format: date-time}
        absolute_expires_at: {type: string, format: date-time, description: Hard ceiling past which refresh is refused}
        user_id: {type: integer}
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        role: {type: string}
        roles: {type: array, items: {type: string}}
        permissions: {type: array, items: {type: string}}
        password_change_required: {type: boolean}
        account_state: {type: string}
        pending_steps:
          type: array
          items: {type: string, enum: [change_password, enroll_mfa]}
          description: >-
            Account-setup steps this session still owes (omitted when none). While present the session is
            confined to those steps' endpoints (account-setup gate, #3024), so a client should route
            straight to the setup page rather than render protected pages. Informational: it changes
            nothing about what the session may access.
        mfa_grace: {$ref: '#/components/schemas/MFAGrace'}
    MFAGrace:
      type: object
      required: [ends_at, days_left]
      description: >-
        ADR-112's security.require_mfa upgrade grace period (#2923), present only while it runs and the
        account has no second factor. MFA is not enforced until ends_at, or until the first administrator
        enrols a second factor if that comes first; after that this account is sent to MFA enrolment when
        it signs in (not locked out). Clients show it as a persistent banner.
      properties:
        ends_at: {type: string, format: date-time, description: The 30-day hard stop (RFC 3339).}
        days_left: {type: integer, description: 'Whole days left until ends_at, rounded up (1 on the last day).'}
    MFAChallengeData:
      type: object
      description: >-
        The password (or setup token) was correct, but a second factor is
        required -- core.ErrMFARequired. The client must complete
        POST /auth/mfa/verify (TOTP/recovery code) with this challenge, or the
        WebAuthn login ceremony, to get a real session.
      required: [mfa_required, mfa_challenge, totp_available, webauthn_available]
      properties:
        mfa_required: {type: boolean, enum: [true]}
        mfa_challenge: {type: string, description: Single-use challenge token to pass to /auth/mfa/verify}
        totp_available: {type: boolean, description: Whether this account can complete the challenge with a TOTP/recovery code}
        webauthn_available: {type: boolean, description: Whether this account can complete the challenge via a WebAuthn passkey}
    # docs/cli-split-inventory.md §7 PR 9 -- share.
    # models.ShareRecord carries no `json:` tags, so it serializes with bare
    # (capitalized) Go field names -- see the identical note on PR 3/4/5's schemas
    # for this same pattern on other untagged storage models.
    Share:
      type: object
      description: >-
        A secret-share grant (internal/storage/models.ShareRecord), via the
        handler-level shareRecordWire type (server/http/handlers/shares_wire.go)
        -- fixed from the previous bare-Go-field-name leak as part of the
        API-hygiene casing campaign.
