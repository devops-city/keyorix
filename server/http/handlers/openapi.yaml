    SecretVersionDiffChange:
      type: object
      properties:
        field: {type: string}
        old_value: {type: string}
        new_value: {type: string}
    SecretVersionDiffResult:
      type: object
      properties:
        secret_name: {type: string}
        from_version: {type: integer}
        to_version: {type: integer}
        changes:
          type: array
          items: {$ref: '#/components/schemas/SecretVersionDiffChange'}
          nullable: true
          description: >-
            Null (not an empty array) when nothing tracked (classification,
            expiry, read count) differs between the two versions -- values
            themselves are never compared or included here.
        acl_user_ids:
          type: array
          items: {type: integer}
          nullable: true
          description: >-
            Current ACL snapshot. Null (not an empty array) when the secret has
            no ACL grants -- the underlying nil Go slice marshals as null -- or
            when the caller lacks secrets.manage and the handler strips it
            entirely (see degraded below).
        degraded:
          type: boolean
          description: >-
            True when the server's ACL lookup itself failed (#G54) --
            acl_user_ids is then an unreliable, possibly-empty placeholder,
            NOT an authoritative "no ACL grants" answer.
    SecretVersionComment:
      type: object
      properties:
        id: {type: integer}
        comment: {type: string}
        username: {type: string}
        created_at: {type: string, format: date-time}
    SecretDependencyEdge:
      type: object
      properties:
        id: {type: integer}
        secret_id: {type: integer}
        secret_name: {type: string}
        note: {type: string}
    SecretDependencies:
      type: object
      properties:
        secret_id: {type: integer}
        depends_on: {type: array, items: {$ref: '#/components/schemas/SecretDependencyEdge'}}
        dependents: {type: array, items: {$ref: '#/components/schemas/SecretDependencyEdge'}}
    SecretImpactedSecret:
      type: object
      properties:
        secret_id: {type: integer}
        secret_name: {type: string}
        depth: {type: integer, description: "Hops from the rotated secret in the dependency graph."}
    SecretImpact:
      type: object
      description: The blast radius of rotating a secret -- every transitively-dependent secret.
      properties:
        secret_id: {type: integer}
        secret_name: {type: string}
        affected: {type: array, items: {$ref: '#/components/schemas/SecretImpactedSecret'}}
    SecretAccessor:
      type: object
      description: One entry in a secret's effective access list.
      properties:
        user_id: {type: integer}
        username: {type: string}
        permission: {type: string, description: "Effective level: read, write or owner."}
        source: {type: string, description: "The grant that gives `permission`: owner, role, acl, direct_share or group_share:<group>."}
        grants:
          type: array
          description: "Every grant the user holds on the secret as source:level, e.g. owner:owner, role:read, direct_share:write."
          items: {type: string}
    SecretAccessLogEntry:
      type: object
      description: >-
        One read event from a secret's access log (server/http/handlers/secrets_access_history.go's
        secretAccessLogEntry -- a snake_case DTO, not the raw internal/storage/models.SecretAccessLog).
        ip_address/user_agent are present only when the caller separately holds audit.read
        (see the route's own description); an ordinary secrets.read-only caller never
        sees another user's originating IP.
      properties:
        id: {type: integer}
        secret_version_id: {type: integer}
        accessed_by: {type: string}
        action: {type: string}
        access_time: {type: string, format: date-time}
        ip_address: {type: string, description: "Only present for a caller who separately holds audit.read."}
        user_agent: {type: string, description: "Only present for a caller who separately holds audit.read."}
    SecretAccessSchedule:
      type: object
      description: A secret's temporal access-window policy (internal/storage/models.SecretAccessSchedule -- properly snake_case-tagged, unlike SecretNode).
      properties:
        id: {type: integer}
        secret_node_id: {type: integer}
        allowed_days: {type: string, description: "Comma-separated ISO weekday list (1=Mon..7=Sun), or \"*\"."}
        start_hour: {type: integer}
        end_hour: {type: integer}
        timezone: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SecretTemplate:
      type: object
      description: A reusable secret-creation metadata preset (internal/storage/models.SecretTemplate -- properly snake_case-tagged).
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        default_classification: {type: string}
        default_tags: {type: string, description: "Comma-separated tag names."}
        description_pattern: {type: string}
        rotation_hint_days: {type: integer}
        created_by: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DeletedSecretEntry:
      type: object
      description: One row of a project's recycle bin (GET /projects/{id}/secrets/deleted) -- a snake_case DTO, not the raw Secret model.
      properties:
        id: {type: integer}
        name: {type: string}
        type: {type: string}
        classification: {type: string}
        deleted_at: {type: string}
        purge_at:
          type: string
          format: date-time
          description: >-
            UTC instant (RFC 3339) before which the purge job will not hard-delete
            this secret -- the restore deadline. Frozen when the secret was deleted
            (deleted_at plus the secret's own retention override, else the
            soft_delete.retention_days in force then), so a later change to the
            configured window does not move it. For a secret deleted before this
            field existed it is computed from the current configuration.
    Group:
      type: object
      description: A group (server/http/handlers/groups_handler.go's groupToAPIResponse).
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
    UserSummary:
      type: object
      description: >-
        A user as returned in list/membership contexts (userToAPIResponse,
        server/http/handlers/users_handler.go). project_count/active_project_count
        are attached only by GET /api/v1/users (listUsers), not by
        GET /api/v1/groups/{id}/members.
      properties:
        id: {type: integer}
        username: {type: string}
        email: {type: string}
        display_name: {type: string}
        active: {type: boolean}
        account_state: {type: string}
        external_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_login_at: {type: string, format: date-time, nullable: true}
        deleted_at: {type: string, format: date-time, nullable: true}
        project_count: {type: integer}
        active_project_count: {type: integer}
    GroupRoleGrant:
      type: object
      description: One role a group holds, with its time-bound expiry if any (internal/core/storage.GroupRoleGrant).
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        expires_at: {type: string, format: date-time, description: "Omitted (never null) for a permanent grant."}
    RoleRef:
      type: object
      description: A minimal role reference (id, name only) -- GET /api/v1/users/{id}/roles's shape.
      properties:
        id: {type: integer}
        name: {type: string}
    Role:
      type: object
      description: >-
        A role (internal/storage/models.Role), via the handler-level roleWire
        type (server/http/handlers/rbac_wire.go) -- fixed from the previous
        bare-Go-field-name leak as part of the API-hygiene casing campaign.
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        bypasses_permission_checks: {type: boolean}
    Permission:
      type: object
      description: >-
        A permission (internal/storage/models.Permission), via the
        handler-level permissionWire type (server/http/handlers/rbac_wire.go)
        -- fixed from the previous bare-Go-field-name leak as part of the
        API-hygiene casing campaign.
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        resource: {type: string}
        action: {type: string}
    RoleWithPermissions:
      type: object
      description: >-
        A role with its assigned permissions (internal/core.RoleWithPermissions,
        embeds models.Role), via the handler-level roleWithPermissionsWire type
        (server/http/handlers/rbac_wire.go) -- fixed from the previous
        bare-Go-field-name leak (the embedded Role's fields promoted under
        their own untagged names) as part of the API-hygiene casing campaign.
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        bypasses_permission_checks: {type: boolean}
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    UserRoleAssignment:
      type: object
      description: >-
        A user's identity plus their assigned roles (internal/core.UserRoleAssignment),
        via the handler-level userRoleAssignmentWire type
        (server/http/handlers/rbac_wire.go) -- fixed from the previous
        bare-Go-field-name leak on the nested Roles field (its own
        UserID/Username/Email were already correctly tagged) as part of the
        API-hygiene casing campaign.
      properties:
        user_id: {type: integer}
        username: {type: string}
        email: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
    Project:
      type: object
      description: >-
        A project. Handler-level snake_case wire type
        (server/http/handlers/catalog_wire.go's projectWire) --
        internal/storage/models.Project itself carries no `json:` tags and is
        never serialized directly.
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        require_mfa: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    Environment:
      type: object
      description: >-
        A project environment. Handler-level snake_case wire type
        (server/http/handlers/catalog_wire.go's environmentWire) --
        internal/storage/models.Environment itself carries no `json:` tags and
        is never serialized directly.
      properties:
        id: {type: integer}
        project_id: {type: integer}
        name: {type: string}
        secret_count:
          type: integer
          format: int64
          description: >-
            Live secrets in the environment (folders and soft-deleted secrets
            excluded). Computed by the server in one grouped query on the list
            routes (GET /environments, GET /projects/{id}/environments); 0 on a
            freshly created environment.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    EnvCloneResult:
      type: object
      description: >-
        The result of cloning one environment's secrets into another
        (internal/core.EnvCloneResult). Handler-level snake_case wire type
        (server/http/handlers/catalog_wire.go's envCloneResultWire) --
        internal/core.EnvCloneResult itself carries no `json:` tags and is
        never serialized directly.
      properties:
        source_env: {type: string}
        dest_env: {type: string}
        secrets_cloned: {type: integer}
        secrets_skipped: {type: integer}
        errors: {type: array, items: {type: string}}
    ProjectInvitation:
      type: object
      description: >-
        A project invitation (ADR-024, internal/storage/models.ProjectInvitation).
        No `json:` tags on the model -- wire keys are the bare Go field names
        (ID, ProjectID, Email, ...), not snake_case. As with Environment above,
        the multi-word field names here do not case-insensitively match a
        snake_case tag, so a generated client must use these exact property
        names.
      properties:
        ID: {type: integer}
        ProjectID: {type: integer}
        Email: {type: string}
        Role: {type: string}
        State: {type: string, enum: [pending, accepted, revoked, expired]}
        InvitedBy: {type: integer}
        InvitedByMachineIdentityID: {type: integer}
        SystemRole: {type: string}
        ExpiresAt: {type: string, format: date-time, nullable: true}
        CreatedAt: {type: string, format: date-time}
        AcceptedAt: {type: string, format: date-time, nullable: true}
        RevokedAt: {type: string, format: date-time, nullable: true}
    ProvisionSetupResult:
      type: object
      description: Outcome of provisioning and delivering a setup/accept link (ADR-028, internal/core.ProvisionSetupResult).
      properties:
        email: {type: string}
        channel: {type: string, enum: [smtp, out_of_band, log]}
        delivered: {type: boolean}
        link_for_admin: {type: string, description: "Set only in out-of-band mode."}
    RBACAuditLogEntry:
      type: object
      description: One RBAC audit trail entry (GET /api/v1/audit/rbac-logs).
      properties:
        id: {type: integer}
        action: {type: string}
        actor_user_id: {type: integer, nullable: true}
        target_user_id: {type: integer, nullable: true}
        group_id: {type: integer, nullable: true}
        role_id: {type: integer, nullable: true}
        permission_id: {type: integer, nullable: true}
        project_id: {type: integer, nullable: true}
        environment_id: {type: integer, nullable: true}
        details: {type: string}
        created_at: {type: string, format: date-time}
    PermissionMatrixRow:
      type: object
      description: >-
        One (user, role, permission, scope) tuple (internal/core.PermissionMatrixRow),
        GET /api/v1/rbac/permission-matrix.
      properties:
        user_id: {type: integer}
        username: {type: string}
        email: {type: string}
        role_id: {type: integer}
        role_name: {type: string}
        permission_name: {type: string}
        resource: {type: string}
        action: {type: string}
        scope: {type: string, enum: [global, project, environment]}
        project_id: {type: integer}
        project_name: {type: string}
        environment_id: {type: integer}
        environment_name: {type: string}
        expires_at: {type: string, format: date-time, nullable: true}
    BreakGlassActivation:
      type: object
      description: One emergency-access self-grant (ADR-108 PR 1 addition).
      properties:
        id: {type: integer, format: uint32}
        user_id: {type: integer, format: uint32}
        role_name: {type: string}
        justification: {type: string}
        state: {type: string, enum: [active, expired, revoked]}
        # Deliberately plain `string`, not `format: date-time`: the CLI passes
        # these straight through to the terminal, and a date-time format would
        # make oapi-codegen generate a time.Time field whose default String()
        # rendering would not byte-match the server's original RFC3339 text.
        expires_at: {type: string}
        created_at: {type: string}
    BreakGlassSettings:
      type: object
      description: >-
        The server's effective break-glass limits, returned with the activations list
        to a caller it allowed. Deployment limits only: no secret, no admin-only data.
      properties:
        enabled: {type: boolean, description: "break_glass.enabled; false means activation is refused with BreakGlassDisabled"}
        emergency_role: {type: string, description: "Name of the role an activation grants"}
        default_ttl_seconds: {type: integer, format: int64, description: "Lifetime granted when none is requested (already capped at max_ttl_seconds)"}
        max_ttl_seconds: {type: integer, format: int64, description: "Ceiling a requested lifetime is capped at"}
    RotationPolicy:
      type: object
      description: >-
        A secret-rotation policy (ADR-108 PR 1 addition). Snake_case, matching this
        spec's usual convention and the model's real wire format: models.RotationPolicy
        (internal/storage/models/models.go) previously had no `json:` tags on most
        fields, so encoding/json's default marshaling emitted the bare Go field names
        verbatim (ID, Name, ProjectID, IntervalDays, ...) instead -- a PascalCase wire
        format silently decoded by any snake_case-tagged consumer (Go's
        case-insensitive JSON fallback matches "ID"~"id" but not
        "ProjectID"~"project_id", an extra underscore is not a case difference) as the
        zero value for every multi-word field. Fixed at the source (the model itself
        now carries these exact tags) rather than documented here as a PascalCase
        exception -- see the model's own doc comment for the full writeup, and
        docs/cli-split-inventory.md §7 PR 1's closure note for how this was found.
      properties:
        id: {type: integer, format: uint32}
        name: {type: string}
        description: {type: string}
        scope: {type: string, enum: [project, environment]}
        project_id: {type: integer, format: uint32, nullable: true}
        environment_id: {type: integer, format: uint32, nullable: true}
        interval_days: {type: integer}
        alert_days_before: {type: integer}
        notify_on_breach: {type: boolean}
        is_active: {type: boolean}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RotationPolicyEvaluation:
      type: object
      description: >-
        One policy-covered secret's rotation posture, as returned by
        GET /api/v1/rotation-policies/evaluate (ADR-108 PR 1 addition).
      properties:
        policy_id: {type: integer, format: uint32}
        policy_name: {type: string}
        secret_id: {type: integer, format: uint32}
        secret_name: {type: string}
        project_id: {type: integer, format: uint32}
        last_rotated_at: {type: string, format: date-time, nullable: true}
        days_overdue: {type: integer}
        is_overdue: {type: boolean}
        is_approaching: {type: boolean}
    DynamicSecretConfig:
      type: object
      description: A registered dynamic-secret target config (ADR-108 PR 1 addition).
      properties:
        id: {type: integer, format: uint32}
        name: {type: string}
        project_id: {type: integer, format: uint32}
        environment_id: {type: integer, format: uint32}
        backend_type: {type: string, enum: [postgres, mysql, mongodb, redis, aws-sts, gcp, azure, kubernetes]}
        default_ttl_seconds: {type: integer}
        max_ttl_seconds: {type: integer}
        classification: {type: string}
    DynamicSecretIssuedLease:
      type: object
      description: >-
        A freshly-issued dynamic-secret credential, shown once (ADR-108 PR 1 addition).
        username/password are populated for DB/cache backends; fields carries
        arbitrary key/value pairs for cloud-IAM backends (AWS STS, GCP, Azure,
        Kubernetes) instead.
      properties:
        lease_id: {type: string}
        username: {type: string}
        password: {type: string}
        fields:
          type: object
          additionalProperties: {type: string}
        expires_at: {type: string}
    DynamicSecretLease:
      type: object
      description: A dynamic-secret lease summary (ADR-108 PR 1 addition).
      properties:
        lease_id: {type: string}
        role_name: {type: string}
        status: {type: string, enum: [active, revoked, expired, revoke_failed]}
        issued_at: {type: string}
        expires_at: {type: string}
    RotationPlanSecret:
      type: object
      description: One secret entry in a rotation-plan wave (ADR-108 PR 1 addition, ADR-053).
      properties:
        secret_id: {type: integer, format: uint32}
        secret_name: {type: string}
        status: {type: string, enum: [overdue, due_soon]}
        days_overdue: {type: integer}
        risk_band: {type: string}
        auto_rotate: {type: boolean}
        reasons:
          type: array
          items: {type: string}
    RotationPlanWave:
      type: object
      description: A dependency-safe batch of secrets to rotate together (ADR-053).
      properties:
        index: {type: integer}
        secrets:
          type: array
          items: {$ref: '#/components/schemas/RotationPlanSecret'}
    RotationPlan:
      type: object
      description: A project's automated rotation plan (ADR-108 PR 1 addition, ADR-053).
      properties:
        project_id: {type: integer, format: uint32}
        total_secrets: {type: integer}
        overdue_count: {type: integer}
        due_soon_count: {type: integer}
        waves:
          type: array
          items: {$ref: '#/components/schemas/RotationPlanWave'}
    DeploymentRotationPlan:
      type: object
      description: >-
        The install-wide roll-up of every project's rotation plan (ADR-108 PR 1
        addition, ADR-053) -- a roll-up of per-project plans, most pressing first.
      properties:
        projects_scanned: {type: integer}
        projects_with_work: {type: integer}
        total_secrets: {type: integer}
        overdue_count: {type: integer}
        due_soon_count: {type: integer}
        projects:
          type: array
          items: {$ref: '#/components/schemas/RotationPlan'}
    RotationOrderStep:
      type: object
      description: One secret in a project's safe rotation sequence (ADR-052).
      properties:
        secret_id: {type: integer, format: uint32}
        secret_name: {type: string}
    RotationOrder:
      type: object
      description: >-
        A safe rotation sequence for a project's secret dependency graph
        (ADR-108 PR 1 addition, ADR-052): each secret is listed before anything
        that depends on it.
      properties:
        project_id: {type: integer, format: uint32}
        order:
          type: array
          items: {$ref: '#/components/schemas/RotationOrderStep'}
