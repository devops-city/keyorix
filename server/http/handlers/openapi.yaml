openapi: 3.0.3
info:
  title: Keyorix API
  version: 1.0.0
  description: |
    Keyorix is a self-hostable secrets manager with scoped RBAC, audit logging,
    rotation, sharing, and machine-identity authentication.

    ## Authentication
    Most endpoints require a Bearer token: `Authorization: Bearer <token>`.
    Three credential types are accepted, all via the same header:
      - **Session tokens** — issued by `POST /auth/login` (and `/auth/refresh`).
      - **Personal access tokens** (`kx_pat_…`) — created at `POST /api/v1/auth/tokens`.
      - **Machine tokens** (`kx_machine_…`, ADR-030) — issued per machine identity.
    Public endpoints (login, refresh, logout, password-reset, system init, the
    setup-token flow, health, and Prometheus metrics) need no token.

    ## Response envelope
    Unless noted, success responses wrap the payload as
    `{ "success": true, "data": <…>, "message": "<…>" }`.
    Errors use `{ "error": { "code": <int>, "message": <string>, "type": <string> } }`.

    ## Authorization
    Operations are gated by scoped RBAC permissions (e.g. `secrets.read`,
    `roles.assign`) at a project/environment scope. A 403 indicates the caller's
    roles do not grant the permission at the target scope.
servers:
  - url: /
    description: Same-origin (paths are absolute from the host root)
  - url: http://localhost:8080
    description: Local development
tags:
  - {name: Auth, description: Authentication & self-service account management}
  - {name: System, description: "Health, info, and metrics"}
  - {name: Projects, description: Projects and cross-environment drift}
  - {name: Environments, description: Project environments}
  - {name: Members, description: Project membership (role grants)}
  - {name: Memberships, description: Membership onboarding lifecycle (ADR-022)}
  - {name: Invitations, description: Invitations (ADR-024)}
  - {name: AccessRequests, description: Self-service access requests (ADR-024)}
  - {name: MachineIdentities, description: "Machine identities, tokens & RBAC (ADR-023/030)"}
  - {name: Secrets, description: "Secret lifecycle, versions, usage, risk"}
  - {name: Shares, description: Secret sharing}
  - {name: RotationPolicies, description: Rotation policies & status}
  - {name: DynamicSecrets, description: On-demand database/cloud credentials (ADR-035)}
  - {name: Users, description: User management & impersonation}
  - {name: Groups, description: Groups}
  - {name: Roles, description: Roles & permissions}
  - {name: Permissions, description: Permission catalog}
  - {name: UserRoles, description: Direct user-role assignment}
  - {name: Audit, description: "Audit logs, export, retention, tamper-evidence, anomalies"}
  - {name: Notifications, description: In-app notifications}
  - {name: Dashboard, description: Dashboard stats & activity}
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with username and password
      description: Authenticate with username and password and return a session bearer token.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: >-
            Login successful, OR the password was correct but a second factor is
            required (core.ErrMFARequired) -- the two shapes are disambiguated by
            `data.mfa_required`, never by status code (both are 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/LoginSuccessData'
                      - $ref: '#/components/schemas/MFAChallengeData'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalidate the supplied bearer token
      description: Invalidate the current session token, logging the user out immediately.
      operationId: authLogout
      responses:
        '200': {description: Logged out}
        '400': {$ref: '#/components/responses/Error'}
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Issue a new session token and invalidate the old one
      description: Exchange the current session token for a fresh one, invalidating the previous token.
      operationId: authRefresh
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      token: {type: string}
                      expires_at: {type: string, format: date-time}
                      absolute_expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Error'}
  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Request a password reset (enumeration-safe; always 200)
      description: Send a password-reset email to the given address; always returns 200 to prevent email enumeration.
      operationId: authPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: {email: {type: string, format: email}}
      responses:
        '200': {description: Always succeeds to prevent email enumeration}
  /system/init:
    post:
      tags: [System]
      summary: Bootstrap the server (admin user + default project/environments)
      description: Initialize the server with the first admin user, default project, and default environments; idempotent.
      operationId: systemInit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password}
                display_name: {type: string}
                bootstrap_token: {type: string, description: 'Prefer the X-Keyorix-Bootstrap-Token header; this field is the fallback for clients that cannot set headers.'}
      responses:
        '200':
          description: System initialised (idempotent; already_initialized=true if previously bootstrapped)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      already_initialized: {type: boolean}
                      environments: {type: array, items: {type: string}}
                      project: {type: string}
                      user:
                        type: object
                        properties:
                          id: {type: integer}
                          username: {type: string}
                          email: {type: string}
        '400': {$ref: '#/components/responses/Error'}
  /auth/setup/{token}:
    get:
      tags: [Auth]
      summary: Describe a single-use setup token without consuming it
      description: Return non-sensitive metadata about a setup token (purpose, email) without consuming it.
      operationId: authGetSetupToken
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Non-sensitive description of the setup token
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      purpose: {type: string}
                      email: {type: string}
                      display_name: {type: string}
        '410': {description: The setup link is no longer valid (unknown/expired/used)}
  /auth/setup/consume:
    post:
      tags: [Auth]
      summary: Consume a setup token, set the password, and log in
      description: Consume a one-time setup token to set the account password and return a session token.
      operationId: authConsumeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: >-
            Account setup complete, payload identical to /auth/login -- including
            the same mfa_required branch when the account already has MFA enrolled
            (core.ErrMFARequired short-circuits the normal session mint here too).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/LoginSuccessData'
                      - $ref: '#/components/schemas/MFAChallengeData'
        '400': {$ref: '#/components/responses/Error'}
  /auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Complete MFA login with the challenge from /auth/login
      description: >-
        Unauthenticated: the bearer of trust is the single-use mfa_challenge
        issued by /auth/login (or /auth/setup/consume), not a session. Verifies a
        TOTP or recovery code and, on success, mints a real session -- same
        payload shape as a normal login.
      operationId: verifyMFALogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_challenge, code]
              properties:
                mfa_challenge: {type: string, description: The challenge token from /auth/login's mfa_required response}
                code: {type: string, description: 'A current TOTP code, or an unused recovery code'}
      responses:
        '200':
          description: MFA verified, session minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/LoginSuccessData'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /health:
    get:
      tags: [System]
      summary: Liveness/health check (not wrapped in the data/message envelope)
      description: Return server health status including version and subsystem check results.
      operationId: healthCheck
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: healthy}
                  timestamp: {type: string, format: date-time}
                  version: {type: string}
                  checks: {type: object}
                  auth_rate_limit:
                    type: string
                    enum: [ok, degraded]
                    description: >-
                      degraded while any auth rate limit (login, password reset, SSO begin,
                      per-account lockout) is enforcing from its in-memory fallback because its
                      database storage failed within the last limit window. Names no budget, key
                      or address; liveness (status, HTTP 200) is unaffected.
  /api/v1/version:
    get:
      tags: [System]
      summary: Version-skew check (unauthenticated)
      description: >-
        Return the server's REST API version and the minimum CLI version it accepts (ADR-108
        PR 0). Unauthenticated, unlike /api/v1/system/info -- a thin CLI must be able to check
        compatibility before it has credentials. Deliberately narrow: never returns the build
        version or commit (see /health's own description for the same disclosure rationale).
      operationId: getVersion
      responses:
        '200':
          description: Version-skew info
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version: {type: integer, example: 1}
                  minimum_cli_version: {type: string, example: '1.0.0'}
  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics exposition
      description: Expose runtime metrics in Prometheus text exposition format for scraping.
      operationId: prometheusMetrics
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain: {schema: {type: string}}
  /api/v1/auth/profile:
    get:
      tags: [Auth]
      summary: Get the current user's profile
      description: Return the authenticated user's profile including roles, permissions, and last login.
      operationId: getAuthProfile
      security: [{bearerAuth: []}]
      responses:
        '200': {description: "Self profile (id, username, email, display_name, role, roles, permissions, last_login_at; pending_steps = the account-setup steps this session still owes, omitted when none; mfa_grace = MFAGrace, present while ADR-112's require_mfa upgrade grace period runs and this interactive session's account has no second factor)"}
        '401': {$ref: '#/components/responses/Error'}
    put:
      tags: [Auth]
      summary: Update own display name and email
      description: Update the authenticated user's own display name and email address.
      operationId: updateAuthProfile
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: {type: string}
                email: {type: string, format: email}
      responses:
        '200': {description: Profile updated}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password (drops other sessions)
      description: >-
        Change the authenticated user's password; invalidates all other active sessions.
        In a setup-only session (an account that had to both replace a one-time password and
        enrol a second factor under security.require_mfa, #3024), the step that finishes setup
        also ends the calling session: data.reauthentication_required is then true and the
        next login is a normal two-step MFA login.
      operationId: changePassword
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password}
                new_password: {type: string, format: password}
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    properties:
                      reauthentication_required:
                        type: boolean
                        description: True when this change finished account setup and the calling session was ended (#3024).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: List the caller's active sessions
      description: Return all active sessions for the authenticated user, with the current session flagged.
      operationId: listSessions
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Active sessions; the request own session is flagged current'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's sessions
      description: Revoke a specific active session by ID, immediately invalidating its token.
      operationId: revokeSession
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '204': {description: Session revoked}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/auth/tokens:
    get:
      tags: [Auth]
      summary: List the caller's personal access tokens
      description: Return all personal access tokens belonging to the authenticated user (secret never returned).
      operationId: listPATs
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope with `data` (array of personal access tokens; secret never returned).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PATToken'}}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Auth]
      summary: Create a personal access token (raw token returned once)
      description: Create a personal access token with optional scopes and expiry; the raw token is returned only once. A request authenticated by a restricted personal access token (any scopes, project, environment or CIDR restriction) is refused with 403, since the new token would not carry that restriction.
      operationId: createPAT
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                expires_at: {type: string, format: date-time, nullable: true, description: 'RFC3339; omit/null for non-expiring'}
                scopes: {type: array, items: {type: string}, description: 'ADR-042 least-privilege allowlist (e.g. ["secrets.read"], supports "*" and "secrets.*"). Omit/empty = inherit the owner''s full permissions. Only ever narrows below the owner.'}
                project_scope: {type: integer, description: 'ADR-042: confine the token to a single project id; 0/omit = any project the owner can reach.'}
                environment_scope: {type: integer, description: 'ADR-042: confine the token to a single environment id; 0/omit = any environment. Env ids are globally unique, so this also pins the project.'}
                allowed_cidrs: {type: array, items: {type: string}, description: 'Restrict the token to source IPs in these CIDRs. Omit/empty = no network restriction.'}
      responses:
        '201':
          description: Envelope with `data` (`token`, the plaintext secret shown once, and `pat`, its metadata).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: {type: string, description: 'Plaintext token, shown only in this response'}
                      pat: {$ref: '#/components/schemas/PATToken'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/tokens/expired:
    get:
      tags: [Auth]
      summary: List the caller's own expired (non-revoked) personal access tokens
      description: Self-service; lists expired PATs belonging to the authenticated user so they can be reviewed before cleanup.
      operationId: listExpiredPATs
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope with `data` (array of personal access tokens).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/PATToken'}}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Auth]
      summary: Bulk-revoke all of the caller's expired personal access tokens
      description: Self-service; revokes every expired (non-revoked) PAT belonging to the authenticated user in one call.
      operationId: bulkRevokeExpiredPATs
      security: [{bearerAuth: []}]
      responses:
        '204': {description: All expired tokens revoked.}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/pat-hygiene:
    get:
      tags: [Auth]
      summary: List stale or expired-but-active personal access tokens across all users (admin)
      description: >-
        Deployment-wide personal access tokens that should probably be revoked: expired-but-never-revoked,
        and unused-for-a-long-window (token sprawl). Requires global audit.read. Never returns a token secret.
      operationId: patHygiene
      security: [{bearerAuth: []}]
      parameters:
        - {name: days, in: query, schema: {type: integer}, description: "Staleness window in days (default server-side: 90, cap 3650)."}
      responses:
        '200':
          description: Envelope with `data.tokens` (array of PAT hygiene rows).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens: {type: array, items: {$ref: '#/components/schemas/PATHygieneRow'}}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's personal access tokens
      description: Permanently revoke a personal access token by ID, preventing further use.
      operationId: revokePAT
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        '204': {description: Token revoked}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/enroll:
    post:
      tags: [Auth]
      summary: Begin TOTP MFA enrolment
      description: >-
        Generate a pending TOTP secret for the authenticated caller and return the
        otpauth:// URI (for a QR code) and the base32 secret. Blocked under
        impersonation. Must be followed by activate to actually enable MFA.
      operationId: enrollMFA
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Pending enrolment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    required: [otpauth_uri, secret]
                    properties:
                      otpauth_uri: {type: string}
                      secret: {type: string, description: Base32 TOTP secret}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/activate:
    post:
      tags: [Auth]
      summary: Confirm MFA enrolment and enable it
      description: >-
        Confirm the pending enrolment with a current TOTP code AND the account
        password (re-proof that this is the account holder, not just whoever
        generated the pending secret via enroll -- #372). Returns the one-time
        recovery codes. Blocked under impersonation.
      operationId: activateMFA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: {type: string, description: Current TOTP code from the pending secret}
                password: {type: string, format: password}
      responses:
        '200':
          description: MFA enabled; one-time recovery codes issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes: {type: array, items: {type: string}}
                      reauthentication_required:
                        type: boolean
                        description: >-
                          True when this activation finished account setup in a setup-only session
                          and that session was ended (#3024); otherwise the calling session stays
                          signed in.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA
      description: >-
        Turn off MFA after verifying a current TOTP code OR the account password,
        then clear the secret and all recovery codes. Blocked under impersonation.
      operationId: disableMFA
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one re-proof is required; the handler checks code first, falling back to password.
              properties:
                code: {type: string, description: Current TOTP code or a recovery code}
                password: {type: string, format: password}
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    required: [mfa_enabled]
                    properties:
                      mfa_enabled: {type: boolean}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/recovery-codes:
    get:
      tags: [Auth]
      summary: How many recovery codes remain unused
      description: 'Returns remaining/total unused recovery codes for the caller. total == 0 means MFA is not enabled.'
      operationId: recoveryCodesStatus
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Recovery-code status
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    required: [remaining, total]
                    properties:
                      remaining: {type: integer}
                      total: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/recovery-codes/regenerate:
    post:
      tags: [Auth]
      summary: Replace all recovery codes
      description: >-
        Re-proof with a current TOTP code OR the account password, then replace
        every recovery code with a fresh set. The old codes stop working
        immediately. Blocked under impersonation.
      operationId: regenerateMFARecoveryCodes
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one re-proof is required; the handler checks code first, falling back to password.
              properties:
                code: {type: string, description: Current TOTP code or a recovery code}
                password: {type: string, format: password}
      responses:
        '200':
          description: New one-time recovery codes issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data:
                    type: object
                    required: [recovery_codes]
                    properties:
                      recovery_codes: {type: array, items: {type: string}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/mfa/stepup:
    post:
      tags: [Auth]
      summary: Re-verify TOTP/recovery code to open a restricted-secret read window
      description: >-
        Re-verify the caller's TOTP (or a recovery code) without a full re-login. On
        success, opens a 15-minute server-side window permitting reads of "restricted"
        classified secrets. Blocked under impersonation.
      operationId: mfaStepUp
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: TOTP code or a recovery code}
      responses:
        '200': {description: Step-up verified; the 15-minute restricted-read window is open}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/end-impersonation:
    post:
      tags: [Auth]
      summary: End the current impersonation session
      description: Terminate the active impersonation session and return to the original user context.
      operationId: endImpersonation
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Impersonation ended}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/system/info:
    get:
      tags: [System]
      summary: Server information (requires system.read)
      description: Return server version, build info, database status, and enabled security features.
      operationId: getSystemInfo
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'System info (version, build, db, security features)'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/system/metrics:
    get:
      tags: [System]
      summary: System performance metrics (requires system.read)
      description: Return runtime, HTTP, database, and secrets performance metrics for the deployment.
      operationId: getSystemMetrics
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Runtime, HTTP, database, and secrets metrics'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/system/auth-config:
    get:
      tags: [System]
      summary: Authentication configuration (requires system.read)
      description: >-
        Return session, password policy, login lockout, MFA, WebAuthn, and SSO provider settings (secrets redacted).
        require_mfa is what is enforced right now: false while ADR-112's upgrade grace period runs, which is then
        described by require_mfa_grace {ends_at, days_left} (#2923; omitted otherwise).
      operationId: getAuthConfig
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Authentication configuration summary'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/system/encryption-config:
    get:
      tags: [System]
      summary: Encryption configuration (requires system.read)
      description: Return whether encryption is enabled and the key-provider type (key material locations redacted).
      operationId: getEncryptionConfig
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Encryption configuration summary'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/jobs/role-expiry-check:
    post:
      tags: [System]
      summary: Trigger a role-expiry notification scan (requires system.write)
      description: >-
        Send immediate role-expiry notifications for time-bound role grants approaching their
        deadline (warning within 7 days, critical within 1 day). On-demand trigger for the job
        that otherwise runs only on its background scheduler.
      operationId: runRoleExpiryCheck
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Scan complete: {warnings, criticals}'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/jobs/token-expiry-check:
    post:
      tags: [System]
      summary: Trigger a PAT/machine-credential expiry notification scan (requires system.write)
      description: >-
        Send immediate expiry notifications for personal access tokens and machine-identity
        credentials approaching their deadline (warning within 7 days, critical within 1 day).
        On-demand trigger for the job that otherwise runs only on its background scheduler.
      operationId: runTokenExpiryCheck
      security: [{bearerAuth: []}]
      responses:
        '200': {description: 'Scan complete: {pat_warnings, pat_criticals, machine_warnings, machine_criticals}'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/usage:
    get:
      tags: [System]
      summary: Per-project secret usage report (requires audit.read)
      description: >-
        Return a per-project usage report (secret counts and read activity) for the given
        reporting window, for every project or one named via project_id.
      operationId: getUsageReport
      security: [{bearerAuth: []}]
      parameters:
        - {name: days, in: query, description: 'Reporting window in days (1-365, default 30)', schema: {type: integer}}
        - {name: project_id, in: query, description: 'Scope to a single project (omit for all)', schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data` (the usage report).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/UsageReport'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/admin/billing/report:
    get:
      tags: [System]
      summary: Per-project FinOps billing report (requires audit.read and the billing license feature)
      description: >-
        Return a per-project billing report (secret counts, read/write activity, machine vs.
        human breakdowns) for a date range, for every project or a caller-supplied comma-separated
        project_id list.
      operationId: getBillingReport
      security: [{bearerAuth: []}]
      parameters:
        - {name: from, in: query, required: true, description: 'RFC3339 start of the billing window', schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, description: 'RFC3339 end of the billing window', schema: {type: string, format: date-time}}
        - {name: project_id, in: query, description: 'Comma-separated project IDs to include (omit for all)', schema: {type: string}}
      responses:
        '200':
          description: Envelope with `data` (the billing report).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingReport'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects with secret and environment counts
      description: >-
        List the projects the CALLER CAN READ, including secret and environment
        counts. A caller holding secrets.read at the global scope gets every
        project; a caller whose grants are project-scoped gets exactly the projects
        they are authorized to read at the project scope — the same check
        GET /api/v1/projects/{id} applies, so every project listed here is one the
        caller can also fetch by id. A caller with no such grant gets 200 with an
        empty array, not 403.
      operationId: listProjects
      security: [{bearerAuth: []}]
      parameters:
        - name: include_deleted
          in: query
          description: >-
            When 'true', also returns soft-deleted projects (each flagged via
            deleted/deleted_at) for the restore UI. This form requires secrets.read at
            the GLOBAL scope: project-scoped role grants deliberately survive a
            soft-delete (so RestoreProject can work) while GET /api/v1/projects/{id}
            returns 404 for a deleted project, so a project-scoped reader cannot read a
            soft-deleted project through any path and must not see one listed. A caller
            without the global grant gets 403 for this form, and 200 for the default one.
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: "Envelope {data, message}. data.projects is an array of project objects (including secret and environment counts; soft-deleted ones carry deleted/deleted_at)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer}
                            name: {type: string}
                            description: {type: string}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Create a project
      description: Create a new project with the given name and optional description, optionally seeding a specific set of environment names.
      operationId: createProject
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                environments:
                  type: array
                  description: "Environment names to seed (default, if omitted: development, staging, production)."
                  items: {type: string}
      responses:
        '201':
          description: "Envelope {data, message='Project created'}. data is the created project object."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      summary: Get a project by ID
      description: Return a single project by its numeric ID, including metadata and counts.
      operationId: getProject
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data, message}. data is the project object."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [Projects]
      summary: Update a project's name/description
      description: Update the name and/or description of an existing project by ID.
      operationId: updateProject
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                description: {type: string}
                require_mfa:
                  type: boolean
                  nullable: true
                  description: >-
                    ADR-037 per-project security-policy control. Omit (or null) to
                    leave unchanged. Changing it additionally requires roles.assign
                    at the project, not just secrets.write.
      responses:
        '200':
          description: "Envelope {data, message='Project updated'}. data is the updated project object."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Delete a project
      description: Soft-delete a project by ID; use force=true to cascade-delete even when the project contains secrets.
      operationId: deleteProject
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: force
          in: query
          description: When 'true', cascade-delete even when the project contains secrets (otherwise a non-empty project yields 409).
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: "Envelope {data=null, message='Project deleted'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/restore:
    post:
      tags: [Projects]
      summary: Restore a soft-deleted project
      description: Restore a previously soft-deleted project, making it active again.
      operationId: restoreProject
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data=null, message='Project restored'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/drift:
    get:
      tags: [Projects]
      summary: Cross-environment drift report for a project
      description: Return a cross-environment drift report showing secret keys that are missing or diverge across environments.
      operationId: getProjectDrift
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data, message}. data is the drift report: environments[] (per-environment listing), drifted_keys[] (keys missing in some environments or with diverging settings), and summary."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/stats:
    get:
      tags: [Projects]
      summary: Rich per-project statistics (ADR-108 PR 6 addition)
      description: >-
        Secret counts, rotation health, unique accessors, open anomalies, and a
        classification breakdown for a project. Added for ADR-108 PR 6 (thin CLI
        `project stats`) -- was already a live route (secretHandler.GetProjectStats,
        router.go), just undocumented in this spec until now.
      operationId: getProjectStats
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: "Envelope {data, message}. data is a per-project stats object (project_id, project_name, total/active/expired/expiring_in_30_days secrets, rotation_enabled, overdue_rotation, last_rotation_at, unique_accessors, open_anomalies, classification_counts, computed_at)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/hygiene:
    get:
      tags: [Projects]
      summary: A project's security-hygiene posture, counts only (ADR-108 PR 6 addition)
      description: >-
        Outstanding cleanup signals for a project in one call: secrets whose owner
        departed, secrets unused for a long window, secrets expiring/expired, and
        stale machine identities. Added for ADR-108 PR 6 (thin CLI `project hygiene`)
        -- was already a live route (secretHandler.ProjectHygiene, router.go), just
        undocumented in this spec until now.
      operationId: getProjectHygiene
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: "Envelope {data, message}. data has orphaned_secrets, unused_secrets, expiring_secrets, stale_machine_identities, rotation_overdue (all integer counts)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/health:
    get:
      tags: [Projects]
      summary: Secret health summary for a project (ADR-108 PR 6 addition)
      description: >-
        A ranked list of the highest-risk secrets in a project together with overall
        band counts (HIGH/MEDIUM/LOW). Added for ADR-108 PR 6 (thin CLI `project
        health`) -- was already a live route (secretHandler.GetProjectHealth,
        router.go), just undocumented in this spec until now.
      operationId: getProjectHealth
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - name: limit
          in: query
          description: Maximum number of secrets to display (1-100, default 20).
          schema: {type: integer}
      responses:
        '200':
          description: "Envelope {data, message}. data has project_id, total_secrets, high_risk_count, medium_risk_count, low_risk_count, and secrets[] (secret_id, secret_name, score, band, factors[] of key/label/score/weight/detail)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/rotation-order:
    get:
      tags: [RotationPolicies]
      summary: Print a safe rotation sequence for a project's dependency graph (ADR-052)
      description: >-
        A topological sort of the project's secret dependency graph: each secret
        is listed before anything that depends on it. Added for ADR-108 PR 1
        (thin CLI `rotation order`) — this route existed and was already called
        by the old CLI's remote mode; it was simply undocumented in this spec
        until now.
      operationId: getProjectRotationOrder
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is a RotationOrder.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/RotationOrder'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/rotation-plan:
    get:
      tags: [RotationPolicies]
      summary: Print an automated rotation plan (dependency-safe waves, by urgency, ADR-053)
      description: >-
        A project's overdue/due-soon secrets batched into dependency-safe waves,
        prioritised by urgency and annotated with why. Added for ADR-108 PR 1
        (thin CLI `rotation plan`) — see getProjectRotationOrder above.
      operationId: getProjectRotationPlan
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: Envelope `{success, data, message}`. `data` is a RotationPlan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/RotationPlan'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review:
    get:
      tags: [Projects]
      summary: Access recertification report (ISO 27001 A.5.18)
      description: >-
        Who can reach the project's secrets and how: role-based standing access
        (project-scoped role grants conferring a secrets.* permission) plus the
        per-secret grants (ownership and direct/group shares). Requires roles.read
        at the project scope.
      operationId: getProjectAccessReview
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data: {entries[], count, degraded, degraded_reasons[],
            activity_window_days (the look-back of every last_used_at: the recertification
            period, default 90 days, at most 366)}; each entry is
            {principal_type (user|group), principal_id, principal_name, email,
            source (role|owner|direct_share|group_share), role_id, role_name,
            access_level, environment_id, secret_id, secret_name, last_used_at
            (the user principal's most recent secret access in the project within the
            last activity_window_days days — absent = no recorded activity in that
            window, i.e. dormant standing access)}.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/attest:
    post:
      tags: [Projects]
      summary: Attest an access-review grant (certify reviewed & kept)
      description: >-
        Record that the grant in the body was reviewed and intentionally kept —
        the audit evidence of recertification (access_review.attested). Changes no
        access. Requires roles.read at the project scope.
      operationId: attestProjectAccessReview
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessReviewDecision'}
      responses:
        '200': {description: "Envelope {data, message}. Attested."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/revoke:
    post:
      tags: [Projects]
      summary: Revoke an access-review grant (remove the role or share)
      description: >-
        Close the recertification loop by removing the grant in the body — a
        project-scoped role assignment (source=role, role_id set) or a secret share
        (source=direct_share|group_share, secret_id set). Audited as
        access_review.revoked. Ownership (source=owner) cannot be revoked here.
        Requires roles.assign at the project scope.
      operationId: revokeProjectAccessReview
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessReviewDecision'}
      responses:
        '200': {description: "Envelope {data, message}. Access revoked."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/campaigns:
    get:
      tags: [Projects]
      summary: List access-review campaigns (periodic recertification, A.5.18)
      description: >-
        The project's recertification campaigns, newest first, each with its
        decision tally {total, pending, attested, revoked}. Requires roles.read.
      operationId: listAccessReviewCampaigns
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200': {description: "Envelope {data}. data: {campaigns[] of {campaign, progress}, count}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Projects]
      summary: Open an access-review campaign (snapshot current access)
      description: >-
        Snapshot the project's current access review into per-grant campaign items
        (each pending) for a tracked recertification cycle. Requires roles.assign.
      operationId: openAccessReviewCampaign
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: "Campaign label, e.g. \"Q4 2026 access recertification\""}
      responses:
        '201': {description: "Envelope {data}. data: {campaign, progress}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/campaigns/{campaignId}:
    get:
      tags: [Projects]
      summary: Get a campaign with its items and progress
      description: Return a single access-review campaign with all its items and recertification progress.
      operationId: getAccessReviewCampaign
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: campaignId, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200': {description: "Envelope {data}. data: {campaign, items[] (snapshot + decision), progress}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/campaigns/{campaignId}/export.csv:
    get:
      tags: [Projects]
      summary: Download campaign items as CSV (auditor evidence export)
      description: >-
        Returns every item of the campaign with its recertification decision as
        a CSV attachment. Intended as the signed-off recertification record for
        ISO 27001 A.5.18 archiving. No secret values are included. Gated by
        roles.read at project scope.
      operationId: exportAccessReviewCampaignCSV
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: campaignId, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: CSV file download (`text/csv`). Columns — id, item_type, subject, role/permission, decision, decided_by, decided_at, created_at.
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/campaigns/{campaignId}/items/{itemId}/decide:
    post:
      tags: [Projects]
      summary: Decide one campaign item (attest or revoke)
      description: >-
        Record a recertification decision on one item of an open campaign: attest
        keeps the grant (evidence only); revoke removes the underlying grant. Both
        audited. Requires roles.assign.
      operationId: decideAccessReviewCampaignItem
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: campaignId, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: itemId, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [attest, revoke]}
                reason: {type: string, description: "Optional reviewer note"}
      responses:
        '200': {description: "Envelope {data, message}. Decision recorded."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/access-review/campaigns/{campaignId}/close:
    post:
      tags: [Projects]
      summary: Close a campaign (freeze as evidence)
      description: >-
        Freeze the campaign as the recertification evidence record. Refuses while
        items remain pending unless force=true. Requires roles.assign.
      operationId: closeAccessReviewCampaign
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: campaignId, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, description: "Close even if items remain pending"}
      responses:
        '200': {description: "Envelope {data}. data: {campaign, progress}."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/break-glass:
    post:
      tags: [Projects]
      summary: Activate break-glass emergency access (self-service)
      description: >-
        Immediately self-grant the configured emergency role at the project scope,
        time-bound (default + capped by server config), with a required written
        justification. NOT RBAC-gated — the controls are config-enablement, the
        justification, a loud audit (break_glass.activated) + admin alert, and
        auto-expiry. Returns 403 when break-glass is disabled (the error field is the
        code BreakGlassDisabled; gRPC: PermissionDenied with a google.rpc.ErrorInfo
        reason BreakGlassDisabled), and always when the
        caller authenticated with a restricted personal access token (ADR-042).
      operationId: activateBreakGlass
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [justification]
              properties:
                justification: {type: string, description: "Written reason (required)"}
                ttl: {type: string, description: "Optional grant-lifetime override, a Go duration (e.g. 2h); capped at the server max"}
      responses:
        '201':
          description: "Envelope {data}. data: {activation}."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activation: {$ref: '#/components/schemas/BreakGlassActivation'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    get:
      tags: [Projects]
      summary: List break-glass activations (all for review, or your own)
      description: >-
        Emergency-access activations, newest first (an active grant past its expiry
        reads as expired). A caller holding roles.read at the project gets every
        activation of the project (scope "project"). Any other current member of the
        project (a role scoped to it, as for activation) gets only their
        OWN activations in the project, active, expired and revoked, with the same
        fields (scope "own"); nothing about other users' activations, not even a
        count. A non-member (the same 403 for every project id), a machine identity
        without roles.read, or a restricted personal access
        token whose restriction does not allow roles.read at the project, is refused
        with 403. The per-project MFA policy applies to both views. The answer also
        carries the server's break-glass limits (settings) so a client offers only
        lifetimes the server will honour; they are returned only to a caller this
        list allowed, and hold no secret.
      operationId: listBreakGlassActivations
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200':
          description: "Envelope {data}. data: {activations[] of {id, user_id, role_name, justification, state, expires_at, created_at}, count, scope}."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      activations:
                        type: array
                        items: {$ref: '#/components/schemas/BreakGlassActivation'}
                      count: {type: integer}
                      scope:
                        type: string
                        enum: [project, own]
                        description: >-
                          "project": every activation of the project (caller holds
                          roles.read). "own": only the caller's own activations.
                      settings: {$ref: '#/components/schemas/BreakGlassSettings'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/break-glass/{activationId}/revoke:
    post:
      tags: [Projects]
      summary: Revoke an active break-glass grant early
      description: >-
        End an active emergency grant before its TTL — removes the role assignment
        and marks the activation revoked. Requires roles.assign.
      operationId: revokeBreakGlass
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - {name: activationId, in: path, required: true, schema: {type: integer, format: uint32}}
      responses:
        '200': {description: "Envelope {data, message}. Emergency access revoked."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/share-recipients:
    get:
      tags: [Shares]
      summary: Search share recipients in a project
      description: >-
        The active members of the project that the caller could share a secret with,
        for the Share dialog. Requires secrets.write at the project's scope, and the
        caller must be a member of the project (the rule ShareSecret applies to a
        secret's owner) or hold global users.read. A project-only admin can therefore
        find recipients without the global users.read that GET /api/v1/users needs.
        Only members whose account is active are listed (not suspended, deprovisioned,
        deactivated or deleted), ordered by username. Each result carries id, username
        and display_name; email is included, and matched by q, only when the caller
        holds users.read at the project's scope. Every refusal is the same 403 with a
        fixed reason, whether or not the project exists.
      operationId: searchShareRecipients
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: uint32}}
        - name: q
          in: query
          required: false
          description: Case-insensitive prefix of the username, the display name (or any word of it) or, when visible, the email. Empty lists every recipient.
          schema: {type: string}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Envelope `{success, data}`. `data.recipients` is one page of results; `data.total` counts every match.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: {type: boolean}
                  data:
                    type: object
                    required: [recipients, total, page, page_size]
                    properties:
                      recipients:
                        type: array
                        items:
                          type: object
                          required: [id, username, display_name]
                          additionalProperties: false
                          properties:
                            id: {type: integer, format: uint32}
                            username: {type: string}
                            display_name: {type: string}
                            email: {type: string, description: Present only when the caller holds users.read at the project's scope.}
                      total: {type: integer}
                      page: {type: integer}
                      page_size: {type: integer}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/members:
    get:
      tags: [Members]
      summary: List a project's members (role grants)
      description: Return all members of a project with their assigned role grants.
      operationId: listProjectMembers
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data, message}. data.members is an array of project member objects."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Members]
      summary: Add a member to a project with a role
      description: Add a user to a project by granting them the specified role.
      operationId: addProjectMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: {type: integer, format: uint32}
                role: {type: string}
      responses:
        '201':
          description: "Envelope {data=null, message='Member added'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/members/{userId}:
    put:
      tags: [Members]
      summary: Update a project member's role
      description: Change the role assigned to an existing project member.
      operationId: updateProjectMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {type: string}
      responses:
        '200':
          description: "Envelope {data=null, message='Member role updated'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Members]
      summary: Remove a member from a project
      description: Remove a user from a project, revoking all their project-scoped role grants.
      operationId: removeProjectMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data=null, message='Member removed'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/memberships:
    get:
      tags: [Memberships]
      summary: List project memberships (onboarding state machine)
      description: List onboarding memberships for a project, optionally filtering for stale invited records.
      operationId: listProjectMemberships
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: stale
          in: query
          description: When 'true', returns only this project's invited memberships older than 7 days.
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: "Envelope {data, message}. data.memberships is an array of membership objects (state: invited|identity_verified|provisioned|active|revoked)."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Memberships]
      summary: Invite a member (creates an invited membership)
      description: Create an invited membership for a user, starting the onboarding state machine.
      operationId: inviteMember
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: {type: integer, format: uint32}
                role: {type: string}
                idp_resolved: {type: boolean}
      responses:
        '201':
          description: "Envelope {data, message='Member invited'}. data.membership is the created membership object."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/memberships/{membershipId}:
    put:
      tags: [Memberships]
      summary: Transition a membership through the onboarding state machine
      description: Advance or revoke a membership by applying verify, provision, activate, or revoke actions.
      operationId: transitionMembership
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: membershipId
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [verify, provision, activate, revoke]
                  description: "verify→identity_verified, provision→provisioned, activate→active, revoke→revoked."
      responses:
        '200':
          description: "Envelope {data, message='Membership updated'}. data.membership is the updated membership object."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/environments:
    get:
      tags: [Environments]
      summary: List all environments (global, backward-compat)
      description: >-
        Return the environments belonging to projects the CALLER CAN READ, across
        all of them. Scoped exactly like GET /api/v1/projects: a global secrets.read
        holder gets every environment, a project-scoped reader gets only their
        projects', and a caller with no such grant gets 200 with an empty array
        rather than 403.
      operationId: listEnvironments
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data, message}. data.environments is an array of environment objects."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/environments:
    get:
      tags: [Environments]
      summary: List a project's environments
      description: Return all environments belonging to the specified project, optionally including soft-deleted ones.
      operationId: listProjectEnvironments
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
        - name: include_deleted
          in: query
          description: When 'true', also returns soft-deleted environments.
          schema: {type: string, enum: ['true', 'false']}
      responses:
        '200':
          description: "Envelope {data, message}. data.environments is an array of environment objects."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [Environments]
      summary: Create an environment in a project
      description: Create a new named environment within the specified project.
      operationId: createProjectEnvironment
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        '201':
          description: "Envelope {data, message='Environment created'}. data is the created environment object (project_id, name)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Environment'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{id}/environments/{envId}/clone:
    post:
      tags: [Environments]
      summary: Clone all secrets from one environment to another in the same project (ADR-108 PR 6 addition)
      description: >-
        Copies every secret from the source environment (path envId) into the
        destination environment (body destination_environment_id). Secrets that
        already exist by name in the destination are skipped, not overwritten. Only
        the latest version of each secret is copied. Requires secrets.write on the
        project scope (creates in destination) and secrets.read on the source
        environment scope. Added for ADR-108 PR 6 (thin CLI `project env clone`) --
        was already a live route (catalogHandler.CloneEnvironment, router.go), just
        undocumented in this spec until now.
      operationId: cloneEnvironment
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, description: Project ID, schema: {type: integer, format: uint32}}
        - {name: envId, in: path, required: true, description: Source environment ID, schema: {type: integer, format: uint32}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destination_environment_id]
              properties:
                destination_environment_id: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data, message}. data is an EnvCloneResult."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/EnvCloneResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/projects/{projectId}/environments/{id}/restore:
    post:
      tags: [Environments]
      summary: Restore a soft-deleted environment
      description: Restore a previously soft-deleted environment within the specified project.
      operationId: restoreEnvironment
      security: [{bearerAuth: []}]
      parameters:
        - name: projectId
          in: path
          required: true
          description: Owning project ID; the permission scope resolves from it because the environment row is soft-deleted.
          schema: {type: integer, format: uint32}
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data=null, message='Environment restored'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/environments/{id}:
    delete:
      tags: [Environments]
      summary: Delete an environment
      description: Soft-delete an environment by ID; fails with 409 if the environment still contains secrets.
      operationId: deleteEnvironment
      security: [{bearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer, format: uint32}
      responses:
        '200':
          description: "Envelope {data=null, message='Environment deleted'}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/invitations:
    get:
      tags: [Invitations]
      summary: List project invitations
      description: Return all pending and historical invitations for the specified project.
      operationId: listProjectInvitations
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data.invitations` (array of invitation objects).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitations: {type: array, items: {$ref: '#/components/schemas/ProjectInvitation'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Invitations]
      summary: Invite a user to the project
      description: Send a project invitation to an email address, assigning the specified role on acceptance.
      operationId: createProjectInvitation
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {type: string, description: Project role to assign on accept}
      responses:
        '201':
          description: >-
            Envelope with `data.invitation` plus `data.setup_link`
            (or `data.delivery_error` when the link could not be delivered).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invitation: {$ref: '#/components/schemas/ProjectInvitation'}
                      setup_link: {$ref: '#/components/schemas/ProvisionSetupResult'}
                      delivery_error: {type: string, description: "Set instead of setup_link when the invitation was created but the link could not be delivered."}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/invitations/{invitationId}:
    delete:
      tags: [Invitations]
      summary: Revoke a pending invitation
      description: Cancel a pending project invitation so it can no longer be accepted.
      operationId: revokeProjectInvitation
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: invitationId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {nullable: true}
                  message: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/invitations/{invitationId}/resend:
    post:
      tags: [Invitations]
      summary: Resend a pending invitation link
      description: Reissue and resend the accept link for a pending project invitation.
      operationId: resendProjectInvitation
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: invitationId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data.setup_link` (the reissued accept link).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      setup_link: {$ref: '#/components/schemas/ProvisionSetupResult'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/invitations:
    post:
      tags: [Invitations]
      summary: Create a global (non-project) invitation
      description: Invite a user to the deployment globally, with optional system role and project assignments.
      operationId: createGlobalInvitation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                role:
                  type: string
                  description: System role (optional; defaults to system_viewer)
                project_assignments:
                  type: array
                  description: Per-project roles applied atomically on accept
                  items:
                    type: object
                    properties:
                      project_id: {type: integer}
                      role: {type: string}
      responses:
        '201':
          description: >-
            Envelope with `data.invitation` plus `data.setup_link`
            (or `data.delivery_error` when the link could not be delivered).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/access-requests:
    get:
      tags: [AccessRequests]
      summary: List project access requests
      description: Return all access requests for a project, including pending dual-control approval progress.
      operationId: listAccessRequests
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope with `data.access_requests` (array of access-request objects).
            Under dual control a pending request carries `ApprovalsReceived` /
            `RequiredApprovals` (the M-of-K progress).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [AccessRequests]
      summary: Request access to a project (self-service)
      description: Submit a self-service request for access to a project with an optional suggested role and reason.
      operationId: createAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                suggested_role: {type: string, description: Project role the requester would like}
                reason: {type: string}
      responses:
        '201':
          description: Envelope with `data.access_request` (the created pending request).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/access-requests/{requestId}:
    put:
      tags: [AccessRequests]
      summary: Approve or reject an access request
      description: >-
        Approve records the caller's sign-off. Under dual control
        (`dual_control.required_approvals` > 1) the role is granted only once that
        many distinct approvers — none of them the requester — have approved;
        before then the request stays pending.
      operationId: resolveAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: requestId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject]}
                granted_role: {type: string, description: Role to grant on approve}
                grant_ttl: {type: string, description: "Optional on approve — time-bound (just-in-time) the granted role; a Go duration (e.g. 4h, 30m). Empty/absent = permanent. The grant stops authorizing once the TTL elapses and is swept by the JIT expiry scheduler."}
                reason: {type: string, description: Reason on reject}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/access-requests/{requestId}/withdraw:
    post:
      tags: [AccessRequests]
      summary: Withdraw your own access request (self-service)
      description: Cancel a previously submitted access request that is still pending approval.
      operationId: withdrawAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: requestId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /api/v1/access-requests/bulk-approve:
    post:
      tags: [AccessRequests]
      summary: Approve multiple pending access requests at once (ADR-108 PR 7 addition)
      description: >-
        Requires a global roles.assign; the handler additionally enforces per-item
        project-scoped roles.assign for the caller before approving each request.
        Added for ADR-108 PR 7 (thin CLI `request bulk-approve`) -- was already a live
        route (catalogHandler.BulkApproveAccessRequests, router.go), just undocumented
        in this spec until now.
      operationId: bulkApproveAccessRequests
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_ids]
              properties:
                request_ids: {type: array, items: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data.result: {approved: [<request ids>],
            failed: [{request_id, error}]}.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/access-requests/bulk-reject:
    post:
      tags: [AccessRequests]
      summary: Reject multiple pending access requests at once (ADR-108 PR 7 addition)
      description: >-
        Requires a global roles.assign; the handler additionally enforces per-item
        project-scoped roles.assign for the caller before rejecting each request.
        Added for ADR-108 PR 7 (thin CLI `request bulk-reject`) -- was already a live
        route (catalogHandler.BulkRejectAccessRequests, router.go), just undocumented
        in this spec until now.
      operationId: bulkRejectAccessRequests
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_ids, reason]
              properties:
                request_ids: {type: array, items: {type: integer}}
                reason: {type: string}
      responses:
        '200':
          description: >-
            Envelope {data, message}. data.result: {rejected: [<request ids>],
            failed: [{request_id, error}]}.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/rejection-reason-templates:
    get:
      tags: [AccessRequests]
      summary: List rejection-reason templates (ADR-108 PR 7 addition)
      description: >-
        Templates are not project-scoped -- requires a global roles.assign. Added for
        ADR-108 PR 7 (thin CLI `request rejection-templates list`) -- was already a
        live route (catalogHandler.ListRejectionReasonTemplates, router.go), just
        undocumented in this spec until now.
      operationId: listRejectionReasonTemplates
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: "Envelope {data, message}. data.templates[]: {id, name, reason}."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [AccessRequests]
      summary: Add a rejection-reason template (ADR-108 PR 7 addition)
      description: >-
        Requires a global roles.assign. Added for ADR-108 PR 7 (thin CLI `request
        rejection-templates add`) -- was already a live route
        (catalogHandler.CreateRejectionReasonTemplate, router.go), just undocumented
        in this spec until now.
      operationId: createRejectionReasonTemplate
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, reason]
              properties:
                name: {type: string}
                reason: {type: string}
      responses:
        '201':
          description: "Envelope {data, message}. data.template: {id, name, reason}."
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}

  /api/v1/rejection-reason-templates/{id}:
    delete:
      tags: [AccessRequests]
      summary: Delete a rejection-reason template (ADR-108 PR 7 addition)
      description: >-
        Requires a global roles.assign. Added for ADR-108 PR 7 (thin CLI `request
        rejection-templates delete`) -- was already a live route
        (catalogHandler.DeleteRejectionReasonTemplate, router.go), just undocumented
        in this spec until now.
      operationId: deleteRejectionReasonTemplate
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope {data=null, message='deleted'}."
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /api/v1/secret-access-requests:
    get:
      tags: [AccessRequests]
      summary: List your own and approvable secret access requests
      description: >-
        Returns two buckets scoped to the caller: `mine` (the caller's own
        secret-scoped access requests, any state) and `pending_approval`
        (pending requests at a project where the caller holds admin
        authority — never including the caller's own requests).
      operationId: listSecretAccessRequests
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Envelope with `data.mine` and `data.pending_approval` (arrays of access-request objects).
        '401': {$ref: '#/components/responses/Error'}
    post:
      tags: [AccessRequests]
      summary: Request approval to read one restricted secret's value (self-service)
      description: >-
        Submit a self-service request for approval to read ONE specific
        secret's value, distinct from the project/role access-request
        family. `reason` is required. A restricted secret's existence is
        never inferable from this endpoint's response: an unknown secret ID
        and one the caller cannot see both produce an identical 404.
      operationId: createSecretAccessRequest
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret_id, reason]
              properties:
                secret_id: {type: integer}
                reason: {type: string}
      responses:
        '201':
          description: Envelope with `data.access_request` (the created pending request).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/secret-access-requests/{requestId}:
    get:
      tags: [AccessRequests]
      summary: Get one secret access request
      description: >-
        Visible only to the request's own requester or an admin at its
        project. A nonexistent request ID, a project/role request ID (out of
        scope for this endpoint), and a real secret-scoped request the
        caller may not see all produce an identical 404.
      operationId: getSecretAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data.access_request`.
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      tags: [AccessRequests]
      summary: Approve or reject a secret access request
      description: >-
        Unlike the project/role family's resolve endpoint, no
        granted_role/grant_ttl — a secret-scoped approval grants no role at
        all. Authority (admin at the request's own project) is enforced
        entirely inside core, since this route carries no project ID to gate
        on at the HTTP layer.
      operationId: resolveSecretAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject]}
                reason: {type: string, description: Reason on reject}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/secret-access-requests/{requestId}/withdraw:
    post:
      tags: [AccessRequests]
      summary: Withdraw your own pending secret access request (self-service)
      description: Cancel a previously submitted secret access request that is still pending approval.
      operationId: withdrawSecretAccessRequest
      security: [{bearerAuth: []}]
      parameters:
        - {name: requestId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities:
    get:
      tags: [MachineIdentities]
      summary: List machine identities
      description: Return all machine identities registered in the specified project.
      operationId: listMachineIdentities
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data.machine_identities` (array of machine-identity objects).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      machine_identities: {type: array, items: {$ref: '#/components/schemas/MachineIdentity'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [MachineIdentities]
      summary: Create a machine identity
      description: Create a new machine identity in the specified project for non-human authentication.
      operationId: createMachineIdentity
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                identity_type: {type: string}
                description: {type: string}
                classification: {type: string, description: 'Data classification: public | internal | confidential | restricted'}
      responses:
        '201':
          description: Envelope with `data.machine_identity` (the created identity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      machine_identity: {$ref: '#/components/schemas/MachineIdentity'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/migrate-from-user:
    post:
      tags: [MachineIdentities]
      summary: Convert a user into a machine identity (ADR-023)
      description: >-
        Materialize a project machine identity for an existing user and, unless keep_user is
        set, suspend the source user so it can no longer log in. The user is never deleted.
        Requires roles.assign (scoped to this project) AND users.write (global).
      operationId: migrateUserToMachine
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string}
                identity_type: {type: string}
                name: {type: string}
                keep_user: {type: boolean, description: 'Leave the source user active (default: false, suspends it)'}
      responses:
        '201':
          description: Envelope with `data.machine_identity` (the created identity).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      machine_identity: {$ref: '#/components/schemas/MachineIdentity'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}:
    put:
      tags: [MachineIdentities]
      summary: Transition a machine identity state
      description: Change a machine identity's lifecycle state by applying an activate, suspend, or revoke action.
      operationId: transitionMachineIdentity
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [activate, suspend, revoke]}
      responses:
        '200':
          description: Envelope with `data.machine_identity` (the updated identity).
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/tokens:
    get:
      tags: [MachineIdentities]
      summary: List machine tokens (metadata only)
      description: Return token metadata (prefix, expiry, last used) for a machine identity; secret values are never returned.
      operationId: listMachineTokens
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: >-
            Envelope with `data.tokens`; each item has `id`, `name`, `prefix`,
            `last_used_at`, `expires_at`, `revoked` (never the raw token).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tokens: {type: array, items: {$ref: '#/components/schemas/MachineToken'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [MachineIdentities]
      summary: Issue a machine token (raw token shown once)
      description: Issue a new authentication token for a machine identity; the raw token is returned only once.
      operationId: issueMachineToken
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                expires_in_days: {type: integer, description: Optional; omit or 0 for no expiry}
                classification: {type: string, description: 'Data classification: public | internal | confidential | restricted'}
      responses:
        '201':
          description: >-
            Envelope with `data.token` (raw token, returned ONCE), `data.id`,
            `data.prefix`, and `data.expires_at`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: {type: string, description: 'Plaintext token, shown only in this response'}
                      id: {type: integer}
                      prefix: {type: string}
                      expires_at: {type: string, format: date-time, nullable: true}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/tokens/{tokenId}:
    delete:
      tags: [MachineIdentities]
      summary: Revoke a machine token
      description: Permanently revoke a machine token by ID, preventing further authentication with it.
      operationId: revokeMachineToken
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
        - {name: tokenId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/roles:
    get:
      tags: [MachineIdentities]
      summary: List a machine identity's project roles
      description: Return every project-scoped role currently granted to the machine identity.
      operationId: listMachineRoles
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: "Envelope `data.roles[]` with id, name."
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles: {type: array, items: {$ref: '#/components/schemas/RoleRef'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [MachineIdentities]
      summary: Grant a project role to a machine identity
      description: Assign a project-scoped role to a machine identity, granting it the role's permissions.
      operationId: grantMachineRole
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: {type: integer}
                environment_id: {type: integer, description: "Scope the grant to one environment in this project; 0 or omitted = global (every environment)."}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/roles/{roleId}:
    delete:
      tags: [MachineIdentities]
      summary: Remove a project role from a machine identity
      description: Revoke a previously granted project- or environment-scoped role from a machine identity.
      operationId: removeMachineRole
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
        - {name: roleId, in: path, required: true, schema: {type: integer}}
        - {name: environment_id, in: query, required: false, description: "Remove the grant scoped to this one environment (must belong to the project; 400 otherwise). Omitted or 0 removes the project-wide grant only.", schema: {type: integer}}
      responses:
        '200':
          description: Envelope with null `data` and a confirmation message.
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/machine-identities/{machineId}/oidc-bindings:
    get:
      tags: [MachineIdentities]
      summary: List a machine identity's OIDC federation bindings
      description: Return the OIDC (issuer, subject) bindings mapped to a machine identity (ADR-031).
      operationId: listOIDCBindings
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Envelope with `data.bindings` (array of OIDC bindings).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bindings: {type: array, items: {$ref: '#/components/schemas/OIDCBinding'}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [MachineIdentities]
      summary: Bind an OIDC (issuer, subject) to a machine identity
      description: >-
        Create an OIDC federation binding (ADR-031) so a workload holding a matching
        external JWT can authenticate as this machine identity with no stored credential.
      operationId: createOIDCBinding
      security: [{bearerAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: machineId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuer, subject]
              properties:
                issuer: {type: string, description: "The token's iss claim"}
                subject: {type: string, description: "The token's sub claim"}
      responses:
        '201':
