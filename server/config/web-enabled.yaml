# Keyorix Configuration with Web Dashboard
# This configuration enables both the API server and web dashboard
#
# ============================================================================
# FOR LOCAL DEV ONLY — DO NOT USE IN PRODUCTION AS-IS (#G36). swagger_enabled
# and grpc.reflection_enabled are both on and TLS is off below — all fine for a
# laptop, none of it for an internet-facing deployment. See
# server/config/production.yaml for a production-oriented starting point.
# ============================================================================

environment: "development"  # development, staging, production

locale:
  language: "en"
  fallback_language: "en"

server:
  http:
    enabled: true
    port: "8080"
    protocol_versions: ["1.1", "2.0"]
    swagger_enabled: true  # DEV-ONLY DEFAULT (#G36) — disable in production.
    # Web dashboard settings
    web_assets_path: "./web/dist"  # Path to built web assets
    domain: "localhost"            # Domain for production CORS
    allowed_origins:               # Additional allowed origins for CORS
      - "http://localhost:3000"    # React dev server
      - "http://localhost:5173"    # Vite dev server
    tls:
      enabled: false  # DEV-ONLY DEFAULT (#G36) — enable (or front with a
                       # TLS-terminating proxy) before production use.
      auto_cert: false
      cert_file: ""
      key_file: ""
    ratelimit:
      enabled: true
      requests_per_second: 100
      burst: 200
  grpc:
    enabled: true
    port: "9090"
    protocol_versions: ["2.0"]
    reflection_enabled: true  # DEV-ONLY DEFAULT (#G36) — disable in production.
    tls:
      enabled: false  # DEV-ONLY DEFAULT (#G36) — see server.http.tls.enabled above.
      cert_file: ""
      key_file: ""
    ratelimit:
      enabled: true
      requests_per_second: 50
      burst: 100

storage:
  type: "local"  # options: local (SQLite), postgres, remote
  database:
    path: "./data/keyorix.db"
    # PostgreSQL (recommended for production):
    # type: postgres
    # dsn: "host=localhost user=keyorix dbname=keyorix port=5432 sslmode=require"
    # password: ""  # use KEYORIX_DB_PASSWORD environment variable instead
    # max_open_conns unset: per-dialect default (8 SQLite, 25 Postgres; #2631).
    max_idle_conns: 5
    conn_max_lifetime_minutes: 30
  encryption:
    enabled: true
    dek_path: ""
    salt_path: ""

secrets:
  chunking:
    enabled: true
    max_chunk_size_kb: 64
    max_chunks_per_secret: 100
  limits:
    max_secrets_per_user: 1000

security:
  enable_file_permission_check: true
  auto_fix_file_permissions: true
  insecure_allow_unsafe_file_permissions: false

soft_delete:
  enabled: true
  retention_days: 30

purge:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM