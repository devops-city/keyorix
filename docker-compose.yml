# Keyorix self-hosted stack: web UI + API server + PostgreSQL.
#
#   1. cp .env.example .env
#   2. ./scripts/selfhost/init-secrets.sh   (creates ./secrets/* and KEYORIX_SECRETS_GID in .env)
#   3. docker compose up -d
#   4. open http://localhost:8088  and log in with the admin in ./secrets/admin_password
#
# The image pins below are the RELEASE pair (server + web from one tag; guarded by
# deploy/compose_pins_test.go). scripts/demo/check.sh --postgres overlays both
# with images built from the checkout (see docs/demo/GOLDEN-PATH.md, "Which
# images does what") because a released web UI does not match a main backend.
#
# Secrets are Docker secrets FILES under ./secrets (or $KEYORIX_SECRETS_DIR), read by
# the containers through the *_FILE variables below. They are not in any container's
# environment (`docker inspect`, /proc/<pid>/environ). There are NO baked-in default
# passwords. Upgrading from a .env-based install:
#   ./scripts/selfhost/init-secrets.sh --from-env .env
# See docs/SELF_HOSTING.md for production hardening (TLS, backups, upgrades).
#
# Why group_add: Compose bind-mounts file secrets as-is and ignores their uid/gid/mode
# (it warns "not supported"), so a 0600 host file is unreadable by the container's
# non-root user. init-secrets.sh writes the files 0640 with your primary group and
# records that gid as KEYORIX_SECRETS_GID; each container that reads a secret joins
# that group. Nothing is world-readable, and the server's file-permission check
# (no access for "other", no group write) passes.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keyorix
      POSTGRES_USER: keyorix
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # Hardening (DEPLOY-1 audit): postgres:15-alpine's own uid/gid is 70. Running as
    # it directly skips the entrypoint's root-then-su-exec step, so no capabilities
    # are needed at all. Named volumes inherit the image's postgres:postgres
    # ownership of the data dir, and existing volumes were chowned to 70 by the old
    # entrypoint, so this is a no-op migration. The root FS is read-only; the
    # unix-socket dir and /tmp are tmpfs.
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
      - /var/run/postgresql:uid=70,gid=70,mode=0755,size=1m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    group_add: ["${KEYORIX_SECRETS_GID:?KEYORIX_SECRETS_GID is required: run ./scripts/selfhost/init-secrets.sh}"]
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keyorix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/keyorixhq/keyorix-server:0.95.3 # pin; bump to match release tag on upgrades
    # To build from source instead of pulling the published image, comment out
    # `image:` above and uncomment:
    # build:
    #   context: .
    #   dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      # Secrets are files (see the `secrets:` block at the bottom); the server and
      # the entrypoint read them through these *_FILE variables.
      KEYORIX_DB_PASSWORD_FILE: /run/secrets/db_password
      # Master passphrase for the encryption KEK. REQUIRED. Changing it after
      # first boot makes all stored secrets undecryptable.
      KEYORIX_MASTER_PASSWORD_FILE: /run/secrets/master_password
      # Optional first-boot admin bootstrap (idempotent). To initialise manually with
      # `keyorix system init` instead, delete the two *_FILE lines below. The bootstrap
      # token must accompany the admin password: /system/init always requires a
      # matching bootstrap token, and the entrypoint has no way to read back the
      # random one the server would otherwise generate for itself.
      KEYORIX_ADMIN_USERNAME: ${KEYORIX_ADMIN_USERNAME:-admin}
      KEYORIX_ADMIN_EMAIL: ${KEYORIX_ADMIN_EMAIL:-admin@keyorix.local}
      KEYORIX_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      KEYORIX_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    depends_on:
      postgres:
        condition: service_healthy
    # Hardening (DEPLOY-1 audit): the image already runs as uid 1001 (non-root).
    # Only /app/keys (volume) and /tmp (entrypoint's bootstrap payload) are written.
    read_only: true
    # Every tmpfs below has an explicit size= so a runaway writer fills its own
    # capped mount and fails, instead of consuming the host's RAM. /tmp here holds
    # the entrypoint's bootstrap payload and `admin restore` staging: raise it if
    # you restore a backup larger than this.
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    group_add: ["${KEYORIX_SECRETS_GID:?KEYORIX_SECRETS_GID is required: run ./scripts/selfhost/init-secrets.sh}"]
    secrets:
      - db_password
      - master_password
      - admin_password
      - bootstrap_token
    volumes:
      - ./keyorix.docker.yaml:/app/keyorix.yaml:ro
      # The encryption keys (wrapped DEK + KEK salt) MUST persist across restarts.
      - keyorix_keys:/app/keys

  web:
    # Published by docker-publish.yml from the same release tag as the server
    # image. Registry tags carry no leading "v" (docker/metadata-action semver
    # pattern): release v0.95.3 -> image tag 0.95.3.
    image: ghcr.io/keyorixhq/keyorix-web:0.95.3 # pin; bump to match release tag on upgrades
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      # HSTS behind a TLS-terminating load balancer (docs/SELF_HOSTING.md). This
      # nginx speaks plain http, so it sends Strict-Transport-Security ONLY for a
      # request whose TCP peer is listed here AND which carries
      # X-Forwarded-Proto=https; never for direct http, and never on the say-so of
      # an untrusted client. Empty (default) = no proxy trusted = no HSTS. Keep it
      # equal to the backend's server.http.trusted_proxies. Comma-separated IPs/CIDRs.
      KEYORIX_WEB_TRUSTED_PROXIES: ${KEYORIX_WEB_TRUSTED_PROXIES:-}
      # auto (default: on when trusted proxies are set) | on | off
      KEYORIX_WEB_HSTS: ${KEYORIX_WEB_HSTS:-auto}
      KEYORIX_WEB_HSTS_MAX_AGE: ${KEYORIX_WEB_HSTS_MAX_AGE:-31536000}
      KEYORIX_WEB_HSTS_INCLUDE_SUBDOMAINS: ${KEYORIX_WEB_HSTS_INCLUDE_SUBDOMAINS:-true}
    depends_on:
      - backend
    # Hardening (DEPLOY-1 audit): image runs as nginx uid 101. nginx's cache, pid
    # and log files go to tmpfs so the root FS can be read-only. NET_BIND_SERVICE
    # mirrors the Helm chart (container port 80 as non-root) and keeps this working
    # on runtimes that don't lower net.ipv4.ip_unprivileged_port_start.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
      - /run:uid=101,gid=101,mode=0755,size=1m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=64m
      # access/error logs (web/nginx.conf writes files here): when full, nginx keeps
      # serving and drops log lines; the cap is what keeps them out of host RAM.
      - /var/log/nginx:uid=101,gid=101,mode=0755,size=32m
      # 40-keyorix-hsts.sh regenerates nginx-hsts.conf here at every start (HSTS
      # trusted-proxy map); the root FS is read-only, so it needs its own writable dir.
      - /etc/nginx/keyorix:uid=101,gid=101,mode=0755,size=64k
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # web/Dockerfile already bakes an image-level HEALTHCHECK (wget against
    # /health — nginx:alpine has no curl), which Compose inherits without this
    # block; declared explicitly so it shows up the same way postgres' does.
    # 127.0.0.1, not localhost: busybox resolves localhost to ::1 first and nginx
    # listens on IPv4 only, so "localhost" was permanently unhealthy (#3026).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional HTTPS front-end. Enable with `docker compose --profile tls up -d`.
  # Caddy terminates TLS and proxies to web. Set KEYORIX_DOMAIN to a real domain
  # (with 80/443 reachable + DNS pointing here) for an automatic, publicly-trusted
  # certificate; the default `localhost` uses Caddy's internal CA. See
  # docs/SELF_HOSTING.md §7. When using this, don't also expose web's 8088 publicly.
  #
  # Caddy runs as uid:gid 65532 (non-root) with only NET_BIND_SERVICE. Earlier
  # releases ran it as root, so an existing caddy_data / caddy_config volume is
  # root-owned and a non-root caddy could not write its certificates or autosave
  # file. caddy-init is a one-shot that chowns those two volumes to caddy's user
  # before caddy starts (a no-op on a fresh or already-migrated volume), so the
  # upgrade needs no manual step. It is the only root container in this file, has
  # every capability dropped except CHOWN and DAC_READ_SEARCH, a read-only root FS
  # and no network.
  #
  # Scope: only /data and /config (the two Caddy volumes), never following symlinks
  # or crossing a mount, and only entries whose owner or group is not already
  # 65532:65532, so a second run on a migrated volume changes nothing. DAC_READ_SEARCH
  # is what makes it idempotent: Caddy creates its storage directories 0700, so once
  # they belong to 65532 root (without DAC_OVERRIDE/DAC_READ_SEARCH) can no longer
  # open them, and a second `up` -- or a first one that was interrupted half-way --
  # would fail here and, because caddy waits for this service to complete
  # successfully, leave HTTPS down. It grants read/search only, not write.
  caddy-init:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: "no"
    user: "0:0"
    entrypoint:
      - find
      - /data
      - /config
      - -xdev
      - (
      - "!"
      - -user
      - "65532"
      - -o
      - "!"
      - -group
      - "65532"
      - )
      - -exec
      - chown
      - -h
      - "65532:65532"
      - "{}"
      - "+"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    user: "65532:65532"
    ports:
      - "80:80"
      - "443:443"
    # Hardening (DEPLOY-1 audit, DEPLOY-2): caddy only needs to bind 80/443 and
    # write its /data and /config volumes. Binding <1024 as non-root works because
    # Docker/containerd set net.ipv4.ip_unprivileged_port_start=0 in the container's
    # network namespace and the binary also carries cap_net_bind_service.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      KEYORIX_DOMAIN: ${KEYORIX_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist issued certificates so restarts don't re-request them (ACME has
      # rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      caddy-init:
        condition: service_completed_successfully

secrets:
  db_password:
    file: ${KEYORIX_SECRETS_DIR:-./secrets}/db_password
  master_password:
    file: ${KEYORIX_SECRETS_DIR:-./secrets}/master_password
  admin_password:
    file: ${KEYORIX_SECRETS_DIR:-./secrets}/admin_password
  bootstrap_token:
    file: ${KEYORIX_SECRETS_DIR:-./secrets}/bootstrap_token

volumes:
  postgres_data:
  keyorix_keys:
  caddy_data:
  caddy_config:
