# Server config for docker-compose.secure.yml: the secure baseline
# (SECURE-DEFAULT-1, ADR-112 §4). `keyorix-server admin validate --posture`
# reports zero deviations on it, file permissions included:
#   - TLS on the backend listener, required. The certificate, its key and the
#     /metrics token are generated by the backend's entrypoint on first start
#     (`admin init --secure-files`, KEYORIX_INIT_SECURE_FILES=true) into the
#     keyorix_tls volume, 0600, and kept across restarts.
#   - API rate limiting on (same values as server/config/production.yaml).
#   - GET /metrics requires the generated token.
#   - The entrypoint copies this bind-mounted file to a private 0600 path
#     (KEYORIX_CONFIG_SOURCE -> KEYORIX_CONFIG_PATH), so the host's owner and
#     mode no longer matter (#2922).
# Needs a backend image newer than v0.95.3 (metrics_token_file and the
# entrypoint steps are new); see docker-compose.secure.yml.
#
# security.enable_file_permission_check is deliberately NOT set (same reason as
# keyorix.docker.yaml; deploy TestShippedComposeConfig_FilePermissionCheckIsOn).
environment: production
server:
  http:
    enabled: true
    # Inside the container the server must listen on all interfaces so the
    # web container (nginx) can reach it. The built-in default is 127.0.0.1
    # only (#2939).
    host: "0.0.0.0"
    port: "8080"
    tls:
      enabled: true
      cert_file: "/app/tls/server.crt"
      key_file: "/app/tls/server.key"
    ratelimit:
      enabled: true
      requests_per_second: 50
      burst: 100
    metrics_token_file: "/app/tls/metrics_token"
  grpc:
    enabled: false
    ratelimit:
      enabled: true
      requests_per_second: 25
      burst: 50
    metrics_token_file: "/app/tls/metrics_token"
security:
  require_transport_tls: true
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    # prefer: TLS when the postgres server offers it. The bundled postgres
    # container has no server certificate, so this connection is plaintext on
    # the internal compose network; for a managed or external postgres use
    # verify-full. Never disable.
    ssl_mode: prefer
    # Password comes from KEYORIX_DB_PASSWORD (set in .env), never committed here.
  encryption:
    enabled: true
    # The wrapped DEK + KEK salt live on the persisted `keys` volume. These MUST
    # survive restarts — losing them, or changing KEYORIX_MASTER_PASSWORD,
    # makes every stored secret undecryptable.
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
