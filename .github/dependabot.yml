# Dependabot for the github-actions ecosystem (#115). Every action `uses:` line
# is now pinned to a full commit SHA rather than a mutable tag — Dependabot
# natively supports bumping a pinned SHA (opening a PR that updates both the SHA
# and its trailing `# vX.Y.Z` comment) for exactly this reason. Without this
# config, SHA-pinning would silently freeze every action forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      # codeql-action ships init/analyze/upload-sarif as separate dependency
      # names (one per sub-action path), so an ungrouped bump lands as
      # separate PRs — merging just one leaves workflows mixing versions,
      # which CodeQL treats as a hard configuration error ("Loaded a
      # configuration file for version X, but running version Y"), failing
      # CI on PRs that have nothing to do with the bump itself (#1257,
      # #1260). Group them so every sub-action bumps atomically in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  # #478: without a gomod entry, Go dependency/toolchain-minimum drift (e.g. #477)
  # has no automated forcing function and depends on someone noticing manually.
  #
  # go-patch-minor groups every patch/minor bump into one PR: each PR (regardless
  # of diff size) pays the same fixed CI cost -- CodeQL/SonarCloud/the full
  # test-suite scale with the codebase, not the diff -- so N ungrouped routine
  # bumps cost roughly N times what one grouped PR costs for the same updates.
  # Patch/minor bumps essentially never conflict with each other and rarely need
  # individual review. Majors are deliberately left ungrouped/individual: they
  # can be breaking and deserve their own review/testing pass, not a bundle that
  # blocks on the slowest one.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-patch-minor:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-patch-minor:
        update-types:
          - "minor"
          - "patch"
  # devtools/vacuum: the OpenAPI linter used by ci.yml's openapi-lint job (own
  # module, not in go.work). A bump changes which findings the lint reports,
  # so it needs the job's red/green canary to pass, same as any ruleset edit.
  - package-ecosystem: gomod
    directory: /devtools/vacuum
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      go-patch-minor:
        update-types:
          - "minor"
          - "patch"
  # ADR-070: web/ (the dashboard, ex-keyorix-web) is now a subtree here.
  # web/.github/dependabot.yml — the pnpm-ecosystem entry that covered it as
  # a standalone repo — is deleted along with the rest of web/.github/ in the
  # same commit; without this entry Dependabot would silently stop updating
  # the frontend's dependency tree entirely.
  #
  # npm-patch-minor groups routine bumps the same way as go-patch-minor above.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
  # The repo root also has its own package.json/package-lock.json
  # (keyorix-ci-tools: cdxgen, pinned for Scorecard
  # supply-chain compliance). Dependabot's security updates already cover
  # it regardless of this file (PR #1687 bumped fast-uri here without any
  # entry below) -- this entry is only for routine patch/minor version
  # updates, which this directory had none of until now.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-patch-minor:
        update-types:
          - "minor"
          - "patch"
