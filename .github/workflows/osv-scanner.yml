name: OSV-Scanner

on:
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '19 17 * * 5'

permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: osv-scanner-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@f4cfcc01edc9c8b756a9b873b7a623ca674da51e" # v1.9.1
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      scan-args: |-
        --recursive
        --skip-git
        ./
      fail-on-vuln: false
