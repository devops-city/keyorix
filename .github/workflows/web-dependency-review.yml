# Frontend (web/, ADR-070) dependency vulnerability review, folded in from
# web/'s own (now-superseded) dependency-review.yml. Promoted as a separate
# path-filtered root workflow rather than merged into an existing root job:
# root has no equivalent GitHub-native dependency-review-action job today
# (osv-scanner.yml/trivy.yml cover known-CVE scanning for the whole repo
# already, but this action additionally gates on the PR's dependency-graph
# diff specifically, which is a distinct check). Path-filtered to web/** so a
# backend-only PR isn't blocked on a check whose diff would always be empty.
name: Web Dependency Review

on:
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths: ['web/**']

permissions: {}

# A newer push to the same PR supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Requires "Dependency graph" to be enabled at the org level:
      # https://github.com/organizations/keyorixhq/settings/security_analysis
      # Until that toggle is on this step reports a GitHub-side "not supported"
      # error; continue-on-error lets the PR merge while not silently removing
      # the check once the feature is enabled (it will start enforcing then).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          # Block any PR that introduces a high or critical known-vulnerable package.
          fail-on-severity: high
          # Mirror the same suppression as web/scripts/audit-check.mjs:
          # react-router RSC-mode CSRF — not reachable in a SPA build.
          allow-ghsas: GHSA-qwww-vcr4-c8h2
          # Post a PR comment summarising what changed so reviewers have context
          # even when the check passes.
          comment-summary-in-pr: always
