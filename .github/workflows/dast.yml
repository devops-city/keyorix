name: DAST
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 3 * * *'  # nightly 3am UTC (was weekly Monday-only -- runner capacity, 2026-09-26)
  workflow_dispatch:

permissions: {}

jobs:
  nuclei:
    name: Nuclei DAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Build server
        run: go build -o /tmp/keyorix-server ./server

      # Without a built web/dist to point web_assets_path at, the server falls
      # back to its "Web UI not bundled in this build" placeholder page at /
      # (see getWebAssetsPath in server/http/router.go) -- Nuclei would only
      # ever see that placeholder, never the real dashboard. Building it here
      # and wiring web_assets_path below (single-binary serving mode, same as
      # an air-gapped production deploy) lets the existing scan below
      # naturally cover the SPA too: its "exposure"/"misconfig" tags are
      # generic web-hygiene checks (missing security headers, exposed
      # .git/.env, etc.), not API-specific, so they now probe real dashboard
      # content instead of a stub.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web/
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build

      - name: Write DAST config
        # SC-015: encryption is enabled so the DAST server matches production
        # configuration (authenticated + encrypted surface).  The DEK is derived
        # from a per-run disposable key via the "env" key provider: KEYORIX_DAST_KEK
        # carries 32 hex-encoded random bytes generated once for this DAST job (see
        # the "Generate DAST KEK" step below); it is never committed or reused.
        run: |
          cat > /tmp/keyorix-dast.yaml << EOF
          environment: "development"
          locale:
            language: "en"
            fallback_language: "en"
          server:
            http:
              enabled: true
              port: "8080"
              domain: "localhost"
              tls:
                enabled: false
              ratelimit:
                enabled: false
              web_assets_path: "${GITHUB_WORKSPACE}/web/dist"
            grpc:
              enabled: false
          storage:
            type: "local"
            database:
              path: "/tmp/keyorix-dast.db"
            encryption:
              enabled: true
              dek_path: "/tmp/keyorix-dast.dek"
              salt_path: "/tmp/keyorix-dast.salt"
              key_provider:
                type: env
                env_var: KEYORIX_DAST_KEK
          security:
            enable_file_permission_check: false
          soft_delete:
            enabled: true
            retention_days: 30
          EOF

      - name: Generate DAST KEK
        # SC-015: generate a per-run disposable hex-encoded 32-byte KEK and export
        # it into GITHUB_ENV so the server start step inherits it.  Never reused.
        run: printf 'KEYORIX_DAST_KEK=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start server
        run: |
          KEYORIX_CONFIG_PATH=/tmp/keyorix-dast.yaml /tmp/keyorix-server &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/health || { echo "Server did not become healthy"; exit 1; }

      - name: Cache Nuclei binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/nuclei
          key: nuclei-v3.3.9-prebuilt-${{ runner.os }}

      - name: Install Nuclei
        # Use the prebuilt release binary instead of `go install`: nuclei v3.3.9
        # transitively pins an old github.com/bytedance/sonic that go:linkname's
        # encoding/json.unquoteBytes -- a symbol removed in Go 1.26+ -- so building
        # from source fails at link ("invalid reference to encoding/json.unquoteBytes").
        # The published binary is built by projectdiscovery with a compatible
        # toolchain. Pinned to v3.3.9 and checksum-verified against the release's
        # own checksums file.
        env:
          NUCLEI_VERSION: 3.3.9
        run: |
          if [ ! -x "$HOME/go/bin/nuclei" ]; then
            mkdir -p "$HOME/go/bin"
            tmp="$(mktemp -d)"; cd "$tmp"
            base="https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}"
            curl -fsSL -O "${base}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
            curl -fsSL -O "${base}/nuclei_${NUCLEI_VERSION}_checksums.txt"
            grep " nuclei_${NUCLEI_VERSION}_linux_amd64.zip$" "nuclei_${NUCLEI_VERSION}_checksums.txt" | sha256sum -c -
            unzip -o "nuclei_${NUCLEI_VERSION}_linux_amd64.zip" nuclei -d "$HOME/go/bin"
            chmod +x "$HOME/go/bin/nuclei"
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/nuclei" -version

      - name: Update Nuclei templates
        run: nuclei -update-templates -silent

      - name: Create empty SARIF fallback
        run: |
          # Single-quoted deliberately: "$schema" here is a literal JSON field
          # name, not a shell variable to expand -- double-quoting would try to
          # substitute a (nonexistent) $schema env var and break the JSON.
          # shellcheck disable=SC2016
          printf '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Nuclei","version":"3.3.9","rules":[]}},"results":[]}]}\n' > /tmp/nuclei-results.sarif


      - name: Run Nuclei (unauthenticated surface)
        run: |
          # -exclude-matchers targets one named matcher inside a template (as
          # opposed to -exclude-id, which drops the whole template) -- every
          # other http-missing-security-headers check (CSP, X-Frame-Options,
          # X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
          # X-Permitted-Cross-Domain-Policies, the three Cross-Origin-* headers)
          # stays active. Alert #825: this DAST job runs the server with
          # tls.enabled=false (an ephemeral plaintext target, see "Write DAST
          # config" above), so Strict-Transport-Security is correctly never
          # sent -- RFC 6797 says a browser MUST ignore HSTS received over
          # plain HTTP, and server/middleware/security_headers.go only sets it
          # when tlsEnabled, which server/middleware/security_headers_test.go's
          # TestSecurityHeaders_HSTSOnlyWithTLS already proves both ways. This
          # scanner has no way to know that; without the exclusion it flags a
          # permanent false positive that no code change here can fix.
          nuclei -target http://localhost:8080 \
                 -tags "auth,token,jwt,exposure,misconfig" \
                 -exclude-tags "ssh,network" \
                 -exclude-matchers "http-missing-security-headers:strict-transport-security" \
                 -sarif-export /tmp/nuclei-results.sarif \
                 -silent \
                 -no-color || true

      - name: Normalize SARIF executionSuccessful
        run: |
          # nuclei v3.3.9 hardcodes invocations[].executionSuccessful=false in
          # its SARIF output even on a clean scan, which GitHub renders as
          # "tool exited with errors". Force it true so a successful scan
          # doesn't falsely alarm.
          jq '(.runs[].invocations[]?.executionSuccessful) = true' /tmp/nuclei-results.sarif > /tmp/nuclei-results.sarif.tmp
          mv /tmp/nuclei-results.sarif.tmp /tmp/nuclei-results.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: /tmp/nuclei-results.sarif
          category: nuclei-dast

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true
