name: CodeQL

on:
  push:
    branches: [main]
  # pull_request: every job is SKIPPED on pull_request since CI-LIGHT-1
  # (2026-10-16, Andrei: GitHub runners are the bottleneck; CodeQL is
  # merge_group + push to main + the weekly schedule only). The trigger stays
  # so the "CodeQL" summary and the Analyze checks still REPORT on a PR (as
  # skipped, which satisfies a required check and costs no runner) and can be
  # made required. Analysis happens in the merge queue instead, against the
  # exact merge result, before anything reaches main -- which also covers the
  # gap that brought pull_request back on 2026-09-29: the backup-v2 tar-slip
  # (#2270) lived only on an unmerged PR branch, so CodeQL never saw it; a PR
  # branch is now analysed the moment it enters the queue. The upload of a
  # merge_group analysis produces GitHub's "Code scanning results / CodeQL"
  # check on the merge group, not on the PR.
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Merge queue. Every REQUIRED status check must also report on the
  # merge_group event or the queue never merges anything -- a check that
  # simply does not run is indistinguishable from one still pending, and it
  # blocks the queue forever rather than failing loudly.
  merge_group:
  schedule:
    # Weekly deep scan: catches newly-published CodeQL query packs against
    # unchanged code, not just what a push/PR diff touches.
    - cron: '17 3 * * 1'

# Workflow-level default: read-only, except the one permission CodeQL's own
# upload step needs (security-events: write, to publish SARIF results to the
# repo's Security tab). Mirrors ci.yml's least-privilege convention (#115).
permissions:
  contents: read # NOSONAR githubactions:S8264 -- workflow-level read is intentional; job-level permissions further restrict (security-events:write only for the upload step)

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes. Also covers the weekly schedule trigger -- if it
# happens to overlap a push-triggered run, that push-run already scans the
# current code, making the concurrent scheduled one redundant.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  # Only the (no-op) pull_request runs are ever superseded; merge_group, push
  # and schedule runs each get their own group (run_id) and are never
  # cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.27.2'

jobs:
  # Classifies the merge group's diff (docs-only, go-unaffected,
  # operator-only, and which of the three analyses it can affect) -- the same
  # detection logic ci.yml's `changes` job uses. push-to-main, the weekly
  # schedule and workflow_dispatch always analyse everything (no base to
  # diff against). A
  # separate job here, not a cross-workflow reference, because GitHub
  # Actions has no mechanism for one workflow file to consume another's job
  # outputs.
  #
  # Gates analyze-server/analyze-operator/analyze-web/summary below via
  # job-level `if:`, NOT a
  # workflow-level `paths-ignore` on the `on:` trigger above. Verified via
  # the actual branch-protection API (not assumed): "Analyze (server)" and
  # "Analyze (operator)" ARE required status checks. A job skipped via
  # job-level `if:` still reports a check-run (conclusion "skipped"), which
  # branch protection treats as satisfying a required check -- a workflow
  # that never triggers at all (paths-ignore) produces no check-run and
  # would leave those two stuck pending forever on a docs-only PR.
  changes:
    # Skipped on pull_request (see the trigger comment above): every job
    # below needs this one, so the whole workflow costs no runner on a PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      # True when every changed file is in a category verified to contain no
      # Go/JS/TS source and nothing any CodeQL build step reads -- same
      # allowlist as ci.yml's own go_unaffected (scripts/, .semgrep/, demo/,
      # integrations/, root repo-metadata files, any workflow file EXCEPT
      # this one). Excludes codeql.yml itself, not ci.yml, since THIS file
      # is what defines the gating logic below -- mirrors ci.yml's identical
      # self-exclusion reasoning for the same reason. A change to ci.yml
      # itself IS safely coverable here (it can't affect CodeQL findings).
      go_unaffected: ${{ steps.filter.outputs.go_unaffected }}
      # True when every changed file is under operator/ -- a separate Go
      # module, so a diff confined to it cannot change the ROOT module's
      # (Analyze (server)) or web/'s (Analyze (javascript-typescript))
      # findings. Deliberately does NOT gate Analyze (operator) itself.
      operator_only: ${{ steps.filter.outputs.operator_only }}
      # merge_group: true when the group diff changes Go in the ROOT module
      # (any *.go, go.mod, go.sum, go.work* outside operator/), or the custom
      # query pack, or this file. Always true for push/schedule/dispatch, so
      # main keeps its full scan, and whenever the diff could not be read.
      root_go_changed: ${{ steps.filter.outputs.root_go_changed }}
      # Same, for the separate operator/ module.
      operator_go_changed: ${{ steps.filter.outputs.operator_go_changed }}
      # merge_group: true when the group diff changes anything under web/.
      # Always true for push/schedule/dispatch (full JS/TS scan of main).
      web_changed: ${{ steps.filter.outputs.web_changed }}
    steps:
      - name: Detect docs-only / go-unaffected / operator-only changes
        id: filter
        # GitHub context values reach the script through env:, never as an
        # expression interpolated into the script text (CI-ENV-INTERP).
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT_NAME" != "merge_group" ]; then
            {
              echo "docs_only=false"
              echo "go_unaffected=false"
              echo "operator_only=false"
              echo "root_go_changed=true"
              echo "operator_go_changed=true"
              echo "web_changed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole group diff (main's tip .. the group commit, every PR in
          # the group). Fail-safe, same as ci.yml: at the compare API's
          # 300-file cap or on any API error `changed` is empty, and an empty
          # list analyses everything.
          changed=$(gh api "repos/$REPO/compare/$MG_BASE_SHA...$MG_HEAD_SHA" --jq '.files[].filename') || changed=""
          if [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 300 ]; then
            changed=""
          fi
          echo "Changed files (merge group):"
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -vE '(\.md$|^docs/)' > /dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          # codeql.yml itself defines this gating logic -- a change to it
          # must always run the full analysis regardless of what else it
          # matches below, so it's checked first and short-circuits to false.
          if echo "$changed" | grep -qx '\.github/workflows/codeql\.yml'; then
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$changed" ] || echo "$changed" | grep -vE '^(scripts/|\.semgrep/|demo/|integrations/|\.github/workflows/|\.gitignore$|\.gitattributes$|LICENSE$|COPYRIGHT$)' > /dev/null; then
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          else
            echo "go_unaffected=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^operator/' > /dev/null; then
            echo "operator_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "operator_only=true" >> "$GITHUB_OUTPUT"
          fi
          # An empty file list (API hiccup) fails safe to "changed".
          always='^(\.github/workflows/codeql\.yml|\.github/codeql/)'
          gofile='(\.go$|(^|/)go\.(mod|sum|work|work\.sum)$)'
          if [ -z "$changed" ] || echo "$changed" | grep -qE "$always" || echo "$changed" | grep -vE '^operator/' | grep -qE "$gofile"; then
            echo "root_go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "root_go_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ] || echo "$changed" | grep -qE "$always" || echo "$changed" | grep -E '^operator/' | grep -qE "$gofile"; then
            echo "operator_go_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "operator_go_changed=false" >> "$GITHUB_OUTPUT"
          fi
          # JS/TS leg: only a group that touches web/** (an empty list fails safe).
          if [ -z "$changed" ] || echo "$changed" | grep -qE '^web/'; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Was a single matrixed `analyze` job (server + operator legs). Split into
  # two jobs because a job-level `if:` cannot reference the `matrix` context
  # (actionlint: "context matrix is not allowed here") -- the "server" leg
  # needs a condition ("operator" leg) doesn't, so per-leg `if:` values are
  # required, which a shared matrix `if:` can't express. Steps are otherwise
  # identical to the pre-split matrix job; only working-directory/GOWORK/
  # category differ, hardcoded per job instead of via ${{ matrix.* }}.
  analyze-server:
    name: Analyze (server)
    needs: [changes]
    # Additionally skips when operator_only -- an operator-only diff can't
    # affect root-module CodeQL findings.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && needs.changes.outputs.root_go_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          # `+` appends to (doesn't replace) CodeQL's default Go query suite. The
          # custom pack (.github/codeql/go-queries) covers bug classes the default
          # suite doesn't: an io.Reader from an outbound client response or a stdin
          # parameter reaching json.NewDecoder unbounded, and a path-based
          # chmod/chown that follows an os.Lstat check on the same path (TOCTOU).
          # Applies to both legs (server, operator) -- init always resolves this
          # path against the repo-root checkout, independent of each leg's later
          # build working-directory.
          queries: +./.github/codeql/go-queries

      - name: Build (server)
        env:
          GOWORK: auto
        run: |
          go build ./...
          go test -run=^$ ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go-server

  # The operator is a separate Go module (controller-runtime/client-go kept
  # out of the root go.work) — same reasoning as ci.yml's dedicated
  # `operator` job, so it needs its own CodeQL build+analyze pass rather
  # than being swept up by the root module's build. Deliberately NOT gated
  # on operator_only, matching ci.yml's `operator` job -- that's exactly the
  # diff shape this job must still run for.
  analyze-operator:
    name: Analyze (operator)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_go_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: +./.github/codeql/go-queries

      - name: Build (operator)
        working-directory: operator
        env:
          GOWORK: off
        run: |
          go build ./...
          go test -run=^$ ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go-operator

  # web/ (ADR-070) is JavaScript/TypeScript, not Go -- a separate job rather
  # than a third matrix entry above, since the Go entries' init/build/analyze
  # steps (build-mode: manual, `go build`+`go test -run=^$`) don't apply here
  # at all: JS/TS uses autobuild (no compile step to run) and its own
  # queries suite. Gated on docs_only/go_unaffected/operator_only via
  # job-level `if:` (see the `changes` job above) -- unlike analyze's two
  # legs, "Analyze (javascript-typescript)" is NOT currently a required
  # status check (verified via the branch-protection API), so this gate is
  # a pure efficiency win with no stuck-pending-check risk either way.
  # operator_only applies here too: an operator-only diff can't touch web/.
  analyze-web:
    name: Analyze (javascript-typescript)
    needs: [changes]
    # On merge_group only when the group touches web/** (web_changed; the
    # same rule the pull_request leg used since 2026-10-11, now applied to
    # the queue). Always runs on push to main and the weekly schedule. Not a
    # required check.
    if: needs.changes.outputs.web_changed == 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          # security-and-quality includes all security queries plus
          # code-quality checks (dead code, error handling, etc.) -- matches
          # what web/'s own (now-superseded) codeql.yml used.
          queries: security-and-quality

      # JS/TS autobuild just discovers source files -- no compile step.
      - uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  # Fan-in convenience job giving a single "CodeQL" status for the whole
  # workflow at a glance. NOT currently a required status check itself
  # (verified via the branch-protection API -- only "Analyze (server)" and
  # "Analyze (operator)" are), so this job's own gating has no stuck-pending
  # risk. Gated on docs_only/go_unaffected (NOT operator_only -- when
  # operator_only is true, analyze-operator still runs for real, so there's
  # still a meaningful result here to report, unlike the docs_only/
  # go_unaffected cases where every dependency is skipped). The check below
  # treats "skipped" as acceptable, not just "success", since operator_only
  # skips analyze-server and analyze-web outright while analyze-operator
  # runs for real -- only an explicit failure/cancellation should fail this
  # check.
  summary:
    name: CodeQL
    needs: [changes, analyze-server, analyze-operator, analyze-web]
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.go_unaffected != 'true'
    steps:
      - name: Check analysis results
        env:
          SERVER_RESULT: ${{ needs.analyze-server.result }}
          OPERATOR_RESULT: ${{ needs.analyze-operator.result }}
          WEB_RESULT: ${{ needs.analyze-web.result }}
        run: |
          for result in "$SERVER_RESULT" "$OPERATOR_RESULT" "$WEB_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "CodeQL analysis failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "All CodeQL analyses passed (or were correctly skipped)"
