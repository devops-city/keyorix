name: Anchore Syft SBOM scan

on:
  push:
    tags: ['v*']
  schedule:
    # Nightly instead of every push to main -- runner capacity, 2026-09-26.
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3.20.24.3.0.24.3
        with:
          path: .
          artifact-name: sbom.spdx.json
