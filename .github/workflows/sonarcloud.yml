name: SonarCloud analysis

on:
  push:
    tags: ['v*']
  schedule:
    # Nightly instead of every push to main -- runner capacity, 2026-09-26.
    # The PR-triggered scan below still runs on every PR, so new-code
    # decoration stays current; only the main-branch baseline re-scan cadence
    # changes, from per-merge to nightly.
    - cron: '27 4 * * *'
  workflow_dispatch:
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains. Note:
    # SonarCloud's new-code baseline comparison is tuned for a main-targeted
    # PR; a PR targeting a feature branch still runs the scan, but the
    # "new code since" comparison point may be less meaningful mid-stack.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths-ignore: ['**/*.md', 'docs/**']

permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Sonar's "New Code Coverage" gate only evaluates lines this PR actually
  # changed (ADR-070's blended-percentage tradeoff is about the overall
  # dashboard number, not the gate). So a PR that touches only web/** has
  # zero new Go lines to score, and vice versa -- generating the other
  # ecosystem's coverage report is then pure CI time with no effect on the
  # gate. Mirrors the `changes`/docs_only job in ci.yml (same gh api
  # approach, no external paths-filter action needed).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_go: ${{ steps.filter.outputs.skip_go }}
      skip_web: ${{ steps.filter.outputs.skip_web }}
    steps:
      - name: Detect which ecosystem(s) changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main updates the persistent project baseline, not just
            # a PR's new-code diff -- always regenerate both reports so the
            # dashboard's overall (not just new-code) numbers stay accurate.
            echo "skip_go=false" >> "$GITHUB_OUTPUT"
            echo "skip_web=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "$changed"
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^web/' > /dev/null; then
            echo "skip_go=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_go=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ] || echo "$changed" | grep -E '^web/' > /dev/null; then
            echo "skip_web=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_web=true" >> "$GITHUB_OUTPUT"
          fi

  Analysis:
    needs: [changes]
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.skip_go != 'true'
        with:
          go-version: '1.27.2'

      # On main this is the whole-project baseline and runs ./... unchanged.
      #
      # On a pull request it runs ONLY the packages whose files the PR
      # touches. This is not an approximation: `go test -coverprofile` with no
      # -coverpkg records coverage for each package from that package's OWN
      # tests only, so for any given package the profile produced by
      # `go test ./that/package` is byte-for-byte what `go test ./...` would
      # have produced for it. Restricting the set therefore cannot change the
      # coverage number SonarCloud computes for any changed package -- and a
      # package with no changed files contributes no new code, so it cannot
      # move "Coverage on New Code" either. Overall project coverage continues
      # to come from the main-branch analysis, which is where SonarCloud takes
      # it from regardless.
      #
      # What this buys: the ./... form re-ran the entire Go suite, unsharded,
      # on every PR push -- 19 minutes on run 34329184317, recomputing
      # coverage the ci.yml test-suite matrix had already computed and merged
      # in the same run, and holding one of the Free plan's 20 concurrent job
      # slots for the length of the critical path. A typical PR touches a
      # handful of packages and now takes seconds.
      #
      # continue-on-error is kept (a failing test is ci.yml's job to gate, not
      # this workflow's) but is no longer silent: the guard below fails loudly
      # if the run produced no usable profile, so a coverage figure on the
      # SonarCloud dashboard is never quietly sourced from a run that died.
      - name: Generate coverage report
        id: gocov
        if: needs.changes.outputs.skip_go != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            go test -timeout 600s -coverprofile=coverage.out -covermode=set ./...
            exit $?
          fi
          changed=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' | grep '\.go$' || true)
          if [ -z "$changed" ]; then
            echo "No .go files changed; skipping Go coverage (no new Go code to measure)."
            exit 0
          fi
          # Deleted files leave a directory that no longer exists, and a path
          # under a directory with no buildable package makes `go test` fail
          # the whole invocation -- filter both out rather than letting one
          # deleted file cost the entire report.
          pkgs=""
          while IFS= read -r d; do
            [ -d "$d" ] || continue
            go list "./$d" >/dev/null 2>&1 || continue
            pkgs="$pkgs ./$d"
          done < <(echo "$changed" | xargs -n1 dirname | sort -u)
          if [ -z "$pkgs" ]; then
            echo "No buildable Go packages among the changed files; skipping."
            exit 0
          fi
          echo "Changed Go packages:$pkgs"
          # shellcheck disable=SC2086
          go test -timeout 600s -coverprofile=coverage.out -covermode=set $pkgs

      # The step above is continue-on-error, which is how a broken coverage run
      # previously reached SonarCloud as a silently truncated (or absent)
      # profile. Distinguish "legitimately nothing to measure" from "the run
      # failed and the number you are about to publish is wrong".
      - name: Verify coverage profile is usable
        if: needs.changes.outputs.skip_go != 'true'
        run: |
          if [ ! -f coverage.out ]; then
            echo "::notice::No Go coverage profile produced (no Go packages changed). Not publishing Go coverage for this analysis."
            exit 0
          fi
          if [ "$(wc -l < coverage.out)" -lt 2 ]; then
            # A header-only profile is legitimate when every changed package has
            # no statements (e.g. a PR touching only _test.go files, where go test
            # reports "coverage: [no statements]"). Only a FAILED test step makes
            # it an error (#2021 was blocked by the old "empty means failed" rule).
            if [ "${{ steps.gocov.outcome }}" = "success" ]; then
              echo "::notice::Changed packages contain no measurable statements (test-only change). Not publishing Go coverage for this analysis."
              rm -f coverage.out
              exit 0
            fi
            echo "::error::coverage.out exists but contains no coverage data -- the test run above failed. Refusing to publish an empty Go coverage figure to SonarCloud."
            exit 1
          fi
          echo "Go coverage profile: $(( $(wc -l < coverage.out) - 1 )) blocks."

      # web/ (ADR-070) coverage, feeding sonar.javascript.lcov.reportPaths in
      # sonar-project.properties — folded in here rather than kept as a
      # separate SonarCloud project/workflow. --ignore-scripts: see the
      # identical reasoning in web-ci.yml.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.skip_web != 'true'
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.skip_web != 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Generate web/ coverage report
        if: needs.changes.outputs.skip_web != 'true'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test:coverage --run
        continue-on-error: true

      # scripts/mutation-testing/summarize.py's coverage, feeding
      # sonar.python.coverage.reportPaths below. Always run (not gated by the
      # changes job like the Go/web steps above) — it's a single tiny test
      # file, well under a second, and skipping it is exactly how this
      # script's "New Code Coverage" gate ended up at 0% in the first place
      # (PR #1353).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Generate mutation-testing script coverage report
        run: |
          python3 -m pip install --quiet --require-hashes -r scripts/mutation-testing/requirements-test.txt
          python3 -m coverage run --branch -m pytest scripts/mutation-testing
          python3 -m coverage xml -o coverage-python.xml --include='scripts/mutation-testing/summarize.py'

      # SonarCloud resolves lcov SF: paths relative to sonar.projectBaseDir
      # (this workflow's `.`, i.e. the repo root) -- vitest writes them
      # relative to wherever it ran (web/, via working-directory above), e.g.
      # `SF:src/App.tsx`. Left as-is, every one of those fails to match the
      # actual analyzed path (web/src/App.tsx) and JS coverage silently comes
      # out as zero. Rewrite in place before the scan reads it.
      - name: Fix web/ coverage report paths for SonarCloud
        run: sed -i 's|^SF:|SF:web/|' web/coverage/lcov.info
        if: hashFiles('web/coverage/lcov.info') != ''

      # Was SonarSource/sonarcloud-github-action, which is itself deprecated (its
      # own action.yml prints a warning on every run: "This action is deprecated
      # ... Please use the sonarqube-scan-action action instead") and was already
      # just a thin wrapper delegating straight to this same action -- confirmed
      # by reading both actions' source at their pinned refs before migrating,
      # not assumed. Also resolves the original "cache the scanner CLI" ask a
      # different way than proposed: sonarqube-scan-action already caches the
      # scanner CLI internally via its own actions/cache step (path keyed on
      # scannerVersion+os+arch), so no additional caching needs adding here --
      # wrapping another cache around this would just duplicate what's already
      # inside the action.
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=keyorixhq_keyorix
            -Dsonar.organization=keyorixhq
            -Dsonar.go.coverage.reportPaths=coverage.out
            -Dsonar.python.coverage.reportPaths=coverage-python.xml
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=false
          projectBaseDir: .
