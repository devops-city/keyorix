name: Hadolint

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths-ignore: ['**/*.md', 'docs/**']
  schedule:
    - cron: '26 12 * * 5'

permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes.
concurrency:
  group: hadolint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Run hadolint on all Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          recursive: true
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: hadolint-results.sarif
          wait-for-processing: true
