# Frontend (web/, ADR-070) type-check/lint/build/test/e2e gate. Folded in from
# web/'s own (now-superseded) ci.yml. Path-filtered to web/** so a backend-only
# commit never spins up pnpm, and a frontend-only commit never waits on Go
# jobs -- this is deliberately a plain workflow-level path filter, not the
# job-level `if:`-plus-detection-job pattern ci.yml's own docs-only skip uses,
# because neither `gate` nor `e2e` is a branch-protection required status
# check today (unlike ci.yml's build-and-test/lint/etc.) -- a workflow that
# never triggers at all produces no check-run, which is only a problem for a
# check something else is waiting on. If these become required checks later,
# revisit with the same job-level pattern ci.yml uses.
#
# web/'s own gitleaks sub-job is dropped here, not folded: root ci.yml's own
# gitleaks job already scans the whole repository unconditionally (no path
# filter, full history via fetch-depth: 0), so it already covers web/ for
# free once web/ is part of this repo -- a second, web/-scoped gitleaks run
# would be pure redundant work, not additional coverage.
name: Web CI

on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    # See ci.yml's own comment: also covers stacked-PR review chains.
    branches: [main, 'adr082/**', 'feat/**', 'fix/**']
    paths: ['web/**']

# Workflow-level default: zero permissions, matching ci.yml's own least-privilege
# convention (#115). Each job grants exactly what it needs below.
permissions: {}

# Cancel superseded runs on the same ref (matches web's original ci.yml).
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  gate:
    name: type-check · lint · build · test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --ignore-scripts: don't let any dependency's install-time lifecycle
      # script run with CI's ambient permissions — classic supply-chain
      # vector (a compromised transitive dependency's postinstall script).
      # pnpm's own default-deny (pnpm 10+) already blocks unlisted lifecycle
      # scripts; web/pnpm-workspace.yaml's allowBuilds: esbuild: true still
      # runs esbuild's allowlisted build step under --ignore-scripts (verified:
      # build/lint/type-check/test all still pass with this flag).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fails if src/types/api-generated.ts (generated by openapi-typescript
      # from ../server/http/handlers/openapi.yaml, see package.json's
      # generate:api-types) drifts from the spec -- e.g. someone edited the
      # spec, or hand-edited the generated file, without re-running the
      # generator and committing the result.
      - name: Generated API types are fresh
        run: pnpm check:api-types-fresh

      # Every apiClient.{get,post,put,patch,delete}(...) call in src/services/*.ts
      # must resolve to a real operation in ../server/http/handlers/openapi.yaml,
      # with a compatible method and (where statically provable) its required
      # body fields -- see scripts/check-api-contract.mjs's own header for why
      # (#2441) and its KNOWN_VIOLATIONS allowlist for pre-existing gaps.
      - name: Web API calls match openapi.yaml
        run: pnpm check:api-contract

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # `test` is bare `vitest` (watch mode); --run forces a single pass.
      - name: Test
        run: pnpm test --run

      # Verifies all production dependency licenses are permissive (MIT, Apache-2.0,
      # BSD variants, ISC). Blocks any accidental GPL/AGPL/LGPL ingestion that
      # would require open-sourcing Keyorix's product code. Uses pnpm's built-in
      # `licenses list` command — no external tool needed.
      - name: Check dependency licenses
        run: node scripts/license-check.mjs

      # Fails on high/critical known-vulnerable dependencies (govulncheck's
      # equivalent for the npm ecosystem, mirrored from keyorix's CI). Scoped to
      # --prod: dev-only tooling (jsdom/vitest's undici chain) never ships and
      # would make this gate noisy with findings that carry no real exposure.
      # Pipes through scripts/audit-check.mjs so known non-applicable advisories
      # (react-router RSC-mode CVE, not reachable in SPA builds) can be suppressed
      # without silently ignoring all findings.
      - name: Audit dependencies
        run: pnpm audit --json --prod | node scripts/audit-check.mjs

  e2e:
    name: e2e (Playwright)
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --ignore-scripts: don't let any dependency's install-time lifecycle
      # script run with CI's ambient permissions — classic supply-chain
      # vector (a compromised transitive dependency's postinstall script).
      # pnpm's own default-deny (pnpm 10+) already blocks unlisted lifecycle
      # scripts; web/pnpm-workspace.yaml's allowBuilds: esbuild: true still
      # runs esbuild's allowlisted build step under --ignore-scripts (verified:
      # build/lint/type-check/test all still pass with this flag).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Keyed on the lockfile hash, not a hand-extracted Playwright version --
      # ANY dependency bump invalidates this (coarser than strictly necessary,
      # but simpler and correct: a change to the pinned Playwright version
      # always changes pnpm-lock.yaml too). Caching the browser binary dir
      # alone doesn't cover --with-deps' apt-installed system libraries, so a
      # cache hit still runs the cheap, idempotent install-deps-only pass
      # below rather than skipping browser setup entirely.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      # Chromium-only (playwright.config.ts) to keep this job fast.
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit -- browser binary already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
