name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    # `labeled` added (on top of the implicit opened/synchronize/reopened
    # default) so adding the ci:full label actually fires a new run -- a
    # label change alone reaches no other trigger type. This does mean any
    # label add (not just ci:full) spins up a full new FAST-job run; the
    # existing concurrency block below cancels a superseded one immediately,
    # so this costs one extra ~5min run per irrelevant label event, not a
    # pile-up.
    types: [opened, synchronize, reopened, labeled]
    # main plus the stacked-PR branch conventions used for multi-PR review
    # chains (each PR in a stack targets its predecessor's branch, not main
    # directly, until it's that PR's turn to land) — without these, a PR
    # based on a sibling feature branch never triggers CI at all.
    # release/** (2026-10-13, Andrei approved): patch releases are cut from
    # release/vX.Y.x branches at the tag commit, and their PRs need CI too.
    branches: [main, 'release/**', 'adr082/**', 'feat/**', 'fix/**']
  # Merge queue. Every REQUIRED status check must also report on the
  # merge_group event or the queue never merges anything -- a check that
  # simply does not run is indistinguishable from one still pending, and it
  # blocks the queue forever rather than failing loudly.
  merge_group:
  # Manual trigger for the full -race test-suite matrix outside a PR/queue
  # context (e.g. investigating a suspected flake on a specific ref).
  # With select_base set, the run takes the merge queue's selection path
  # instead (the `select` job below, diffed against that commit): the way to
  # prove a selection change on a branch without enqueueing anything. Empty
  # (the default) is the full suite, exactly as before.
  workflow_dispatch:
    inputs:
      select_base:
        description: 'Optional base commit: run the merge-queue selection against it instead of the full suite'
        required: false
        default: ''
        type: string
  # Nightly full run on main. A push to main skips test-suite, e2e-smoke and
  # most other jobs whenever the merge queue already passed that exact SHA
  # (changes.queue_verified), so "main green" said nothing about the journeys:
  # TestJourney_BreakGlass failed deterministically on main after #2454 and
  # looked like a flake. The schedule event takes the same `changes` path as
  # workflow_dispatch (queue_verified=false, every *_only filter false), so
  # everything that runs on push also runs here; test-suite, build-and-test's
  # gate and the boot-smoke jobs list `schedule` explicitly below. The
  # nightly-failure-issue job at the end files an issue when the run fails.
  # Scheduled runs always use the default branch (main).
  schedule:
    - cron: '17 2 * * *'

# Workflow-level default: zero permissions. No job here writes to the repo,
# comments on PRs, or publishes anything — a compromised dependency/action in
# any step gets the narrowest possible GITHUB_TOKEN rather than the
# (potentially read/write) repo default (#115). Each job below grants exactly
# the permissions it needs (contents: read to check out code, plus whatever
# extra scope a specific job requires) rather than inheriting a workflow-wide
# default -- SonarCloud's least-privilege rule for GitHub Actions permissions
# flags a blanket workflow-level grant even when it's already read-only.
permissions: {}

# Cancel superseded runs on the same ref (matches web-ci.yml's own convention):
# a later push/merge on the same branch makes an in-flight run's result moot
# before it even finishes, and this is by far the most expensive workflow here
# (18 parallel test-suite shards among ~30 jobs) -- letting a superseded run
# burn its full runtime is pure wasted Actions-minute spend.
# A `labeled` event for any label other than ci:full gets its own group (suffixed
# with run_id), so it never cancels the PR's in-flight run. Before this, every
# review/triage label add killed a PR's queued CI mid-run; on 2026-10-03 that
# left ~20 approved PRs with an all-cancelled run reported as a build-and-test
# failure. A push (synchronize), reopen, or the ci:full label still supersede
# the in-flight run exactly as before.
# Only pull_request runs are ever superseded. push to main, merge_group and
# workflow_dispatch get a group of their own (run_id), so neither an in-flight
# nor a queued run of those is cancelled by a newer one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned security tooling (SSDLC Phase 1, June 2026). Do not use @latest:
  # the tools that gate our security checks are themselves a supply-chain
  # surface. govulncheck deliberately floats — Google x/ tool, vuln DB is
  # fetched live regardless of binary version.
  GOSEC_VERSION: v2.29.0
  # gosec v2.29.0 (latest as of 2026-10) still links golang.org/x/tools
  # v0.49.0, which can only decode export-data format version <=4. Go
  # 1.27.2 writes format version 5 (see GOLANGCI_LINT_VERSION's comment
  # below for the same root cause) -- a vanilla `go install gosec@...`
  # binary type-errors on every package and skips all SSA-based rules.
  # scripts/ci/install-gosec.sh builds gosec in a throwaway module that
  # also requires this x/tools version, so MVS picks it over gosec's own
  # older requirement. Bump this whenever x/tools' own export-data reader
  # falls behind the Go toolchain again.
  GOSEC_TOOLS_VERSION: v0.51.0
  # v2.13.2 links golang.org/x/tools v0.49.0, whose gcimporter only reads
  # export-data format version <=4; Go 1.27.2 (GO-2026-6610..6617 fix)
  # writes version 5, so golangci-lint on this toolchain type-errors on
  # every single-file typecheck ("export data version 5 is greater than
  # maximum supported version 4"). v2.14.0 links x/tools v0.50.0, which
  # added the v5 decoder.
  GOLANGCI_LINT_VERSION: v2.14.0
  GO_LICENSES_VERSION: v1.6.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_LINUX_AMD64_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  # Pinned pyinstaller binary release (not `pip install`, so the scanner brings no
  # Python/pip dependency-resolution surface of its own). checkov publishes no
  # official checksums file, so this hash was computed locally from the release
  # asset and pinned here, matching the gitleaks/kubeconform convention above.
  CHECKOV_VERSION: 3.3.6
  CHECKOV_LINUX_X64_SHA256: 0b4f043603225acc55812d896233c98fdfe13e8de31dbbcb18edc669812fb667
  # actionlint publishes an official checksums.txt; verified it against a
  # locally-recomputed sha256 of the same asset before pinning here, matching
  # the gitleaks/kubeconform convention above rather than trusting either
  # source alone.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # kube-score publishes an official checksums.txt; verified the linux_amd64
  # tarball's sha256 against it locally before pinning here, matching the
  # gitleaks/kubeconform/checkov/actionlint convention above.
  KUBE_SCORE_VERSION: 1.20.0
  KUBE_SCORE_LINUX_AMD64_SHA256: ff777b4b3f45905b2d22c69e93c57a7a170e61529a79d54e59cb95cca4bc2a55
  COVERAGE_FLOOR: '80'

jobs:
  # Detects PR changes that touch nothing but *.md/docs/** (a "docs-only" PR),
  # and separately whether a PR touches nothing but web/** ("web-only").
  # Every code-verification job below (preflight, test-suite, static-analysis,
  # exclusion-freshness, assert-leg-completeness, lint, licenses, operator,
  # helm-*, openapi-lint, fuzz-targets, and the build-and-test aggregator) is
  # gated on BOTH `docs_only != 'true'` AND `web_only != 'true'` -- go tests,
  # go lint, Helm charts, dependency licenses, and the operator module cannot
  # be affected by a *.md/docs/** change, and (2026-08-29) verified they can't
  # be affected by a web/-only change either: server/webui/embed.go's
  # `//go:embed all:dist` looks like it ties the Go build to web/'s output,
  # but server/webui/dist/ holds only a committed placeholder in this repo --
  # the real web build only gets copied in by `make build-ui`, which ci.yml
  # never runs (that's release.yml/docker-publish.yml's job). So `go build`/
  # `go test` embed the same placeholder regardless of what changes in web/,
  # and a web-only PR genuinely cannot change any of these jobs' outcome.
  # Verified empirically too, not just by reading: PR #1514 (52 files, all
  # under web/) ran the full pre-this-fix test-suite matrix + preflight +
  # static-analysis + lint + licenses + operator + helm-* + openapi-lint to
  # completion, ~21 minutes, on a diff that never touched a .go file. A job
  # skipped via a job-level `if:` still reports a check-run
  # (conclusion "skipped"), and branch protection treats a skipped required
  # check as satisfying the requirement -- this is different from (and safe,
  # unlike) gating an entire workflow via top-level `paths-ignore`, which
  # prevents the check-run from being created at all and leaves a *required*
  # check stuck pending forever (why codeql.yml's Analyze (server)/(operator)
  # and this workflow's own trigger are deliberately NOT path-filtered).
  #
  # Scoped to pull_request and merge_group (2026-09-28: the merge queue's
  # 18-shard matrix was running in full for docs-only groups). push-to-main
  # still always runs everything (once per merge; not worth diffing).
  #
  # gitleaks is NOT gated by this: a secret pasted into a markdown file is
  # exactly the class of leak gitleaks exists to catch, so it always runs
  # regardless of docs_only.
  #
  # Two CI profiles (CI-LIGHT-1, 2026-10-16: GitHub runners were the
  # bottleneck, ~60 concurrent jobs fully used and ~31,000 runner-minutes a
  # day, measured in ~/proj/prompts/reports/SESSION-CI-LIGHT-1.md):
  #   - FAST: a pull_request without the ci:full label. Build, vet, lint,
  #     gosec/govulncheck, the guard and freshness checks, the changelog and
  #     ledger checks (adr-numbers), test-quick, gitleaks, plus the jobs whose
  #     inputs the PR actually touched (operator/, migrate/, cli/, go.mod,
  #     deploy/helm/, the OpenAPI spec).
  #   - FULL: merge_group, push to main/release, schedule, workflow_dispatch,
  #     a pull_request carrying ci:full, and every pull_request into release/**
  #     (no merge queue there, so the PR run is the last gate). Every job, exactly as before:
  #     the 22-leg -race test-suite, e2e/web-e2e/boot/demo smokes, fuzz-targets/
  #     fuzz-reach, the QUICK_START smoke, every module and chart job.
  # Every check that ran on pull_request before still runs before anything
  # reaches main: either still on the PR, or in the merge queue (FULL). Jobs
  # skipped in FAST report "skipped", which satisfies a required check; the
  # merge queue then runs them for real against the merge result.
  #
  # Merge-queue SELECTION (CI-SELECT-1, 2026-10-18; Andrei approved cutting
  # queue demand without new runners): inside the FULL profile, a merge_group
  # run tests only what its own diff can affect. Each queue entry's base_sha
  # is the entry ahead of it (or main), so the diff is that one PR. The
  # `select` job below computes the affected root-module packages and the
  # path gates (scripts/ci/select-affected.py); test-suite legs with nothing
  # affected skip their steps and still report success, and the heavy
  # path-gated jobs skip when their inputs are untouched. Every repo-wide
  # guard still runs (repo-guards, scripts/ci/run-guards.sh). push to main,
  # the nightly schedule and a plain workflow_dispatch never select: they run
  # everything exactly as before, and the nightly run is the full-suite
  # safety net (its failure issue names the PRs merged since the last green
  # nightly, so a selection miss is traceable).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # actions: read -- only for the push-event queue_verified lookup below
      # (lists this workflow's own merge_group runs for github.sha).
      actions: read
    outputs:
      # 'true' = FULL profile (see above), 'false' = FAST. Only a pull_request
      # without the ci:full label, into a branch other than release/**, is FAST.
      full_profile: ${{ steps.filter.outputs.full_profile }}
      # Path relevance for the FAST profile's conditional jobs: each is true
      # when the PR touches that job's inputs (or ci.yml itself, same
      # self-skip-proofing rule as every positive-match output below), and
      # always true outside pull_request and when the file list is unknown.
      # A FULL run ignores them (every job runs).
      operator_changed: ${{ steps.filter.outputs.operator_changed }}
      migrate_changed: ${{ steps.filter.outputs.migrate_changed }}
      cli_changed: ${{ steps.filter.outputs.cli_changed }}
      deps_changed: ${{ steps.filter.outputs.deps_changed }}
      helm_changed: ${{ steps.filter.outputs.helm_changed }}
      openapi_changed: ${{ steps.filter.outputs.openapi_changed }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      # True only on a push to main whose EXACT commit (github.sha) already
      # passed this workflow on the merge_group event. The merge queue
      # fast-forwards main to the very commit it tested, so re-running the
      # whole matrix on that push re-tests an identical tree (~155 runner
      # minutes per merge on the Free plan's 20-runner cap). Every job that
      # also runs on merge_group skips on such a push; a push that did NOT
      # come through a green queue run (admin bypass, a failed lookup) gets
      # the full suite exactly as before -- fail-safe toward running.
      queue_verified: ${{ steps.filter.outputs.queue_verified }}
      # web/ (ADR-070) lives in this repo now, so a frontend-only PR is no
      # longer isolated in its own repo+CI -- it flows through this same
      # workflow. Used to skip every job that's backend-only busywork on a
      # diff that can't possibly change their outcome -- see this file's own
      # top-of-jobs comment for why the go:embed-shaped concern that
      # originally kept this OUT of docs_only's job set doesn't actually
      # apply (server/webui/dist is a committed placeholder in every ci.yml
      # run; the real web build never reaches it here).
      web_only: ${{ steps.filter.outputs.web_only }}
      # True when every changed file is in a category verified to contain no
      # Go source and nothing any Go build/test/lint/vuln-scan step reads:
      # scripts/ (shell/Python tooling, not part of any go.mod -- verified no
      # .go files), .semgrep/ (rule YAML), demo/ and integrations/ (shell/
      # YAML/JS samples, verified no .go files), root repo-metadata files, and
      # any workflow file EXCEPT ci.yml itself (this file defines the gating
      # logic below, so a change to it must always run the full suite to
      # validate the change). A separate, non-overlapping check from
      # docs_only above (no need to also match \.md$/^docs/ here -- jobs
      # check both outputs). Deliberately does NOT include: examples/
      # (contains real root-module .go files with no separate go.mod),
      # configs/ (plausibly read by config-loading code via a search path,
      # not verified safe), migrations/ (contains a .go file, plausibly
      # exercised by tests), or go.mod/go.sum/go.work (dependency changes
      # must always run the full suite). An allowlist, not a denylist,
      # deliberately -- a new top-level directory added later and never
      # added here just means this stays false (full suite runs, safe);
      # a denylist would instead default to skipping an unrecognized
      # directory, silently under-testing it.
      go_unaffected: ${{ steps.filter.outputs.go_unaffected }}
      # True when every changed file is under operator/ -- a separate Go
      # module (own go.mod, excluded from go.work), so a diff confined to it
      # cannot change the ROOT module's test/build/lint/vuln-scan/license
      # outcomes. Deliberately does NOT gate the `operator` job itself below,
      # which is exactly what must still run for this case.
      operator_only: ${{ steps.filter.outputs.operator_only }}
      # True (POSITIVE match, unlike every other output above) when this run
      # could plausibly affect whether the Docker Compose stack or the Helm
      # chart actually boots: Dockerfile*/docker-compose*/keyorix.docker.yaml
      # (the exact files item 1's encryption-boot-path fix and its crash-loop
      # touched), deploy/helm/** (the chart, including its own copy of the
      # same config shape), internal/encryption/** (the code that derives the
      # KEK and places dek.lock -- the actual root cause, not just the config
      # files), and server/** (broad on purpose: almost anything server-side
      # can change whether the server boots) -- OR a change to ci.yml itself
      # (this file defines the gating logic for these jobs, so a PR touching
      # only ci.yml, e.g. these jobs' own definitions, must not be able to
      # skip them -- the one case that most needs to exercise them; see the
      # filter step's own comment for how this was actually caught live, not
      # just reasoned about). Gates docker-boot-smoke/helm-boot-smoke below
      # so they don't run on every unrelated change (a docs-only or web-only
      # change can't affect either). Those jobs are FULL-profile only since
      # CI-LIGHT-1: on merge_group this is computed from the whole group diff
      # (same regex), true for push/workflow_dispatch/schedule (no file list),
      # and true whenever the file list could not be read (fail-safe).
      boot_smoke_relevant: ${{ steps.filter.outputs.boot_smoke_relevant }}
      # True (POSITIVE match, same shape as boot_smoke_relevant) when this
      # run could plausibly affect the real-backend web UI smoke
      # (web-e2e-real-smoke below): web/** (the UI itself) or server/http/**
      # (the API it actually calls against a real backend -- unlike the
      # mocked web/e2e suite, this one would catch a contract break there),
      # or ci.yml itself (same self-skip-proofing reasoning as every other
      # positive-match output above). Always true for a non-pull_request run
      # (there is no PR file list to check). web-e2e-real-smoke runs on
      # pull_request and merge_group; for merge_group this is always true, so
      # a non-docs, non-operator-only group always runs it. push/dispatch do
      # not run it, so the value is moot there.
      web_e2e_relevant: ${{ steps.filter.outputs.web_e2e_relevant }}
      # True (POSITIVE match, same shape as boot_smoke_relevant) when this run
      # could plausibly affect scripts/demo/up.sh|down.sh or what they build
      # on top of: scripts/demo/** itself, server/Dockerfile (the image up.sh
      # builds), server/webui/** (populate-webui-dist's target, embedded into
      # that image), or ci.yml itself (same self-skip-proofing reasoning as
      # every other positive-match output above). Gates demo-up-smoke below.
      demo_smoke_relevant: ${{ steps.filter.outputs.demo_smoke_relevant }}
      # True (POSITIVE match) when this run could plausibly affect the
      # fault-tolerance issue-state check (adr-numbers job, "Verify every
      # fault-injection tolerance cites an open issue" below): server/faultops/
      # (knownOpenTolerances itself, and TestDumpKnownOpenTolerances that reads
      # it) or scripts/check-fault-tolerance-issues.sh (the check itself), or
      # ci.yml (same self-skip-proofing reasoning as every other positive-match
      # output above). Computed the same way for pull_request and merge_group
      # (both have a real file list); defaults true for push/workflow_dispatch,
      # same as boot_smoke_relevant/web_e2e_relevant, since there's no file
      # list to check there and both are rare enough that running it
      # unconditionally costs nothing. Deliberately NOT run on every PR
      # regardless of path: this check calls the GitHub API per tolerance row,
      # and a transient API error or a routinely-closed issue would otherwise
      # turn CI red for every unrelated PR until someone edits the table. The
      # nightly schedule (.github/workflows/fault-tolerance-nightly.yml) is
      # the unconditional full check; this is the narrow PR-time one.
      fault_tolerance_relevant: ${{ steps.filter.outputs.fault_tolerance_relevant }}
    steps:
      - name: Detect docs-only / web-only / go-unaffected / operator-only / boot-smoke-relevant changes
        id: filter
        # Every GitHub context value reaches the script through env:, never
        # as an expression interpolated into the script text (CI-ENV-INTERP,
        # code-scanning #1198): branch names, labels and SHAs are data here,
        # never shell syntax.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HAS_CI_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # FAST only for a pull_request without ci:full; everything else is
          # FULL. A PR into release/** is always FULL: only main has a merge
          # queue, so for a release branch the PR run is the last gate.
          full_profile=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_CI_FULL_LABEL" != "true" ]; then
            case "$BASE_REF" in
              release/*) ;;
              *) full_profile=false ;;
            esac
          fi
          echo "full_profile=$full_profile"
          echo "full_profile=$full_profile" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "merge_group" ]; then
            # Merge queue (2026-09-28): classify the WHOLE group diff (main's
            # tip .. the group commit, which includes every earlier PR in the
            # same group), so a docs-only / web-only group skips the 18-shard
            # test matrix exactly like the same PR already does on
            # pull_request. Fail-safe: the compare API lists at most 300
            # files; at or above that, or on any API error, `changed` is
            # emptied, and every output below treats an empty list as "run":
            # *_only false, *_relevant and *_changed true.
            changed=$(gh api "repos/$REPO/compare/$MG_BASE_SHA...$MG_HEAD_SHA" --jq '.files[].filename') || changed=""
            if [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 300 ]; then
              changed=""
            fi
            echo "Changed files (merge group):"
            echo "$changed"
          elif [ "$EVENT_NAME" != "pull_request" ]; then
            queue_verified=false
            if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$SHA&status=success&per_page=1" --jq '.total_count') || n=0
              if [ "${n:-0}" -ge 1 ] 2>/dev/null; then
                queue_verified=true
              fi
            fi
            echo "queue_verified=$queue_verified"
            echo "queue_verified=$queue_verified" >> "$GITHUB_OUTPUT"
            {
              echo "docs_only=false"
              echo "web_only=false"
              echo "go_unaffected=false"
              echo "operator_only=false"
              echo "boot_smoke_relevant=true"
              echo "web_e2e_relevant=true"
              echo "demo_smoke_relevant=true"
              echo "fault_tolerance_relevant=true"
              echo "operator_changed=true"
              echo "migrate_changed=true"
              echo "cli_changed=true"
              echo "deps_changed=true"
              echo "helm_changed=true"
              echo "openapi_changed=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            changed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') || changed=""
          fi
          echo "Changed files:"
          echo "$changed"

          # relevant NAME REGEX: NAME=true when the list is unknown (empty:
          # API error or the 300-file cap), when ci.yml itself changed, or
          # when any changed file matches REGEX; else false. A change to
          # ci.yml itself must always run these jobs: this file defines the
          # gating logic FOR them, so a change to it (e.g. these jobs' own
          # definitions) is exactly the case that must not be able to skip
          # itself. Confirmed live before this helper existed: a PR touching
          # only ci.yml (adding the boot-smoke jobs) evaluated the path regex
          # against ci.yml's own path, matched nothing, and both jobs showed
          # "skipping" -- the one PR that most needed to exercise them.
          relevant() {
            if [ -z "$changed" ] || echo "$changed" | grep -qx '\.github/workflows/ci\.yml' || echo "$changed" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          relevant boot_smoke_relevant '^(Dockerfile|docker-compose|keyorix\.docker\.yaml$|deploy/helm/|internal/encryption/|server/)'
          relevant demo_smoke_relevant '^(scripts/demo/|server/Dockerfile$|server/webui/|web/src/|server/http/)'
          # scripts/e2e/web-real-smoke.sh IS the harness web-e2e-real-smoke
          # runs (#2738): a change confined to it previously skipped the one
          # job that would exercise it.
          relevant web_e2e_relevant '^(web/|server/http/|scripts/e2e/web-real-smoke\.sh$)'
          relevant fault_tolerance_relevant '^server/faultops/|^scripts/check-fault-tolerance-issues\.sh$'
          # FAST-profile path gates. operator/ and migrate/ are separate Go
          # modules with no dependency on the root module (no replace to
          # ../), so only their own tree changes them. cli/ imports the root
          # module, but test-quick-cli already runs the affected cli packages'
          # tests on every Go PR; this gates the cli module's own vet/lint/
          # gosec job. deps_changed gates go-licenses (it reads the module
          # graph). helm_changed is everything the three helm-chart jobs read.
          # openapi_changed is everything openapi-lint reads.
          relevant operator_changed '^operator/'
          relevant migrate_changed '^migrate/'
          relevant cli_changed '^cli/'
          relevant deps_changed '(^|/)go\.(mod|sum|work|work\.sum)$'
          relevant helm_changed '^(deploy/helm/|\.github/testdata/helm)'
          relevant openapi_changed '^(server/http/handlers/openapi\.yaml$|\.vacuum\.yaml$|devtools/vacuum/)'

          if [ -z "$changed" ] || echo "$changed" | grep -vE '(\.md$|^docs/)' > /dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^web/' > /dev/null; then
            echo "web_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "web_only=true" >> "$GITHUB_OUTPUT"
          fi
          # ci.yml itself defines this gating logic -- a change to it must
          # always run the full suite regardless of what else it matches
          # below, so it's checked first and short-circuits to false.
          if echo "$changed" | grep -qx '\.github/workflows/ci\.yml'; then
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -q '^scripts/e2e/'; then
            # scripts/e2e/ is NOT Go-free: it holds the e2e journey tests
            # (Go, build tag e2e) that e2e-smoke runs. Classifying it as
            # go_unaffected skipped e2e-smoke on the very PRs that change
            # those tests (#2681 merged with its assertion never executed).
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          elif echo "$changed" | grep -q '^scripts/edge/'; then
            # scripts/edge/ drives Go builds (edge-builds: ARM cross-build and
            # the footprint guard), so it is not Go-free either.
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$changed" ] || echo "$changed" | grep -vE '^(scripts/|\.semgrep/|demo/|integrations/|\.github/workflows/|\.gitignore$|\.gitattributes$|LICENSE$|COPYRIGHT$)' > /dev/null; then
            echo "go_unaffected=false" >> "$GITHUB_OUTPUT"
          else
            echo "go_unaffected=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$changed" ] || echo "$changed" | grep -vE '^operator/' > /dev/null; then
            echo "operator_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "operator_only=true" >> "$GITHUB_OUTPUT"
          fi

  # Merge-queue selection (CI-SELECT-1; see the comment above `changes`).
  # Runs on every event so every job can depend on it; outside merge_group
  # (and a workflow_dispatch without select_base) it only reports mode=full
  # with every gate open, in a few seconds and without a checkout, so pull
  # request, push, schedule and dispatch runs behave exactly as before.
  #
  # On merge_group it diffs the group commit against
  # github.event.merge_group.base_sha and runs scripts/ci/select-affected.py
  # (rule and reasoning in that file's header): FULL when go.mod/go.sum,
  # internal/testutil/**, ci.yml, scripts/ci/**, the leg definitions or a
  # generated-code input changed; otherwise the changed packages plus every
  # package that imports them. Outputs:
  #   mode       full | selected
  #   legs       JSON {leg: "pkg pkg ..." | "*"} of the test-suite legs that
  #              run (selected only); a leg not listed skips its tests
  #   gate_*     'true' when that path-gated job's inputs were touched (always
  #              'true' in mode=full)
  # Fail-safe both ways: the script answers mode=full on any error, and
  # build-and-test (required) fails the run if this job itself did not
  # succeed, so a broken selection can never turn into skipped-and-green.
  select:
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.sel.outputs.mode || steps.scope.outputs.mode }}
      reason: ${{ steps.sel.outputs.reason || steps.scope.outputs.reason }}
      legs: ${{ steps.sel.outputs.legs || '{}' }}
      gate_helm: ${{ steps.sel.outputs.gate_helm || 'true' }}
      gate_helm_boot: ${{ steps.sel.outputs.gate_helm_boot || 'true' }}
      gate_docker_boot: ${{ steps.sel.outputs.gate_docker_boot || 'true' }}
      gate_demo: ${{ steps.sel.outputs.gate_demo || 'true' }}
      gate_web_e2e: ${{ steps.sel.outputs.gate_web_e2e || 'true' }}
      gate_operator: ${{ steps.sel.outputs.gate_operator || 'true' }}
      gate_migrate: ${{ steps.sel.outputs.gate_migrate || 'true' }}
      gate_fuzz_targets: ${{ steps.sel.outputs.gate_fuzz_targets || 'true' }}
      gate_fuzz_reach: ${{ steps.sel.outputs.gate_fuzz_reach || 'true' }}
    steps:
      - name: Does this run select? (merge_group, or workflow_dispatch with select_base)
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          DISPATCH_BASE: ${{ github.event.inputs.select_base }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          base=""
          case "$EVENT_NAME" in
            merge_group) base="$MG_BASE_SHA" ;;
            workflow_dispatch) base="$DISPATCH_BASE" ;;
          esac
          if [ -z "$base" ]; then
            echo "Event $EVENT_NAME runs the full suite: no selection, every gate open."
            {
              echo "select=false"
              echo "mode=full"
              echo "reason=event $EVENT_NAME runs the full suite"
            } >> "$GITHUB_OUTPUT"
          elif [ "$DOCS_ONLY" = "true" ]; then
            # Every job this selection gates already skips on docs_only.
            echo "Docs-only change: every Go job already skips; nothing to select."
            {
              echo "select=false"
              echo "mode=full"
              echo "reason=docs-only change (the docs_only skips apply)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Event $EVENT_NAME: selecting against base $base."
            {
              echo "select=true"
              echo "base=$base"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.select == 'true'

      - name: Set up Go
        if: steps.scope.outputs.select == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Select affected packages and path gates (scripts/ci/select-affected.py)
        id: sel
        if: steps.scope.outputs.select == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          # The base is the queue entry ahead of this one (or main); depth 1
          # is enough for a two-tree diff. If it cannot be fetched the script
          # cannot diff and answers mode=full.
          git fetch --no-tags --depth=1 origin "$BASE" || echo "::warning::could not fetch base $BASE; selection falls back to the full suite"
          python3 scripts/ci/select-affected.py --base "$BASE" --head HEAD \
            --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # web/ (ADR-070) has its own pnpm-workspace.yaml. pnpm resolves its
  # workspace root by walking UP from the invoked directory until it finds a
  # pnpm-workspace.yaml (or a lockfile) -- a stray pnpm-workspace.yaml or
  # pnpm-lock.yaml at the repository root would shadow web/'s own and
  # silently change the frontend's dependency resolution. Not gated by
  # docs_only (like gitleaks below): a root-level pnpm file could land in a
  # change docs_only wouldn't classify as code, and this check is a single
  # `ls`, cheap enough to always run regardless.
  pnpm-workspace-root-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no root-level pnpm workspace files
        run: |
          if [ -e pnpm-workspace.yaml ] || [ -e pnpm-lock.yaml ]; then
            echo "::error::pnpm-workspace.yaml or pnpm-lock.yaml found at the repository root."
            echo "pnpm resolves its workspace root by walking up from the invoked"
            echo "directory -- a root-level file here would shadow web/pnpm-workspace.yaml"
            echo "and silently change the frontend's dependency resolution. Remove it,"
            echo "or if a root-level pnpm workspace is genuinely intended, this guard"
            echo "and ADR-070 both need to be revisited."
            exit 1
          fi
          echo "OK: no root-level pnpm workspace files."

  # #1594 showed "Merged" on GitHub but never reached main: it was merged
  # into its base branch (wave2-adr-amendments), which had ALREADY been
  # squash-merged into main as a separate PR before #1594 landed on it --
  # the exact branch-into-branch trap this repo's CLAUDE.md already names
  # by example (PRs #1563-#1566). CLAUDE.md's own "verify closure by
  # content, not by commit" practice only catches this AFTER the fact, by
  # re-reading a specific PR someone already suspects is wrong -- it is a
  # post-hoc verification step, not a gate, so it does not stop the mistake
  # from being merged in the first place. This job fails a PR outright if
  # its base is not `main`, unless the PR is explicitly labeled `stacked-pr`
  # (a deliberate, visible opt-out for a genuine multi-PR review chain --
  # see adr082/**'s stacked-branch convention in this file's own
  # `on: pull_request: branches:` comment above for what a legitimate case
  # looks like). Runs on pull_request only (base branch has no meaning for a
  # push event); ungated by docs_only for the same reason as adr-numbers
  # below -- a single string comparison, cheap enough to always run.
  #
  # NOT a preventive gate, despite currently being listed in main's required
  # status checks (#1609/G80, verified directly, not theorized): it can only
  # FAIL when a PR's base isn't main, and required-status-check enforcement
  # only applies where the base branch IS protected -- which today is only
  # main. Those two conditions never overlap, so this can never actually
  # block the mistake it names. Proved by merging PR #1609 (deliberately
  # mis-based) with this check red. A ruleset requiring it on
  # feat/**/fix/**/adr082/** too was tried the same day and reverted within
  # the hour -- ruleset required-status-checks gate PUSHES, not just merges,
  # and this check only runs on pull_request events, so it can never satisfy
  # that; every ordinary push to a matching branch was rejected.
  #
  # Open decision, not yet acted on (removing it needs a branch-protection
  # change, out of scope for the pass that added this comment):
  # recommendation is to remove this from main's required status checks --
  # "required" implies enforcement this check cannot provide, which is
  # exactly the false reassurance that let this sit unnoticed for weeks.
  # Whether or not that happens, keep the JOB itself running (required or
  # not) for its narrow remaining value: a human glancing at a mis-based
  # PR's own checks before merging still sees it red, even though nothing
  # stops them clicking merge past it. The actual catch is
  # scripts/detect-mis-based-merges.sh (mis-based-merge-detector.yml):
  # detection on a schedule, not prevention -- see that script's own header
  # for the full reasoning, including why IT must never be added to
  # required checks either.
  base-branch-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert PR base is main, unless labeled stacked-pr
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            echo "ok: base is main"
            exit 0
          fi
          # Release branches (release/vX.Y.x) are long-lived targets of their own,
          # not stacked feature branches: a PR into one lands there by design.
          case "$BASE_REF" in
            release/*)
              echo "ok: base is release branch '$BASE_REF'"
              exit 0
              ;;
          esac
          case ",$LABELS," in
            *,stacked-pr,*)
              echo "ok: base is '$BASE_REF', but PR is labeled stacked-pr -- allowed"
              exit 0
              ;;
          esac
          echo "::error::PR base is '$BASE_REF', not main, and is not labeled 'stacked-pr'."
          echo "A PR based on a feature branch instead of main can show 'Merged' on GitHub"
          echo "without its content ever reaching main -- see #1594/docs/adr-089-mfa-purge-relay-deletion.md"
          echo "for a real instance. If this is a genuine stacked-PR review chain, add the"
          echo "'stacked-pr' label explicitly; otherwise retarget this PR at main."
          exit 1

  # WARN-ONLY for its first week (2026-10-03 -- 2026-10-10, see the script's
  # own header for the one-line switch to make it required after that).
  # Checks that a PR titled fix(...)/fix: ... fills in the "Bug origin" block
  # (.github/PULL_REQUEST_TEMPLATE.md, COMMON-RULES.md's "Definition of done
  # and bug-origin tracking") -- Introduced-by/Detected-by/Class/Severity.
  # Title/body are passed via env:, never interpolated into the script text,
  # so untrusted PR content is read as data, never executed (same pattern as
  # base-branch-check's BASE_REF/LABELS above).
  bug-origin-block-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Bug origin block on fix(...) PRs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/ci/check-bug-origin-block.sh

  # Not gated by docs_only: docs/adr-*.md files ARE classified as docs, but
  # this check is a single find|sed|sort pass, cheap enough to always run
  # regardless of what this specific PR touches, matching
  # pnpm-workspace-root-guard's reasoning for staying ungated.
  adr-numbers:
    needs: [changes]
    # Skipped only on a push to main the merge queue already passed (queue_verified): same SHA, same result (CI-LIGHT-1).
    if: needs.changes.outputs.queue_verified != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # issues: read is for the informational report step and the
      # fault-tolerance issue-state check below -- nothing else in this job
      # touches issues, and the informational step never fails the job (see
      # its own step and script header for why).
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert every docs/adr-NNN-*.md number is unique
        run: ./scripts/check-adr-numbers.sh

      # CHURN-1: unreleased entries are changelog.d/ fragments, assembled into
      # CHANGELOG.md at release time. --check validates every fragment.
      - name: Validate changelog.d/ fragments
        run: ./scripts/changelog-assemble.sh --check

      # NON-FAILING for now (about 30 open PRs still edit CHANGELOG.md directly).
      # A hard check can follow once they have drained. Needs the base ref.
      - name: Notice if the PR edits CHANGELOG.md directly
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # HEAD is the PR merge commit, so a two-dot diff against the base tip
          # is exactly the PR's own change; depth 1 of the base is enough.
          git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" || true
          ./scripts/changelog-assemble.sh --notice

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # docs/security-closures.tsv is no longer committed (generated from
      # docs/security-closures.d/ on demand); this validates the fragments.
      - name: Validate docs/security-closures.d/*.tsv fragments
        run: scripts/gen-security-closures-tsv.sh --check

      - name: Self-test the closure guard (must be able to go red)
        run: ./scripts/check-closures.sh --self-test

      # This job never sets KEYORIX_TEST_PG_DSN, so every pg-gated row in
      # docs/security-closures.d/ gate-skips here by design -- that is
      # expected, not a failure (see the ledger's own header). The test-suite
      # job's `core-1` leg below runs this SAME script again, WITH the DSN, and
      # is what actually proves those rows.
      - name: Verify every security closure claim names a passing test
        run: ./scripts/check-closures.sh

      - name: Self-test the ADR conformance guard (must be able to go red)
        run: ./scripts/check-adr-conformance.sh --self-test

      - name: Verify every ADR conformance claim names a passing test
        run: ./scripts/check-adr-conformance.sh

      - name: Self-test the review-coverage guard (must be able to go red both ways)
        run: ./scripts/check-review-coverage.sh --self-test

      # server/entrypoint.sh (container image): bootstrap password never in argv
      # (#241), bootstrap over the TLS URL with the server's own CA, config copy
      # at 0600 (#2922), arguments run instead of the server. It ran nowhere
      # before SECURE-DEFAULT-1 and had gone stale (no bootstrap token in its env).
      - name: Container entrypoint tests (server/entrypoint_test.sh)
        run: bash server/entrypoint_test.sh

      # Scope is derived from `go list ./...` at run time, never hand-enumerated
      # -- see docs/review-coverage.tsv's own header for why (a hand-maintained
      # package list is the exact failure mode this exists to prevent). Fails
      # if any package go list reports has no row, or if any row names a
      # package that no longer exists.
      - name: Verify every Go package has an adversarial-review coverage row
        run: ./scripts/check-review-coverage.sh

      # Informational only -- never fails this job (the script itself always
      # exits 0, and continue-on-error is set as a second, belt-and-suspenders
      # layer in case a future edit ever changes that). See the script's own
      # header for why an issue missing from this report is not proof nothing
      # is owed, and docs/security-closures.d/HEADER.txt for the same caveat
      # on its `issue` column.
      - name: Report closed security-labeled issues the ledger doesn't cite (informational)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/report-unlisted-security-issues.sh

      # GATING, unlike the informational step above, and the difference is the
      # signal each one keys on. That step keys on the `security` LABEL, which
      # this repo applies unreliably (its header documents four confirmed
      # misses), so its silence proves nothing and it must never fail a build.
      # This one keys on issue STATE, which is not a human convention anyone has
      # to remember to apply -- a closed issue is closed. See the script's own
      # header, and #2844.
      #
      # It fails rather than passes when it cannot reach the API: green would
      # otherwise mean "no closed issues found" when it actually means "nothing
      # was looked at". The offline backstop is
      # TestKnownOpenTolerances_CarryIssueAndExpiry's expiry check, which runs
      # in the test-suite job regardless.
      #
      # Gated on fault_tolerance_relevant (the tolerance table/script changed,
      # or this run has no PR file list to check): see that output's own
      # comment in the changes job for why this does NOT run on every PR --
      # it calls the GitHub API per tolerance row, and a transient error or a
      # routinely-closed issue must not turn CI red for every unrelated PR.
      # The unconditional nightly run is
      # .github/workflows/fault-tolerance-nightly.yml.
      - name: Verify every fault-injection tolerance cites an open issue
        if: needs.changes.outputs.fault_tolerance_relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-fault-tolerance-issues.sh

  # Backstop for the actionlint pre-commit hook (.pre-commit-config.yaml) --
  # not a replacement for it. That hook is the PRIMARY guard: it runs on the
  # contributor's own machine before a broken workflow file is ever pushed,
  # which matters specifically because a job defined INSIDE ci.yml cannot run
  # to catch ci.yml's own syntax error breaking its own parse -- if this file
  # itself is what's unparseable, no job in it starts, this one included. This
  # job exists for what pre-commit can't cover: a bypassed hook (--no-verify),
  # a contributor without it installed, or a GitHub web-UI edit -- and it
  # protects every OTHER workflow file unconditionally, which stays possible
  # even when ci.yml itself is the one that's broken elsewhere in history.
  # Not gated by docs_only, matching pnpm-workspace-root-guard's reasoning: a
  # workflow file is never classified as docs (doesn't match \.md$ or
  # ^docs/), and this is a single static-analysis pass, cheap enough to
  # always run regardless of what this specific PR touches.
  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache actionlint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: actionlint
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ runner.os }}

      - name: actionlint
        run: |
          if [ ! -x ./actionlint ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            echo "${ACTIONLINT_LINUX_AMD64_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
            tar -xz -f "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          fi
          ./actionlint

  # Fast compile gate (~30s). Catches redeclarations, type errors, and build
  # failures before the expensive test-suite/static-analysis jobs start -- those
  # declare `needs: [preflight]`. Cheaper jobs (lint, licenses, fuzz-targets,
  # operator, gitleaks, helm-*, openapi-lint) run their own independent
  # compile/analysis and so run fully in parallel with preflight instead of
  # waiting on it -- on a broken build they each fail on their own terms
  # instead of via the shared gate, but nothing waits an extra ~30s to start.
  preflight:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Check for invalid UTF-8 (U+FFFD replacement characters)
        run: |
          if grep -rPl '\xef\xbf\xbd' \
               --include='*.go' --include='*.yml' --include='*.yaml' \
               --include='*.sh' --include='*.ts' --include='*.tsx' \
               --include='*.json' --include='*.md' \
               --exclude-dir=node_modules --exclude-dir=.scratch .; then
            echo "ERROR: files above contain U+FFFD (replacement character)."
            echo "This causes SonarCloud encoding warnings."
            echo "Replace corrupt bytes with the intended Unicode characters."
            exit 1
          fi

      - name: go mod verify
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # Quick-tier feedback for a pull_request push: `go test -short`, no -race,
  # SQLite only, on just the packages the PR's diff can plausibly affect
  # (scripts/ci-test-quick.py: changed packages + their in-repo reverse deps,
  # via go list -json's already-transitive Deps field). Does NOT replace
  # test-suite's 18-shard -race matrix as the correctness gate -- it runs
  # only when test-suite doesn't (see test-suite's own if: above), and the
  # merge queue guarantees test-suite runs against the exact merge result
  # before anything reaches main. See build-and-test's gate-logic step for
  # the truth table these two tiers combine into one required context.
  test-quick-root:
    needs: [preflight, changes]
    if: needs.preflight.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Select affected root-module packages and run go test -short
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          pkgs=$(echo "$changed" | python3 scripts/ci-test-quick.py .)
          # 480s (8min) is right for the common case -- a handful of affected
          # packages. The FULL fallback runs the entire root-module package
          # list, which includes packages the full test-suite matrix gives
          # their own 1800s-timeout leg specifically because they're slow
          # (internal/storage/store measured 867s-1363s alone; server/http
          # measured 1904s alone -- see test-suite's own leg comments below).
          # 480s killed a real, still-running test package on this exact PR
          # (#2052's own first CI run: `panic: test timed out after 8m0s`
          # mid server/http, not a real failure, just too short a clock) --
          # match test-suite's own generous-timeout precedent instead of
          # re-discovering that the hard way on every future ci.yml/go.mod
          # change.
          timeout=480s
          # internal/storage/store alone runs longer than 480s even with -short (test-suite
          # gives it two 1800s legs), so any PR whose affected set includes it timed out
          # (#2054). Give the quick tier the 1800s clock whenever that package is selected.
          if echo "$pkgs" | grep -qx 'github.com/keyorixhq/keyorix/internal/storage/store'; then
            timeout=1800s
          fi
          if [ "$pkgs" = "FULL" ]; then
            echo "Fallback trigger fired (go.mod/go.sum/.github/ or internal/testutil/ changed) -- running the full root-module package list."
            pkgs=$(go list ./... | grep -vE '^github\.com/keyorixhq/keyorix/(cli|operator)(/|$)')
            timeout=1800s
          fi
          if [ -z "$pkgs" ]; then
            echo "No root-module package is affected by this PR's diff -- nothing to run."
            exit 0
          fi
          echo "Affected packages:"
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -short -timeout "$timeout" $pkgs

  test-quick-cli:
    needs: [preflight, changes]
    if: needs.preflight.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: cli
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Select affected cli-module packages and run go test -short
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          # ci-test-quick.py resolves <moddir> relative to the repo root (it runs `go list` with
          # cwd=<moddir>), but this job's working-directory is already cli/, so run it from the root.
          pkgs=$(echo "$changed" | (cd .. && python3 scripts/ci-test-quick.py cli))
          # See test-quick-root's own comment on this same pattern: FULL
          # fallback runs the whole module, which deserves the same
          # generous-timeout treatment even though cli/ itself is small
          # today -- consistent behavior beats a timeout that's only
          # actually been sized for the common (small-subset) case.
          timeout=480s
          if [ "$pkgs" = "FULL" ]; then
            echo "Fallback trigger fired (go.mod/go.sum/.github/ or internal/testutil/ changed) -- running the full cli-module package list."
            pkgs=$(go list ./...)
            timeout=1800s
          fi
          if [ -z "$pkgs" ]; then
            echo "No cli-module package is affected by this PR's diff -- nothing to run."
            exit 0
          fi
          echo "Affected packages:"
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -short -timeout "$timeout" -count=1 $pkgs

  # Runs the two `go test` legs (root minus known-excluded/handlers packages,
  # and server/http/handlers on its own longer timeout, see the step comment
  # below) as parallel matrix runners instead of two sequential steps in one
  # job -- server/http/handlers alone can take up to 1200s (ADR-048), so
  # running it back-to-back with everything else was the single largest
  # contributor to this workflow's wall-clock time. `build-and-test` below
  # aggregates both legs' results and does the coverage-floor check, keeping
  # that exact job name for branch protection's required status check.
  test-suite:
    needs: [preflight, changes, select]
    # A custom `if:` replaces the implicit "only run if needs succeeded"
    # default, so preflight's success must be checked explicitly here too --
    # otherwise a docs_only-unrelated broken build would no longer be
    # fast-failed by preflight before this (expensive) job starts.
    #
    # CI quick-tier split: this 18-shard -race matrix no longer runs on every
    # pull_request push -- it runs on merge_group (the merge queue proves the
    # full suite against the exact commit about to land before it reaches
    # main), on push (post-merge, belt-and-suspenders), on workflow_dispatch
    # (manual), and on a pull_request carrying the ci:full label (opt-in for
    # a PR an author wants the full matrix on before it queues). Every other
    # pull_request push instead gets test-quick-root/test-quick-cli below --
    # see build-and-test's own gate-logic step for the pass/fail truth table
    # this split creates.
    #
    # needs.select.result: on merge_group the `select` job decides which legs
    # run (each leg's first step below); if it did not succeed, test-suite is
    # skipped and build-and-test fails closed on that.
    if: needs.preflight.result == 'success' && needs.select.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')))
    strategy:
      fail-fast: false
      matrix:
        include:
          # root was a single ~1160s leg (measured 2026-08-03) -- slower than
          # handlers below despite handlers being the one with its own
          # extended timeout, defeating the point of splitting them apart
          # (ADR-048). Resharded into 3 pinned "heavy" legs (root-1/2/3,
          # bin-packed to ~830s each from actual per-package timings) plus
          # root-4, a catch-all computed by EXCLUDING root-1/2/3's pinned
          # packages from the same list root ever used -- so a newly added
          # package always lands somewhere (root-4) rather than silently
          # never running, and only gets promoted to its own pinned leg once
          # it's proven slow enough to be worth the split.
          #
          # Every leg below (root-1/2/3/4, handlers-1/2/3/4) was raised from
          # 600s to 1800s in one pass (2026-08-22), matching the core leg's
          # precedent below rather than tuning each individually: pulling
          # actual go-test-only elapsed time (not job wall-clock) from a real
          # CI run found root-3 at 555s (7.5% headroom) and root-4 at 569s
          # (5.2% headroom) against the old 600s budget -- the SAME range
          # internal/core died at (605s) before it got its own leg. 600s was
          # miscalibrated repo-wide, not just for internal/core; core was
          # just the first leg to actually cross it. A per-package timeout
          # exists to catch hangs, not to enforce a speed budget -- unused
          # headroom costs nothing, and tuning each leg to just past its
          # observed duration risks exactly the intermittent-red outcome that
          # made the original April exclusion look justified in hindsight.
          - leg: root-1
            timeout: 1800
            coverage-file: coverage_root1.out
          - leg: root-2
            timeout: 1800
            coverage-file: coverage_root2.out
          # (no root-3: ./server is split by test name into server-1/server-2
          # below, and root-3's small packages joined root-2; CI-SHARD-BALANCE-1
          # round 2 had root-3 at 21.6 min, bounded by ./server alone.)
          - leg: root-4
            timeout: 1800
            coverage-file: coverage_root4.out
          # core (internal/core, re-enabled 2026-08-22 after ~4 months dark --
          # see fix/ci-reenable-internal-core) gets its own pinned leg rather
          # than folding into root-4's catch-all: measured 369.6s in isolation
          # locally (-race, same flags as this leg) but 605s -- over root-4's
          # OLD 600s budget -- sharing a runner with a dozen other concurrent
          # test binaries there. 1800s here is deliberately generous so a
          # healthy-but-slow run never trips it, rather than tuning to just
          # past the observed duration. 323 test files in one package is
          # itself worth revisiting -- tracked separately (#1523), not folded
          # into this CI-scheduling fix.
          #
          # Briefly split into two test-name shards (2026-09-09, #1819) and
          # reverted the same day once run 34345617638 measured the split:
          # the max core leg moved 13.0 -> 12.6 min, 0.4 minutes, while the
          # group's total compute went 13.0 -> 23.0 min. That +10.0 min is a
          # direct measurement of this leg's fixed per-leg cost (checkout,
          # setup-go, Postgres startup, race+cover compile of 372 test files)
          # being paid twice for the same tests. It bought a runner slot's
          # worth of contention and ~10 min of compute for nothing: at 13 min
          # a single core leg sits well under http's 16.8 min maximum, so it
          # is not on the critical path either way.
          #
          # The real lever for this leg is not more shards -- it is not
          # paying that fixed cost per shard at all (compile once, upload the
          # test binary, run it with -test.run per shard) and t.Parallel()
          # for the 2856 currently-serial tests. Both tracked separately.
          # timeout raised 1800 -> 3300 (2026-10-19, CI-CORE-TIMEOUT-1): merge_group
          # runs 39289607674 and 39283963061 died with "test timed out after
          # 30m0s". test-suite has no job-level timeout-minutes (GitHub default
          # 360), so the go test -timeout is the only bound and is far below it.
          #
          # Split into core-1/core-2 (2026-10-19, CI-CORE-SHARD-1): the leg grew
          # to ~35 min (CI-CORE-TIMEOUT-1) and was the merge queue's critical
          # path. That split was by a pinned heavy-test regex (core-1 -run,
          # core-2 -skip of the same regex) and still left core-1 the slowest leg
          # of the matrix in 5 of 8 comparable merge-queue rounds: ~20 min of
          # tests (1037s in the test binary) plus the ~9-10 min
          # scripts/check-closures.sh step below, serial on the same runner.
          #
          # core-1/2/3 (2026-10-20, CI-SHARD-BALANCE-1): the same package, three
          # test-name shards bin-packed by committed per-test weights
          # (sharded_legs / weighted_run_filter in scripts/ci-test-legs.sh,
          # scripts/ci-test-weights.tsv), with check-closures' ~10 min counted as
          # a preload on core-1 so the shard that also runs it gets fewer tests.
          # The fixed cost of one more leg was measured at ~2-4 min of compile
          # plus ~1 min of job setup (go test step minus the `ok` time on run
          # 39477864156: core-2 119s, core-1 171s, http-3 215s, faultops-2 228s),
          # not the ~10 min the #1819 note above inferred, so a third shard
          # (about 3 leg-minutes) buys a ~6 min shorter critical path.
          # Timeouts stay 3300: the per-binary run is now ~12-15 min, the same
          # generous-headroom reasoning as every other leg.
          - leg: core-1
            timeout: 3300
            coverage-file: coverage_core1.out
          - leg: core-2
            timeout: 3300
            coverage-file: coverage_core2.out
          - leg: core-3
            timeout: 3300
            coverage-file: coverage_core3.out
          - leg: server-1
            timeout: 1800
            coverage-file: coverage_server1.out
          - leg: server-2
            timeout: 1800
            coverage-file: coverage_server2.out
          # storage-store (internal/storage/store, re-pinned out of root-4's
          # catch-all 2026-09-04) -- same trigger as core's own split above: a
          # real CI run (main, commit b971ed36) found root-4's `go test` step
          # at 1363s against its 1800s timeout (76% of budget, only ~437s
          # headroom) -- well past the ~569s root-4 measured at when that
          # budget was last calibrated. Isolating internal/storage/store alone
          # locally (go test -timeout 20m, no -race, single run) took 867.818s
          # BY ITSELF, confirming it as the dominant contributor: the package
          # picked up a large batch of new *_cascade_sweep_test.go/
          # *_error_sweep_test.go coverage files since root-4's budget was
          # last measured. 1800s here for the same reason every other leg
          # uses it -- generous headroom so a healthy-but-slow run never
          # trips it, not tuned tight to the observed duration.
          #
          # Split into two test-name shards 2026-09-09: 18 min on run
          # 34329184317, the slowest leg after http-6 and unsharded, so it
          # set a floor no rebalancing elsewhere could get under.
          #
          # Merged back into one leg (2026-10-20, CI-SHARD-BALANCE-1): the two
          # shards now ran 4-8 min each (run 39477864156: 5.9 and 8.0 min, of
          # which ~4 min each is fixed cost), so one leg of ~10 min is under
          # every leg that matters and saves a runner plus ~4 leg-minutes.
          # sharded_legs() has it as a single shard (no -run filter, so the
          # package's Example tests run too), -shuffle=on unchanged.
          - leg: storage-store-1
            timeout: 1800
            coverage-file: coverage_storage_store1.out
          # internal/encryption split out of root-1 into two test-name shards
          # (2026-09-27): it was 829.5s of root-1's ~15-16 min on merge-queue
          # run 36320819069, the longest leg in the matrix. See
          # encryption_pkgs in scripts/ci-test-legs.sh.
          - leg: encryption-1
            timeout: 1800
            coverage-file: coverage_encryption1.out
          - leg: encryption-2
            timeout: 1800
            coverage-file: coverage_encryption2.out
          # server/faultops split out of root-4's catch-all into two test-name
          # shards (2026-10-15). It ran 1305s -> 1605s -> 1679s -> 1759s in
          # root-4 and then hit the 30m per-binary timeout on main (run
          # 38698772543, 1804.7s) and in merge-group runs (38721857337). The
          # timeout is per test binary, so one leg of its own would not have
          # been enough -- the package alone is the problem; two shards halve
          # it. Nothing is skipped or reduced: every Test*/Fuzz* name runs in
          # exactly one shard (assert_all_shards_complete, run by
          # assert-leg-completeness). See faultops_pkgs in
          # scripts/ci-test-legs.sh.
          #
          # Three shards (2026-10-20, CI-SHARD-BALANCE-1): the hand-pinned
          # two-shard split left faultops-1 at 12 min and faultops-2 at 27-29
          # min on the same full rounds (run 39482036342: 11.6 vs 28.2 min),
          # making faultops-2 one of the slowest legs of the matrix. Four tests
          # dominate the package (346s + 229s + 183s + 102s of its 1251s -race
          # local total), so the weighted assignment places them explicitly.
          - leg: faultops-1
            timeout: 1800
            coverage-file: coverage_faultops1.out
          - leg: faultops-2
            timeout: 1800
            coverage-file: coverage_faultops2.out
          - leg: faultops-3
            timeout: 1800
            coverage-file: coverage_faultops3.out
          # handlers (server/http/handlers, one package, 167 test files, 5151
          # top-level tests, all already t.Parallel()) measured at 911s in CI
          # -- vs. 15s wall / 37s summed-per-test locally without -race. That
          # ~60x gap is race-detector contention scaling with the sheer
          # volume of concurrent goroutines on one runner's limited cores
          # (ADR-048's ~3.6x modernc.org/sqlite figure explains part of it,
          # not all of it), not a handful of slow outlier tests the way root
          # had -- so unlike root-1/2/3's pinned-by-name approach, this
          # splits evenly by (sorted test name index) mod 4: no per-test
          # timing data to bin-pack against, and every test costs roughly the
          # same here. A newly added test always lands in whichever shard its
          # name happens to hash to -- nothing to keep in sync, unlike
          # root-1/2/3's pinned lists.
          #
          # (2026-10-20, CI-SHARD-BALANCE-1: handlers now uses the same weighted
          # assignment as the other sharded packages; every test is parallel, so
          # its weights file row is a single default and the pack is an even
          # spread by name, as before. Run 39477864156: 269 s and 226 s of tests
          # in handlers-1/2 -- balanced, left at two legs.)
          - leg: handlers-1
            timeout: 1800
            coverage-file: coverage_handlers1.out
          - leg: handlers-2
            timeout: 1800
            coverage-file: coverage_handlers2.out
          # Reduced from 4 shards to 2 (2026-09-09): on run 34329184317 the
          # four legs ran 5/6/5/5 min -- balanced, but each was paying the
          # ~1.9 min fixed per-leg cost (checkout + setup-go + race/cover
          # compile + Postgres startup) on ~3.3 min of actual test work. Two
          # shards land at ~8.6 min, still under the matrix maximum, and
          # return two runner slots to http where the work actually is.
          # http (server/http, re-enabled 2026-08-23 after ~4 months dark --
          # see docs/g80-remediation-notes.md, G80 C4). Measured 1904.015s
          # locally (-race, unsharded, one full run, zero failures beyond
          # two already-fixed-on-main fixtures) -- healthy and slow, not
          # deadlocked (the prior 20-minute goroutine-dump "failure" that
          # motivated this measurement was the default go-test timeout
          # cutting off a genuinely still-running suite, not a hang).
          # Sharded 6 ways by test name rather than left as one leg:
          # 1904.015s * ~1.7 local->runner factor puts an unsharded run
          # around 3237s, well past any per-leg budget this workflow uses
          # elsewhere. Originally hash-by-(sorted-name-index-mod-6), the same
          # mechanism handlers-1..4 above uses -- but unlike handlers,
          # server/http turned out NOT to have uniform per-test cost: CI
          # measured http-4 landing at ~1180s against a ~953s 6-shard
          # average (765s-1180s spread, ~54% top-to-bottom), a real
          # imbalance from the hash, not the workload. Resharded 2026-08-29
          # to pin http-1..5 by REAL measured per-test time (same fix
          # root-1/2/3 already applied to root_base's uneven packages, one
          # level down at test-name granularity) with http-6 as a dynamic
          # catch-all -- see scripts/ci-test-legs.sh's http_shard_N_tests()
          # comment for the full measurement and bin-packing writeup. All 6
          # shards landed within 597.7s-598.9s of each other on that
          # measurement basis, comfortably under the 1800s timeout with real
          # headroom to spare, matching this workflow's generous-timeout precedent
          # rather than tuning tight to the observed duration.
          #
          # 8 mod-8 shards -> 4 weighted shards (2026-10-20, CI-SHARD-BALANCE-1).
          # The mod-8 split put the package's heavy tests into two classes: on
          # merge-queue run 39477864156 the `go test` binaries of http-1..8 ran
          # 65 / 162 / 1248 / 57 / 94 / 59 / 1371 / 371 s (3427 s in total, 76%
          # of it in http-3 and http-7), so five legs were ~90% fixed cost
          # (checkout, Postgres, race+cover compile, ~290 s) around a minute of
          # tests while two ran 25-28 min. Per-test CI times (a -v round on this
          # PR) show why: TestEveryRouteRefusesADeadCredential (~1560 s with -v)
          # and TestEveryWriteRouteRefusesAndChangesNothing (~1090 s) are 2/3 of
          # the package. The weighted pack gives each of them a leg and splits
          # the other ~480 tests over two more; more legs only add fixed cost.
          # Splitting INSIDE those two tests (their /sqlite /postgres and
          # per-route subtests) is the only way below this floor and would need
          # a subtest-level proof of "runs exactly once"; not done here.
          # timeout 2400 (was 1800): the longest leg runs one 20+ min test.
          - leg: http-1
            timeout: 2400
            coverage-file: coverage_http1.out
          - leg: http-2
            timeout: 2400
            coverage-file: coverage_http2.out
          - leg: http-3
            timeout: 2400
            coverage-file: coverage_http3.out
          - leg: http-4
            timeout: 2400
            coverage-file: coverage_http4.out
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # KEYORIX_TEST_PG_DSN (see internal/cli/encryption/rotate_e2e_test.go's own
    # header comment) has existed as a developer opt-in gate since before this
    # job ran against Postgres at all -- CI never set it, so every Postgres-
    # gated test silently skipped here, indefinitely (the same shape as the 13
    # HA-lock branches this container also exists to exercise: a mechanism
    # that only ever runs against SQLite verifies nothing about the Postgres
    # path it was written for). Declared job-level (not leg-conditional) to
    # keep this diff to "add the container + the DSN," matching every other
    # leg's already-generous-timeout precedent rather than hand-picking which
    # legs need it -- a service container that isn't used by a given leg's
    # tests costs only its own startup time, not the leg's.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyorix
          POSTGRES_PASSWORD: keyorix123
          POSTGRES_DB: keyorix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYORIX_TEST_PG_DSN: "host=localhost port=5432 dbname=keyorix user=keyorix sslmode=disable password=keyorix123"
    steps:
      # Merge-queue selection (CI-SELECT-1): a leg none of whose packages the
      # group can affect skips every step below and still reports success, so
      # the required build-and-test context sees a green matrix. Outside a
      # selected run (mode=full) every leg runs everything, as before.
      - name: Merge-queue selection for this leg
        id: leg
        env:
          MODE: ${{ needs.select.outputs.mode }}
          LEGS: ${{ needs.select.outputs.legs }}
          LEG: ${{ matrix.leg }}
        run: |
          if [ "$MODE" != "selected" ]; then
            echo "Full run (mode=$MODE): leg $LEG runs every package it owns."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pkgs=$(jq -r --arg l "$LEG" '.[$l] // ""' <<<"$LEGS")
          if [ -z "$pkgs" ]; then
            echo "Merge-queue selection: no package of leg $LEG is affected by this group; skipping its tests (the leg reports success)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "*" ]; then
            echo "Merge-queue selection: leg $LEG's package is affected; running its whole shard."
          else
            echo "Merge-queue selection: leg $LEG runs only its affected packages:"
            echo "$pkgs" | tr ' ' '\n'
            echo "only=$pkgs" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.leg.outputs.run == 'true'

      - name: Set up Go
        if: steps.leg.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: go test (${{ matrix.leg }})
        if: steps.leg.outputs.run == 'true'
        env:
          LEG_ONLY: ${{ steps.leg.outputs.only }}
        run: |
          # Which packages each leg runs, and why each excluded package is
          # excluded, now lives in one place (scripts/ci-test-legs.sh) shared
          # with the leg-completeness assertion job below -- see that file's
          # own header comment for why (G80 C5: a hand-duplicated pattern
          # list here is exactly what let server/http drift to zero legs,
          # unnoticed, for ~4 months).
          source scripts/ci-test-legs.sh

          leg="${{ matrix.leg }}"
          # Empty matches everything (verified: `go test -run ""` and no
          # -run flag at all select the identical test set) -- the root-N and
          # storage-store legs leave this empty; core/http/handlers/encryption/
          # faultops shard one package by test name (leg_run_filter, below).
          run_filter=""
          pkgs=$(pkgs_for_leg "$leg")
          # Selected merge-queue run, package-list leg (root-N, core-N): only the
          # affected subset of this leg's own packages (select-affected.py
          # intersected them with pkgs_for_leg, so nothing outside the leg).
          if [ -n "$LEG_ONLY" ]; then
            pkgs="$LEG_ONLY"
          fi
          # Empty for every leg except storage-store-N (below) -- see that
          # case arm for why this one package gets it and the others don't.
          shuffle_flag=""

          # Every sharded package below gets its -run regex from
          # leg_run_filter: the weighted bin-pack of the package's
          # Test*/Fuzz* names (scripts/ci-test-legs.sh sharded_legs, weights in
          # scripts/ci-test-weights.tsv). One function builds the regex here AND
          # in assert-leg-completeness's exactly-once proof. A newly added test
          # weighs the package average and lands in SOME shard automatically;
          # stale weights cost balance, never completeness.
          case "$leg" in
            handlers-*)
              # One package (server/http/handlers), all tests already
              # t.Parallel(): per-test times are contention, not cost, so the
              # weights file gives every test the same default and the pack
              # degrades to an even spread by name.
              run_filter=$(leg_run_filter "$leg")
              pkgs=./server/http/handlers/...
              ;;
            http-*)
              run_filter=$(leg_run_filter "$leg")
              pkgs=./server/http
              ;;
            core-*|server-*)
              # $pkgs stays as pkgs_for_leg gave it (internal/core, ./server).
              run_filter=$(leg_run_filter "$leg")
              ;;
            encryption-*)
              run_filter=$(leg_run_filter "$leg")
              pkgs=./internal/encryption
              ;;
            faultops-*)
              run_filter=$(leg_run_filter "$leg")
              pkgs=./server/faultops
              ;;
            storage-store-*)
              # One leg, the whole package (leg_run_filter prints nothing for a
              # one-shard leg), so no test is filtered.
              pkgs=./internal/storage/store
              # fix/store-test-isolation-shuffle: this package's tests used
              # to depend on execution order without anyone checking for it
              # -- a bare ":memory:" SQLite DSN's unbounded connection pool
              # could silently open a second, never-migrated phantom
              # connection under concurrent load (fixed package-wide via
              # sqlDB.SetMaxOpenConns(1); see
              # local_memdb_pool_isolation_test.go for the deterministic
              # mechanism proof). -shuffle=on makes order-dependence a
              # standing, continuously-checked property instead of
              # something that can return silently: Go reorders every run
              # and prints the seed on failure, so a red run stays
              # reproducible with no extra plumbing here. Scoped to this
              # package only, not repo-wide -- a broader rollout is a
              # separate, deliberately unstarted change (see this fix's own
              # commit message for why: enabling it elsewhere may surface
              # other packages' latent order dependencies, and those need
              # their own investigation, not a blanket flag flip bundled
              # into this one).
              shuffle_flag="-shuffle=on"
              ;;
          esac
          # $pkgs is deliberately unquoted below: it holds a space-separated
          # list of Go package paths meant to word-split into separate
          # `go test` arguments, not one literal string.
          #
          # -coverprofile unconditionally disables Go's test result cache
          # (go help test: -cpuprofile/-memprofile/-mutexprofile/-blockprofile/
          # -coverprofile all make a run's outcome depend on more than the
          # source+flags go test normally hashes, so it's never eligible for a
          # cache hit, matched or not). That means `-count=1` isn't the reason
          # this workflow gets zero benefit from Go's test cache on re-runs of
          # an unchanged package -- there's no `-count=1` anywhere in this
          # file. The actual, permanent cause is this flag, and it can't be
          # dropped without dropping the coverage-floor gate that consumes its
          # output (build-and-test's "Check coverage floor" step, COVERAGE_FLOOR
          # above). If someone proposes enabling Go's test cache here, that's
          # the trade being proposed, whether or not the proposal names it.
          # shellcheck disable=SC2086
          go test -race -timeout ${{ matrix.timeout }}s -run "$run_filter" $shuffle_flag -coverprofile=${{ matrix.coverage-file }} -covermode=atomic $pkgs

      # This job is the ONLY one with a Postgres service container (see this
      # job's own KEYORIX_TEST_PG_DSN comment above), so it is the only place
      # a pg-gated docs/security-closures.d/ row can ever be genuinely
      # proven rather than gate-skipped. Restricted to ONE leg, core-1 (exactly one
      # of core-1/core-2): every pg-gated row today lives in ./internal/core,
      # and running the full ledger sweep once per leg would just repeat the
      # same ~17-row check 15 times for no new coverage. adr-numbers already runs this same script
      # without a DSN (every pg-gated row gate-skips there, by design) --
      # this is the run that actually counts as evidence for those rows.
      - name: Verify pg-gated security closures with a real Postgres DSN available (core-1 leg only)
        if: matrix.leg == 'core-1' && steps.leg.outputs.run == 'true'
        run: ./scripts/check-closures.sh

      - name: Upload coverage artifact
        if: steps.leg.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.leg }}
          path: ${{ matrix.coverage-file }}
          retention-days: 1

  # G80 C5: fails (does not warn) when a TEMPORARY exclusion in
  # scripts/ci-test-legs.sh has sat unreviewed for more than 30 days. Cheap
  # and fast (bash + `date`, no Go/checkout of test code needed beyond the
  # script itself), so it runs independently of test-suite rather than
  # waiting on it. The check itself, and the fact that it fires, are both
  # verified in the PR that introduced this job (see the PR description) by
  # temporarily pointing it at a deliberately stale entry.
  exclusion-freshness:
    needs: [preflight, changes]
    if: needs.preflight.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CI exclusion freshness (fails on any TEMPORARY entry >30 days old)
        run: |
          source scripts/ci-test-legs.sh
          check_exclusion_freshness

      - name: Check coverage-floor exclusion freshness (fails on any TEMPORARY entry >30 days old)
        run: |
          source scripts/ci-test-legs.sh
          check_coverage_floor_exclusion_freshness

  # G80 C5: fails when any package in `go list ./...` is covered by NEITHER
  # a CI test-suite leg NOR an entry in scripts/ci-test-legs.sh's exclusion
  # table -- the guard against a package silently landing in zero legs, the
  # exact failure mode that let server/http go untested for ~4 months with
  # nothing red anywhere to catch it. Independent of test-suite: this only
  # needs `go list` (package discovery), not an actual test run, so it's
  # fast and doesn't wait on the (up to 30-minute) test-suite matrix.
  assert-leg-completeness:
    needs: [preflight, changes]
    if: needs.preflight.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Assert every package is covered by exactly the CI matrix or an enumerated exclusion
        run: |
          source scripts/ci-test-legs.sh
          assert_leg_completeness

      - name: Assert every leg-pinned package exists in go list and is pinned exactly once
        run: |
          source scripts/ci-test-legs.sh
          assert_pinned_leg_packages_valid

      # CI-SHARD-BALANCE-1: one proof for every package split by test name
      # (core, http, handlers, encryption, faultops), built from the same
      # weighted_run_filter the legs run. Before, only faultops and core had
      # one, each with its own hand-written filter.
      - name: Assert every test of every sharded package runs in exactly one shard
        run: |
          source scripts/ci-test-legs.sh
          assert_all_shards_complete

      - name: Assert the shard weights file is well formed
        run: |
          source scripts/ci-test-legs.sh
          assert_test_weights_valid

      - name: Assert the test-suite matrix, the leg table and the coverage merge agree
        run: |
          source scripts/ci-test-legs.sh
          assert_matrix_consistent .github/workflows/ci.yml

  # Independent of test execution/coverage -- both tools statically analyze
  # source, so this runs in parallel with test-suite instead of waiting for it
  # (as it did when both lived inside one sequential build-and-test job).
  static-analysis:
    needs: [preflight, changes]
    if: needs.preflight.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      # Keyed on the resolved Go version too (not just GOSEC_VERSION): a
      # govulncheck/gosec binary built under one Go toolchain and reused as-is
      # under a newer one can fail outright -- see go-licenses's own cache
      # step below for the general mechanism. A version-scoped key forces a
      # fresh install (via install-gosec.sh, which also re-pins x/tools) on
      # every Go bump, not just every GOSEC_VERSION bump.
      - name: Cache govulncheck/gosec binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin/govulncheck
            ~/go/bin/gosec
          key: static-analysis-tools-v1.8.0-${{ env.GOSEC_VERSION }}-xtools${{ env.GOSEC_TOOLS_VERSION }}-go${{ steps.setup-go.outputs.go-version }}-${{ runner.os }}

      - name: govulncheck
        run: |
          [ -x ~/go/bin/govulncheck ] || go install golang.org/x/vuln/cmd/govulncheck@v1.8.0 # NOSONAR githubactions:S8545 -- version is pinned to v1.8.0
          govulncheck ./...

      - name: gosec
        run: |
          [ -x ~/go/bin/gosec ] || scripts/ci/install-gosec.sh ~/go/bin/gosec
          # -exclude-generated skips files with the "DO NOT EDIT" header
          # (generated protobuf code), whose *_FullMethodName string constants
          # otherwise trip G101 (hardcoded-credential) false positives.
          gosec -severity medium -exclude-generated ./...

  # Aggregates test-suite (both matrix legs) and static-analysis: merges the
  # two coverage profiles and checks the floor. Kept as its own job named
  # exactly `build-and-test` because branch protection requires that exact
  # status-check context by name -- a matrix or renamed job would report as
  # e.g. "build-and-test (root)" and never satisfy it.
  build-and-test:
    needs: [preflight, test-suite, test-quick-root, test-quick-cli, static-analysis, changes, select, repo-guards]
    # always() so this still runs (and reports the failure below) even when
    # test-suite/test-quick-root/test-quick-cli/static-analysis genuinely
    # fail, not just when they're skipped -- combined with the docs_only/
    # web_only/go_unaffected/operator_only checks so the whole aggregator
    # itself is skipped (not run at all) when they're skipped too.
    #
    # needs.changes.result == 'success' is required too, and NOT redundant
    # with always(): if the `changes` job itself is cancelled (e.g. a
    # concurrency-group supersession mid-run) its outputs are unset, so every
    # `!= 'true'` comparison above reads as true regardless -- always() then
    # lets build-and-test run anyway, find test-suite/static-analysis
    # auto-skipped (they have no always(), so they correctly skip when a
    # dependency is cancelled), and fail with a misleading
    # "test-suite=skipped" error on a PR that never actually had a code
    # failure. Gating on changes' own result keeps build-and-test in sync
    # with test-suite/static-analysis's implicit skip-on-cancelled-dependency
    # behavior instead of being the one job immune to it. (root-caused on
    # #1368, whose docs-only CI run hit exactly this.)
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    # download-artifact needs actions: read beyond the workflow-level
    # contents: read default, even for same-run artifacts.
    permissions:
      contents: read
      actions: read
    steps:
      # Two-tier CI truth table (test-suite's and test-quick-root/
      # test-quick-cli's own `if:` above decide whether each tier runs at
      # all; this is what decides which one build-and-test REQUIRES):
      #
      # | event                                   | ci:full label | required                          |
      # |------------------------------------------|----------------|-----------------------------------|
      # | pull_request                              | absent         | test-quick-root, test-quick-cli   |
      # | pull_request                              | present        | test-suite                        |
      # | merge_group / push / workflow_dispatch / schedule | n/a     | test-suite                        |
      #
      # static-analysis is required in every row. Fail CLOSED: the tier that
      # SHOULD have run reporting anything other than 'success' -- including
      # 'skipped' -- is a failure here, not a silent pass. A required check
      # that never runs is indistinguishable from one still pending, and
      # this is the one job branch protection actually names.
      #
      # Merge-queue selection (CI-SELECT-1): `select` must have succeeded on
      # every event -- it decides which legs and path-gated jobs run, and a
      # job skipped because a dependency failed reports "skipped", which a
      # required check accepts. This step is where that turns into a red
      # required context instead. On a selected run (mode=selected) the
      # repo-wide guards (repo-guards) are required too, since the legs that
      # normally carry them may have been skipped.
      - name: Check upstream job results (two-tier gate)
        id: gate
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          SELECT_MODE: ${{ needs.select.outputs.mode }}
          SELECT_REASON: ${{ needs.select.outputs.reason }}
          SELECT_LEGS: ${{ needs.select.outputs.legs }}
          GUARDS_RESULT: ${{ needs.repo-guards.result }}
        run: |
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::select=$SELECT_RESULT: the merge-queue selection job did not succeed, so it is unknown which tests ran"
            exit 1
          fi
          selected=false
          if [ "$SELECT_MODE" = "selected" ]; then
            selected=true
            nlegs=$(jq 'length' <<<"$SELECT_LEGS")
            echo "Selected run: $nlegs test-suite legs ran ($SELECT_REASON)."
            if [ "$GUARDS_RESULT" != "success" ]; then
              echo "::error::selected merge-queue run requires repo-guards=success (every repo-wide guard), got repo-guards=$GUARDS_RESULT"
              exit 1
            fi
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          is_full_tier=false
          if [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            is_full_tier=true
          elif [ "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}" = "true" ]; then
            is_full_tier=true
          fi
          echo "full_tier=$is_full_tier" >> "$GITHUB_OUTPUT"

          if [ "${{ needs.static-analysis.result }}" != "success" ]; then
            echo "::error::static-analysis=${{ needs.static-analysis.result }}"
            exit 1
          fi

          if [ "$is_full_tier" = "true" ]; then
            if [ "${{ needs.test-suite.result }}" != "success" ]; then
              echo "::error::full tier (event=${{ github.event_name }}) requires test-suite=success, got test-suite=${{ needs.test-suite.result }}"
              exit 1
            fi
          else
            if [ "${{ needs.test-quick-root.result }}" != "success" ] || [ "${{ needs.test-quick-cli.result }}" != "success" ]; then
              echo "::error::quick tier (pull_request, no ci:full label) requires test-quick-root=success and test-quick-cli=success, got test-quick-root=${{ needs.test-quick-root.result }} test-quick-cli=${{ needs.test-quick-cli.result }}"
              exit 1
            fi
          fi

      # The coverage-floor gate below only has data to check on the full
      # tier -- test-quick-root/test-quick-cli don't produce coverage
      # profiles (they run `-short`, no -coverprofile, against a partial
      # package set, so a floor check against them would be meaningless).
      # go tool cover -func (below) reads the actual source files to attribute
      # coverage ranges to functions, not just the coverage profile text.
      #
      # A selected merge-queue run is in the same position: its skipped legs
      # produce no profile and its partial root-N legs cover a subset, so the
      # floor is checked on every run that executes the whole matrix instead
      # (nightly schedule, push to main outside the queue, workflow_dispatch,
      # ci:full, and any merge_group whose selection fell back to full).
      - name: Coverage floor not computed on a selected merge-queue run
        if: steps.gate.outputs.selected == 'true'
        run: echo "::notice::Selected merge-queue run -- the ${COVERAGE_FLOOR}% coverage floor is not computed here. A coverage drop is caught by the nightly run on main, not by the merge queue."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.full_tier == 'true' && steps.gate.outputs.selected != 'true'

      - name: Set up Go
        if: steps.gate.outputs.full_tier == 'true' && steps.gate.outputs.selected != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Download coverage artifacts
        if: steps.gate.outputs.full_tier == 'true' && steps.gate.outputs.selected != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Merge coverage profiles
        if: steps.gate.outputs.full_tier == 'true' && steps.gate.outputs.selected != 'true'
        run: |
          echo "mode: atomic" > coverage_merged.out
          # File-pattern exclusions from the coverage-FLOOR sum (as opposed to
          # exclusion_entries() above, which controls whether a PACKAGE runs in
          # a CI leg at all) are a machine-checked, reasoned registry --
          # scripts/ci-test-legs.sh's coverage_floor_exclusions() -- not a bare
          # `grep -v` here with the reasoning only asserted in a comment.
          source scripts/ci-test-legs.sh
          grep_args=()
          while IFS= read -r pattern; do grep_args+=(-e "$pattern"); done < <(coverage_floor_grep_patterns)
          # coverage_core1.out / coverage_core2.out (was coverage_core.out) are deliberately NOT in this list -- a pre-existing
          # gap this PR found but did not fix (out of scope for a CI-sharding
          # change; internal/core's coverage silently isn't counted toward the
          # floor). The coverage_storage_store*.out files below are included: they are THIS
          # leg's own new file, and omitting it would just be reproducing that
          # same gap in new code rather than inheriting an unrelated one.
          tail -q -n +2 coverage_root1.out coverage_root2.out coverage_root4.out coverage_server1.out coverage_server2.out coverage_storage_store1.out coverage_encryption1.out coverage_encryption2.out coverage_faultops1.out coverage_faultops2.out coverage_faultops3.out coverage_handlers1.out coverage_handlers2.out coverage_http1.out coverage_http2.out coverage_http3.out coverage_http4.out | grep -v "${grep_args[@]}" >> coverage_merged.out
          mv coverage_merged.out coverage.out

      - name: Check coverage floor (≥${{ env.COVERAGE_FLOOR }}%)
        if: steps.gate.outputs.full_tier == 'true' && steps.gate.outputs.selected != 'true'
        run: |
          pct=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          awk -v pct="$pct" -v floor="${COVERAGE_FLOOR}" 'BEGIN {
            if (pct+0 < floor+0) {
              print "FAIL: coverage " pct "% is below the " floor "% floor"
              exit 1
            }
            print "OK: coverage " pct "% meets the " floor "% floor"
          }'

  # Fresh-install API smoke, SQLite leg (Session I, 2026-09-28): boots a real
  # server on a freshly migrated database and calls every REST route, failing
  # on any 5xx. It exists for the bug class #2258 fixed (7 shipped features
  # that 500'd on every fresh install because no test used a fresh database).
  # FULL profile only (CI-LIGHT-1, 2026-10-16): merge_group, push to main when
  # the queue did not already pass the SHA, schedule, workflow_dispatch, and a
  # PR labeled ci:full. It ran on every pull_request push from 2026-10-11
  # (Andrei: a smoke failure first showing up inside the merge queue ejected
  # the PR and every entry queued behind it); runner capacity is now the
  # tighter constraint, so a PR author who wants this signal before queueing
  # adds ci:full. Same docs/web/go-unaffected gating as the test matrix. The
  # slower PostgreSQL, upgrade-path and web UI legs run nightly in
  # e2e-nightly.yml.
  e2e-smoke:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && needs.changes.outputs.full_profile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Fresh-install API smoke (SQLite)
        run: make e2e-smoke
      # Customer journeys N1-N3 + N6 (SQLite, no Docker, ~40s): assert end
      # results through the real server and CLI binaries. See
      # docs/TESTING_GUIDE.md "Customer journeys".
      - name: Customer journeys (fast tier)
        run: make e2e-journeys

  # QA-2 session (2026-10): the real-backend web UI smoke
  # (scripts/e2e/web-real-smoke.sh) previously ran ONLY nightly
  # (e2e-nightly.yml's e2e-web-smoke job) -- a web/server-http contract
  # break (the exact #2441/#2442/#2450 bug class) could sit on main for up
  # to a day before anything caught it. This runs the SAME script on every
  # PR that touches web/ or server/http/ instead of waiting for nightly.
  # Runs on pull_request AND merge_group (Andrei 2026-10-13, CI-E2E-MQ-1).
  # It used to be pull_request only to save runner capacity, but a spec that
  # went red through a PR-vs-main interaction (#3080) was never run against the
  # merged tree and sat on main for a day. In the queue the group commit is
  # the PR merged onto the current main plus the groups ahead of it, so this
  # is the only point where web specs see that combination. Not a required
  # check (branch protection lists neither this job nor its shards), so it
  # cannot stall the queue; it gates a group only through the queue's own
  # all-checks-green rule. Both shards run in parallel with the ~30 min
  # test-suite matrix, so they add runner minutes (~12 per group) but not
  # wall-clock time. Docs-only and operator-only groups still skip it.
  #
  # Runtime budget. 2026-10-05 (#2738): scripts/e2e/web-real-smoke.sh moved to
  # MAX_SPECS_PER_GROUP=1 (one spec file per freshly-booted server, so no
  # group's login budget is ever a sum of per-file counts -- see that script's
  # own comment). Each group costs 15-45s (boot + bootstrap + seed +
  # Playwright; the MFA files wait out real 30-second TOTP steps) and
  # ui-route-walk ~2m. 2026-10-11: with 17 spec files the single job was
  # killed at its 10-minute timeout (10m06s on #3065, with every group
  # passing), so it is now split into two parallel shards of the SAME specs:
  # KEYORIX_E2E_SHARD=i/n gives spec k of the sorted list to shard k%n+1, and
  # the script fails if any spec would belong to no shard. Measured on CI
  # (PR #3100, run 38165198610): shard 1/2 = 9 specs, 7m06s job time (incl.
  # ~1m checkout/pnpm/Playwright setup); shard 2/2 = 8 specs, 4m27s. Shard 1
  # is the longer one because round-robin lands ui-route-walk (~2m) in it.
  # Each shard keeps the 10-minute timeout. A spec file costs ~30s, so past
  # ~25 spec files shard 1 gets close to the limit again: check the shard
  # durations rather than assume, and raise the shard count in the matrix
  # and in KEYORIX_E2E_SHARD below.
  #
  # The matrix job is web-e2e-real-smoke-shard; web-e2e-real-smoke further down
  # is the aggregate under the original name.
  #
  # FULL profile only (CI-LIGHT-1, 2026-10-16): merge_group and a PR labeled
  # ci:full. A FAST pull_request run skips both shards and the aggregate (web
  # unit tests still run there in web-ci.yml).
  #
  # Merge-queue gate (CI-SELECT-1): on merge_group the shards run when the
  # `select` job's gate_web_e2e is true -- the server binary (./server or
  # anything it imports), web/**, cli/**, scripts/e2e/**, server/Dockerfile,
  # .dockerignore or the Makefile changed. That replaces web_e2e_relevant's
  # narrower path list there (a change in internal/core reaches the real
  # backend this drives). Outside merge_group the gate is always true.
  web-e2e-real-smoke-shard:
    needs: [changes, select]
    if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.full_profile == 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.web_e2e_relevant == 'true' || github.event_name == 'merge_group') && needs.select.outputs.gate_web_e2e == 'true'
    name: web-e2e-real-smoke-shard (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # --ignore-scripts: same supply-chain rationale as web-ci.yml.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Keyed on the lockfile hash, same cache key shape as e2e-nightly.yml's
      # own Playwright cache for this exact reason: any dependency bump
      # (including a Playwright version bump) always changes pnpm-lock.yaml
      # too, so this is a correct invalidation key, not an approximation.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright OS dependencies (cache hit -- browser binary already present)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: pnpm exec playwright install-deps chromium
      - name: Real-backend web UI smoke
        env:
          KEYORIX_E2E_SHARD: ${{ matrix.shard }}/2
        run: make e2e-web-smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-real-smoke-playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 7

  # Aggregate under the job's ORIGINAL name, so anything that refers to
  # `web-e2e-real-smoke` (a required-check entry, nightly-failure-issue's needs)
  # keeps working: it fails if either shard failed or was cancelled, and is
  # skipped exactly when the shards are (same gate as the shards).
  web-e2e-real-smoke:
    needs: [changes, select, web-e2e-real-smoke-shard]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.full_profile == 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.web_e2e_relevant == 'true' || github.event_name == 'merge_group') && needs.select.outputs.gate_web_e2e == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require both shards to pass
        env:
          SHARDS_RESULT: ${{ needs.web-e2e-real-smoke-shard.result }}
        run: |
          echo "web-e2e-real-smoke-shard matrix result: $SHARDS_RESULT"
          [ "$SHARDS_RESULT" = "success" ]

  # repo-guards (2026-10-05): the repo-wide structural guard tests (every
  # Test...Guard / ...Sweep / ...Completeness test: state-map completeness,
  # key-material wipe sweep, BeforeSave bypass, check-then-act, MFA step-up
  # purpose, ...) scan the WHOLE codebase, so a PR can break one without
  # touching the guarded package. The quick tier only runs affected packages,
  # so these failures used to surface first inside the merge queue, where each
  # one restarts every group behind it (~40 min each). They take ~1 min, so
  # they run on every non-docs PR here. The package list is derived at run
  # time, so a new guard test is picked up automatically. Not a required check:
  # the coordinator's merge script holds back PRs whose repo-guards failed, and
  # merge_group still runs the full suite as the real gate.
  #
  # Merge-queue selection (CI-SELECT-1): on a SELECTED merge_group run (the
  # `select` job's mode=selected) this job also runs, and runs every
  # repo-wide guard instead (scripts/ci/run-guards.sh: the named guards in
  # every root-module package, every source-scanning test, and the packages
  # in scripts/ci/global-guards.txt, the coordinator preflight's list). The
  # test-suite legs that normally carry these may have been skipped, so
  # selection must never decide whether a guard runs; build-and-test
  # (required) requires this job's success on a selected run. A full run gets
  # the same tests through test-suite, so the job stays skipped there, as
  # before. Same docs/web/go-unaffected/operator-only skips as test-suite.
  repo-guards:
    needs: [changes, select]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (github.event_name == 'pull_request' || needs.select.outputs.mode == 'selected')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Every repo-wide guard (selected merge-queue run)
        if: needs.select.outputs.mode == 'selected'
        run: scripts/ci/run-guards.sh

      - name: Run repo-wide guard tests
        if: github.event_name == 'pull_request'
        run: |
          pkgs=$(grep -rlE --include='*_test.go' 'func Test[A-Za-z0-9_]*(Guard|Sweep|Completeness)' ./internal ./server | xargs -n1 dirname | sort -u)
          echo "guard packages:"; echo "$pkgs"
          # shellcheck disable=SC2086
          go test -count=1 -timeout 600s -run '^Test[A-Za-z0-9_]*(Guard|Sweep|Completeness)' $pkgs

  lint:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      # The operator job below has always had its own gofmt step, scoped to
      # operator/ — the root module (internal/, server/, cmd/, ...) never
      # had one at all, so drift there went uncaught: 220 files had quietly
      # gone out of gofmt-compliance with nothing to catch it. operator/ is
      # excluded here since its own job already covers it.
      - name: gofmt
        run: |
          bad=$(gofmt -l . | grep -v '^operator/' || true)
          if [ -n "$bad" ]; then
            echo "gofmt needed:"
            echo "$bad"
            exit 1
          fi

      # Promotes the previously local-only `make lint` to a CI gate:
      # errcheck, staticcheck, unused, goconst, ineffassign (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # Executes the documented QUICK_START.md flow (keyorix-server admin init ->
  # start the server -> keyorix login -> project create -> secret create/get/
  # export) against real built binaries, in an isolated HOME/cwd -- this is the
  # CI + release gate for the SHIPPED keyorix binary (Phase 5, ADR-108).
  # scripts/smoke.sh's own header explains why this exists alongside
  # cli/cmd/quickstart_commands_test.go and server/admin/quickstart_commands_test.go,
  # which only prove the commands and flags exist, not that they work. A broken
  # `system init` (reading its config template from the wrong path) shipped
  # past a command-existence test undetected once before; this is the gate that
  # would have caught it. One job, not a matrix: `make smoke` builds the CLI
  # itself and the whole run takes seconds, so it isn't worth sharding or
  # reusing another job's build artifact.
  #
  # FULL profile only (CI-LIGHT-1, 2026-10-16), so it moved from pull_request
  # into merge_group: the merge queue is now where it gates what reaches main
  # (it was skipped on merge_group from 2026-10-03, CI-1, because every
  # pull_request push already ran it). A push to main skips it when the queue
  # already passed that exact SHA (queue_verified), like test-suite. Not a
  # required context, so it cannot stall the queue on its own.
  smoke:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.full_profile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Smoke test (executes QUICK_START.md's flow end to end, the shipped binary)
        run: make smoke

  # RELEASE-BLOCKERS item 5: `docker compose up -d` with the committed
  # docker-compose.yml/keyorix.docker.yaml, UNCHANGED, actually boots the
  # backend and answers a real request through the web/nginx proxy -- the
  # check that would have caught the item 1 crash-loop (an absolute
  # dek_path/salt_path in keyorix.docker.yaml hit
  # internal/securefiles.safeRelComponents' "must be relative" rejection on
  # every single boot) in about 15 seconds instead of shipping it invisibly.
  # Not a required check (the coordinator decides that separately) and
  # path-filtered via boot_smoke_relevant so it doesn't run on every
  # unrelated change. FULL profile only (CI-LIGHT-1, 2026-10-16): merge_group,
  # schedule, workflow_dispatch and a PR labeled ci:full; never on push.
  # Before, it ran on pull_request only, because boot_smoke_relevant used to
  # be hard-wired true for merge_group (coordinator review: ~5-8 min of
  # runner time on every group for a non-required job). merge_group now
  # computes boot_smoke_relevant from the group diff with the same regex, so
  # a group runs this exactly when one of its PRs would have.
  # demo-up-smoke and helm-boot-smoke below follow the same rule.
  #
  # Merge-queue gate (CI-SELECT-1): on merge_group this runs when the
  # `select` job's gate_docker_boot is true -- the server binary (./server or
  # anything it imports: the image compiles the whole root module), web/**
  # (the web image), docker-compose*, keyorix.docker.yaml, scripts/selfhost/**,
  # server/Dockerfile, web/Dockerfile, .dockerignore or the Makefile changed.
  # That replaces boot_smoke_relevant's narrower server/|internal/encryption/
  # regex there: a change in internal/config or internal/storage can stop the
  # container booting just as well. Outside merge_group the gate is true.
  docker-boot-smoke:
    needs: [changes, select]
    if: github.event_name != 'push' && needs.changes.outputs.full_profile == 'true' && (needs.changes.outputs.boot_smoke_relevant == 'true' || github.event_name == 'merge_group') && needs.select.outputs.gate_docker_boot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: keyorix-server:boot-smoke
          cache-from: type=gha,scope=keyorix-server
          cache-to: type=gha,mode=max,scope=keyorix-server

      - name: Build web image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          load: true
          tags: keyorix-web:boot-smoke
          cache-from: type=gha,scope=keyorix-web
          cache-to: type=gha,mode=max,scope=keyorix-web

      # keyorix.docker.yaml and docker-compose.yml are read UNCHANGED --
      # this override file only swaps the image references (built above,
      # not pulled from ghcr.io) and the web port (avoid colliding with
      # anything else on the runner), the same override-file technique
      # docs/SELF_HOSTING.md already documents for a local build.
      - name: Bring up the stack with the committed compose file, unchanged
        env:
          COMPOSE_PROJECT_NAME: kx-ci-boot-smoke
        run: |
          # The stack reads Docker secrets FILES (./secrets), not env vars. The runner's
          # uid is 1001 -- the uid the server runs as, which refuses a group-readable
          # file it owns -- so the script fails once and the files are handed to root
          # (the documented fix), then the second run succeeds.
          ./scripts/selfhost/init-secrets.sh || sudo chown root:"$(id -g)" secrets/*
          ./scripts/selfhost/init-secrets.sh
          printf 'services:\n  backend:\n    image: keyorix-server:boot-smoke\n  web:\n    image: keyorix-web:boot-smoke\n    ports:\n      - "18088:80"\n' > docker-compose.override.yml
          docker compose up -d

      - name: Wait for /api/v1/version 200 through the web service (timeout 120s)
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18088/api/v1/version || true)
            if [ "$code" = "200" ]; then
              echo "backend answered /api/v1/version 200"
              exit 0
            fi
            sleep 2
          done
          echo "backend never answered /api/v1/version 200 within 120s (last HTTP code: ${code:-none})" >&2
          exit 1

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # DEMO-2: scripts/demo/up.sh builds its OWN local air-gapped image (the
  # published ghcr.io/keyorixhq/keyorix-server-airgap image never embeds the
  # web UI -- #2752) and seeds a realistic org through the public API/CLI.
  # This job proves two things CI had no coverage for before: (1) up.sh
  # actually runs end to end and seeds what it claims to -- not just that it
  # parses as shell; (2) the air-gapped image genuinely makes zero outbound
  # network calls, via scripts/airgap-e2e.sh's own `--network none` drill
  # (already proven standalone, 2026-09-28 -- this wires it into CI instead
  # of only ever running by hand). Path-filtered via demo_smoke_relevant, the
  # same shape as boot_smoke_relevant just above, so it doesn't run on every
  # unrelated change. FULL profile only, like docker-boot-smoke above.
  #
  # Merge-queue gate (CI-SELECT-1): gate_demo -- the server binary and what it
  # imports, web/**, cli/** (up.sh builds and drives the CLI), scripts/demo/**,
  # scripts/totpgen/**, scripts/airgap-e2e.sh, server/Dockerfile,
  # .dockerignore or the Makefile. Replaces demo_smoke_relevant on
  # merge_group only, like docker-boot-smoke above.
  demo-up-smoke:
    needs: [changes, select]
    if: github.event_name != 'push' && needs.changes.outputs.full_profile == 'true' && (needs.changes.outputs.demo_smoke_relevant == 'true' || github.event_name == 'merge_group') && needs.select.outputs.gate_demo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: scripts/demo/up.sh (builds the image, seeds the demo)
        run: ./scripts/demo/up.sh

      - name: Verify the seed through the public API (not the database)
        run: |
          set -e
          # up.sh enrols TOTP for the admin (#2982), so a password login needs a
          # code, and every accepted code is single-use (anti-replay): a second
          # login here replays up.sh's window (-> 401) or has to wait out a step,
          # and every login AND MFA verify spends a slot of the per-IP budget
          # (10 per 15 min) that up.sh (3) and the check.sh step below (6) already
          # nearly use up (the 11th attempt is the 429). So reuse the admin
          # session up.sh obtained with its code login instead of logging in again.
          TOKEN=$(cat .demo-2-cli-home/.admin-session-token)
          [ -n "$TOKEN" ] || { echo "up.sh left no admin session token in .demo-2-cli-home" >&2; exit 1; }
          projects=$(curl -s -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/v1/projects | \
            jq -r '.data.projects | length')
          [ "$projects" = "3" ] || { echo "expected 3 seeded projects, got $projects" >&2; exit 1; }
          audit=$(curl -s -H "Authorization: Bearer $TOKEN" "http://localhost:8080/api/v1/audit/logs?page_size=1" | \
            jq -r '.data.total')
          [ "$audit" -gt "0" ] || { echo "expected a non-empty seeded audit trail, got $audit events" >&2; exit 1; }
          echo "seed verified: $projects projects, $audit audit events"

      - name: "scripts/demo/up.sh again (idempotency: must be a no-op reprint)"
        run: |
          out=$(./scripts/demo/up.sh)
          echo "$out"
          echo "$out" | grep -q "already running and seeded" || { echo "expected the idempotent no-op path, got a reseed" >&2; exit 1; }

      - name: Demo readiness check (fast API-only leg -- DEMO-READY-1)
        run: ./scripts/demo/check.sh --url http://localhost:8080 --no-ui

      - name: scripts/demo/down.sh
        run: ./scripts/demo/down.sh --wipe --force-default

      - name: Offline guarantee -- scripts/airgap-e2e.sh --network none against the same image
        run: |
          KEYORIX_AIRGAP_E2E_IMAGE=keyorix-demo:airgap ./scripts/airgap-e2e.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker logs keyorix-demo 2>&1 || true

  # RELEASE-BLOCKERS item 5, Helm half: a kind cluster + `helm install` with
  # chart defaults (readOnlyRootFilesystem: true, the bundled Postgres) must
  # reach Ready -- the check that would have caught the second, independent
  # defect item 1 fixed (dek.lock landing outside the one writable PVC mount
  # for the relative dek_path/salt_path convention under readOnlyRootFilesystem).
  # FULL profile only, gated on boot_smoke_relevant -- see docker-boot-smoke's
  # comment just above.
  #
  # Merge-queue gate (CI-SELECT-1): gate_helm_boot -- deploy/helm/** or
  # .github/testdata/helm* (the chart), plus everything docker-boot-smoke's
  # gate covers for the two images it builds. Replaces boot_smoke_relevant on
  # merge_group only.
  helm-boot-smoke:
    needs: [changes, select]
    if: github.event_name != 'push' && needs.changes.outputs.full_profile == 'true' && (needs.changes.outputs.boot_smoke_relevant == 'true' || github.event_name == 'merge_group') && needs.select.outputs.gate_helm_boot == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build server image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: keyorix-server:boot-smoke
          cache-from: type=gha,scope=keyorix-server
          cache-to: type=gha,mode=max,scope=keyorix-server

      - name: Build web image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          load: true
          tags: keyorix-web:boot-smoke
          cache-from: type=gha,scope=keyorix-web
          cache-to: type=gha,mode=max,scope=keyorix-web

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kx-ci-boot-smoke

      - name: Load images into kind
        run: |
          kind load docker-image keyorix-server:boot-smoke --name kx-ci-boot-smoke
          kind load docker-image keyorix-web:boot-smoke --name kx-ci-boot-smoke

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The admin password must satisfy the server's bootstrap policy (>=16
      # chars, upper/lower/digit/special, must not contain the username
      # "admin" or "Administrator"); the chart now fails the render below 16
      # chars (#2271). Generated per run so no literal credential lives in
      # the repo, and exported for the bootstrap assertion further down.
      - name: Generate a policy-compliant admin password
        run: |
          pw="Ci-Boot-$(openssl rand -hex 8)-Kx9!"
          echo "::add-mask::$pw"
          echo "KX_ADMIN_PW=$pw" >> "$GITHUB_ENV"

      - name: helm install with chart defaults
        run: |
          helm install kx deploy/helm/keyorix \
            --set auth.masterPassword=ci-boot-smoke \
            --set postgresql.auth.password=ci-boot-smoke \
            --set auth.adminPassword="$KX_ADMIN_PW" \
            --set server.image.repository=keyorix-server \
            --set server.image.tag=boot-smoke \
            --set server.image.pullPolicy=IfNotPresent \
            --set web.image.repository=keyorix-web \
            --set web.image.tag=boot-smoke \
            --set web.image.pullPolicy=IfNotPresent

      - name: Wait for the server pod to be Ready (timeout 300s)
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/instance=kx,app.kubernetes.io/component=server \
            --timeout=300s

      # Pod readiness alone never proved first-boot bootstrap worked: a
      # silently skipped or rejected bootstrap still leaves a Ready pod
      # (exactly how the missing KEYORIX_BOOTSTRAP_TOKEN went unnoticed until
      # #2271). Log in as the bootstrapped admin; retry for up to 90 s because
      # the entrypoint bootstraps only after the server reports healthy.
      - name: Assert the admin bootstrap actually completed (real login)
        run: |
          pod=$(kubectl get pod -l app.kubernetes.io/instance=kx,app.kubernetes.io/component=server -o name | head -n1)
          # The server is TLS-only (secure baseline, the chart default). Verify it
          # against the chart's own certificate (the web pod trusts the same one),
          # read from the generated Secret; its SANs include "localhost".
          kubectl get secret kx-keyorix-secure-baseline -o jsonpath='{.data.server\.crt}' | base64 -d > /tmp/kx-ca.crt
          test -s /tmp/kx-ca.crt
          kubectl port-forward "$pod" 18080:8080 >/tmp/pf.log 2>&1 &
          pf=$!
          trap 'kill $pf 2>/dev/null || true' EXIT
          body=$(jq -n --arg p "$KX_ADMIN_PW" '{username:"admin",password:$p}')
          for i in $(seq 1 30); do
            code=$(curl -s --cacert /tmp/kx-ca.crt -o /tmp/login.json -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "$body" https://localhost:18080/auth/login || true)
            if [ "$code" = "200" ]; then echo "admin login OK after ${i} attempt(s)"; exit 0; fi
            sleep 3
          done
          echo "::error::admin login never succeeded (last HTTP status: ${code:-none}) -- first-boot bootstrap did not complete"
          exit 1

      - name: Describe pods and dump logs on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=kx,app.kubernetes.io/component=server --tail=200 || true

      - name: Tear down
        if: always()
        run: |
          helm uninstall kx --wait --timeout 60s || true
          kind delete cluster --name kx-ci-boot-smoke || true

  # The Kubernetes operator is a separate Go module (operator/) so its
  # controller-runtime/client-go dependency tree stays out of the server/CLI build.
  # It is therefore not covered by the root `go ./...` jobs above; gate it here.
  operator:
    needs: [changes, select]
    # Deliberately NOT gated on operator_only -- that flag means the diff is
    # CONFINED to operator/, which is exactly the case this job must still
    # run for.
    # FAST profile: only when the PR touches operator/ (a separate module, no dependency on the root module); FULL: always (CI-LIGHT-1).
    # Merge-queue gate (CI-SELECT-1): gate_operator -- operator/** (its own
    # module, no dependency on the root module), .golangci.yml (the lint
    # config it inherits), or a file outside operator/ that its Go code names
    # by path (e.g. a CRD under deploy/helm/). ci.yml and scripts/ci/** make
    # every gate true.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.operator_changed == 'true') && needs.select.outputs.gate_operator == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: operator
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: go vet + build
        run: |
          go vet ./...
          go build ./...

      - name: go test
        run: go test -race -timeout 600s ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: operator

      - name: Cache gosec binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/gosec
          # Deliberately a distinct key from static-analysis's combined
          # govulncheck+gosec cache -- sharing one key across a job that caches
          # 2 binaries and one that caches 1 would let whichever job's save
          # step wins the race archive only its own (narrower) path set,
          # silently dropping govulncheck from the other job's restore. Also
          # keyed on the resolved Go version (see go-licenses's cache step
          # below for why) so a toolchain bump forces install-gosec.sh to
          # re-pin x/tools instead of reusing a binary built for an older Go.
          key: operator-gosec-${{ env.GOSEC_VERSION }}-xtools${{ env.GOSEC_TOOLS_VERSION }}-go${{ steps.setup-go.outputs.go-version }}-${{ runner.os }}

      - name: gosec
        # working-directory defaults to operator/ -- install-gosec.sh lives at the repo root.
        run: |
          [ -x ~/go/bin/gosec ] || ../scripts/ci/install-gosec.sh ~/go/bin/gosec
          gosec -severity medium -exclude-generated ./...

  # The thin CLI (ADR-108) is a separate Go module (cli/), same pattern as operator/ above:
  # its own go.mod, excluded from the repo's go.work, gated here rather than by the root
  # `go ./...` jobs. Unlike operator, that exclusion is load-bearing for a security property,
  # not just dependency-tree hygiene -- cli/internal/depguard's test is what actually proves
  # the module never imports server code or a cloud SDK; this job is what runs it on every PR.
  cli:
    needs: [changes]
    # Deliberately NOT gated on any *_only flag -- same reasoning as operator above: a diff
    # confined elsewhere still needs this job's own build/test/depguard result reported.
    # FAST profile: only when the PR touches cli/ (test-quick-cli already runs the affected cli tests on every Go PR); FULL: always (CI-LIGHT-1).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.cli_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: go vet + build
        run: |
          go vet ./...
          go build ./...

      - name: go test (includes the dependency guard, internal/depguard)
        run: go test -race -timeout 600s -count=1 ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: cli

      - name: Cache gosec binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/gosec
          # Distinct key from operator's and static-analysis's own gosec caches -- same
          # save-race reasoning as operator's own comment on this same step. Also keyed
          # on the resolved Go version -- see go-licenses's cache step below for why.
          key: cli-gosec-${{ env.GOSEC_VERSION }}-xtools${{ env.GOSEC_TOOLS_VERSION }}-go${{ steps.setup-go.outputs.go-version }}-${{ runner.os }}

      - name: gosec
        # working-directory defaults to cli/ -- install-gosec.sh lives at the repo root.
        run: |
          [ -x ~/go/bin/gosec ] || ../scripts/ci/install-gosec.sh ~/go/bin/gosec
          gosec -severity medium -exclude-generated ./...

  # keyorix-migrate (docs/design-keyorix-migrate.md): a third sibling module alongside cli/ and
  # operator/, same "own module, own CI job" shape as cli above -- except this one DOES carry
  # cloud SDKs in its SBOM (that's the entire reason it's not part of cli/, see ADR-108's
  # "moved out, not dropped" decision in docs/cli-split-inventory.md). The service container
  # makes internal/vaultsource's and internal/e2e's VAULT_ADDR-gated tests
  # (docs/design-keyorix-migrate.md's "Testing" section) actually run here as `default-ci`
  # (docs/security-closures.d/HEADER.txt's verification tiers) rather than silently skip forever --
  # the same failure mode CLAUDE.md's Postgres-container comment above documents for
  # KEYORIX_TEST_PG_DSN, avoided here by wiring the container from this job's first commit
  # instead of adding it later.
  #
  # Matrix runs the full suite against both a real Vault AND OpenBao (PR #2077 review item 4:
  # "OpenBao compatibility is part of our pitch") -- not a one-off manual check, a standing leg
  # every CI run exercises. Both service images are pinned by digest (review item 4's other
  # half); both env blocks set BOTH images' dev-mode variable names (VAULT_DEV_*/BAO_DEV_*)
  # unconditionally -- GitHub Actions `services.<id>.env` keys cannot themselves be templated
  # from the matrix (only values can), and each image ignores the other's variable names, so
  # setting both is harmless and is the only way one `services:` block covers both legs.
  migrate:
    needs: [changes, select]
    # FAST profile: only when the PR touches migrate/ (a separate module, no dependency on the root module); FULL: always (CI-LIGHT-1).
    # Merge-queue gate (CI-SELECT-1): gate_migrate -- migrate/**,
    # .golangci.yml, or a file outside migrate/ its Go code names by path.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.migrate_changed == 'true') && needs.select.outputs.gate_migrate == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: vault
            image: hashicorp/vault@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d # 1.15
          - leg: openbao
            image: openbao/openbao@sha256:05d777d6b47d0d0985b87317914632de31d98994b58e490ebabde3c389b09f8f # 2.0
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: migrate
    env:
      GOWORK: off
      VAULT_ADDR: http://localhost:8200
      VAULT_TOKEN: root-token
    services:
      vault:
        image: ${{ matrix.image }}
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          BAO_DEV_ROOT_TOKEN_ID: root-token
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200
        options: >-
          --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: go vet + build
        run: |
          go vet ./...
          go build ./...

      - name: go test (${{ matrix.leg }}) (includes internal/depguard, and the *-gated internal/vaultsource + internal/e2e suites)
        run: go test -race -timeout 600s -count=1 ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo 'gofmt needed:'; gofmt -l .; exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: migrate

      - name: Cache gosec binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/gosec
          # Keyed on the resolved Go version too -- see go-licenses's cache
          # step below for why.
          key: migrate-gosec-${{ env.GOSEC_VERSION }}-xtools${{ env.GOSEC_TOOLS_VERSION }}-go${{ steps.setup-go.outputs.go-version }}-${{ runner.os }}

      - name: gosec
        # working-directory defaults to migrate/ -- install-gosec.sh lives at the repo root.
        run: |
          [ -x ~/go/bin/gosec ] || ../scripts/ci/install-gosec.sh ~/go/bin/gosec
          gosec -severity medium -exclude-generated ./...

  # scripts/fuzzing/targets.d/*.conf (one file per target -- see
  # scripts/fuzzing/targets.d/README.md) is the hand-maintained canonical list
  # of this repo's fuzz targets; scripts/fuzzing/targets.conf is GENERATED from
  # it (gen-targets-conf.sh) purely for the external fuzz-harness rig, which
  # still reads the flat file. Neither has an automated link to what
  # `func FuzzXxx` targets actually exist in the tree. (The rig itself
  # discovers targets dynamically via the fuzz-harness runner; this list is the
  # human cross-check.) A sibling project hit exactly this failure mode for months with no
  # signal anything was wrong: an identical hand-maintained list silently
  # missed 18 of 44 real fuzz functions. This job closes that gap by diffing
  # the list of FuzzXxx functions `go test -list` finds in the tree (ground
  # truth) against what targets.d declares, failing on ANY divergence:
  #   - a real FuzzXxx exists but isn't declared -- it would silently never
  #     get continuously fuzzed (the sibling-project failure mode above).
  #   - targets.d declares a FuzzXxx that no longer exists -- a stale
  #     entry (e.g. after a rename/removal) that no longer matches any target
  #     in the tree.
  # Also skipped on web_only PRs: every target here is a Go `func FuzzXxx` in
  # internal/** (or operator/**), and `go test -list` output for those
  # packages cannot change from a diff that only touches web/ -- ADR-070
  # merged the frontend into this repo, but the fuzz targets themselves stay
  # Go-only (there's no JS/TS equivalent to Go's native fuzzing engine), so a
  # web/-only PR is guaranteed to produce the exact same true-targets.txt.
  fuzz-targets:
    needs: [changes, select]
    # Deliberately NOT gated on operator_only -- this job checks FuzzXxx
    # functions in BOTH the root and operator modules, and an operator-only
    # diff could add/remove/rename one there.
    # FULL profile only (CI-LIGHT-1). Required context: skipped satisfies it on a FAST PR run, the merge queue runs it.
    # Merge-queue gate (CI-SELECT-1): gate_fuzz_targets -- scripts/fuzzing/**,
    # or a changed .go file (any module) that has a `func Fuzz` line before
    # or after the change (an added, removed, renamed or build-tag-moved fuzz
    # target is the only thing this job's comparison can see change).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.full_profile == 'true' && needs.select.outputs.gate_fuzz_targets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Verify targets.conf is generated from targets.d/*.conf
        run: scripts/fuzzing/gen-targets-conf.sh --check

      - name: Verify targets.conf matches the real FuzzXxx functions in the tree
        run: |
          MODULE_PREFIX="github.com/keyorixhq/keyorix"

          # Reads `go test -list '^Fuzz' ./...`-style output on stdin and prints
          # "<pkg-relative-to-module>|<FuzzFuncName>" for every real FuzzXxx
          # function found, one per line. That output interleaves each
          # package's matched test names (if any) immediately before its own
          # "ok  <pkg>  <time>" (or "FAIL"/"?   <pkg> [no test files]") summary
          # line, so the parse below buffers pending names and flushes them,
          # tagged with the package they preceded, the moment it sees that
          # summary line. Only the ROOT module prefix is stripped (never the
          # operator/cli submodule's own path segment) -- each submodule's
          # import path is "github.com/keyorixhq/keyorix/<operator|cli>/...",
          # so stripping just the root leaves "operator/..." or "cli/..."
          # already disambiguated from the root module's own package paths;
          # re-adding that segment as a separate prefix would double it
          # (e.g. "cli/cli/internal/skew").
          extract_fuzz_targets() {
            awk -v modprefix="${MODULE_PREFIX}/" '
              /^(ok|FAIL)[ \t]/ {
                pkg = $2
                sub("^" modprefix, "", pkg)
                for (i = 1; i <= n; i++) print pkg "|" names[i]
                n = 0
                next
              }
              /^\?[ \t]/ { n = 0; next }
              /^#/       { next }
              NF == 0    { next }
              { n++; names[n] = $0 }
            '
          }

          echo "== true FuzzXxx functions: root module =="
          go test -list '^Fuzz' ./... | tee root-fuzz-list.txt
          # The operator is a separate Go module (see the `operator` job
          # above); GOWORK=off keeps it out of this repo's go.work, mirroring
          # that job's own established convention for module-specific checks.
          echo "== true FuzzXxx functions: operator module (GOWORK=off) =="
          (cd operator && GOWORK=off go test -list '^Fuzz' ./...) | tee operator-fuzz-list.txt
          # cli is also a separate Go module (see the `cli` job above, which
          # sets GOWORK: off for the same reason), and not listed in go.work's
          # `use` directives -- without this pass, any FuzzXxx function added
          # under cli/ is invisible to this check and its targets.d entry
          # is wrongly reported as stale.
          echo "== true FuzzXxx functions: cli module (GOWORK=off) =="
          (cd cli && GOWORK=off go test -list '^Fuzz' ./...) | tee cli-fuzz-list.txt

          extract_fuzz_targets < root-fuzz-list.txt > true-targets.txt
          extract_fuzz_targets < operator-fuzz-list.txt >> true-targets.txt
          extract_fuzz_targets < cli-fuzz-list.txt >> true-targets.txt
          sort -u true-targets.txt -o true-targets.txt

          cat scripts/fuzzing/targets.d/*.conf \
            | grep -vE '^[[:space:]]*(#|$)' \
            | awk -F'|' '{print $1"|"$2}' \
            | sort -u > declared-targets.txt

          echo "--- true FuzzXxx targets in the tree ---"; cat true-targets.txt
          echo "--- targets declared in scripts/fuzzing/targets.d/*.conf ---"; cat declared-targets.txt

          missing=$(comm -23 true-targets.txt declared-targets.txt)
          stale=$(comm -13 true-targets.txt declared-targets.txt)

          status=0
          if [ -n "$missing" ]; then
            echo "::error::FuzzXxx functions exist in the tree but are NOT declared in scripts/fuzzing/targets.d/ -- they would never be picked up by the continuous-fuzzing rig:"
            echo "$missing"
            status=1
          fi
          if [ -n "$stale" ]; then
            echo "::error::scripts/fuzzing/targets.d/ declares FuzzXxx targets that no longer exist in the tree (stale entry, e.g. after a rename/removal):"
            echo "$stale"
            status=1
          fi
          exit $status

  # Reach-check gate for in-wall fuzz harnesses. An "in-wall" harness seeds from a
  # valid fixture to pour the fuzzer PAST a signature/JSON wall (OIDC claims, SAML
  # assertion content, WebAuthn attestation) -- but it can run green while silently
  # DRY, every mutation dying at the wall, exercising none of the code behind it.
  # This runs scripts/fuzzing/harness-acceptance.sh in its fast, deterministic
  # seed-corpus mode (no -fuzz): it measures coverage of each target's post-wall
  # functions and fails if any falls below its floor, so a dry harness can't merge.
  # The deeper sibling/coverage-delta comparison is rig-only (--fuzz); this is the
  # CI-safe floor gate. Rationale: claude/2026-09-16-ai-fuzzing-best-practices-benchmark.md.
  fuzz-reach:
    needs: [changes, select]
    # FULL profile only (CI-LIGHT-1). Required context: skipped satisfies it on a FAST PR run, the merge queue runs it.
    # Merge-queue gate (CI-SELECT-1): gate_fuzz_reach -- scripts/fuzzing/**, or
    # an affected (changed or importing a changed) package among the TARGETS
    # packages of scripts/fuzzing/harness-acceptance.sh (read at run time; an
    # unreadable list opens the gate).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.full_profile == 'true' && needs.select.outputs.gate_fuzz_reach == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      - name: Reach-check in-wall fuzz harnesses (seed corpus, floor gate)
        run: bash scripts/fuzzing/harness-acceptance.sh

  # Dependency license compliance. Keyorix is dual-licensed -- the repo is
  # AGPL-3.0, but the same code is also commercially licensed to customers who
  # don't want AGPL obligations (see LICENSING.md's "Our principles"). Nothing
  # today stops a future `go get` from silently pulling in a dependency under
  # a license that's actually incompatible with that model: real copyleft
  # (GPL/AGPL/LGPL) that could "infect" the ability to relicense the resulting
  # binary commercially, or a source-available-but-restrictive license (SSPL,
  # BSL, Commons Clause, Elastic License) that explicitly bars commercial
  # redistribution. This job fails the build if any dependency -- direct or
  # transitive, in either Go module -- carries a license outside the allowlist.
  #
  # Allowlist verified against the ACTUAL dependency tree of both modules
  # (`go-licenses csv ./...`), not assumed: every third-party dependency in
  # both modules today is MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, or
  # MPL-2.0 (github.com/go-sql-driver/mysql) -- ordinary permissive/weak
  # file-level-copyleft licenses standard in the Go/cloud ecosystem. MPL-2.0's
  # copyleft is scoped to modifications of MPL-licensed files themselves; using
  # an unmodified MPL-2.0 dependency imposes no obligation on the rest of this
  # program. No GPL/AGPL/LGPL/SSPL/BSL/Commons-Clause/Elastic/Unknown licenses
  # were found in either module's real dependency tree.
  licenses:
    needs: [changes]
    # Deliberately NOT gated on operator_only -- this job checks BOTH the
    # root and operator modules' dependency licenses, and an operator-only
    # diff could add a new operator/go.mod dependency.
    # FAST profile: only when a go.mod/go.sum changed; FULL: always (CI-LIGHT-1). Required context: skipped satisfies it on the PR, the merge queue runs it.
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.deps_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      # Keyed on the resolved Go version too (not just GO_LICENSES_VERSION): a
      # go-licenses binary built under one Go toolchain and then reused as-is
      # against a DIFFERENT one (a cache hit surviving a Go version bump) can
      # fail to load stdlib package info at all ("does not have module info"
      # for arbitrary stdlib packages -- crypto/ecdh, testing, os/signal, ...),
      # since it invokes `go list`/`go/packages` against a GOROOT its own
      # compiled-in assumptions no longer match. A version-scoped key forces a
      # fresh `go install` (and therefore a binary built against the ACTIVE
      # toolchain) on every Go bump, not just every go-licenses version bump.
      - name: Cache go-licenses binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/go-licenses
          key: go-licenses-${{ env.GO_LICENSES_VERSION }}-go${{ steps.setup-go.outputs.go-version }}-${{ runner.os }}

      - name: Install go-licenses
        run: |
          [ -x ~/go/bin/go-licenses ] || go install "github.com/google/go-licenses@${GO_LICENSES_VERSION}" # NOSONAR -- go:S8545: version is pinned via GO_LICENSES_VERSION env

      # `--ignore` excludes each module's OWN code from the license check --
      # this repo is itself AGPL-3.0, which is expected and not a dependency
      # finding, not a license this job should flag. (The operator module has
      # no LICENSE file of its own inside operator/, so without --ignore its
      # own packages would misleadingly show up as "Unknown" too.)
      #
      # modernc.org/mathutil (transitive, via modernc.org/sqlite ->
      # modernc.org/libc, ADR-048) is also ignored here: it ships a genuine
      # BSD-3-Clause LICENSE file at its module root (manually verified), but
      # go-licenses v1.6.0's classifier fails to recognize this exact license
      # text variant and misreports it as unknown/disallowed -- a tool
      # limitation, not an actual licensing concern.
      - name: go-licenses check (root module)
        run: |
          go-licenses check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 \
            --ignore github.com/keyorixhq/keyorix \
            --ignore modernc.org/mathutil

      # The operator is a separate Go module (see the `operator` job above);
      # GOWORK=off keeps it out of this repo's go.work, mirroring that job's
      # own established convention for module-specific checks.
      - name: go-licenses check (operator module)
        working-directory: operator
        env:
          GOWORK: off
        run: |
          go-licenses check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 \
            --ignore github.com/keyorixhq/keyorix/operator

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed and later deleted on THIS branch
          # is still leaked. `fetch-depth: 0` is actions/checkout's documented
          # way to say that — but it fetches full history for every branch in
          # the repo, not just the checked-out one (its own docs: "0 indicates
          # all history for all branches and tags").
          fetch-depth: 0

      - name: Cache gitleaks binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitleaks
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ runner.os }}

      # Pinned binary instead of gitleaks-action (the action requires a
      # license key for org accounts; the CLI is MIT). Checksum-verified before
      # extraction (#115) — piping curl straight into tar trusted whatever GitHub
      # (or a MITM on the release CDN) served, with no integrity check.
      - name: gitleaks (full history)
        run: |
          if [ ! -x ./gitleaks ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
            tar -xz -f "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          fi
          # --log-opts="HEAD" restricts gitleaks to commits reachable from the
          # checked-out ref only. Without it, gitleaks' own default git-log
          # invocation walks every branch present in the fetch-depth:0 clone
          # above — verified empirically: on an unrelated branch with zero
          # commits in common with this one, the default scan still reported
          # a "leak" that only existed on a completely different, unmerged
          # branch elsewhere in the repo, and scanned ~1500 commits instead of
          # the ~900 actually reachable from HEAD. That means any PR could be
          # failed by a secret-shaped string on someone else's unrelated,
          # unmerged branch — this scopes the scan back to what this specific
          # PR/branch's own history actually contains, which is what the
          # "full history" comment above was always meant to check.
          ./gitleaks detect --source . --verbose --redact --log-opts="HEAD"

  helm-chart:
    needs: [changes, select]
    # FAST profile: only when the PR touches deploy/helm/ or .github/testdata/helm*; FULL: always (CI-LIGHT-1). Required context: skipped satisfies it on the PR, the merge queue runs it.
    # Merge-queue gate (CI-SELECT-1, same for helm-chart-security and
    # helm-chart-policy): gate_helm -- deploy/helm/** or .github/testdata/helm*,
    # everything these helm lint/template/kubeconform/checkov/kube-score steps
    # read (plus ci.yml itself, which opens every gate).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.helm_changed == 'true') && needs.select.outputs.gate_helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm lint
        run: |
          helm lint deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci

      - name: Cache kubeconform binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ runner.os }}

      - name: Render + schema-validate (kubeconform)
        run: |
          # Pinned version + checksum-verified before extraction (#115) — was
          # /releases/latest/download/ (floating) piped straight into tar with no
          # integrity check at all.
          if [ ! -x ./kubeconform ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
            tar -xz -f kubeconform-linux-amd64.tar.gz kubeconform
          fi
          # Render both the bundled-DB and external-DB paths and validate against
          # the Kubernetes schema.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            --set auth.adminPassword=Ci-Render-Only-Pw1! --set ingress.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.enabled=false \
            --set externalDatabase.host=db.example.com --set externalDatabase.password=ci \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0
          # secureBaseline (SECURE-DEFAULT-1): TLS server/web/postgres, the
          # prepare-files initContainer and the generated Secret.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            --set auth.adminPassword=Ci-Render-Only-Pw1! --set secureBaseline.enabled=true \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0

      - name: Pinned default image tag + Secret-sourced passwords (#137)
        run: |
          # #137 residual: server/web images used to default to the mutable
          # `latest` tag, and this asserts the default render instead pins to
          # the chart's own appVersion (matching keyorix-operator/
          # keyorix-k8s-sync's already-hardened `default .Chart.AppVersion .tag`
          # convention) -- no `latest` anywhere in the default render.
          APP_VERSION="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/keyorix/Chart.yaml)"
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            --set auth.adminPassword=Ci-Render-Only-Pw1! > default-render.yaml
          if grep -q ':latest' default-render.yaml; then
            echo "expected no ':latest' image tag in the default render"; exit 1
          fi
          if ! grep -q "image: ghcr.io/keyorixhq/keyorix-server:${APP_VERSION}\$" default-render.yaml; then
            echo "expected the server image pinned to appVersion ${APP_VERSION}"; exit 1
          fi
          if ! grep -q "image: \"ghcr.io/keyorixhq/keyorix-web:${APP_VERSION}\"\$" default-render.yaml; then
            echo "expected the web image pinned to appVersion ${APP_VERSION}"; exit 1
          fi
          # An explicit tag/digest override must still work (non-regression for
          # existing values.yaml overrides set before this fix).
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            --set server.image.tag=v1.2.3 --set web.image.digest=sha256:deadbeef \
            > override-render.yaml
          if ! grep -q 'image: ghcr.io/keyorixhq/keyorix-server:v1.2.3$' override-render.yaml; then
            echo "expected an explicit server.image.tag override to still apply"; exit 1
          fi
          if ! grep -q 'image: "ghcr.io/keyorixhq/keyorix-web@sha256:deadbeef"$' override-render.yaml; then
            echo "expected web.image.digest to still take precedence over tag"; exit 1
          fi
          # #137 residual, DEPLOY-2: the master/db/admin passwords reach the pod as
          # files from the mounted Secret (a *_FILE variable), never as an env var --
          # neither a literal value nor a secretKeyRef. (deploy/hardening
          # TestHelmChart_SecretsAreMountedFilesNotEnv checks the mount modes.)
          for key in KEYORIX_MASTER_PASSWORD KEYORIX_DB_PASSWORD KEYORIX_ADMIN_PASSWORD POSTGRES_PASSWORD; do
            if grep -q "name: $key\$" default-render.yaml; then
              echo "expected $key NOT to be an environment variable (use ${key}_FILE)"; exit 1
            fi
            if ! grep -A1 "name: ${key}_FILE\$" default-render.yaml | grep -q 'value: /run/secrets/keyorix/'; then
              echo "expected ${key}_FILE to point at the mounted Secret under /run/secrets/keyorix/"; exit 1
            fi
          done
          if grep -q 'secretKeyRef' default-render.yaml; then
            echo "expected no secretKeyRef env var in the default render (credentials are mounted files)"; exit 1
          fi

      - name: Lint + render keyorix-k8s-sync chart
        run: |
          K8S_SYNC_SET="--set keyorix.url=https://k --set keyorix.projectID=1 --set keyorix.tokenSecret.name=tok \
            --set mappings[0].ref=e/n --set mappings[0].namespace=app \
            --set mappings[0].name=s --set mappings[0].key=K"
          # $K8S_SYNC_SET is deliberately unquoted below: it holds multiple
          # space-separated `--set` flags meant to word-split into separate
          # helm arguments, not one literal string.
          # shellcheck disable=SC2086
          helm lint deploy/helm/keyorix-k8s-sync $K8S_SYNC_SET
          # Same reason as above.
          # shellcheck disable=SC2086
          helm template kx deploy/helm/keyorix-k8s-sync $K8S_SYNC_SET \
            --set targetNamespaces='{app,web}' \
            | ./kubeconform -strict -summary -kubernetes-version 1.29.0

      - name: "Lint + render keyorix-operator chart (ADR-076: all 4 scope paths)"
        run: |
          helm lint deploy/helm/keyorix-operator
          helm lint deploy/helm/keyorix-operator --set 'watchNamespaces={team-a,team-b}'
          helm lint deploy/helm/keyorix-operator --set rbac.clusterScoped=true

          # For each of the 3 renderable paths this asserts the same two things: the
          # rendered RBAC binding kind+namespace(s), and the rendered manager flag,
          # actually AGREE with each other — not just that something renders. That
          # agreement check is what #1224's chart-precedence bug (and the separate,
          # previously-undocumented RBAC/cache wiring gap ADR-076's investigation found)
          # would have violated; asserting it directly is what makes this bug class
          # non-recurring rather than merely fixed once more.

          # Path 1 (ADR-076 DEFAULT): rbac.clusterScoped=false, watchNamespaces=[] --
          # RoleBinding in the release's own namespace only, matching the manager's own
          # fail-closed default (operator/cmd/main.go, Commit 1): with no explicit flag,
          # it would watch only its own namespace via POD_NAMESPACE. No longer the
          # cluster-wide default this test asserted pre-ADR-076.
          helm template kx deploy/helm/keyorix-operator --set leaderElection=true \
            > default-render.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 < default-render.yaml
          if grep -q '^kind: ClusterRoleBinding$' default-render.yaml; then
            echo "did not expect a ClusterRoleBinding in the default (namespace-scoped) render"; exit 1
          fi
          if ! grep -A2 '^kind: RoleBinding$' default-render.yaml | grep -q 'name: kx-keyorix-operator$'; then
            echo "expected a RoleBinding named kx-keyorix-operator in the release namespace (default)"; exit 1
          fi
          if ! grep -q '^            - "-watch-namespaces=default"$' default-render.yaml; then
            echo "expected the -watch-namespaces=default flag on the manager Deployment (must agree with the RoleBinding namespace above)"; exit 1
          fi

          # Path 2 (opt-in multi-namespace): watchNamespaces set -- RoleBinding per listed
          # namespace, no ClusterRoleBinding.
          helm template kx deploy/helm/keyorix-operator --set 'watchNamespaces={team-a,team-b}' \
            > scoped-render.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 < scoped-render.yaml
          if grep -q '^kind: ClusterRoleBinding$' scoped-render.yaml; then
            echo "did not expect a ClusterRoleBinding when watchNamespaces is set"; exit 1
          fi
          for ns in team-a team-b; do
            if ! grep -B2 "  namespace: $ns\$" scoped-render.yaml | grep -q 'name: kx-keyorix-operator$'; then
              echo "expected a RoleBinding named kx-keyorix-operator in namespace $ns"; exit 1
            fi
          done
          if ! grep -q '^            - "-watch-namespaces=team-a,team-b"$' scoped-render.yaml; then
            echo "expected the -watch-namespaces=team-a,team-b flag on the manager Deployment"; exit 1
          fi

          # Path 3 (explicit cluster-wide opt-in): rbac.clusterScoped=true,
          # watchNamespaces=[] -- ClusterRoleBinding, -all-namespaces flag. The ONLY route
          # to cluster-wide (ADR-076) -- no longer reachable via any default.
          helm template kx deploy/helm/keyorix-operator --set rbac.clusterScoped=true \
            > cluster-render.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 < cluster-render.yaml
          if ! grep -q '^kind: ClusterRoleBinding$' cluster-render.yaml; then
            echo "expected a ClusterRoleBinding when rbac.clusterScoped=true"; exit 1
          fi
          if grep -A2 '^kind: RoleBinding$' cluster-render.yaml | grep -q 'name: kx-keyorix-operator$'; then
            echo "unexpected namespace-scoped RoleBinding for the main Secret/CRD grant when rbac.clusterScoped=true"
            exit 1
          fi
          if ! grep -q '^            - "-all-namespaces"$' cluster-render.yaml; then
            echo "expected the -all-namespaces flag on the manager Deployment"; exit 1
          fi
          if grep -q '^            - "-watch-namespaces=' cluster-render.yaml; then
            echo "did not expect a -watch-namespaces flag when rbac.clusterScoped=true"; exit 1
          fi

          # Path 4 (contradictory config): rbac.clusterScoped=true AND watchNamespaces set
          # -- must fail the render outright (ADR-076 decision B: no precedence-based
          # resolution of this exact combination, since #1224 already showed what that
          # produces). helm template must exit non-zero and never reach kubeconform.
          if helm template kx deploy/helm/keyorix-operator --set rbac.clusterScoped=true \
              --set 'watchNamespaces={team-a}' > contradictory-render.yaml 2> contradictory-error.txt; then
            echo "expected helm template to fail for rbac.clusterScoped=true + watchNamespaces set"; exit 1
          fi
          if ! grep -q 'mutually exclusive' contradictory-error.txt; then
            echo "expected the failure message to name the contradiction"; cat contradictory-error.txt; exit 1
          fi

      - name: "Egress NetworkPolicy + PodDisruptionBudget (K8S-HARDENING)"
        run: |
          # Before this, every chart's NetworkPolicy set policyTypes: [Ingress] only --
          # egress was completely unrestricted by default (any pod could reach anything
          # the cluster network permits: internal services, cloud metadata endpoints,
          # arbitrary internet hosts). This asserts the fix actually landed in the
          # rendered output, not just that egress: {} templating exists in the source.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            > keyorix-egress-render.yaml
          for name in kx-keyorix-server kx-keyorix-web kx-keyorix-postgresql; do
            if ! grep -A1 "^  name: $name\$" keyorix-egress-render.yaml | grep -q "$name"; then
              echo "expected a NetworkPolicy named $name"; exit 1
            fi
          done
          # server and web must have Egress in policyTypes (postgresql too, even though
          # its own rule list is empty -- Egress must still be in policyTypes for the
          # empty egress: [] to actually mean deny-all, not "unset/unrestricted").
          EGRESS_POLICYTYPE_COUNT="$(grep -c '^    - Egress$' keyorix-egress-render.yaml)"
          if [ "$EGRESS_POLICYTYPE_COUNT" -lt 3 ]; then
            echo "expected at least 3 'Egress' policyType entries (server, web, postgresql), found $EGRESS_POLICYTYPE_COUNT"
            exit 1
          fi
          # web must NOT gain an Ingress restriction (#137's original design: the web UI
          # is the public entry point and stays open to inbound traffic from any pod, only
          # egress is now scoped) -- assert its NetworkPolicy has no `ingress:` key at all.
          if awk '/^  name: kx-keyorix-web$/{f=1} f && /^kind: NetworkPolicy$/{exit} f && /^  ingress:$/{found=1} f && /^---$/{exit} END{exit !found}' keyorix-egress-render.yaml; then
            echo "did not expect an ingress: block on the web NetworkPolicy"; exit 1
          fi
          # No PDB at the default replica count of 1 anywhere (a PDB on a singleton can
          # only ever block its own voluntary eviction/drain, never add real tolerance).
          if grep -q '^kind: PodDisruptionBudget$' keyorix-egress-render.yaml; then
            echo "did not expect a PodDisruptionBudget at the default web.replicas=1"; exit 1
          fi
          # Scaling web out must produce a PDB with minAvailable: 1.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci --set web.replicas=2 \
            > keyorix-web-scaled-render.yaml
          if ! grep -A3 '^kind: PodDisruptionBudget$' keyorix-web-scaled-render.yaml | grep -q 'name: kx-keyorix-web$'; then
            echo "expected a PodDisruptionBudget named kx-keyorix-web when web.replicas=2"; exit 1
          fi
          if ! grep -q '^  minAvailable: 1$' keyorix-web-scaled-render.yaml; then
            echo "expected minAvailable: 1 on the web PodDisruptionBudget"; exit 1
          fi

          K8S_SYNC_SET="--set keyorix.url=https://k --set keyorix.projectID=1 --set keyorix.tokenSecret.name=tok"
          # shellcheck disable=SC2086
          helm template kx deploy/helm/keyorix-k8s-sync $K8S_SYNC_SET > k8s-sync-egress-render.yaml
          if ! grep -A2 '^kind: NetworkPolicy$' k8s-sync-egress-render.yaml | grep -q 'name: kx-keyorix-k8s-sync$'; then
            echo "expected a NetworkPolicy named kx-keyorix-k8s-sync"; exit 1
          fi
          if ! grep -q '^    - Egress$' k8s-sync-egress-render.yaml; then
            echo "expected Egress in keyorix-k8s-sync's NetworkPolicy policyTypes"; exit 1
          fi

          helm template kx deploy/helm/keyorix-operator > operator-egress-render.yaml
          if ! grep -A2 '^kind: NetworkPolicy$' operator-egress-render.yaml | grep -q 'name: kx-keyorix-operator-metrics$'; then
            echo "expected a NetworkPolicy named kx-keyorix-operator-metrics"; exit 1
          fi
          if ! grep -q '^    - Egress$' operator-egress-render.yaml; then
            echo "expected Egress in keyorix-operator's NetworkPolicy policyTypes"; exit 1
          fi
          if grep -q '^kind: PodDisruptionBudget$' operator-egress-render.yaml; then
            echo "did not expect a PodDisruptionBudget at the default replicas=1"; exit 1
          fi
          helm template kx deploy/helm/keyorix-operator --set replicas=2 --set leaderElection=true \
            > operator-scaled-render.yaml
          if ! grep -A3 '^kind: PodDisruptionBudget$' operator-scaled-render.yaml | grep -q "name: kx-keyorix-operator\$"; then
            echo "expected a PodDisruptionBudget named kx-keyorix-operator when replicas=2"; exit 1
          fi

          # allowedServers (the confused-deputy control, operator/internal/controller's
          # validateServer) must actually reach the manager's CLI flag -- without this
          # wiring, every KeyorixSecret CR is rejected on any helm-installed operator with
          # no way to configure it short of hand-editing the rendered Deployment.
          if grep -q '\-allowed-servers=' operator-egress-render.yaml; then
            echo "did not expect -allowed-servers in the default render (allowedServers unset)"; exit 1
          fi
          helm template kx deploy/helm/keyorix-operator --set 'allowedServers={https://a,https://b}' \
            > operator-allowed-servers-render.yaml
          if ! grep -q -- '-allowed-servers=https://a,https://b' operator-allowed-servers-render.yaml; then
            echo "expected -allowed-servers=https://a,https://b on the manager Deployment"; exit 1
          fi

  # helm-chart (above) validates chart/schema *shape* (helm lint + kubeconform
  # against the Kubernetes API schema) but asserts nothing about security
  # *policy* -- it would not catch e.g. a future PR accidentally dropping
  # `readOnlyRootFilesystem: true` or `allowPrivilegeEscalation: false` from a
  # pod security context, or a chart that starts granting wildcard/escalate RBAC.
  # This job closes that gap by running checkov's Kubernetes policy checks
  # against the same rendered chart output.
  helm-chart-security:
    needs: [changes, select]
    # FAST profile: only when the PR touches deploy/helm/ or .github/testdata/helm*; FULL: always (CI-LIGHT-1). Required context: skipped satisfies it on the PR, the merge queue runs it.
    # Merge-queue gate: gate_helm (see helm-chart).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.helm_changed == 'true') && needs.select.outputs.gate_helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Cache checkov binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: checkov_dist
          key: checkov-${{ env.CHECKOV_VERSION }}-${{ runner.os }}

      - name: Install checkov
        run: |
          # Pinned version + checksum-verified before extraction (#115) -- see the
          # CHECKOV_VERSION/CHECKOV_LINUX_X64_SHA256 comment in the env block above.
          if [ ! -x checkov_dist/dist/checkov ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/bridgecrewio/checkov/releases/download/${CHECKOV_VERSION}/checkov_linux_X86_64.zip"
            echo "${CHECKOV_LINUX_X64_SHA256}  checkov_linux_X86_64.zip" | sha256sum -c -
            unzip -q checkov_linux_X86_64.zip -d checkov_dist
          fi
          echo "$PWD/checkov_dist/dist" >> "$GITHUB_PATH"

      - name: Render all 3 charts
        run: |
          # Reuses the same --set values as the helm-chart job's renders, so this
          # job scans exactly what that job already proved schema-valid. Every
          # chart's image is rendered with an explicit digest override so
          # CKV_K8S_43 (image should use digest) checks the pinned-production
          # shape rather than the ergonomic default (a mutable tag) every chart
          # falls back to when no digest is given -- CKV_K8S_43 checks what's
          # actually rendered, not whether the chart merely *supports* pinning,
          # so an unpinned render would fail it regardless of chart capability.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            --set auth.adminPassword=Ci-Render-Only-Pw1! --set ingress.enabled=true \
            --set server.image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set web.image.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            > keyorix-render.yaml
          helm template kx deploy/helm/keyorix-k8s-sync \
            --set keyorix.url=https://k --set keyorix.projectID=1 --set keyorix.tokenSecret.name=tok \
            --set mappings[0].ref=e/n --set mappings[0].namespace=app \
            --set mappings[0].name=s --set mappings[0].key=K \
            --set targetNamespaces='{app,web}' \
            --set image.digest=sha256:3333333333333333333333333333333333333333333333333333333333333333 \
            > k8s-sync-render.yaml
          helm template kx deploy/helm/keyorix-operator \
            --set image.digest=sha256:4444444444444444444444444444444444444444444444444444444444444444 \
            > operator-render.yaml

      - name: checkov (pod security + RBAC-escalation policy scan)
        run: |
          # Scoped to the hardening properties this repo has already committed to
          # (non-root, dropped capabilities, read-only rootfs, no privilege
          # escalation, seccomp, no privileged/hostPID/hostIPC/hostNetwork
          # containers) plus the RBAC-escalation family named in the background
          # for this job (wildcard rules, escalate/bind, CSR-approval, webhook
          # control, default-SA binding) -- NOT checkov's full default Kubernetes
          # ruleset, which also flags missing resource limits/probes/image pull
          # policy/etc. Those aren't regressions in anything hardened today and
          # would just be alert-fatigue noise (a scanner nobody trusts because
          # it's noisy is worse than no scanner).
          #
          # Deliberately excluded after reading their check source, not blind
          # suppression:
          #   CKV_K8S_35 ("prefer secret-as-file over secretKeyRef env vars")
          #     directly contradicts this repo's own #137 fix, which *moved to*
          #     secretKeyRef env vars as the hardening step -- enabling it would
          #     permanently flag an intentional, already-reviewed decision.
          #   CKV_K8S_40 ("runAsUser >= 10000") conflicts with the fixed,
          #     image-matched UIDs already documented in the deployment templates
          #     (1001 server, 101 nginx, 999 postgres, 65532 distroless).
          #
          # CKV_K8S_43 ("image should use digest") is included: keyorix-operator and
          # keyorix-k8s-sync now support .Values.image.digest (mirroring the main
          # chart), and this check is what actually catches a chart shipping without
          # that pinning option -- a real, previously-unnoticed gap on exactly the two
          # charts whose ServiceAccounts hold the most sensitive access (cluster/
          # namespace-wide Secret RBAC, and a live Keyorix bearer token respectively).
          # The render step above sets a digest for every chart so this doesn't
          # regress to alert-fatigue noise on the ergonomic (tag-only) default.
          #
          # --framework kubernetes: restricts the scan to K8s policy checks only,
          # skipping checkov's separate secrets-framework (gitleaks above already
          # covers secret scanning across full git history; these rendered files
          # are CI-only artifacts, not committed content, and contain only the
          # placeholder `ci` password values passed via --set above).
          CHECKS="CKV_K8S_16,CKV_K8S_17,CKV_K8S_18,CKV_K8S_19,CKV_K8S_20,CKV_K8S_22,CKV_K8S_23,CKV_K8S_28,CKV_K8S_31,CKV_K8S_37,CKV_K8S_42,CKV_K8S_43,CKV_K8S_49,CKV_K8S_155,CKV_K8S_156,CKV_K8S_157,CKV_K8S_158"
          checkov --framework kubernetes --compact --check "$CHECKS" \
            -f keyorix-render.yaml -f k8s-sync-render.yaml -f operator-render.yaml

  # Policy-as-code for the 3 charts: kubeconform (schema shape, like helm-chart
  # above, but also over a "maximal" values file with every optional feature on
  # -- ingress+TLS, CORS, a scaled-out web replica set, multiple k8s-sync
  # mappings/target namespaces + cleanup, operator leaderElection+replicas=2 +
  # allowedServers -- so templating paths the helm-chart job's narrower default/
  # external-DB renders never exercise still get schema-validated) plus
  # kube-score (policy: security context, probes, NetworkPolicy coverage,
  # PodDisruptionBudget presence -- checkov above already covers the
  # security-context/RBAC-escalation family; kube-score adds the
  # probes/NetworkPolicy-coverage/PDB checks neither checkov nor kubeconform's
  # schema-shape validation touches). A positive-control fixture
  # (.github/testdata/helm-policy-bad-fixture.yaml: privileged container, no
  # resource limits, no securityContext) is scored FIRST, in isolation, to prove
  # the job's own flags don't accidentally neuter it before trusting a clean
  # result on the real charts -- see CLAUDE.md's "confirm it is green on a
  # known-good case as well as red on a known-bad one."
  #
  # No Kubernetes cluster, no network calls beyond the two pinned+checksummed
  # tool downloads below (cached after the first run) -- pure `helm template` +
  # two static Go binaries over ~15 small YAML files, comfortably under a
  # minute. Gated the same way as helm-chart/helm-chart-security above (chart-
  # relevant changes), not further restricted to deploy/helm/** specifically:
  # at this runtime there's no CI-minute budget reason to narrow it further.
  helm-chart-policy:
    needs: [changes, select]
    # FAST profile: only when the PR touches deploy/helm/ or .github/testdata/helm*; FULL: always (CI-LIGHT-1).
    # Merge-queue gate: gate_helm (see helm-chart).
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.helm_changed == 'true') && needs.select.outputs.gate_helm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Cache kubeconform binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kubeconform
          key: kubeconform-${{ env.KUBECONFORM_VERSION }}-${{ runner.os }}

      - name: Install kubeconform
        run: |
          # Same pinned version + checksum-verified download as the helm-chart
          # job above (env.KUBECONFORM_VERSION/KUBECONFORM_LINUX_AMD64_SHA256) --
          # a separate job-level cache entry under the same key, so a cache hit
          # here skips the download regardless of which job populated it first.
          if [ ! -x ./kubeconform ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
            echo "${KUBECONFORM_LINUX_AMD64_SHA256}  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
            tar -xz -f kubeconform-linux-amd64.tar.gz kubeconform
          fi

      - name: Cache kube-score binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: kube-score
          key: kube-score-${{ env.KUBE_SCORE_VERSION }}-${{ runner.os }}

      - name: Install kube-score
        run: |
          if [ ! -x ./kube-score ]; then
            curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/zegl/kube-score/releases/download/v${KUBE_SCORE_VERSION}/kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz"
            echo "${KUBE_SCORE_LINUX_AMD64_SHA256}  kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
            tar -xz -f "kube-score_${KUBE_SCORE_VERSION}_linux_amd64.tar.gz" kube-score
          fi

      - name: Positive control -- kube-score must fail on a deliberately bad manifest
        run: |
          # Run BEFORE trusting a clean result on the real charts below, with the
          # exact same --ignore-test flag the real scan uses, so a too-broad
          # ignore-list change here can't silently mask itself. If this step ever
          # stops failing, the CHECK is broken, not the fixture -- see the
          # fixture file's own header comment.
          if ./kube-score score .github/testdata/helm-policy-bad-fixture.yaml \
              --ignore-test container-image-pull-policy > positive-control.txt 2>&1; then
            echo "expected kube-score to fail (exit non-zero) on the deliberately bad fixture"
            cat positive-control.txt
            exit 1
          fi
          if ! grep -q 'Security Context Privileged' positive-control.txt; then
            echo "expected the privileged-container finding specifically, not just any failure"
            cat positive-control.txt
            exit 1
          fi

      - name: Render default + maximal values for all 3 charts
        run: |
          # "Default" mirrors the helm-chart job's own default render. "Maximal"
          # (.github/testdata/helm-maximal/*.yaml) turns on every optional
          # feature this job's narrower default doesn't touch -- see each
          # fixture's own header comment for exactly what it exercises.
          helm template kx deploy/helm/keyorix \
            --set auth.masterPassword=ci --set postgresql.auth.password=ci \
            > keyorix-default.yaml
          helm template kx deploy/helm/keyorix \
            -f .github/testdata/helm-maximal/keyorix-chart.yaml \
            > keyorix-maximal.yaml
          helm template kx deploy/helm/keyorix-k8s-sync \
            --set keyorix.url=https://k --set keyorix.projectID=1 --set keyorix.tokenSecret.name=tok \
            > k8s-sync-default.yaml
          helm template kx deploy/helm/keyorix-k8s-sync \
            -f .github/testdata/helm-maximal/keyorix-k8s-sync.yaml \
            > k8s-sync-maximal.yaml
          # --include-crds: helm template omits a chart's crds/ directory from its
          # output unless this is passed -- without it, the operator's own
          # CustomResourceDefinition object (deploy/helm/keyorix-operator/crds/)
          # is never rendered here at all, let alone validated. The existing
          # helm-chart job's own operator render (above, pre-existing) doesn't
          # pass this flag either -- this job is the first one in this repo that
          # actually validates the CRD object.
          helm template kx deploy/helm/keyorix-operator --include-crds \
            > operator-default.yaml
          helm template kx deploy/helm/keyorix-operator --include-crds \
            -f .github/testdata/helm-maximal/keyorix-operator.yaml \
            > operator-maximal.yaml

      - name: kubeconform (schema validation, default + maximal, all 3 charts)
        run: |
          for f in keyorix-default.yaml keyorix-maximal.yaml \
                   k8s-sync-default.yaml k8s-sync-maximal.yaml; do
            ./kubeconform -strict -summary -kubernetes-version 1.29.0 < "$f"
          done
          # -skip CustomResourceDefinition: kubeconform's bundled schema catalog
          # has no schema for apiextensions.k8s.io's CustomResourceDefinition
          # kind at all (confirmed locally: "could not find schema for
          # CustomResourceDefinition" even with no other flags changed) -- a
          # kubeconform catalog gap, not a property of this chart's CRD. Scoped
          # to exactly this one kind via -skip (not -ignore-missing-schemas,
          # which would also silently skip any OTHER unrecognized kind in the
          # file) so every other object in the render is still strictly checked.
          for f in operator-default.yaml operator-maximal.yaml; do
            ./kubeconform -strict -summary -kubernetes-version 1.29.0 \
              -skip CustomResourceDefinition < "$f"
          done

      - name: kube-score (policy scan, default + maximal, all 3 charts)
        run: |
          # container-image-pull-policy is the ONLY check ignored globally (every
          # container in every chart here uses IfNotPresent with an explicit,
          # non-`latest` tag or digest -- see each chart's own image.tag/digest
          # values.yaml comments -- so `Always` buys no security benefit once
          # content is pinned, only an extra registry round-trip on every pod
          # (re)start; pullPolicy stays user-configurable per chart for anyone
          # who wants `Always` anyway). Every OTHER ignore is scoped to the
          # specific resource it applies to via a `kube-score/ignore` annotation
          # committed in that resource's own template, each with its own
          # documented reason there -- not listed again here, so there is
          # exactly one place per exclusion to keep in sync, not two.
          #
          # Deliberately does NOT pass --exit-one-on-warning: two WARNINGs are
          # left un-ignored on purpose (web's few-replicas and missing host
          # podAntiAffinity, both real, both non-blocking, see keyorix/README.md
          # -- ignoring them would misrepresent an open gap as a reviewed
          # decision). CRITICAL findings still fail this step by kube-score's
          # own default exit behavior.
          ./kube-score score keyorix-default.yaml keyorix-maximal.yaml \
            k8s-sync-default.yaml k8s-sync-maximal.yaml \
            operator-default.yaml operator-maximal.yaml \
            --ignore-test container-image-pull-policy

  # The 3,000-line openapi.yaml is the contract between the server and every
  # client (dashboard, CLI remote mode, SDK users). vacuum validates structural
  # correctness (response schemas present, security schemes consistent, no
  # trailing slashes, typed enums) so drift between the spec and handler intent
  # is caught in CI rather than discovered by a consumer. .vacuum.yaml at the
  # repo root selects the rules (the spectral:oas set plus a few zero-finding
  # extras); the job fails on ERRORs only, warnings are surfaced without
  # blocking. vacuum replaced @stoplight/spectral-cli, whose dependency tree
  # carries braces GHSA-vfj7-8cjw-p6xm with no patched release.
  #
  # vacuum is built from source at the exact version in devtools/vacuum/go.mod;
  # every module it needs is verified against devtools/vacuum/go.sum (and
  # GOFLAGS=-mod=readonly forbids any drift), the Scorecard-friendly
  # equivalent of npm ci against a lockfile. The canary step proves the
  # ruleset is loaded and error rules fire.
  #
  # FULL profile (merge_group, push to main not already queue-verified, ...),
  # and on pull_request only when the PR touches what it reads
  # (openapi_changed: the spec, .vacuum.yaml, devtools/vacuum/; or ci:full),
  # since CI-LIGHT-1: its result is a pure function of those files. It moved
  # back into merge_group (skipped there since CI-1, 2026-10-03) so that it
  # still runs before every merge to main, at ~40 s per group. Not a
  # required context. Measured over 3 days / 82 merge_group runs: 0 failures.
  openapi-lint:
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true' && needs.changes.outputs.operator_only != 'true' && (needs.changes.outputs.full_profile == 'true' || needs.changes.outputs.openapi_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go toolchain + module/build cache keyed on devtools/vacuum/go.sum, so a
      # warm run only relinks vacuum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: devtools/vacuum/go.sum

      - name: Lint OpenAPI spec
        env:
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
        run: go tool -modfile=devtools/vacuum/go.mod vacuum lint -r .vacuum.yaml --no-update-check -b -q server/http/handlers/openapi.yaml

      # A guard nobody has watched fail is not a guard: the canary is a
      # deliberately broken spec, and this step fails if vacuum accepts it.
      - name: Ruleset canary (a broken spec must fail)
        env:
          GOWORK: 'off'
          GOFLAGS: -mod=readonly
        run: |
          if go tool -modfile=devtools/vacuum/go.mod vacuum lint -r .vacuum.yaml --no-update-check -b -q -x devtools/vacuum/canary-bad.yaml; then
            echo "::error::vacuum accepted devtools/vacuum/canary-bad.yaml; .vacuum.yaml is not enforcing its error rules"
            exit 1
          fi

  # EDGE-1 CI wiring (#3343; coordinator 2026-10-16): the ARM cross-build of
  # every shipped component (linux/arm64 + linux/arm GOARM=7, CGO off) and
  # the edge footprint guard (binary-size budgets for darwin/arm64,
  # linux/amd64, linux/arm64 and linux/arm; idle peak RSS for the host only,
  # skipped with a message until scripts/edge/footprint-budget.tsv has a
  # linux row -- fill it from this job's log with `footprint.sh --print`).
  # Both take minutes, so FULL profile only, never in the FAST pull_request
  # profile. Not a required context. Until #3343 lands, the scripts are not
  # on the ref and each step says so and passes: the step's job is to run
  # them once they exist, not to prove their absence.
  edge-builds:
    needs: [changes]
    if: needs.changes.outputs.full_profile == 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.queue_verified != 'true' && needs.changes.outputs.web_only != 'true' && needs.changes.outputs.go_unaffected != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: ARM cross-build (scripts/edge/cross-build.sh)
        run: |
          if [ ! -f scripts/edge/cross-build.sh ]; then
            echo "::notice::scripts/edge/cross-build.sh is not on this ref (it lands with #3343); nothing to cross-build yet."
            exit 0
          fi
          bash scripts/edge/cross-build.sh

      - name: Edge footprint guard (scripts/edge/footprint.sh)
        run: |
          if [ ! -f scripts/edge/footprint.sh ]; then
            echo "::notice::scripts/edge/footprint.sh is not on this ref (it lands with #3343); nothing to check yet."
            exit 0
          fi
          bash scripts/edge/footprint.sh --targets darwin/arm64,linux/amd64,linux/arm64,linux/arm

  # Nightly failure report. Runs only for the scheduled run, after every other
  # job, and only when at least one of them failed. Opens an issue titled
  # "Nightly main CI failed", or comments on the existing open one so a
  # multi-night outage is one thread, not one issue per night. No labels.
  #
  # The ONLY job in this workflow with issues: write (job-level, so nothing else
  # inherits it). No checkout: the failing jobs are named from `needs` (job
  # ids; a matrix such as test-suite is reported under its job id). The run
  # link points at the per-leg detail.
  #
  # CI-SELECT-1: the merge queue now tests only what each PR can affect, and
  # this nightly run is the full-suite safety net behind it. The issue names
  # the PRs merged since the last green nightly run, so a failure here that
  # selection let through is traceable to its candidates. That lookup needs
  # actions: read (this workflow's last successful scheduled run) and
  # contents: read (the compare between that commit and this one), both
  # read-only; a failed lookup says so in the issue instead of failing the job.
  nightly-failure-issue:
    needs:
      - changes
      - select
      - pnpm-workspace-root-guard
      - base-branch-check
      - bug-origin-block-check
      - adr-numbers
      - workflow-lint
      - preflight
      - test-quick-root
      - test-quick-cli
      - test-suite
      - exclusion-freshness
      - assert-leg-completeness
      - static-analysis
      - build-and-test
      - e2e-smoke
      - web-e2e-real-smoke
      - repo-guards
      - lint
      - smoke
      - docker-boot-smoke
      - demo-up-smoke
      - helm-boot-smoke
      - operator
      - cli
      - migrate
      - fuzz-targets
      - fuzz-reach
      - licenses
      - gitleaks
      - helm-chart
      - helm-chart-security
      - helm-chart-policy
      - openapi-lint
      - edge-builds
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - name: Open or update the "Nightly main CI failed" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result == "failure") | "- " + .key')
          # PRs merged since the last green nightly (CI-SELECT-1): every merge
          # commit main gained between that run's commit and this one. The
          # queue merges with merge commits ("Merge pull request #N from ...").
          last_green=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || last_green=""
          if [ -z "$last_green" ]; then
            merged="PRs merged since the last green full run: unknown (no successful scheduled run found)."
          elif prs=$(gh api --paginate "repos/$GH_REPO/compare/${last_green}...${RUN_SHA}?per_page=100" --jq '.commits[].commit.message | capture("^Merge pull request #(?<n>[0-9]+)") | "#" + .n' | sort -u | paste -sd ' ' -); then
            total=$(gh api "repos/$GH_REPO/compare/${last_green}...${RUN_SHA}?per_page=1" --jq '.total_commits') || total="?"
            merged="PRs merged since the last green full run (${last_green:0:10}, ${total} commits; the merge queue tests only what each PR can affect, so a selection miss is one of these): ${prs:-none}"
          else
            merged="PRs merged since the last green full run (${last_green:0:10}): lookup failed."
          fi
          title="Nightly main CI failed"
          # The coverage floor is checked only on full runs (a selected merge-queue
          # run skips it), so a build-and-test failure here may be the floor.
          cov=""
          if printf '%s\n' "$failed" | grep -qx -- '- build-and-test'; then
            cov="build-and-test failed: besides a test or build error, a possible cause is the coverage floor (the Check coverage floor step), which merge-queue runs do not compute.\n\n"
          fi
          body=$(printf 'The scheduled full CI run on main (%s) failed.\n\nRun: %s\n\nFailing jobs:\n%s\n\n%s\n\n%bA failing test-suite or e2e-smoke here means main is red even if its push run looked green: push runs skip both when the merge queue already passed the SHA.\n' "$RUN_SHA" "$RUN_URL" "$failed" "$merged" "$cov")
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
