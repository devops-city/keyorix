# Publishes the Keyorix CLI + server + keyorix-migrate release binaries when a
# vX.Y.Z tag is pushed.
#
# Cross-compiles via `make release` (linux/darwin × amd64/arm64) and uploads the
# binaries + checksums.txt to the GitHub Release for the tag. The CLI/server
# asset names (keyorix_<os>_<arch>, keyorix-server_<os>_<arch>) are exactly what
# install.sh downloads — they are produced by the Makefile `release` target;
# keep the three in sync. Before this workflow, release assets were built
# out-of-band, which is how install.sh drifted from the published names.
# keyorix-migrate_<os>_<arch> is also produced here (same target) but is a
# standalone tool a user downloads manually per docs/migrate-from-vault.md —
# install.sh intentionally does not fetch it.
name: release

on:
  push:
    tags: ['v*']

# Lock down GITHUB_TOKEN defaults: no permissions at the top level; each job
# below requests only what it needs (contents/packages/id-token for publish).
permissions: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      # Keyless cosign signing of the release binaries' checksums.txt (#115) — no
      # long-lived signing key; GitHub's OIDC token proves this exact workflow run
      # produced the release, recorded in Sigstore's public Rekor transparency log.
      id-token: write
      # SLSA build provenance (ADR-109 step 6, B6): actions/attest-build-provenance
      # writes to GitHub's own Attestations API, verifiable with `gh attestation
      # verify` — a separate mechanism from cosign's keyless signing above (which
      # stays, for customers already using cosign).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      # `make release` has depended on `populate-webui-dist` (pnpm install +
      # build of web/) since ADR-070 merged the frontend into this repo, but
      # this workflow never set up Node/pnpm to make that dependency
      # satisfiable — a pre-existing gap, not introduced by ADR-073, found
      # while wiring in the frontend SBOM step below (which also needs
      # pnpm). Same versions/actions as web-ci.yml's own setup, for
      # consistency.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Pinned: supply-chain tooling is itself an attack surface. The Makefile
      # `release` target shells out to cyclonedx-gomod to emit a per-binary
      # CycloneDX SBOM (covered by checksums.txt, uploaded with dist/*).
      - name: Cache cyclonedx-gomod binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/cyclonedx-gomod
          key: cyclonedx-gomod-v1.10.0-${{ runner.os }}

      - name: Install SBOM generator
        run: '[ -x ~/go/bin/cyclonedx-gomod ] || go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0' # NOSONAR githubactions:S8545 -- pinned to v1.10.0; go.sum not applicable for a standalone build-time tool outside the module graph (same pattern as dast.yml's nuclei install)

      # actions/setup-node's own `cache:` input above is already spent on pnpm
      # (keyed to web/pnpm-lock.yaml, one cache slot per action call) -- this
      # is a second, independent cache for npm's own package cache, keyed to
      # the ROOT package-lock.json that `npm ci` below actually reads.
      - name: Cache npm packages (root package-lock.json)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Pinned via the root package-lock.json + npm ci, the pattern the
      # openapi-lint job used for Spectral (Scorecard #533): `npm install -g` has
      # no integrity hash for Scorecard's Pinned-Dependencies check to verify
      # against, whereas a committed lockfile records the exact SHA of every
      # package in the tree (Scorecard #636). node_modules/.bin is added to
      # PATH (not pnpm's install, and not a project dependency resolved
      # against web/pnpm-lock.yaml) since build-frontend-sbom.mjs resolves
      # cdxgen from PATH by absolute directory (ADR-073).
      - name: Install frontend SBOM generator (lockfile-pinned)
        run: npm ci --ignore-scripts

      - name: Add npm-installed CLI tools to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # VERSION is passed via env, not interpolated into the `run:` string (#115):
      # a tag name can contain shell metacharacters ($, `, ;, |, &, ( ) are all
      # valid in a git ref) that git's own naming rules don't reject, so a
      # template-expression interpolation directly into a shell command line is a
      # script-injection vector. GITHUB_REF_NAME is a runner-provided env var —
      # substituted by the shell, never re-parsed as YAML/template syntax.
      - name: Cross-compile release binaries + SBOMs
        run: make release VERSION="$GITHUB_REF_NAME"

      # SLSA build provenance (ADR-109 step 6, B6): one in-toto attestation per
      # binary, naming this exact workflow run, its inputs (repo, ref, commit),
      # and the builder identity — posted to GitHub's Attestations API. Only the
      # actual executables are named as subjects (glob exclusions below) — the
      # per-binary SBOMs and checksums.txt/.sig/.pem are already covered by
      # checksums.txt's own cosign signature (the step after this one), not by a
      # build-provenance claim of their own (they are generated FILES, not
      # binaries the provenance's build-definition step actually produced).
      - name: Generate SLSA build provenance (binaries)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/keyorix*
            !dist/*.json
            !dist/*.txt
            !dist/*.sig
            !dist/*.pem

      # cosign-release pinned: latest (v3.1.1) defaults sign-blob to its new
      # bundle format and silently drops --output-signature/--output-certificate;
      # passing --new-bundle-format=false to force the old behavior then hits a
      # second v3.1.1-only requirement ("must provide ... with --signing-config
      # or --use-signing-config"). v2.5.2 predates all of this and supports the
      # split-file flags SECURITY.md's verification instructions depend on.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0
        with:
          cosign-release: 'v2.5.2'

      # Signs checksums.txt (not each binary individually): it already contains a
      # SHA-256 of every release binary, so one signature transitively covers all
      # of them — verify checksums.txt's signature, then verify each downloaded
      # binary against its listed checksum.
      - name: Sign checksums.txt (keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Keyorix $GITHUB_REF_NAME" \
              --generate-notes
          fi

  publish-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the Helm charts to GHCR (OCI)
      id-token: write # keyless cosign signing of the pushed chart artifacts (#115)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # `helm registry login` below only populates Helm's own credential store
      # (~/.config/helm/registry/config.json) — cosign resolves registry auth via
      # the standard Docker config (~/.docker/config.json), which stays empty
      # without this, so `cosign sign` fails with UNAUTHORIZED even though the
      # preceding `helm push` calls succeed. docker-publish.yml already does this
      # correctly for the image cosign-signing steps; mirrors that here.
      - name: Log in to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + push charts to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Chart version = the tag without the leading 'v' (semver); app version
          # = the full tag, so each chart pins its matching image by default.
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/keyorix          --version "$version" --app-version "$version"
          helm package deploy/helm/keyorix-k8s-sync --version "$version" --app-version "$version"
          helm package deploy/helm/keyorix-operator --version "$version" --app-version "$version"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "keyorix-${version}.tgz"          oci://ghcr.io/keyorixhq/charts
          helm push "keyorix-k8s-sync-${version}.tgz" oci://ghcr.io/keyorixhq/charts
          helm push "keyorix-operator-${version}.tgz" oci://ghcr.io/keyorixhq/charts
          cosign sign --yes "ghcr.io/keyorixhq/charts/keyorix:${version}"
          cosign sign --yes "ghcr.io/keyorixhq/charts/keyorix-k8s-sync:${version}"
          cosign sign --yes "ghcr.io/keyorixhq/charts/keyorix-operator:${version}"
