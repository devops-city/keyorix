        run: ./trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-mcp@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # SLSA build provenance (ADR-109 step 6, B6).
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/keyorixhq/keyorix-mcp
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-mcp@${{ steps.build.outputs.digest }}"

  # The web dashboard image (keyorix-web) -- folded in from web/'s own
  # (now-superseded) docker-publish.yml (ADR-070). Same trigger as every job
  # above (push: branches: [main], tags: ['v*']), so pushing one vX.Y.Z tag on
  # this repo now builds and tags the server AND web images identically in
  # the same workflow run -- this is what fixes docker-compose.yml's
  # previously-unresolvable keyorix-web:vX.Y.Z pin (ADR-070 defect #1):
  # keyorix-web had its own separate tag history (only v0.2.0 ever cut) with
  # no mechanism to track the server's version at all.
  build-and-push-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      # SLSA build provenance (ADR-109 step 6, B6).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Commit date, not wall clock: see build-and-push.
      - name: Commit date for BUILD_DATE
        id: build_date
        run: echo "value=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulation for the target arch's runtime-stage steps only (nginx +
      # the libuuid/libexpat apk upgrade) -- the frontend build itself runs
      # under --platform=$BUILDPLATFORM (native, no emulation) since its
      # static output has no architecture dependence.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          push: true
          # docker-compose.yml has no per-arch image variants -- a single tag
          # must resolve on both Apple Silicon/arm64 hosts and amd64 servers.
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keyorix-web
          cache-to: type=gha,mode=max,scope=keyorix-web

      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trivy
          key: trivy-${{ env.TRIVY_VERSION }}-${{ runner.os }}

      - name: Download Trivy
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Scan image for vulnerabilities (trivy, linux/amd64)
        run: ./trivy image --platform linux/amd64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-web@${{ steps.build.outputs.digest }}"

      - name: Scan image for vulnerabilities (trivy, linux/arm64)
        run: ./trivy image --platform linux/arm64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-web@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # SLSA build provenance (ADR-109 step 6, B6).
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/keyorixhq/keyorix-web
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-web@${{ steps.build.outputs.digest }}"
