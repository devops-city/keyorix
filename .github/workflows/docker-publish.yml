# Builds the Keyorix container images and publishes them to GHCR: the API server
# (self-host docker-compose) and the Kubernetes sync agent (keyorix-k8s-sync).
name: docker-publish

on:
  push:
    tags: ['v*']
  schedule:
    # Nightly `main`/`latest` image rebuild instead of one per push to main --
    # runner capacity, 2026-09-26. A real `v*` release tag (above) still always
    # runs this workflow regardless of what it touches.
    - cron: '41 4 * * *'
  workflow_dispatch:

# Lock down GITHUB_TOKEN defaults: no permissions at the top level; each job
# below requests only what it needs (packages/id-token for image publish).
permissions: {}

env:
  # Pinned, checksum-verified (mirrors gitleaks in ci.yml) — the tool that scans
  # our images for vulnerabilities is itself a supply-chain surface.
  TRIVY_VERSION: 0.72.0
  TRIVY_LINUX_64BIT_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless (OIDC) signing — no long-lived signing key
      # is stored as a secret; GitHub's OIDC token proves this exact workflow run
      # produced the image, and Sigstore's transparency log makes that provable
      # after the fact (#115).
      id-token: write
      # SLSA build provenance (ADR-109 step 6, B6) — a separate mechanism from
      # cosign's signature above, verifiable with `gh attestation verify`.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BUILD_DATE is the commit date (UTC, same format as the Makefile), never
      # the wall clock, so rebuilding a commit gives the same stamp. git log is
      # used rather than github.event.head_commit because that is absent on
      # schedule/workflow_dispatch runs.
      - name: Commit date for BUILD_DATE
        id: build_date
        run: echo "value=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulation for the target arch's runtime-stage steps only (e.g. the
      # final apk add in server/Dockerfile) -- the Go build itself cross-
      # compiles natively via GOOS/GOARCH under --platform=$BUILDPLATFORM, no
      # emulation needed there.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
      # build with "Attestation is not supported for the docker driver."
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          # docker-compose.yml has no per-arch image variants -- a single tag
          # must resolve on both Apple Silicon/arm64 hosts and amd64 servers.
          platforms: linux/amd64,linux/arm64
          # BuildKit-native SBOM + provenance attestations (#115) — pushed to GHCR
          # alongside the image, independent of the cosign signature below.
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend, scoped per image so the 5 images in
          # this workflow don't evict each other's layers under a shared
          # default scope.
          cache-from: type=gha,scope=keyorix-server
          cache-to: type=gha,mode=max,scope=keyorix-server

      # Cached across runs by TRIVY_VERSION — a version bump naturally busts
      # the cache and re-downloads+re-verifies the checksum.
      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trivy
          key: trivy-${{ env.TRIVY_VERSION }}-${{ runner.os }}

      - name: Download Trivy
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      # Scans the pushed image DIGEST before it's signed, so a signature only
      # ever attests to an image that's already cleared this gate. The digest
      # here is the multi-arch manifest list; `trivy image` without --platform
      # only ever resolves and scans ONE entry from a manifest list (picking
      # the runner's own arch), so each published platform is scanned
      # explicitly -- otherwise an arm64-only vulnerability would never gate
      # the release at all.
      - name: Scan image for vulnerabilities (trivy, linux/amd64)
        run: ./trivy image --platform linux/amd64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

      - name: Scan image for vulnerabilities (trivy, linux/arm64)
        run: ./trivy image --platform linux/arm64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # Signs the image DIGEST (not a mutable tag) keylessly: cosign requests a
      # short-lived certificate from Sigstore's Fulcio CA bound to this workflow's
      # OIDC identity, and records the signature in the public Rekor transparency
      # log — no signing key to provision, rotate, or leak (#115).
      # SLSA build provenance (ADR-109 step 6, B6) — pushed as an OCI referrer
      # to GHCR (push-to-registry) in addition to GitHub's own Attestations
      # API, so it's verifiable either way (`gh attestation verify` or
      # `cosign verify-attestation`/`docker buildx imagetools inspect`).
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/keyorixhq/keyorix-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

  # The AIR-GAPPED keyorix-server image variant (ADR-109 step 6, B3/S4):
  # -tags noaws,noazure,nogcp (Vault and Kubernetes stay -- ADR-109's
  # open-questions decision: on-prem Vault read-through and on-prem k8s are
  # legitimate air-gapped uses). Same image name as the full build
  # (ghcr.io/keyorixhq/keyorix-server), distinguished by a -airgap tag suffix
  # (flavor: below), with the SAME multi-arch platforms and per-platform
  # Trivy gates as build-and-push above (#2187) -- an air-gapped deployment
  # gets the identical vulnerability-scanning bar the full image does, not a
  # weaker one.
  build-and-push-server-airgap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      # SLSA build provenance (ADR-109 step 6, B6).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Commit date, not wall clock: see build-and-push.
      - name: Commit date for BUILD_DATE
        id: build_date
        run: echo "value=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/keyorixhq/keyorix-server
          # Every tag this generates gets an -airgap suffix, INCLUDING latest
          # (onlatest=true) -- e.g. v0.95.1 -> v0.95.1-airgap, latest ->
          # latest-airgap. Without onlatest=true, metadata-action's default
          # only suffixes non-latest tags, which would leave the air-gapped
          # variant's own "most recent" pointer indistinguishable from the
          # full build's `latest`.
          flavor: |
            suffix=-airgap,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.value }}
            BUILD_TAGS=noaws,noazure,nogcp
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Own cache scope: a different BUILD_TAGS arg produces a different
          # compiled binary layer than build-and-push's full build, so sharing
          # its cache scope would be a permanent cache miss on that layer.
          cache-from: type=gha,scope=keyorix-server-airgap
          cache-to: type=gha,mode=max,scope=keyorix-server-airgap

      - name: Cache Trivy binary
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trivy
          key: trivy-${{ env.TRIVY_VERSION }}-${{ runner.os }}

      - name: Download Trivy
        if: steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_LINUX_64BIT_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy

      - name: Scan image for vulnerabilities (trivy, linux/amd64)
        run: ./trivy image --platform linux/amd64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

      - name: Scan image for vulnerabilities (trivy, linux/arm64)
        run: ./trivy image --platform linux/arm64 --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v3.10.0

      # SLSA build provenance (ADR-109 step 6, B6) — same mechanism as the
      # full image's build-and-push job above, for the air-gapped variant.
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/keyorixhq/keyorix-server
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image (keyless)
        run: cosign sign --yes "ghcr.io/keyorixhq/keyorix-server@${{ steps.build.outputs.digest }}"

  # The Kubernetes sync agent image (keyorix-k8s-sync), published alongside the server.
  build-and-push-k8s-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      # SLSA build provenance (ADR-109 step 6, B6).
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance/sbom attestations below require the docker-container driver;
      # the runner's default `docker` driver doesn't support them and fails the
