# Runs the real `make release` pipeline (cross-compile, SBOM generation +
# verify-sbom-links, checksums) plus a no-push multi-arch image build on every
# PR that could break it, and weekly on a schedule -- so a release-breaking
# change (the v0.95.0 CLI-SBOM/node_modules failure this workflow is named
# for) is caught before a `v*` tag is ever pushed, not discovered live during
# a GTM demo. Deliberately never publishes, signs, or uploads anything: this
# is a build-validation gate, not a release itself -- release.yml/
# docker-publish.yml own the real thing, gated on the `v*` tag push they
# already require.
name: release-dry-run

on:
  pull_request:
    paths:
      - .github/workflows/release-dry-run.yml
      - Makefile
      - .github/workflows/release.yml
      - .github/workflows/docker-publish.yml
      - '**/Dockerfile'
      - go.mod
      - go.sum
      - cli/go.mod
      - migrate/go.mod
      - web/package.json
      - web/pnpm-lock.yaml
  schedule:
    # Same weekly-reminder shape as govulncheck-scheduled.yml/osv-scanner.yml:
    # a release can start failing with no PR touching any of the paths above
    # (a base image going away, a registry rate-limit change, an upstream
    # tool's behavior shifting under a floating installer step).
    - cron: '7 6 * * 1'
  workflow_dispatch: {}

permissions: {}


# Cancel superseded runs for the same PR/ref (2026-09-28, runner-cap relief).
# merge_group refs are unique per group, so queue runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'

      # `make release` depends on populate-webui-dist (pnpm install + build of
      # web/) same as release.yml's own build-and-release job -- see that
      # job's identical steps for the full rationale.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache cyclonedx-gomod binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/cyclonedx-gomod
          key: cyclonedx-gomod-v1.10.0-${{ runner.os }}

      - name: Install SBOM generator
        run: '[ -x ~/go/bin/cyclonedx-gomod ] || go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0' # NOSONAR githubactions:S8545 -- pinned to v1.10.0, see release.yml's identical step

      - name: Cache npm packages (root package-lock.json)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Lockfile-pinned, same as release.yml's identical step -- cdxgen is
      # resolved from PATH by build-frontend-sbom.mjs (ADR-073).
      - name: Install frontend SBOM generator (lockfile-pinned)
        run: npm ci --ignore-scripts

      - name: Add npm-installed CLI tools to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # The real release job builds the actual tag with cosign + gh release
      # afterward; this dry run stops at `make release` itself -- the
      # cross-compile, per-binary SBOMs, verify-sbom-links, and checksums.txt
      # generation are exactly what broke for v0.95.0, and none of it needs a
      # signing key or GitHub Release to exercise.
      - name: Cross-compile release binaries + SBOMs (dry run)
        run: make release VERSION=v0.0.0-dryrun

      # ADR-109 step 6 (B4/S5): fails if the air-gapped profile links a
      # forbidden cloud-SDK package. See scripts/airgap-dependency-guard.sh's
      # own header for the allowlist mechanism.
      - name: Air-gapped profile — dependency guard
        run: make airgap-dependency-guard

      # ADR-109 step 6 (B4/S5): "build and test both profiles" — the FULL
      # profile's test suite already runs in ci.yml (Session C's own test
      # job); this is specifically the AIR-GAPPED profile's test coverage,
      # which nothing else in CI exercises. Server + core are the packages
      # this ADR's fail-closed startup/runtime work (B1/#2218) actually
      # added no<x>-tagged tests to.
      - name: Air-gapped profile — go test (server + core)
        run: go test -tags noaws,noazure,nogcp ./server/... ./internal/core/...

      # The runtime stages (apk add / nginx) run under the TARGET arch, so an
      # arm64 build on an amd64 runner needs binfmt emulation for those steps.
      # Same action and pin as docker-publish.yml.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No `push:`/registry login anywhere in this job -- `push: false` below
      # builds both platforms and discards the result. Confirms the images
      # still build (and, once R1 lands, cross-compile rather than emulate)
      # for arm64 without ever touching GHCR.
      - name: Multi-arch build check — keyorix-server (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      # ADR-109 step 6 (B3/#2220, B4/S5): the air-gapped image variant gets
      # the same no-push multi-arch build check as the full image above —
      # confirms server/Dockerfile's BUILD_TAGS arg actually produces a
      # working cross-compiled image, not just a working `go build` (already
      # checked by the go test step above).
      - name: Multi-arch build check — keyorix-server-airgap (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_TAGS=noaws,noazure,nogcp

      - name: Multi-arch build check — keyorix-web (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      # ADR-109 step 6 (B4/S5): full vs air-gapped dependency-count + SBOM
      # component-count diff, as a job summary — the two SBOM files were just
      # generated by `make release` above (dist/keyorix-server_linux_amd64_
      # sbom.cdx.json / dist/keyorix-server-airgap_linux_amd64_sbom.cdx.json).
      - name: Air-gapped profile — SBOM/dependency-count diff (job summary)
        run: ./scripts/airgap-profile-diff.sh dist/keyorix-server_linux_amd64_sbom.cdx.json dist/keyorix-server-airgap_linux_amd64_sbom.cdx.json >> "$GITHUB_STEP_SUMMARY"
