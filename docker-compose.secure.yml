# Secure-baseline override for docker-compose.yml (SECURE-DEFAULT-1, ADR-112 §4).
#
#   docker compose -f docker-compose.yml -f docker-compose.secure.yml up -d
#
# With it, `admin validate --posture` on the running stack's config reports
# zero deviations (file permissions included, #2922):
#   - backend serves TLS with a certificate its entrypoint generates on first
#     start (keyorix_tls volume, 0600), and requires it;
#   - nginx (web) proxies to https://backend:8080 and verifies that certificate
#     (a 0644 copy on the keyorix_tls_public volume);
#   - rate limiting on, /metrics behind a generated token;
#   - the bind-mounted config is copied to a private 0600 file at every start.
#
# NEEDS A BACKEND IMAGE NEWER THAN v0.95.3: the pinned ghcr.io/.../keyorix-server
# :0.95.3 refuses keyorix.docker.secure.yaml (unknown key metrics_token_file) and
# has none of the entrypoint steps. Until the next release, build the backend
# from this checkout (uncomment `build:` below, or see scripts/demo/check.sh
# --postgres, which does). At that release this file folds into
# docker-compose.yml (RELEASING.md; deploy TestComposeSecureBaselineFoldedAfterRelease
# fails the bump otherwise). The web image can stay on any version: its nginx
# config is mounted from this checkout.
services:
  backend:
    # build:
    #   context: .
    #   dockerfile: server/Dockerfile
    environment:
      KEYORIX_CONFIG_SOURCE: /app/config/keyorix.docker.yaml
      KEYORIX_CONFIG_PATH: /app/data/keyorix.yaml
      KEYORIX_INIT_SECURE_FILES: "true"
      KEYORIX_TLS_DNS_NAMES: backend
      KEYORIX_PUBLIC_CA_FILE: /app/tls-public/ca.crt
      KEYORIX_LOCAL_URL: https://localhost:8080
      KEYORIX_LOCAL_CA_FILE: /app/tls/server.crt
    # The base backend is read_only: the private config copy (rewritten from the
    # source at every start) needs a writable home. A small tmpfs owned by the
    # image's uid 1001, 0700; nothing else lives in /app/data here.
    # (deploy TestComposeSecureBackend_EntrypointWritesLandOnWritableMounts)
    tmpfs:
      - /app/data:mode=0700,uid=1001,gid=1001,size=1m
    volumes:
      # Replaces the stock mount at /app/keyorix.yaml (unused with
      # KEYORIX_CONFIG_PATH set): the entrypoint copies this one.
      - ./keyorix.docker.secure.yaml:/app/config/keyorix.docker.yaml:ro
      - keyorix_tls:/app/tls
      - keyorix_tls_public:/app/tls-public
    healthcheck:
      test: ["CMD", "sh", "-c", "SSL_CERT_FILE=/app/tls/server.crt wget -q --spider https://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    depends_on:
      backend:
        # nginx reads the backend certificate at startup.
        condition: service_healthy
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/compose/keyorix-backend.tls.conf:/etc/nginx/keyorix-backend.conf:ro
      # nginx.conf includes /etc/nginx/keyorix/nginx-hsts.conf, which this script
      # generates at start (tmpfs in docker-compose.yml). A web image older than
      # the script (the pinned 0.95.3) would not start without it; for a newer one
      # it is the same script. It must stay executable in the checkout.
      - ./web/docker-entrypoint.d/40-keyorix-hsts.sh:/docker-entrypoint.d/40-keyorix-hsts.sh:ro
      - keyorix_tls_public:/etc/keyorix/tls:ro

volumes:
  keyorix_tls:
  keyorix_tls_public:
