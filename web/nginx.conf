events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Cache-Control for hashed static assets, computed here (not in the
    # location block) so the add_header below stays the ONLY add_header in
    # the whole config that isn't at server scope — see the note above the
    # server block on why every add_header lives at server scope now. An
    # unmatched $uri resolves to the empty string, and nginx's add_header
    # omits the header entirely when its value is empty (documented
    # behavior), so non-asset responses get no Cache-Control from this.
    # $keyorix_trusted_proxy / $keyorix_hsts: see nginx-hsts.conf (default: no HSTS).
    include /etc/nginx/keyorix/nginx-hsts.conf;

    map $uri $static_cache_control {
        default                                                   "";
        ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$  "public, immutable";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Every add_header for this server lives HERE, at server scope, and
        # nowhere else. nginx's add_header does not inherit into a location
        # block once that location sets any add_header of its own — mixing
        # server- and location-scoped add_header is what previously forced
        # copy-pasting this whole set into every location (and what Semgrep's
        # generic.nginx.security.header-redefinition rule flags, independent
        # of whether the location's copy actually agrees with the original).
        # Keeping every add_header at this one scope sidesteps both problems:
        # nothing to drift out of sync, nothing for the rule to flag. The two
        # headers that vary by response (Cache-Control, Content-Type) are
        # handled without add_header in their locations instead — see the
        # $static_cache_control map above and the /health location's
        # default_type below.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        # script-src is 'self' only: the Vite production bundle ships no inline scripts
        # and invokes no eval()/Function(), so 'unsafe-inline'/'unsafe-eval' are not needed.
        # style-src keeps 'unsafe-inline' for Tailwind/React inline styles. form-action,
        # base-uri, frame-ancestors do not inherit from default-src and must be explicit;
        # object-src 'none' blocks Flash/Java plugins. img-src omits the https: wildcard —
        # all images are same-origin or inline data URIs. This must stay in sync with
        # server/middleware/security_headers.go and
        # deploy/helm/keyorix/templates/web-config.yaml — the three serving modes
        # (embedded single-binary, this Docker+nginx image, Helm/K8s) must present the
        # same policy to the browser.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none';" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Strict-Transport-Security: this server only ever speaks plain HTTP, and
        # HSTS over http:// is wrong (DEMO-WALK-3 finding 23), so it is NOT sent
        # unconditionally. $keyorix_hsts (nginx-hsts.conf, generated at start from
        # KEYORIX_WEB_TRUSTED_PROXIES) is non-empty only when the TCP peer is a
        # trusted proxy that sets X-Forwarded-Proto=https, i.e. TLS terminated at a
        # load balancer in front of us; otherwise it is empty and add_header omits
        # the header. The header is never trusted from an arbitrary client. (The
        # Caddyfile adds its own HSTS; the backend adds it when it serves TLS.)
        add_header Strict-Transport-Security $keyorix_hsts always;
        add_header Cache-Control $static_cache_control always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            try_files $uri =404;
        }

        # API proxy. /api/ is the authenticated API; /auth/ is the PUBLIC auth
        # endpoints (login, refresh, logout), which the backend serves at the ROOT
        # path — not under /api/. Without proxying /auth/, login falls through to
        # the SPA index and 404s. /system/ covers first-boot init.
        #
        # No CORS headers here: the SPA is served by this same nginx on the same
        # origin, so browser calls to these paths are same-origin and need none.
        # There is no other known caller of this API from a browser context —
        # don't add Access-Control-Allow-Origin/-Credentials back without a real,
        # named cross-origin consumer and a specific origin allowlist.
        #
        # No `internal;` directive: Semgrep's generic.nginx.security.missing-internal
        # rule wants that on any proxy_pass location, but this location is
        # deliberately reachable from the browser directly — it's how the SPA
        # (served by this same nginx) calls its own backend API. `internal;` would
        # make nginx 404 every /api/, /auth/, and /system/ request from the browser,
        # breaking the app entirely.
        location ~ ^/(api|auth|system)/ {
            # Resolve the backend lazily via Docker's embedded DNS (127.0.0.11) and
            # a variable, so nginx starts even if the backend isn't up yet (returns
            # 502 until it is) and picks up a new backend IP after a restart —
            # rather than failing to start or caching a stale address as a literal
            # upstream hostname would.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $keyorix_backend http://backend:8080;
            proxy_pass $keyorix_backend$request_uri; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Security headers are set ONCE, by this nginx (server scope above,
            # inherited into this location). The backend adds the same set to its
            # own responses (server/middleware/security_headers.go), which without
            # this made every proxied response carry each header twice (DEMO-WALK-3
            # finding 23). proxy_hide_header drops the backend's copy so nginx's
            # is the only one; it is not an add_header, so the server-scope-only
            # add_header rule above still holds.
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-XSS-Protection;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
            proxy_hide_header Cross-Origin-Resource-Policy;
            proxy_hide_header Cross-Origin-Embedder-Policy;
            proxy_hide_header Cross-Origin-Opener-Policy;
            proxy_hide_header Strict-Transport-Security;
        }

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint. default_type (not add_header Content-Type)
        # so this doesn't reintroduce a location-scoped add_header.
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
