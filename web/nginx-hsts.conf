# Default HSTS policy for the web image: NO trusted proxy, so NO HSTS.
#
# web/nginx.conf includes this file. The image's entrypoint script
# (web/docker-entrypoint.d/40-keyorix-hsts.sh) regenerates it at container start
# from KEYORIX_WEB_TRUSTED_PROXIES / KEYORIX_WEB_HSTS / KEYORIX_WEB_HSTS_MAX_AGE.
# See docs/SELF_HOSTING.md ("HSTS behind a TLS-terminating load balancer").
#
# $keyorix_hsts is the Strict-Transport-Security value for the current request,
# or "" (nginx's add_header omits the header when the value is empty).
# It is non-empty ONLY when the TCP peer is a trusted proxy AND that proxy says
# X-Forwarded-Proto=https. A direct http request, or any client outside the
# trusted set sending X-Forwarded-Proto: https itself, gets no HSTS.
geo $keyorix_trusted_proxy {
    default 0;
}

map "$keyorix_trusted_proxy:$http_x_forwarded_proto" $keyorix_hsts {
    default "";
}
