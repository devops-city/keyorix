# Included by nginx.conf inside the /api, /auth, /system location: where the
# backend is. Plain HTTP on the compose network (the stock docker-compose.yml).
# docker-compose.secure.yml mounts deploy/compose/keyorix-backend.tls.conf over
# this file instead: HTTPS to the backend, verifying its certificate.
set $keyorix_backend http://backend:8080;
