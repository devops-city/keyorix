environment: "development"
locale:
  language: "en"
  fallback_language: "en"
server:
  http:
    enabled: true
    # The scanner containers reach keyorix:8080 over the compose network, so the
    # server must listen on all interfaces (the default is 127.0.0.1, #2939).
    host: "0.0.0.0"
    port: "8080"
    domain: "localhost"
    swagger_enabled: true
    tls:
      enabled: false
    ratelimit:
      enabled: false
    web_assets_path: "/app/web-dist"
  grpc:
    enabled: false
storage:
  type: postgres
  database:
    host: postgres
    port: "5432"
    name: keyorix
    user: keyorix
    # Explicitly unencrypted (reported as storage.database.insecure_disable_database_tls):
    # this stack's postgres (docker-compose.yml, stock postgres:15-alpine) serves no TLS and
    # has no CA to verify against, so verify-full is not possible here. `prefer` would say the
    # same thing less honestly (it also reports as a plaintext-fallback deviation). The
    # database is only reachable on the stack's private compose network.
    # Switch to verify-full + ssl_root_cert when this stack's postgres gets TLS like the
    # Compose stack (#3203).
    ssl_mode: disable
  encryption:
    enabled: true
    dek_path: "/app/keys/data.key"
    salt_path: "/app/keys/kek.salt"
    key_provider:
      type: env
      env_var: KEYORIX_DAST_KEK
security:
  enable_file_permission_check: false
soft_delete:
  enabled: true
  retention_days: 30
