# Backup v2 archive reader (internal/backupfmt, design-b3-backup-v2.md
# §5.3): ExtractArchive reads an operator-supplied archive that may come from
# untrusted or removable media and is NOT yet signature-verified when this
# code runs -- a sibling of server/admin's existing FuzzReadBackupArchive
# (v1 physical format), but the v2 logical format's own reader/manifest
# layer had zero coverage before this target. Asserts arbitrary bytes never
# panic, never cause more than a tiny, deliberately-set total-bytes cap to
# land on disk (decompression-bomb / huge-declared-length resistance,
# independent of the per-entry cap), and -- when accepted -- every staged
# file independently re-hashes to exactly what the archive's own manifest
# declared. New; 1h given the archive/tar/gzip decode surface is
# self-contained (no network, no auth).
internal/backupfmt|FuzzExtractArchive|1h

# Backup v2 archive tar-slip guard (internal/backupfmt): the #2270 path-
# traversal regression class, generalized beyond the three hand-picked names
# TestExtractArchive_RefusesPathTraversal checks -- asserts filepath.IsLocal's
# verdict on a fuzzed entry name always agrees with whether ExtractArchive
# refused it, and that no entry (../, absolute, embedded NUL, or a
# Unicode-normalization variant) ever lands a byte outside the staging
# directory. Security-relevant (an archive is untrusted, pre-signature-check,
# operator-supplied input), though the #2270 regression it mirrors was found
# by manual review, not by this fuzzer, so it stays at the medium default
# rather than claiming BUDGET.tsv's "high" bar (a real finding THIS fuzzer
# caught). 2h given two independent guard layers (ExtractArchive's own check
# and stageFile's redundant one) to actually exercise.
internal/backupfmt|FuzzExtractArchivePathSafety|2h

# Backup v2 restore table-order independence (internal/backupfmt): LoadArchive
# must derive its own insert order from RestoreOrder() (order.go), never from
# the order an untrusted manifest's own Tables field happens to declare --
# verified by instrumenting a real GORM Create callback to observe the actual
# INSERT sequence (an outcome-only check is unsound here: this schema has no
# real SQL-level FOREIGN KEY constraints, so SQLite never rejects an
# out-of-order insert regardless of declared order -- confirmed by directly
# planting the bug and watching an outcome-only assertion pass vacuously
# before this version was written). Input space is a single bool (which
# table the manifest lists first), so this saturates almost immediately --
# 10m is already more than exhaustive, not a shortened/incomplete run.
internal/backupfmt|FuzzLoadArchiveIgnoresManifestTableOrder|10m

# Backup v2 manifest canonical encoding (internal/backupfmt): canonicalManifestBytes
# is what SignManifest/VerifyManifestSignature build their HMAC over, so it
# must be a total, deterministic function of any successfully-parsed Manifest
# -- feeds arbitrary bytes through the JSON decode/canonicalize/decode/
# canonicalize cycle and asserts it never panics and is a fixed point (same
# bytes both times). Small, pure JSON surface; new, no saturation data yet; 1h.
internal/backupfmt|FuzzManifestJSONRoundTripIsStable|1h

# Backup v2 manifest signature (internal/backupfmt, design-b3-backup-v2.md
# §5.2/§5.4): the v2 manifest's own HMAC-SHA256 had zero fuzz coverage before
# this target -- server/admin's FuzzReadBackupArchive only exercises the v1
# physical-format path. Differentially checks the fixed point SignManifest/
# VerifyManifestSignature imply for ANY JSON that parses as a Manifest: a
# fresh re-sign under the real key always verifies, and the ORIGINAL's own
# stored signature verifies if and only if it equals that recomputation --
# never for a mismatch. Small, pure HMAC/JSON surface; new, no saturation
# data yet; 1h.
internal/backupfmt|FuzzManifestSignatureNeverAcceptsMismatch|1h

