# GET /api/v1/users/{id}/shared-secrets (#2025, ListSharedSecretsForUser) — a
# read query, so it can't join opCatalog (whose keys are checked against the
# mutating-only knownOperations registry). Same fault-injection world as
# FuzzStorageFaultOperations, narrower oracle (no non-AuditEvent state may
# ever change, success or failure) and a much smaller state space (one route,
# not the whole catalog) — 30m, no saturation data yet.
server/faultops|FuzzSharedSecretsViewNeverWrites|30m

# Storage-interface-level fault injection (one layer above FuzzFaultInjectedOperations,
# which faults durability seams below the interface): fails/panics the Nth call of
# any storage.Storage method during one real REST/system/gRPC operation, driven
# through the actual router/grpc.Server (RecoveryInterceptor included), and asserts
# atomicity/panic-never-becomes-success/fail-closed-authz/no-mixed-commit/error-hygiene
# via a full-DB canonical snapshot. Each iteration is comparatively expensive (two
# fresh SQLite-backed worlds, a real httptest.Server, a real bufconn grpc.Server) —
# 1h given the lower achievable exec rate, matching this file's own precedent for
# HTTP-stack-dispatch targets above.
server/faultops|FuzzStorageFaultOperations|1h

# Schema-aware gRPC fuzzer (fuzzer inventory item #6): a generic, protoreflect-
# driven mutator picks a registered keyorix.v1 service+method from the live
# *grpc.Server's own registry, walks its descriptor to build a well-typed
# request (scalars, enums incl. unknown values, repeated, maps, oneofs, nested
# messages, field presence, injected unknown fields), and runs it against the
# real in-process gRPC server (bufconn) + real core + SQLite world, as
# zero-grant / read-only / admin identities. Four oracles: no panic / no
# leaking Unknown-or-Internal status; zero-grant and read-only never get OK on
# a call that mutates the DB or returns the canary secret's plaintext;
# non-OK leaves the DB unchanged outside a documented best-effort write; work
# stays proportional to request size. SQLite-backed + CI-runnable, 1h.
server/grpc|FuzzGRPCProtoreflectInvariants|1h

# ── Behind-the-wall soak (fuzz/behind-the-wall-batch) — pour INSIDE the wall ──
# The obvious byte-level entry points are already fuzzed; these three pour past
# the signature/JSON wall so the code behind it (claim semantics, assertion
# extraction, the CBOR/attestation-format family) actually gets wetted.
#
# WebAuthn credential parse: go-webauthn ParseCredential{Creation,Request}
# ResponseBytes on the UNAUTHENTICATED ceremony-finish endpoints — raw browser
# bytes after only a JSON decode + 64 KiB cap, no keyorix schema in front. The
# library is the front line, so a panic/hang here is a pre-auth DoS. 1h.
# Moved to server/http/handlers/webauthnparse (Session M, leaf-package move):
# this target has zero Keyorix production code in the loop (it fuzzes
# go-webauthn/webauthn/protocol directly), so the move is purely a test-file
# relocation. Coverage map dropped from 425,336 to 44,253 bytes (measured
# with scripts/fuzzing/mapsize_of_bin.sh).
server/http/handlers/webauthnparse|FuzzWebAuthnCredentialResponse|1h

# JSON request-body decode bounded-work: the stage before ANY handler logic runs,
# on every route incl. every unauthenticated one (login, password-reset, webauthn
# login-finish), plus the shared mustDecodeBody helper and both
# map[string]interface{}-decode routes found (alert-escalation Update,
# notification-channel Update — the only two in server/http/handlers). Asserts
# time+alloc stay linear in min(body, configured size cap), and that nesting past
# encoding/json's maxNestingDepth is rejected, not silently accepted. New; 1h.
server/http/handlers|FuzzJSONDecodeBoundedWork|1h

# G1 (FUZZ-GAPS): per-IP login-throttle budget shared across all 8
# unauthenticated login-adjacent endpoints (Login, RefreshToken, VerifyMFA,
# Begin/FinishWebAuthnLogin, Begin/FinishWebAuthnPasswordlessLogin,
# ConsumeSetup). Deterministic controlled-interleaving harness over a real,
# storage-backed KeyorixCore -- found (and this PR fixes) two call sites
# (ConsumeSetup, BeginWebAuthnPasswordlessLogin) that shared the rate-limit
# CHECK but never reserved a budget slot, so either could be hammered without
# limit. Also re-checks the orthogonal per-account lockout is never bypassed.
# Real DB writes + bcrypt/TOTP per exec keep this slower than a pure parser
# fuzzer; 1h is enough to keep exploring new (ip,endpoint,account) orderings.
server/http/handlers|FuzzLoginThrottleConcurrency|1h

# Canary secret-value leakage: plants unique per-iteration canary values, drives
# hostile op sequences (cross-project reads, malformed/oversized/wrong-content-type
# requests, rotation, version reads, deletes, audit queries, list/CSV-export
# endpoints) through the real HTTP router + gRPC server (bufconn), and scans every
# reachable channel (logs, every HTTP/gRPC response/header/metadata, the full SQLite
# schema via introspection, and the raw on-disk DB file) for the canary after every
# op and at sequence end. Exact-match oracle: a canary may appear only in the `value`
# field of one of three designated, permission-checked read endpoints for a principal
# the live shadow-grant model says may read that exact secret — anywhere else is a
# leak. A real encryption.Service is wired (not a no-op), so the plaintext-at-rest
# assertion is live. SQLite-backed + CI-runnable. 1h.
server/http|FuzzCanarySecretLeakage|1h

# TRUE concurrent (real goroutines) linearizability fuzzer for grant/revoke+read,
# RotateSecret+read, and session-revocation+read, checked against a sequential
# model via porcupine. Generalizes the #121 TOCTOU regression shape
# (concurrency_rotate_secret_test.go) across fuzzer-chosen goroutine counts,
# interleavings, and GOMAXPROCS. SQLite (production pool config) always; PostgreSQL
# when KEYORIX_TEST_PG_DSN is set. DEK/KEK envelope-key rotation is deliberately
# out of scope (exclusive-locked, single-process by construction — see the fuzz
# function's own doc comment). 1h.
server/http|FuzzConcurrentOpsLinearizable|1h

# Extends FuzzConnectRefScoping's ref-scoping oracle across BOTH transports keyorix
# serves for a federated read: REST (server/http/handlers/connect.go) and gRPC
# (server/grpc/services/connect_service.go) both call the identical
# core.KeyorixCore.ReadFederatedSecret -> connectRefAllowed -> refMatches
# (ADR-045 ConnectRefGrant), unlike FuzzConnectRefScoping's target (prefixAllowed),
# which is a connector-level static allowlist reached with no transport at all.
# SAME generated world as FuzzKeyorixHTTPAPISequence's buildAPIFuzzWorlds, extended
# with one fake connector + one role holding a single ConnectRefGrant, and a second
# gRPC server (bufconn) wired onto the identical core the REST router already uses
# (mirrors FuzzMultiTenantIsolationGRPC's own extension pattern). Oracle: (a) a ref
# never resolves outside the grant's prefix on EITHER transport (independent
# segment-slice + dot-segment checks, not the implementation under test); (b)
# REST-vs-gRPC decision+value parity. SQLite-backed + CI-runnable. New; 1h.
server/http|FuzzConnectRefScopingGRPC|1h

# gRPC<->REST authz-parity differential: reads the SAME secret over BOTH the real
# HTTP router and the real gRPC server (bufconn) with the same credential + fuzzed
# grants, asserting the authorization DECISION agrees (a mismatch is a
# transport-dependent auth bypass). The two transports are each other's oracle
# (no shadow model). SQLite-backed + CI-runnable; heavier (two live stacks), 1h.
server/http|FuzzGRPCRESTSecretReadAuthzParity|1h

# Live-API invariant fuzzer: a grant/revoke/read sequence driven against the real,
# fully-wired stack (NewRouter + auth middleware + handlers + core + crypto + storage)
# stood up in-process; reads go over HTTP, mutations via core with a token-cache flush.
# Asserts auth-required / fail-closed / tenant-isolation / no-plaintext-on-deny /
# integrity against a shadow authz model. SQLite-backed + CI-runnable (no PG needed);
# a Postgres-backed rig variant is Phase 2. 1h.
server/http|FuzzKeyorixHTTPAPISequence|1h

server/http|FuzzMultiTenantIsolation|1h

# Extends FuzzMultiTenantIsolation's own two-tenant world (SAME core, SAME alice/bob
# grants, SAME sa/sb secrets) across a SECOND, gRPC-specific in-process server wired
# onto that identical core, so a grant/mutation is visible to both surfaces at once.
# Oracle: (a) the REST harness's own no-cross-tenant-read/list/write invariants,
# reapplied against gRPC (GetSecretValue/GetSecret/ListSecrets); (b) NEW REST-vs-gRPC
# decision + value parity for the value-read operation (a divergence is a
# transport-dependent tenant-isolation bypass). LIST keeps oracle (a) only — see the
# file's own doc comment for the documented REST/gRPC list status-code asymmetry this
# does NOT treat as a decision-parity target. SQLite-backed + CI-runnable, 1h.
server/http|FuzzMultiTenantIsolationGRPC|1h

# FUZZ-GAPS G5: single-node auth-cache-vs-DB differential (K9 part 1; the
# two-replica part is a separate, later track). Drives random sequences of
# login / PAT create / machine-token issue, interleaved with revoke / suspend
# / role-change / password-change / session-delete / expiry mutations and
# authenticated requests, over a real sqlite-backed *core.KeyorixCore and the
# real Authentication middleware chain. Oracle: the cache-serving decision for
# a request must equal the decision the same request gets with that token's
# cache entry forced out (straight to storage) -- any divergence is a stale/
# wrong cached auth decision. Regression coverage for #1955 (re-verify on
# every cache hit), #1878 (session-expiry clamp), and #1985 (role-lookup
# error fails closed) by construction of that oracle, not by re-deriving each
# fix's own mechanism. Found a real, separately-fixed divergence within
# seconds of its first fuzzing run (see docs/security-closures.tsv's
# account-state-reactivate-pat-tombstone-001, PR #2206) -- not reachable from
# this harness's own seed corpus, only from its random mutation, so this PR's
# CI stays independent of that fix's merge order. Small, pure in-process
# world (no HTTP-stack dispatch); 1h.
server/middleware|FuzzAuthCacheDifferential|1h

# --- fuzz/new-surfaces-2026-09-24 ---
# ADR-108 §B admin-dispatch argument handling: isAdminDispatch's own routing
# predicate (server/main.go) plus, whenever it routes to admin, the real
# cobra command tree (server/admin.Execute) — argv-shaped fuzzing, asserting
# the routing decision stays razor-precise (never hijacking the plain
# server's --passphrase-fd/--passphrase-file/--passphrase-stdin flags),
# admin.Execute never panics/hangs (the "no admin command starts a listener"
# promise — a listener would manifest as a call that never returns), and an
# unrecognized subcommand always errors instead of silently no-op'ing. New;
# small, pure dispatch surface; 1h.
server|FuzzAdminDispatch|1h

# FUZZ-MECH M5: configuration-space fuzzer. Fuzzes a structured grid of
# independent security-relevant config dimensions (not raw config-file
# bytes) through config.Config.Validate() and server's own
# checkTransportTLSPosture -- both pure, no network/DB/listener. Confirms
# wildcard CORS origins and unrecognized storage.type are never accepted,
# security.require_transport_tls=true + TLS-disabled always fails closed,
# and the documented CLEARTEXT warning is actually logged (not silently
# skipped) whenever a TLS-disabled listener is legitimately accepted. Pure
# in-memory struct construction + two function calls; 1h is generous.
server|FuzzConfigSecurityPosture|1h
