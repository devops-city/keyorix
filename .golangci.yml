version: "2"

run:
  # Widened from 5m (2026-09): a 17-way simultaneous Go dependency bump
  # (dependabot's go-patch-minor group) invalidated the lint cache and pushed
  # a real, zero-issue run to 5m58s -- golangci-lint exits 4 ("Timeout
  # exceeded") on a slow-but-clean run exactly like a genuinely hung one, so
  # this was a false-negative CI failure, not a real lint violation. Widened
  # generously rather than tuned to the observed run, per this repo's own
  # "timeouts detect hangs, they don't enforce speed" standing practice.
  timeout: 12m
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - modernize
  # goconst (500+ repeated-string-literal hits, never adopted) and gosec (run
  # separately by the dedicated gosec job in CI, with the repo's own config) are
  # intentionally not enabled here — keeping the linters that catch real bugs.
  settings:
    modernize:
      # The one-time modernize pass (GO-MODERNIZE-1) left these three off on
      # purpose; keep them off here so the linter matches what was applied.
      #   embedlit       -- rewrites literals via promoted fields of embedded
      #                     structs, which older tooling cannot parse
      #   stringsbuilder -- readability churn, touches the semgrep-annotated
      #                     SQL string build in server/admin/restore_postgres.go
      #   newexpr        -- rewrites pointer helpers into new(x) plus
      #                     //go:fix inline, which trips govet's inline check
      disable:
        - embedlit
        - stringsbuilder
        - newexpr
    staticcheck:
      # Keep the SA (bug) and S (simplification) checks. Mirror golangci-lint's
      # default ST* exclusions (the repo uses per-file `// name.go — …` comments,
      # not `// Package x …`), and additionally drop the QFxxxx "quickfix"
      # refactoring suggestions, which are stylistic, not bugs.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003
        - -QF1008

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
